<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#52636d}.label{font-size:13px;font-weight:700;fill:#2f617a}.value{font-size:15px;fill:#3f515c}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">三層軌跡驗證：盡量讓證據來自真實環境</text><rect width="245" height="82" x="30" y="76" class="box" rx="8"/><text x="152.5" y="107" class="t h" text-anchor="middle">結果驗證器</text><text x="152.5" y="135" class="t s" text-anchor="middle">測試、金額、訂單最終狀態</text><rect width="245" height="82" x="30" y="174" class="box" rx="8"/><text x="152.5" y="205" class="t h" text-anchor="middle">過程驗證器</text><text x="152.5" y="233" class="t s" text-anchor="middle">政策、權限、動作與承諾</text><rect width="245" height="82" x="30" y="272" class="accent" rx="8"/><text x="152.5" y="303" class="t h" text-anchor="middle">LLM Rubric</text><text x="152.5" y="331" class="t s" text-anchor="middle">自然、簡潔、合規變通</text><rect width="320" height="340" x="342" y="62" class="accent" rx="10"/><text x="502" y="97" class="t h" text-anchor="middle">結構化軌跡評價</text><line x1="374" x2="630" y1="117" y2="117" stroke="#89a0ac"/><text x="376" y="145" class="t label">任務結果</text><text x="376" y="168" class="t value">成功、部分成功或失敗</text><text x="376" y="198" class="t label">維度評價</text><text x="376" y="221" class="t value">逐項評分，而不是只給總分</text><text x="376" y="251" class="t label">證據位置</text><text x="376" y="274" class="t value">標明對話輪次與工具狀態</text><text x="376" y="304" class="t label">失敗標籤</text><text x="376" y="327" class="t value">保留問題類型，支援後續診斷</text><line x1="374" x2="630" y1="348" y2="348" stroke="#b6c7cf"/><text x="502" y="378" class="t s" text-anchor="middle">證據不足時，允許拒絕評分</text><rect width="258" height="202" x="712" y="119" class="box" rx="10"/><text x="841" y="156" class="t h" text-anchor="middle">可學習的診斷訊號</text><text x="841" y="199" class="t s" text-anchor="middle">保留成功與失敗的位置</text><text x="841" y="234" class="t s" text-anchor="middle">說明證據與問題類型</text><text x="841" y="269" class="t s" text-anchor="middle">交給獨立模組選擇更新對象</text><path d="M275 117 H307 V151 H340" class="line"/><path d="M275 215 H340" class="line"/><path d="M275 313 H307 V279 H340" class="line"/><path d="M662 220 H710" class="line"/></svg>