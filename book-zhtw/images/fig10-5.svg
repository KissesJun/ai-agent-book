<svg xmlns="http://www.w3.org/2000/svg" width="780" height="530" viewBox="0 40 780 530" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker><marker id="ah-sm" markerHeight="4" markerWidth="6" orient="auto" refX="6" refY="2"><polygon fill="#333" points="0 0 6 2 0 4"/></marker></defs><rect width="300" height="70" x="240" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="77" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Manager Agent</text><text x="390" y="103" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">任務規劃 · 進度監控 · 異常處理 · 結果綜合</text><rect width="230" height="185" x="30" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="145" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Glossary Agent</text><text x="145" y="208" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">術語對照表</text><text x="42" y="230" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">接收全書 → 識別專業術語</text><text x="42" y="248" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Ne