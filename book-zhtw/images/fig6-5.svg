<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>圖 6-5 同步介面相容與模型原生非同步</title><desc>前面的相容方案由執行階段安排事件的接入順序，讓使用同步介面的模型參與非同步任務。另一條路線是讓模型原生理解這種互動節奏：工具還在執行時，自己可以繼續做別的事；使用者中途補充要求時，也可以據此調整後續工作。GPT-6 Astra 已支援非同步工具呼叫（Async tool calling）與回合中途引導（Mid-turn steering），體現了這一變化（圖 6-5）。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="40" y="53" class="title">相容方案：執行階段安排非同步節奏</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" text-anchor="middle">任務在背景執行</text><text x="155" y="122" class="small" text-anchor="middle">明確記錄「尚未完成」</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" text-anchor="middle">執行階段接入新事件</text><text x="440" y="122" class="small" text-anchor="middle">決定排隊、打斷或並行處理</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" text-anchor="middle">模型繼續處理任務</text><text x="725" y="122" class="small" text-anchor="middle">仍按同步互動方式接收資訊</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="40" y="218" class="title">原生非同步：模型理解等待與中途變化</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" text-anchor="middle">發起耗時查詢</text><text x="155" y="290" class="small" text-anchor="middle">例如：查詢會議場地</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" text-anchor="middle">等待期間繼續工作</text><text x="440" y="290" class="small" text-anchor="middle">例如：整理議程與準備清單</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" text-anchor="middle">結果抵達後作出決策</text><text x="725" y="290" class="small" text-anchor="middle">依據真實資訊比較場地</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" text-anchor="middle">使用者中途補充要求</text><text x="155" y="390" class="small" text-anchor="middle">例如：預算與人數變化</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" text-anchor="middle">保留已完成的工作</text><text x="440" y="390" class="small" text-anchor="middle">將新要求納入目前任務</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" text-anchor="middle">調整後續行動</text><text x="725" y="390" class="small" text-anchor="middle">綜合已有資訊與全部更新</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" text-anchor="middle">模型理解變化、調整計畫；執行階段管理工具執行、任務狀態與事件來源</text><text x="440" y="506" class="small" text-anchor="middle">能接收非同步訊息，還需要能正確恢復任務並控制實際動作。</text></svg>