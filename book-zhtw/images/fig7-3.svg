<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker><marker id="ah-r" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="0" refY="3.5"><polygon fill="#666" points="10 0 0 3.5 10 7"/></marker></defs><style>.l,.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;dominant-baseline:central}.t{text-anchor:middle}.l{text-anchor:start}.h{font-size:17px;font-weight:700}.m{font-size:14px}.c,.n{font-size:12.5px;fill:#666}.c{font-family:&apos;SF Mono&apos;,Menlo,Consolas,monospace}</style><rect width="270" height="86" x="40" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="175" y="40" class="t h">使用者模擬器（LLM）</text><text x="56" y="62" class="l n">known_info：John Smith / 555-123-2002 / 在法國</text><text x="56" y="80" class="l n">task_instructions：漸進透露 · 情緒 · 事實錨定</text><text x="56" y="96" class="l n">驗收口徑：僅 excellent 算解決</text><rect width="270" height="86" x="570" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="705" y="40" class="t h">Agent（待評估）</text><text x="586" y="62" class="l n">輸入：工單 + 領域政策</text><text x="586" y="80" class="l n">不可見：使用者裝置的真實狀態</text><text x="586" y="96" class="l n">只能引導使用者操作，無法代其執行</text><line x1="316" x2="560" y1="63" y2="63" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)" marker-start="url(#ah-r)"/><text x="438" y="50" class="t n">多輪對話</text><text x="438" y="80" class="t n">漸進式資訊透露</text><rect width="800" height="150" x="40" y="146" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="166" class="t h">共享環境（雙控：兩側都能改寫狀態）</text><rect width="370" height="98" x="60" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="245" y="200" class="t m" font-weight="bold">裝置側狀態</text><text x="76" y="222" class="l n">飛航模式 ON · 資料漫遊 OFF · 省流模式 · 剩餘流量</text><text x="76" y="246" class="l c">使用者工具：toggle_airplane_mode / toggle_roaming</text><text x="76" y="266" class="l c">check_status_bar / run_speed_test</text><rect width="370" height="98" x="450" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="635" y="200" class="t m" font-weight="bold">運營商側資料庫</text><text x="466" y="222" class="l n">客戶 C1001 · 線路 L1001/L1002/L1003 · 套餐 · 賬單</text><text x="466" y="246" class="l c">Agent 工具：get_customer_by_phone / get_data_usage</text><text x="466" y="266" class="l c">enable_roaming / refuel_data</text><line x1="175" x2="175" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="705" x2="705" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="800" height="34" x="40" y="306" fill="#fff" stroke="#666" stroke-dasharray="5 4" stroke-width="1.5" rx="5"/><text x="440" y="323" class="t n">使用者執行 toggle_roaming 後環境已改變，Agent 必須重新呼叫工具才能獲知結果——驗證因此覆蓋 「是否讀到了使用者側的操作結果」</text><rect width="800" height="136" x="40" y="356" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="376" class="t h">任務結束後：四層檢查 + 聚合規則</text><rect width="182" height="62" x="56" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="147" y="408" class="t m">env_assertions</text><text x="147" y="428" class="t n">移動資料可用</text><text x="147" y="444" class="t n">測速 ≥ 200 / excellent</text><rect width="182" height="62" x="254" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="345" y="408" class="t m">actions</text><text x="345" y="428" class="t n">toggle_airplane_mode</text><text x="345" y="444" class="t n">requestor 必須為 user</text><rect width="182" height="62" x="452" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="543" y="408" class="t m">communicate_info</text><text x="543" y="428" class="t n">必要資訊是否告知</text><text x="543" y="444" class="t n">本題為 null</text><rect width="182" height="62" x="650" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="741" y="408" class="t m">nl_assertions</text><text x="741" y="428" class="t n">自然語言層判定</text><text x="741" y="444" class="t n">本題為 null</text><text x="440" y="474" class="t n">reward_basis = [&quot;ENV_ASSERTION&quot;] → 僅採信第一層；其餘各層照常記錄但不計入獎勵</text></svg>