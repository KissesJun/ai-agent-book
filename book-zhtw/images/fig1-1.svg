<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" aria-labelledby="title desc" role="img" viewBox="0 0 900 450"><title id="title">Agent 與 Environment 的互動迴圈</title><desc id="desc">Agent 由 Harness 所環繞的 Model 組成。Environment 將觀察回傳給 Agent，Agent 將行動送給 Environment；Harness 負責中介互動，但不包含 Environment 本身。</desc><defs><marker id="arrow-dark" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="4"><polygon fill="#333" points="0 0 10 4 0 8"/></marker><style>.sans{font-family:Arial,&quot;Helvetica Neue&quot;,Helvetica,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.heading,.subheading{fill:#303030;font-size:20px;font-weight:700}.subheading{fill:#333;font-size:17px}.body{fill:#333;font-size:15px}.note{fill:#666;font-size:13.5px}.box{stroke:#3f3f3f;stroke-width:2}.flow{fill:none;stroke:#333;stroke-width:2.2;marker-end:url(#arrow-dark)}</style></defs><rect width="900" height="500" fill="#fff"/><rect width="432" height="382" x="28" y="42" fill="#fff" class="box" rx="12"/><text x="50" y="72" class="sans heading" dominant-baseline="middle">Agent（智能體）</text><rect width="372" height="300" x="58" y="92" fill="#f3f3f3" stroke="#666" stroke-dasharray="8 4" stroke-width="2" rx="10"/><text x="244" y="112" class="sans subheading" dominant-baseline="middle" text-anchor="middle">Harness（模型執行與互動層）</text><rect width="250" height="58" x="145" y="130" fill="#fff" class="box" rx="7"/><text x="270" y="151" class="sans subheading" dominant-baseline="middle" text-anchor="middle">上下文</text><text x="270" y="172" class="sans note" dominant-baseline="middle" text-anchor="middle">觀察 · 歷史 · 記憶 · 任務狀態</text><line x1="270" x2="270" y1="190" y2="207" class="flow"/><rect width="250" height="78" x="145" y="210" fill="#d5d5d5" class="box" rx="8"/><text x="270" y="236" class="sans heading" dominant-baseline="middle" text-anchor="middle">Model</text><text x="270" y="263" class="sans body" dominant-baseline="middle" text-anchor="middle">理解 · 推理 · 選擇下一步行動</text><line x1="270" x2="270" y1="290" y2="313" class="flow"/><rect width="250" height="50" x="145" y="316" fill="#fff" class="box" rx="7"/><text x="270" y="341" class="sans subheading" dominant-baseline="middle" text-anchor="middle">工具與行動介面</text><text x="244" y="382" class="sans note" dominant-baseline="middle" text-anchor="middle">迴圈 · 狀態管理 · 權限 · 驗證 · 糾正</text><rect width="252" height="322" x="620" y="78" fill="#eee" class="box" rx="12"/><text x="746" y="111" class="sans heading" dominant-baseline="middle" text-anchor="middle">Environment（環境）</text><text x="746" y="136" class="sans note" dominant-baseline="middle" text-anchor="middle">狀態與轉移規則</text><rect width="192" height="67" x="650" y="161" fill="#fff" stroke="#777" stroke-width="1.7" rx="7"/><text x="746" y="184" class="sans subheading" dominant-baseline="middle" text-anchor="middle">目前狀態</text><text x="746" y="207" class="sans note" dominant-baseline="middle" text-anchor="middle">執行行動後產生新狀態</text><line x1="650" x2="842" y1="247" y2="247" stroke="#b0b0b0"/><text x="670" y="274" class="sans body" dominant-baseline="middle">檔案系統 · 資料庫</text><text x="670" y="304" class="sans body" dominant-baseline="middle">網頁 · API · 應用程式</text><text x="670" y="334" class="sans body" dominant-baseline="middle">使用者 · 其他 Agent</text><text x="670" y="364" class="sans body" dominant-baseline="middle">模擬或物理世界</text><path d="M 620 145 H 398" class="flow"/><rect width="116" height="22" x="477" y="119" fill="#fff" rx="4"/><text x="535" y="131" class="sans body" dominant-baseline="middle" text-anchor="middle">觀察</text><path d="M 398 341 H 617" class="flow"/><rect width="116" height="22" x="477" y="311" fill="#fff" rx="4"/><text x="535" y="323" class="sans body" dominant-baseline="middle" text-anchor="middle">行動</text></svg>