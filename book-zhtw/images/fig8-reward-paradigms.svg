<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 40 880 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="640" height="35" x="120" y="55" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="135" y="73" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">任務: Xfinity套餐變更 | 瑕疵: 遺漏賬單地址 + 誤報套餐名稱</text><rect width="190" height="36" x="37.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="132.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">標量</text><rect width="190" height="210" x="37.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="47.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">7.2 分</text><text x="47.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="47.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">無診斷能力</text><text x="47.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">不知道哪裡</text><text x="47.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">做得好/差</text><line x1="229.5" x2="240.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(