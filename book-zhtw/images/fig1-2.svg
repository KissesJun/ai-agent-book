<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 40 820 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="240" height="65" x="30" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="85.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">後訓練</text><text x="150" y="111.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Post-training</text><rect width="80" height="28" x="110" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="150" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">訓練時</text><rect width="240" height="38" x="30" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">修改模型權重</text><rect width="240" height="38" x="30" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">永久性 · 通用性</text><rect width="240" height="38" x="30" y="275" fill="#f0f0f0" stroke="