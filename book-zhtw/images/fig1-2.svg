lvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">臨時性 · 即時適應</text><rect width="240" height="38" x="290" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">受限於視窗大小</text><rect width="240" height="45" x="290" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">例：從 3 個示例學會新格式</text><rect width="240" height="65" x="550" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="85.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">外部化學習</text><text x="670" y="111.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Externalized Learning</text><rect width="80" height="28" x="630" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="670" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">執行時</text><rect width="240" height="38" x="550" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">知識庫 + 工具生成</text><rect width="240" height="38" x="550" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">永續性 · 可更新</text><rect width="240" height="38" x="550" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">高可靠 · 可驗證</text><rect width="240" height="45" x="550" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="670" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">例：將流程固化為程式碼工具</text><line x1="60" x2="760" y1="430" y2="430" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="60" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">慢（數週）</text><text x="410" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">學習速度</text><text x="760" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="end">快（毫秒）</text></svg>