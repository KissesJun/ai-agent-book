<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">線上執行與離線進化：正式版本不在執行中直接改寫</text><rect width="944" height="118" x="28" y="80" fill="#fafbfb" stroke="#7d8d96" stroke-width="1.5" rx="10"/><text x="55" y="107" class="t h">線上執行迴圈</text><rect width="150" height="58" x="220" y="114" class="box" rx="7"/><rect width="150" height="58" x="425" y="114" class="box" rx="7"/><rect width="150" height="58" x="630" y="114" class="box" rx="7"/><text x="295" y="149" class="t s" text-anchor="middle">穩定版 Agent</text><text x="500" y="149" class="t s" text-anchor="middle">處理真實任務</text><text x="705" y="149" class="t s" text-anchor="middle">記錄軌跡與回饋</text><path d="M370 143 H423" class="line"/><path d="M575 143 H628" class="line"/><rect width="944" height="150" x="28" y="270" fill="#f5f8fa" stroke="#2f617a" stroke-width="1.5" rx="10"/><text x="55" y="298" class="t h">離線進化迴圈</text><rect width="150" height="62" x="107" y="323" class="accent" rx="7"/><rect width="150" height="62" x="307" y="323" class="accent" rx="7"/><rect width="150" height="62" x="507" y="323" class="accent" rx="7"/><rect width="170" height="62" x="707" y="323" class="accent" rx="7"/><text x="182" y="349" class="t s" text-anchor="middle">聚合與診斷</text><text x="182" y="371" class="t s" text-anchor="middle">尋找共同根因</text><text x="382" y="349" class="t s" text-anchor="middle">候選修改</text><text x="382" y="371" class="t s" text-anchor="middle">知識·指令·程序·參數</text><text x="582" y="349" class="t s" text-anchor="middle">迴歸與安全驗證</text><text x="582" y="371" class="t s" text-anchor="middle">保留舊能力</text><text x="792" y="349" class="t s" text-anchor="middle">灰度、監控與回溯</text><text x="792" y="371" class="t s" text-anchor="middle">晉升為新穩定版</text><path d="M257 354 H305" class="line"/><path d="M457 354 H505" class="line"/><path d="M657 354 H705" class="line"/><path stroke-dasharray="7 5" d="M705 172 V232 H182 V321" class="line"/><rect width="140" height="24" x="374" y="220" fill="#fff" rx="4"/><text x="444" y="237" class="t s" text-anchor="middle">版本化經驗日誌</text><path stroke-dasharray="7 5" d="M877 354 H986 V56 H295 V112" class="line"/><rect width="156" height="24" x="572" y="44" fill="#fff" rx="4"/><text x="650" y="61" class="t s" text-anchor="middle">通過驗證的新版本</text><text x="500" y="452" class="t s" text-anchor="middle">可信根：權限、稽核、驗證與回溯機制不由普通進化流程自行修改</text></svg>