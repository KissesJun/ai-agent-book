<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="60" x="20" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="120" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">使用者輸入</text><text x="120" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">&quot;我想訂去北京的機票&quot;</text><line x1="220" x2="260" y1="90" y2="90" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="140" x="260" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="390" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LLM 分析 → 生成表單程式碼</text><rect width="240" height="140" x="270" y="90" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="276" y="103" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;form id=&quot;clarify&quot;&gt;</text><text x="276" y="116" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;input type=&quot;text&quot;</text><text x="276" y="129" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">name=&quot;from&quot; label=&quot;出發城市&quot;/&gt;</text><text x="276" y="142" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;input type=&quot;date&quot;</text><text x="276" y="155" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">name=&quot;depart&quot; label=&quot;出發日&quot;/&gt;</text><text x="276" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;select name=&quot;type&quot;&gt;</text><text x="276" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;option&gt;單程&lt;/option&gt;</text><text x="276" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;option&gt;往返&lt;/option&gt;</text><text x="276" y="207" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;/select&gt;</text><text x="276" y="220" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;/form&gt;</text><line x1="520" x2="560" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="300" height="200" x="560" y="55" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="710" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">渲染後的表單介面</text><text x="580" y="95" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">出發城市</text><rect width="180" height="24" x="660" y="83" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="95" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">上海</text><text x="580" y="135" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">出發日期</text><rect width="180" height="24" x="660" y="123" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="135" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">2025-08-15</text><text x="580" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">旅行型別</text><rect width="180" height="24" x="660" y="163" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="175" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">往返 ▾</text><text x="580" y="215" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">返程日期</text><rect width="180" height="24" x="660" y="203" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="215" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">2025-08-22</text><rect width="80" height="26" x="660" y="238" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="700" y="251" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">提交</text><line x1="710" x2="710" y1="268" y2="300" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="300" height="110" x="560" y="300" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="710" y="318" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">結構化 JSON 返回</text><rect width="280" height="74" x="570" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="578" y="344" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">{&quot;from&quot;: &quot;上海&quot;,</text><text x="578" y="360" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&quot;depart&quot;: &quot;2025-08-15&quot;,</text><text x="578" y="376" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&quot;type&quot;: &quot;往返&quot;,</text><text x="578" y="392" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&quot;return&quot;: &quot;2025-08-22&quot;}</text><line x1="560" x2="400" y1="390" y2="440" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="500" height="50" x="100" y="430" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="448" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agent 攜帶完整參數繼續執行任務</text><text x="350" y="468" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">search_flights(from=&apos;上海&apos;, to=&apos;北京&apos;, depart=&apos;2025-08-15&apos;, ...)</text><rect width="250" height="140" x="20" y="280" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="145" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">對比: 純文字 vs 表單</text><text x="30" y="318" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">文字問答: 10 輪對話</text><text x="30" y="331" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Q1: 從哪出發? A: 上海</text><text x="30" y="344" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Q2: 幾號? A: 8月15</text><text x="30" y="357" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Q3: 單程還是往返? ...</text><text x="30" y="383" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">動態表單: 1 次提交</text><text x="30" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">所有資訊一次收集完成</text><text x="30" y="409" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">級聯邏輯自動處理</text><text x="440" y="510" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">表單程式碼由 LLM 動態生成 → 級聯邏輯: 選&quot;往返&quot;時自動顯示返程日期</text></svg>