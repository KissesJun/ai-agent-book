<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 40 880 400" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="180" height="55" x="20" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="110" y="92.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">① 使用者查詢</text><text x="110" y="145" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">&quot;故意殺人罪判幾年？&quot;</text><line x1="200" x2="238" y1="92" y2="92" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="240" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="330" y="92.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">② 檢索 (Retrieval)</text><text x="330" y="140" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">稠密檢索 + BM25</text><text x="330" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">→ Top-K 文字塊</text><line x1="420" x2="458" y1="92" y2="92" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="460" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="92.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">③ 增強 (Augment)</text><text x="550" y="140" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">查詢 + 檢索結果</text><text x="550" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">→ 構造完整 Prompt</text><line x1="640" x2="678" y1="92" y2="92" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="680" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="770" y="92.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">④ 生成 (Generate)</text><text x="770" y="140" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">LLM 綜合上下文</text><text x="770" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">→ 生成回答</text><line x1="20" x2="860" y1="195" y2="195" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="215" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">具體資料流示例</text><rect width="400" height="90" x="20" y="235" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="220" y="253" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">檢索到的文字塊</text><text x="30" y="278" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">《刑法》第232條：故意殺人的，處死刑、</text><text x="30" y="298" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">無期徒刑或十年以上有期徒刑...</text><rect width="420" height="90" x="440" y="235" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="650" y="253" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">增強後的 Prompt</text><text x="450" y="278" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">基於以下法條回答問題：</text><text x="450" y="298" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">[《刑法》第232條...] 問：故意殺人罪判幾年？</text><rect width="840" height="80" x="20" y="345" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="363" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">生成的回答</text><text x="30" y="390" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">根據《刑法》第232條，故意殺人罪處死刑、無期徒刑或十年以上有期徒刑；</text><text x="30" y="412" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">情節較輕的，處三年以上十年以下有期徒刑。</text></svg>