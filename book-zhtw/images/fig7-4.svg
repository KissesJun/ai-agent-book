<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" style="background:#fff"><defs><marker id="ax" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker></defs><style>.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;text-anchor:middle;dominant-baseline:central}.h{font-size:16px;font-weight:700}.m{font-size:13.5px;fill:#666}.a,.n{fill:#333}.n{font-size:13px}.a{font-size:13.5px}</style><line x1="40" x2="846" y1="26" y2="26" stroke="#333" stroke-width="2" marker-end="url(#ax)"/><text x="130" y="12" class="t a">任務的可機械驗證程度：高</text><text x="790" y="12" class="t a">低</text><rect width="190" height="112" x="18" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="113" y="76" class="t h">確定性驗證器</text><text x="113" y="100" class="t m">終態唯一可查</text><text x="113" y="120" class="t m">通過 / 不通過</text><text x="113" y="146" class="t n">SWE-bench 跑測試</text><line x1="212" x2="232" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="236" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="331" y="76" class="t h">檢查項清單</text><text x="331" y="100" class="t m">多項確定性檢查</text><text x="331" y="120" class="t m">按宣告的口徑聚合</text><text x="331" y="146" class="t n">τ²-bench 四層驗證</text><line x1="430" x2="450" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="454" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="549" y="76" class="t h">Rubric + LLM 評判</text><text x="549" y="100" class="t m">維度可拆但無法機械判定</text><text x="549" y="120" class="t m">分維度打分並說明理由</text><text x="549" y="146" class="t n">客服質量、報告撰寫</text><line x1="648" x2="668" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="672" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="767" y="76" class="t h">配對比較</text><text x="767" y="100" class="t m">連維度都難以寫出</text><text x="767" y="120" class="t m">只判 A 與 B 孰優</text><text x="767" y="146" class="t n">Chatbot Arena</text><rect width="408" height="66" x="18" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="222" y="212" class="t h">確定性驗證</text><text x="222" y="234" class="t m">結果完全可復現、可納入持續整合、成本低</text><text x="222" y="250" class="t m">代價：只回答對錯，不指出問題出在哪裡</text><rect width="408" height="66" x="454" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="658" y="212" class="t h">模型評判</text><text x="658" y="234" class="t m">可拆出診斷維度，覆蓋寫不成斷言的任務</text><text x="658" y="250" class="t m">代價：引入評判偏差與波動，成本更高</text></svg>