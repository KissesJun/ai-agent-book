<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>الشكل 6-5: التوافق مع الواجهات المتزامنة واللاتزامن الأصلي في النموذج</title><desc>في مسار التوافق السابق، ترتّب بيئة التشغيل دخول الأحداث لكي يشارك نموذج ذو واجهة متزامنة في مهام غير متزامنة. وهناك مسار آخر يجعل النموذج يفهم هذا الإيقاع أصلاً: يعمل على أمور أخرى أثناء تشغيل الأداة، ويعدّل العمل اللاحق عندما يضيف المستخدم متطلبات أثناء المهمة. يدعم GPT-6 Astra بالفعل استدعاء الأدوات غير المتزامن (Async tool calling) والتوجيه أثناء الدور (Mid-turn steering)، وهو ما يجسّد هذا التغير (الشكل 6-5).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="840" y="53" class="title" direction="rtl" unicode-bidi="plaintext">التوافق: بيئة التشغيل تنظّم العمل غير المتزامن</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">المهمة تعمل في الخلفية</text><text x="155" y="122" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">تسجيل واضح: لم تكتمل</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">استقبال أحداث جديدة</text><text x="440" y="122" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">طابور أو مقاطعة أو توازٍ</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">النموذج يواصل المهمة</text><text x="725" y="122" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">المدخلات ما زالت في جولات متزامنة</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="840" y="218" class="title" direction="rtl" unicode-bidi="plaintext">اللاتزامن الأصلي: فهم الانتظار والتغييرات أثناء المهمة</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">بدء استعلام طويل</text><text x="155" y="290" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">البحث عن مكان للاجتماع</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">مواصلة العمل أثناء الانتظار</text><text x="440" y="290" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">إعداد جدول الأعمال وقائمة التحضير</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">القرار بعد وصول النتائج</text><text x="725" y="290" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">مقارنة الأماكن ببيانات حقيقية</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">المستخدم يضيف متطلبات</text><text x="155" y="390" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">تغير الميزانية أو عدد الحاضرين</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">الاحتفاظ بالعمل المكتمل</text><text x="440" y="390" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">إدخال المتطلبات الجديدة في المهمة</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">تعديل الأفعال اللاحقة</text><text x="725" y="390" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">دمج المعلومات وكل التحديثات</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">النموذج يفهم التغير ويعدّل الخطة؛ بيئة التشغيل تدير الأدوات والحالة ومصادر الأحداث</text><text x="440" y="506" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">استقبال الرسائل يتطلب أيضاً استئناف المهام والتحكم الصحيح في الأفعال.</text></svg>