 مدير المنتج → المهندس المعماري → مدير المشروع → المهندس → ضمان الجودة</text><text x="199.987" y="514" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">▸ قناة الاستثناء</text><text x="727.534" y="514" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">فشل ضمان الجودة → تم توجيه تقرير الخطأ مرة أخرى إلى المهندس بواسطة الوحدة → الإصلاح التكراري</text></svg>