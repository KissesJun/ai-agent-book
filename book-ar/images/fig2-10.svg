<svg xmlns="http://www.w3.org/2000/svg" width="820" height="443" viewBox="0 44 820 443" style="background:#fff"><title>الشكل 2-10: Prompt Cache: إعادة استخدام KV Cache للبادئة عبر الطلبات</title><desc>تقارن ثلاثة طلبات كيف يعيد Prompt Cache استخدام KV Cache الخاصة بالبادئة عبر الطلبات: ينشئ الطلب 1 الذاكرة المؤقتة، ويصيبها الطلب 2 لأن البادئة لم تتغير، بينما يضع الطلب 3 طابعًا زمنيًا ديناميكيًا في بداية موجّه النظام، فتُعاد حساب جميع الرموز بعد نقطة التغيير وتُحتسب تكلفتها من جديد.</desc><defs><marker id="ah-light" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#999" points="0 0 10 3.5 0 7"/></marker></defs><text x="135.262" y="70" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الطلب 1</text><rect width="455" height="40" x="40" y="85" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="267.5" y="105" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">موجّه النظام + الأدوات (1200 رمزًا)</text><rect width="155" height="40" x="500" y="85" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="577.5" y="105" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المستخدم: &quot;كيف يبدو الطقس؟&quot;</text><rect width="120" height="40" x="660" y="85" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="720" y="105" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ توليد الاستجابة</text><text x="135.262" y="155" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الطلب 2</text><rect width="455" height="40" x="40" y="170" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="267.5" y="190" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">موجّه النظام + الأدوات (إصابة الذاكرة المؤقتة ✓)</text><rect width="155" height="40" x="500" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="577.5" y="190" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المستخدم: &quot;كم الساعة؟&quot;</text><rect width="120" height="40" x="660" y="170" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="720" y="190" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ توليد الاستجابة</text><line x1="267.5" x2="267.5" y1="127" y2="168" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="279.5" y="147.5" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="end" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إصابة Prompt Cache: إعادة استخدام KV</text><line x1="267.5" x2="267.5" y1="212" y2="253" stroke="#999" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#ah-light)"/><text x="255.5" y="232.5" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تغيّر موجّه النظام</text><text x="279.5" y="232.5" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="end" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إخفاق Prompt Cache: إعادة حساب KV</text><text x="135.262" y="240" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الطلب 3</text><rect width="455" height="40" x="40" y="255" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="267.5" y="275" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;الوقت: 10:30:45&quot; + موجّه النظام + الأدوات (إبطال الذاكرة المؤقتة ✗)</text><text x="267.5" y="308" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">نقطة التغيير أولًا ← يُعاد حساب كل ما بعدها</text><rect width="155" height="40" x="500" y="255" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="577.5" y="275" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المستخدم: &quot;كيف يبدو الطقس؟&quot;</text><rect width="120" height="40" x="660" y="255" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="720" y="275" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ توليد الاستجابة</text><rect width="660" height="143" x="80" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="352" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مقارنة الأداء (سياق إجمالي من 3000 رمز)</text><line x1="100" x2="720" y1="366" y2="366" stroke="#999" stroke-width="2"/><text x="340" y="384" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إصابة الذاكرة المؤقتة</text><text x="580" y="384" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إبطال الذاكرة المؤقتة</text><line x1="100" x2="720" y1="398" y2="398" stroke="#999" stroke-width="2"/><text x="130" y="416" fill="#333" direction="ltr" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">TTFT *</text><text x="340" y="416" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">~0.5 ثانية</text><text x="580" y="416" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">3–5 ثوانٍ</text><text x="190" y="439" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التكلفة</text><text x="340" y="439" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">فوترة الرموز الجديدة فقط</text><text x="580" y="439" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إعادة فوترة كل الرموز بعد التغيير</text><text x="410" y="460" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">* قيم TTFT توضيحية؛ تختلف باختلاف النموذج والعتاد والنشر، وتبيّن المقياس النسبي فقط.</text></svg>