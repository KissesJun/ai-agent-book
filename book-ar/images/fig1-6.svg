<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" aria-labelledby="title desc" direction="rtl" lang="ar" role="img" viewBox="0 0 820 470"><title id="title">حلقة تنفيذ الوكيل المستقل</title><desc id="desc">يفكر الوكيل ويتصرف ويراقب بالتتابع، ثم يتحقق من شروط الخروج ليعيد النتيجة النهائية أو يبدأ دورة جديدة.</desc><defs><marker id="arrow-dark" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#333" points="0 0 9 3.5 0 7"/></marker><marker id="arrow-light" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#777" points="0 0 9 3.5 0 7"/></marker><style>.sans{font-family:Arial,&quot;Helvetica Neue&quot;,Helvetica,&quot;Noto Sans Arabic&quot;,&quot;Geeza Pro&quot;,sans-serif}.code{font-family:&quot;Courier New&quot;,Courier,monospace}.heading{fill:#333;font-size:16px;font-weight:700}.body{fill:#333;font-size:15px}.note,.small{font-size:14px}.note{fill:#666}.box,.flow{stroke:#333;stroke-width:2}.flow{fill:none;marker-end:url(#arrow-dark)}</style></defs><rect width="820" height="470" fill="#fff"/><rect width="210" height="96" x="45" y="70" fill="#e8e8e8" class="box" rx="8"/><text x="150" y="95" class="sans heading" direction="rtl" dominant-baseline="middle" text-anchor="middle">١. التفكير</text><rect width="180" height="38" x="60" y="112" fill="#fff" stroke="#777" rx="5"/><text x="150" y="132" class="sans body" direction="rtl" dominant-baseline="middle" text-anchor="middle">&quot;بحاجة إلى معلومات&quot;</text><rect width="210" height="96" x="305" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="410" y="95" class="sans heading" direction="rtl" dominant-baseline="middle" text-anchor="middle">٢. الفعل</text><rect width="180" height="38" x="320" y="112" fill="#fff" stroke="#777" rx="5"/><text x="410" y="132" class="code body" direction="ltr" dominant-baseline="middle" text-anchor="middle">web_search(...)</text><rect width="210" height="96" x="565" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="670" y="95" class="sans heading" direction="rtl" dominant-baseline="middle" text-anchor="middle">٣. الملاحظة</text><rect width="180" height="38" x="580" y="112" fill="#fff" stroke="#777" rx="5"/><text x="670" y="132" class="code body" direction="ltr" dominant-baseline="middle" text-anchor="middle">tool_result: &quot;...&quot;</text><line x1="255" x2="302" y1="118" y2="118" class="flow"/><line x1="515" x2="562" y1="118" y2="118" class="flow"/><line x1="670" x2="670" y1="166" y2="207" class="flow"/><rect width="430" height="145" x="45" y="220" fill="#fff" stroke="#777" stroke-dasharray="7 4" stroke-width="2" rx="8"/><text x="260" y="244" class="sans heading" direction="rtl" dominant-baseline="middle" text-anchor="middle">شروط الخروج (يكفي أحدها)</text><line x1="65" x2="455" y1="258" y2="258" stroke="#ccc"/><text x="357" y="282" class="sans body small" direction="rtl" dominant-baseline="middle" text-anchor="middle">١. اكتملت المهمة</text><text x="157" y="282" class="sans body small" direction="rtl" dominant-baseline="middle" text-anchor="middle">٢. استدعاء final_answer</text><text x="357" y="314" class="sans body small" direction="rtl" dominant-baseline="middle" text-anchor="middle">٣. لا يوجد استدعاء أداة</text><text x="157" y="314" class="sans body small" direction="rtl" dominant-baseline="middle" text-anchor="middle">٤. تجاوز حد الأخطاء</text><text x="357" y="346" class="sans body small" direction="rtl" dominant-baseline="middle" text-anchor="middle">٥. بلوغ الحد الأقصى للجولات</text><path fill="none" stroke="#777" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-light)" d="M 475 260 H 587"/><rect width="72" height="20" x="497" y="238" fill="#fff" rx="3"/><text x="533" y="248" class="sans note" direction="rtl" dominant-baseline="middle" text-anchor="middle">أساس القرار</text><polygon fill="#e2e2e2" points="670 208 750 260 670 312 590 260" class="box"/><text x="670" y="252" class="sans heading" direction="rtl" dominant-baseline="middle" text-anchor="middle">تحقق شرط</text><text x="670" y="273" class="sans heading" direction="rtl" dominant-baseline="middle" text-anchor="middle">الخروج؟</text><path d="M 750 260 H 795 V 35 H 150 V 67" class="flow"/><text x="773" y="245" class="sans note" direction="rtl" dominant-baseline="middle" text-anchor="middle">لا</text><rect width="120" height="22" x="360" y="43" fill="#fff" rx="3"/><text x="420" y="54" class="sans note" direction="rtl" dominant-baseline="middle" text-anchor="middle">متابعة الحلقة</text><line x1="670" x2="670" y1="312" y2="379" class="flow"/><text x="685" y="346" class="sans note" direction="rtl" dominant-baseline="middle">نعم</text><rect width="230" height="68" x="555" y="382" fill="#d6d6d6" class="box" rx="8"/><text x="670" y="416" class="sans heading" direction="rtl" dominant-baseline="middle" text-anchor="middle">إرجاع النتيجة النهائية</text></svg>