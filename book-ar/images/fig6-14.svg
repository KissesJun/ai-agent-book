ont-size="14" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إحداثيات إخراج النموذج</text><text x="640" y="108" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">بناءً على الصورة التي تم تصغير حجمها</text><text x="640" y="128" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التنبؤ: (683، 384)</text><circle cx="650" cy="145" r="4" fill="#333" stroke="#333" stroke-width="2"/><text x="640" y="168" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ الرجوع إلى الدقة الفعلية</text><line x1="242" x2="288" y1="110" y2="110" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="265" y="100" fill="#666" direction="rtl" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تصغير الحجم</text><line x1="492" x2="538" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="538" x2="492" y1="110" y2="110" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="515" y="100" fill="#666" direction="rtl" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الإحداثيات</text><rect width="700" height="60" x="40" y="200" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="218" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">سير العمل الكامل</text><text x="390" y="242" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">① حدد دقة الهدف حسب نسبة العرض إلى الارتفاع → ② لقطة شاشة ذات نطاق منخفض باستخدام ImageMagick → ③ ينشئ استنتاج النموذج إحداثيات → ④ زيادة الحجم بشكل متناسب → ⑤ نفذ باستخدام xdotool</text><rect width="700" height="55" x="40" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="293" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مثال على القياس (شاشة 16:9 ← FWXGA)</text><text x="390" y="315" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">لقطة الشاشة: 2560×1440 → 1366×768 (×0.53) | الإحداثيات: نموذج (683، 384) → فعلي (1280، 720) (×1.87)</text></svg>