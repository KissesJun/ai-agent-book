Noto Sans Arabic','Noto Sans',Arial,sans-serif">مخطط البيانات المعيارية</text><text x="240" y="212" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المخطط الأساسي (الاستسلام الطوعي/التعويض/الإدانات_السابقة) + مخطط التمديد الخاص بالجريمة</text><text x="240" y="232" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">(السرقة ← المبلغ_المتورط، الإصابة ← مستوى_الإصابة)</text><rect width="840" height="215" x="20" y="270" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="293" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المرحلة الثانية: تحليل العوامل ونمذجة المعرفة</text><rect width="200" height="80" x="40" y="310" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="140" y="330" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">ميزة المتجهات</text><text x="140" y="354" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" t