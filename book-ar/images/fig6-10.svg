<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 40 780 430" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="140" height="50" x="30" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="100" y="78" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">إدخال المستخدم</text><text x="100" y="98" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;أي خطة تختار؟&quot;</text><line x1="172" x2="218" y1="78" y2="78" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="250" height="130" x="220" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="350.01" y="73" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التفكير الموازي</text><rect width="220" height="42" x="235" y="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="345" y="95" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تفكير سريع ~ 500 مللي ثانية (التفكير)</text><text x="345" y="110" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;سعر جيد، أنصح بالشراء&quot;</text><rect width="220" height="42" x="235" y="130" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="345" y="145" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التفكير البطيء ~ 8 ثواني (التفكير)</text><text x="345" y="160" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;يفتقر إلى خدمة التجوال الدولي، غير مناسب&quot;</text><line x1="457" x2="503" y1="95" y2="95" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="457" x2="503" y1="150" y2="150" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="240" height="130" x="505" y="60" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="625" y="80" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تجربة المستخدم</text><text x="625" y="102" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">0.5 ثانية: &quot;سعر جيد، أوصي بالشراء&quot;</text><text x="625" y="120" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">8.0s: &quot;يفتقر إلى التجوال الدولي، غير مناسب&quot;</text><text x="625" y="145" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ تناقض!</text><text x="625" y="168" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ المستخدم يفقد الثقة</text><rect width="720" height="90" x="30" y="210" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="230" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">قضيتان رئيسيتان</text><text x="200" y="258" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المشكلة الأولى: الإفراط في التفكير في المشاكل البسيطة</text><text x="200" y="278" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;ما هو اليوم؟&quot; ← التفكير السريع صحيح بالفعل ← يستمر التفكير البطيء لمدة 8 ثوانٍ</text><text x="580" y="258" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المسألة الثانية: التعارض بين السريع والبطيء</text><text x="580" y="278" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مسارات التفكير المستقلة، قد تكون الافتراضات مختلفة تماما</text><rect width="340" height="100" x="30" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="200" y="376" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التحسين: التفكير البطيء كـ &quot;مستشار&quot; يرشد خلف الكواليس</text><text x="200" y="400" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تفكير بطيء → شريط حالة الوكيل → تفكير سريع</text><text x="200" y="420" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">لا يوجد صراع مباشر، ولكن التواصل غامض بشكل غير مباشر</text><rect width="340" height="100" x="410" y="355" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="580" y="376" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">لا تزال لديها قيود أساسية</text><text x="580" y="398" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التفكير السريع قد يسيء تفسير تلميحات شريط الحالة (&quot;تأكيد السعر&quot; →</text><text x="580" y="416" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;التأكيد مع المستخدم&quot; بدلاً من &quot;إعادة الحساب&quot;)</text><text x="580" y="434" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">لا يستطيع تحقيق التفاعل الطبيعي المتمثل في &quot;التفكير أثناء التحدث&quot;</text></svg>