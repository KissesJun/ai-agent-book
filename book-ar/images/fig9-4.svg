<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">تحويل الخبرة إلى معرفة: المسارات دليل، والوثيقة هي وحدة إعادة الاستخدام</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle">المسار الخام</text><text x="106" y="139" class="t s" text-anchor="middle" style="font-size:10px">الإجراءات والنتائج والبيئة</text><text x="106" y="160" class="t s" text-anchor="middle" style="font-size:13px">دليل غير قابل للتغيير</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle">تقييم مفرد</text><text x="299" y="139" class="t s" text-anchor="middle">نجاح، فشل، وسوم</text><text x="299" y="160" class="t s" text-anchor="middle">يحفظ موضع الدليل</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle" style="font-size:15px">مقارنة عبر المسارات</text><text x="500" y="128" class="t s" text-anchor="middle" style="font-size:13.5px">تجميع المهام المتشابهة</text><text x="500" y="151" class="t s" text-anchor="middle" style="font-size:14.5px">مقابلة النجاح بالفشل</text><text x="500" y="174" class="t s" text-anchor="middle" style="font-size:9px">استخراج القواسم المشتركة والحدود</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle">وثيقة Markdown</text><text x="709" y="128" class="t s" text-anchor="middle" style="font-size:9px">سيناريوهات التطبيق والاستراتيجية</text><text x="709" y="142.59" class="t s" text-anchor="middle" style="font-size:14.5px">الاستثناءات والمناطق</text><text x="709" y="159.41" class="t s" text-anchor="middle" style="font-size:14.5px">المحظورة والمصادر</text><text x="709" y="174" class="t s" text-anchor="middle">الإصدار ووقت التحقق</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle" style="font-size:12.5px">الاسترجاع والتطبيق</text><text x="902" y="131.17" class="t s" text-anchor="middle" style="font-size:13.5px">التحميل عند الحاجة</text><text x="902" y="146.83" class="t s" text-anchor="middle" style="font-size:13.5px">للمهام الجديدة</text><text x="902" y="160" class="t s" text-anchor="middle" style="font-size:9px">يواصل توليد التغذية الراجعة</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">الأدلة الجديدة تنقّح المعرفة القديمة أو تقيّدها أو تلغيها</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="332" class="t s" text-anchor="middle" style="font-size:10.5px">يشارك بنية الاستخراج والاسترجاع مع الفصل الثالث؛ ويضيف هذا الفصل تقييم المسارات وحلقة تحسين السلوك</text></svg>