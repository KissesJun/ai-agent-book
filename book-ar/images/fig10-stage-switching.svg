t-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مهندس البرمجيات</text><rect width="232" height="88" x="298" y="160" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="400.136" y="175" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">موجّه النظام</text><text x="493.541" y="192" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;اكتب بناءً على المتطلبات المؤكدة</text><text x="480.732" y="208" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">كود Python عالي الجودة. اتبع</text><text x="519.223" y="224" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">النمذجة، وأفضل الممارسات في التعامل مع الأخطاء.&quot;</text><rect width="232" height="78" x="298" y="258" fill="#fff" stroke="#333" stroke-width="2" rx="3"/><text x="355.798" y="272" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14"