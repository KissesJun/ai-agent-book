ght="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الأمن. اعتماد التفكير النقدي.&quot;</text><rect width="232" height="78" x="564" y="258" fill="#fff" stroke="#333" stroke-width="2" rx="3"/><text x="621.798" y="272" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مجموعة الأدوات</text><text x="677.6" y="290" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">run_linter (ملف)</text><text x="671" y="310" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">اختبارات التشغيل (ملف)</text><text x="730.4" y="330" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تحليل_التعقيد (ملف)</text><text x="410" y="510" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تبديل الدور: تحديث موجّه النظام + مجموعة الأدوات، وحفظ سجل المحادثة والحالة بشكل مستمر</text></svg>