<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker><marker id="ah-r" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="0" refY="3.5"><polygon fill="#666" points="10 0 0 3.5 10 7"/></marker></defs><style>.l,.t{fill:#333;dominant-baseline:central}.t{text-anchor:middle}.l{text-anchor:start}.h{font-size:15px;font-weight:700}.m{font-size:12px}.c,.n{font-size:10.5px;fill:#666}.c,.l,.t{unicode-bidi:plaintext}.l,.t{direction:rtl;font-family:&apos;Noto Sans Arabic&apos;,&apos;Noto Sans&apos;,Arial,sans-serif}.c{font-family:&apos;SF Mono&apos;,Menlo,Consolas,monospace;direction:ltr}</style><rect width="270" height="86" x="40" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="175" y="40" class="t h">محاكي المستخدم (LLM)</text><text x="56" y="62" class="l n">known_info: John Smith / 555-123-2002 / في فرنسا</text><text x="56" y="80" class="l n">task_instructions: كشف تدريجي · انفعال · ترسيخ</text><text x="56" y="96" class="l n">القبول: excellent وحدها تُعد حلًّا</text><rect width="270" height="86" x="570" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="705" y="40" class="t h">الوكيل (قيد التقييم)</text><text x="586" y="62" class="l n">المدخل: تذكرة + سياسة النطاق</text><text x="586" y="80" class="l n">غير مرئي: الحالة الحقيقية للجهاز</text><text x="586" y="96" class="l n">يوجّه فقط ولا ينفّذ نيابةً عنه</text><line x1="316" x2="560" y1="63" y2="63" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)" marker-start="url(#ah-r)"/><text x="438" y="50" class="t n">حوار متعدد الأدوار</text><text x="438" y="80" class="t n">كشف تدريجي للمعلومات</text><rect width="800" height="150" x="40" y="146" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="166" class="t h">بيئة مشتركة (تحكم مزدوج: الطرفان يغيّران الحالة)</text><rect width="370" height="98" x="60" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="245" y="200" class="t m" font-weight="bold">حالة جانب الجهاز</text><text x="76" y="222" class="l n">وضع الطيران ON · التجوال OFF · توفير البيانات · الرصيد</text><text x="76" y="246" class="l c">أدوات المستخدم: toggle_airplane_mode / toggle_roaming</text><text x="76" y="266" class="l c">check_status_bar / run_speed_test</text><rect width="370" height="98" x="450" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="635" y="200" class="t m" font-weight="bold">قاعدة بيانات المشغّل</text><text x="466" y="222" class="l n">العميل C1001 · الخطوط L1001/L1002/L1003 · الباقات · الفواتير</text><text x="466" y="246" class="l c">أدوات الوكيل: get_customer_by_phone / get_data_usage</text><text x="466" y="266" class="l c">enable_roaming / refuel_data</text><line x1="175" x2="175" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="705" x2="705" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="800" height="34" x="40" y="306" fill="#fff" stroke="#666" stroke-dasharray="5 4" stroke-width="1.5" rx="5"/><text x="440" y="323" class="t n">استدعاء toggle_roaming من المستخدم غيّر البيئة؛ على الوكيل استدعاء الأداة من جديد — والتحقق يغطي هذه القراءة</text><rect width="800" height="136" x="40" y="356" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="376" class="t h">بعد المهمة: أربع طبقات فحص + قاعدة تجميع</text><rect width="182" height="62" x="56" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="147" y="408" class="t m">env_assertions</text><text x="147" y="428" class="t n">بيانات الجوّال متاحة</text><text x="147" y="444" class="t n">السرعة ≥ 200 / excellent</text><rect width="182" height="62" x="254" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="345" y="408" class="t m">actions</text><text x="345" y="428" class="t n">toggle_airplane_mode</text><text x="345" y="444" class="t n">يجب أن يكون requestor هو user</text><rect width="182" height="62" x="452" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="543" y="408" class="t m">communicate_info</text><text x="543" y="428" class="t n">هل أُبلغت المعلومات اللازمة</text><text x="543" y="444" class="t n">null في هذه المهمة</text><rect width="182" height="62" x="650" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="741" y="408" class="t m">nl_assertions</text><text x="741" y="428" class="t n">حكم على مستوى اللغة الطبيعية</text><text x="741" y="444" class="t n">null في هذه المهمة</text><text x="440" y="474" class="t n">reward_basis = [&quot;ENV_ASSERTION&quot;] ← الطبقة الأولى وحدها معتمدة؛ والباقي يُسجَّل ولا يدخل المكافأة</text></svg>