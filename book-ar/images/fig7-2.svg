<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="400" height="460" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="220" y="78" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">نوع استدعاء الأداة (أدوات التحقق)</text><rect width="200" height="42" x="120" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="116" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الوكيل (LLM)</text><line x1="220" x2="220" y1="137" y2="168" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="80" x="60" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="192" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">بيئة تنفيذ الأداة</text><rect width="290" height="48" x="75" y="200" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="293.8" y="219" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">run_python(&quot;def fib(n): ...&quot;)</text><text x="279.4" y="237" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ {&quot;النتيجة&quot;: [1,1,2,3,5,8]}</text><line x1="220" x2="220" y1="250" y2="278" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="80" x="60" y="280" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="302" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مدقق قابل للتنفيذ</text><rect width="290" height="48" x="75" y="312" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="286.6" y="331" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تأكيد fib(10) == 55 # PASS</text><text x="286.6" y="349" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">تأكيد fib(0) == 0 # PASS</text><line x1="220" x2="220" y1="360" y2="390" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="240" height="40" x="100" y="392" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="412" fill="#fff" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المكافأة = 1.0 (جميعها ناجحة)</text><rect width="280" height="30" x="80" y="445" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="354.6" y="460" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الميزات: لا يلزم إجراء تقييم بشري/LLM</text><rect width="400" height="460" x="460" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="660" y="78" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.5" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">نوع التفاعل بين الإنسان والحاسوب (τ-bench)</text><rect width="165" height="42" x="475" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="557.5" y="116" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">محاكاة المستخدم</text><rect width="165" height="42" x="680" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="762.5" y="116" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الوكيل (LLM)</text><line x1="640" x2="678" y1="108" y2="108" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="660" y="148" fill="#666" direction="rtl" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-style="italic" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">&quot;رحلتي بها مشكلة&quot;</text><line x1="680" x2="642" y1="128" y2="128" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="762" x2="762" y1="137" y2="168" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="340" height="80" x="490" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="192" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">استدعاء الأداة</text><rect width="310" height="48" x="505" y="200" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="702.2" y="219" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">lookup_booking(&quot;BK-98712&quot;)</text><text x="761" y="237" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">→ {&quot;الحالة&quot;: &quot;مؤكد&quot;، &quot;الرحلة&quot;: &quot;UA123&quot;}</text><line x1="660" x2="660" y1="250" y2="278" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="340" height="100" x="490" y="280" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="302" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التحقق المزدوج</text><rect width="310" height="66" x="505" y="312" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="767" y="331" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">① قاعدة البيانات: booking.status == &quot;تم الإلغاء&quot;</text><text x="739.4" y="349" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">② الحوار: يحتوي على &quot;استرداد 150 دولارًا&quot;</text><text x="708.8" y="367" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">يحتوي على &quot;3-5 أيام عمل للوصول&quot;</text><line x1="660" x2="660" y1="380" y2="406" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="280" height="40" x="520" y="408" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="428" fill="#fff" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المكافأة = 0/1 (كلاهما ناجح)</text><rect width="320" height="30" x="500" y="460" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="802.5" y="475" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الميزات: الكشف التدريجي عن المعلومات + التحقق من الحالة</text></svg>