<svg xmlns="http://www.w3.org/2000/svg" width="820" height="525" viewBox="0 40 820 525" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="740" height="90" x="40" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="529.937" y="90" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الطبقة 1: البيانات الوصفية (يتم تحميلها عند بدء التشغيل، ~300 رمز مميز)</text><rect width="700" height="48" x="60" y="108" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="716.8" y="130" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المهارات: [{name: &quot;PPTX&quot;، desc: &quot;إنشاء عروض PowerPoint التقديمية من المحتوى&quot;}</text><text x="599.2" y="145" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">{الاسم: &quot;PDF&quot;، وصف: &quot;استخراج وتحليل مستندات PDF&quot;}، ...]</text><line x1="410" x2="410" y1="162" y2="185" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="718.8" y="173" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مشغل المهمة: &quot;إنشاء PPT من الورق&quot;</text><rect width="740" height="150" x="40" y="190" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="632.137" y="210" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الطبقة 2: التدفق الأساسي لـ SKILL.md (يتم تحميله عند الطلب، حوالي 2 ألف رمز مميز)</text><rect width="700" height="100" x="60" y="230" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="271.6" y="250" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="16" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">التدفق الأساسي لمهارة PPTX:</text><text x="607.6" y="272" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">1. قم باستخراج النص → 2. قم بفك ضغط PPTX للوصول إلى XML</text><text x="588.4" y="294" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">3. قم بتعديل محتوى الشريحة {N}.xml → 4. أعد تجميعها بتنسيق .pptx</text><text x="607.6" y="316" fill="#333" direction="rtl" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">المراجع: → html2pptx.md | → مرجع.MD | → البرامج النصية/</text><line x1="410" x2="410" y1="342" y2="365" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="811.63" y="353" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">بحاجة إلى طريقة تفصيلية: &quot;إنشاء PPT باستخدام قالب HTML&quot;</text><rect width="740" height="140" x="40" y="370" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="669.883" y="390" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="bold" text-anchor="start" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الطبقة 3: المستندات الفرعية (التعمق الانتقائي، المحملة عند الطلب)</text><rect width="215" height="80" x="60" y="415" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="167.5" y="433" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">html2pptx.md</text><text x="167.5" y="455" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">سير العمل الكامل ل</text><text x="167.5" y="473" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">قالب HTML → PPT</text><rect width="215" height="80" x="295" y="415" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="402.5" y="433" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مرجع.md</text><text x="402.5" y="455" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">مواصفات تنسيق XML</text><text x="402.5" y="473" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">والتفاصيل الفنية</text><rect width="215" height="80" x="530" y="415" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="637.5" y="433" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">البرامج النصية/*.py</text><text x="637.5" y="455" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الأدوات القابلة للتنفيذ:</text><text x="637.5" y="473" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">الصورة المصغرة.py وما إلى ذلك.</text><rect width="620" height="35" x="100" y="520" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="538" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">البيانات التعريفية الثابتة → KV Cache ودية | تم إلحاق المحتوى الديناميكي → لم يتم إبطال ذاكرة التخزين المؤقت</text></svg>