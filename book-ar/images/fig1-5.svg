<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 40 820 530" style="background:#fff"><title>الشكل 1-5: بنية &quot;النموذج كوكيل&quot; — استدعاء الأداة الأصلية</title><desc>يستدعي النموذج أدوات أصلية مثل web_search و code_interpreter داخل حلقة مغلقة ينفّذها Harness على الخادم. مدخل المستخدم والناتج النهائي خارج هذه الحلقة، وداخلها تتكوّن حلقة ReAct من الفكرة والفعل والملاحظة. عبارة «لا حاجة لكتابة حلقة ReAct في العميل» تصح فقط لمسار Responses API (التجربة 1-3)؛ أما في مسار Kimi K3 (التجربة 1-2) فتُنفَّذ الأدوات على الخادم لكن الحلقة ما زالت تُدار من كود العميل.</desc><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="300" height="100" x="260" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="100" fill="#333" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">LLM (كيمي K3 / GPT-5.6)</text><text x="410" y="130" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle" unicode-bidi="plaintext" style="font-family:'Noto Sans Arabic','Noto Sans',Arial,sans-serif">قدرات الوكيل الأصلية بعد تدريب RL</text><rect width="180" height="230" x="620" y="70" fill="none" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="788" y="88" fill="#666" direction="rtl" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', 