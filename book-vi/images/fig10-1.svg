<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 40 780 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="350" height="480" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="32" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="start">Bối cảnh được chia sẻ (cộng tác kế thừa)</text><g transform="translate(0 4)"><rect width="320" height="100" x="35" y="82" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Giai đoạn 1: Nhà phân tích yêu cầu</text><text x="47" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start"><tspan x="47" y="114">sys: &quot;Trách nhiệm của bạn là hiểu đầy đủ các</tspan><tspan x="47" y="127">yêu cầu...&quot;</tspan></text><text x="47" y="142" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [ask_question, save_req]</text><text x="47" y="155" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">user: &quot;Viết tập lệnh phân tích CSV&quot;</text><text x="47" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: &quot;Loại tệp nào cần được xử lý?&quot;</text><g transform="translate(0 10)"><rect width="320" height="100" x="35" y="184" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Giai đoạn 2: Kỹ sư phần mềm</text><text x="47" y="216" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start"><tspan x="47" y="216">sys: &quot;Viết mã dựa trên yêu cầu đã được xác</tspan><tspan x="47" y="229">nhận...&quot;</tspan></text><text x="47" y="244" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [write_file, execute_code]</text><text x="47" y="258" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: write_file(&quot;analyze.py&quot;, ...)</text><text x="47" y="271" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: execute_code(&quot;python test.py&quot;)</text></g><g transform="translate(0 20)"><rect width="320" height="100" x="35" y="286" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Giai đoạn 3: Người đánh giá mã</text><text x="47" y="318" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">sys: &quot;Đánh giá chất lượng và bảo mật mã...&quot;</text><text x="47" y="336" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [run_linter, run_tests]</text><text x="47" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: run_linter → 2 warnings</text><text x="47" y="372" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: approve_code()</text></g><g transform="translate(0 38)"><rect width="320" height="28" x="35" y="388" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="195" y="397" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle"><tspan x="195" y="397">↑ Tất cả các giai đoạn đều có chung lịch</tspan><tspan x="195" y="407">sử trò chuyện</tspan></text></g><text x="195" y="472" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Hoàn thành đường đua</text><text x="195" y="494" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ Mở rộng nhanh chóng bối cảnh</text></g><rect width="350" height="480" x="410" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="422" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="start">Không có bối cảnh chung (cộng tác biệt lập)</text><g transform="translate(0 4)"><rect width="320" height="80" x="425" y="82" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Glossary Agent</text><text x="437" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;Nhận dạng thuật ngữ và dịch...&quot;</text><text x="437" y="132" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [search_dict, write_file]</text><text x="437" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ glossary.json</text><g transform="translate(0 10)"><rect width="320" height="80" x="425" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="184" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Translation Agent</text><text x="437" y="202" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;Dịch chương này...&quot;</text><text x="437" y="220" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [read_file, write_file]</text><text x="437" y="238" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ chapter1_zh.md</text></g><g transform="translate(0 20)"><rect width="320" height="80" x="425" y="258" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="272" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Proofreading Agent</text><text x="437" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">sys: &quot;Kiểm tra tính nhất quán của thuật ngữ...&quot;</text><text x="437" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [read_file, write_file]</text><text x="437" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ review_report.md</text></g><g transform="translate(0 39)"><rect width="320" height="65" x="425" y="351" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="585" y="367" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Hệ thống tập tin được chia sẻ</text><text x="437" y="384" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">glossary.json chapter1_zh.md review_report.md</text><text x="585" y="399" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle"><tspan x="585" y="399">+ Tham số lệnh gọi tool truyền dữ liệu có</tspan><tspan x="585" y="410">cấu trúc</tspan></text></g><text x="585" y="472" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Mô-đun · Có thể mở rộng · Song song</text><text x="585" y="494" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ Đồng bộ hóa thông tin phức tạp</text></g></svg>