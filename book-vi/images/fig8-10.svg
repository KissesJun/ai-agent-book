<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 40 780 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="210" height="138" x="60" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="165" y="79.7" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17.96" font-weight="bold" text-anchor="middle">Chuẩn bị dữ liệu</text><text x="165" y="96.18" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.57" font-weight="normal" text-anchor="middle">Cặp đầu vào-đầu ra: (x, y)</text><text x="165" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.57" font-weight="normal" text-anchor="middle"><tspan x="165" dy="109.76">Giọng nói: Âm thanh tham</tspan><tspan x="165" dy="13.58">chiếu → Kiểu token</tspan></text><text x="165" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.57" font-weight="normal" text-anchor="middle"><tspan x="165" dy="136.91">Chắt lọc: đầu ra của giáo</tspan><tspan x="165" dy="13.58">viên → mục tiêu của học</tspan><tspan x="165" dy="13.58">sinh</tspan></text><text x="165" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.57" font-weight="normal" text-anchor="middle"><tspan x="165" dy="177.64">Đa ngôn ngữ: Trình diễn</tspan><tspan x="165" dy="13.58">mẫu tư duy</tspan></text><rect width="210" height="138" x="290" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="395" y="88.64" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Tối ưu hóa đào tạo</text><text x="395" y="107" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">L = −Σ log P(yᵢ|xᵢ)</text><text x="395" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="395" dy="122.12">Tối đa hóa khả năng ghi</tspan><tspan x="395" dy="15.12">nhật ký có điều kiện</tspan></text><text x="395" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="395" dy="152.36">Hàng nghìn đến hàng chục</tspan><tspan x="395" dy="15.12">nghìn mẫu</tspan></text><text x="395" y="182.6" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Hội tụ trong vài giờ</text><rect width="210" height="138" x="520" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="625" y="96.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Đánh giá hiệu quả</text><text x="625" y="114.56" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" fo