<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="400" height="460" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="220" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Loại lệnh gọi tool (Verifiers)</text><rect width="200" height="42" x="120" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="116" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Agent (LLM)</text><line x1="220" x2="220" y1="137" y2="168" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="80" x="60" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="192" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Môi trường thực thi tool</text><rect width="290" height="48" x="75" y="200" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="85" y="219" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">run_python(&quot;def fib(n): ...&quot;)</text><text x="85" y="237" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ {&quot;result&quot;: [1,1,2,3,5,8]}</text><line x1="220" x2="220" y1="250" y2="278" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="80" x="60" y="280" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="302" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Trình xác thực có thể thực thi</text><rect width="290" height="48" x="75" y="312" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="85" y="331" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">assert fib(10) == 55 # PASS</text><text x="85" y="349" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">assert fib(0) == 0 # PASS</text><line x1="220" x2="220" y1="360" y2="390" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="240" height="40" x="100" y="392" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="0" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="bold" text-anchor="middle"><tspan x="220" dy="404.5">reward = 1.0 (tất cả đều</tspan><tspan x="220" dy="15">đạt)</tspan></text><rect width="280" height="30" x="80" y="445" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="90" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="90" dy="454.6">Các tính năng: Không cần đánh giá thủ</tspan><tspan x="90" dy="10.8">công/LLM</tspan></text><rect width="400" height="460" x="460" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="660" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle"><tspan x="660" dy="268.26">Loại tương tác giữa người và máy</tspan><tspan x="660" dy="21.6">tính (τ-bench)</tspan></text><rect width="165" height="42" x="475" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="557.5" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.81" font-weight="bold" text-anchor="middle"><tspan x="557.5" dy="108">Trình mô phỏng</tspan><tspan x="557.5" dy="15.99">người dùng</tspan></text><rect width="165" height="42" x="680" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="762.5" y="116" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Agent (LLM)</text><line x1="640" x2="678" y1="108" y2="108" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="660" y="306.6" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-style="italic" text-anchor="middle">&quot;Có vấn đề với chuyến bay của tôi&quot;</text><line x1="680" x2="642" y1="128" y2="128" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="762" x2="762" y1="137" y2="168" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="340" height="80" x="490" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="192" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Cuộc gọi tool</text><rect width="310" height="48" x="505" y="200" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="515" y="219" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">lookup_booking(&quot;BK-98712&quot;)</text><text x="515" y="237" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">→ {&quot;status&quot;:&quot;confirmed&quot;,&quot;flight&quot;:&quot;UA123&quot;}</text><line x1="660" x2="660" y1="250" y2="278" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="340" height="100" x="490" y="280" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="302" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Xác minh hai bước</text><rect width="310" height="66" x="505" y="312" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="515" y="331" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">① DB: booking.status == &quot;cancelled&quot;</text><text x="515" y="349" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">② Hội thoại: Chứa &quot;Hoàn tiền $150&quot;</text><text x="515" y="367" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Chứa &quot;3-5 ngày làm việc sẽ đến&quot;</text><line x1="660" x2="660" y1="380" y2="406" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="280" height="40" x="520" y="408" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="428" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">reward = 0/1 (cả hai đều đạt)</text><rect width="320" height="30" x="500" y="460" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="510" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="510" dy="469.6">Tính năng: Tiết lộ thông tin lũy tiến + xác</tspan><tspan x="510" dy="10.8">minh trạng thái</tspan></text></svg>