<svg xmlns="http://www.w3.org/2000/svg" width="880" height="515" viewBox="0 40 880 515" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="180" height="50" x="60" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">bụi → sao</text><text x="150" y="92" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">định luật vật lý</text><line x1="240" x2="255" y1="80" y2="80" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="50" x="260" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ngôi sao → hành tinh</text><text x="350" y="92" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">sự hội tụ hấp dẫn</text><line x1="440" x2="455" y1="80" y2="80" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="50" x="460" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">hành tinh → sự sống</text><text x="550" y="92" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">DNA tự sao chép</text><line x1="640" x2="655" y1="80" y2="80" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="50" x="660" y="55" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="750" y="72" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Cuộc sống→Đại lý</text><text x="750" y="92" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">khởi động mã</text><line x1="30" x2="850" y1="120" y2="120" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><rect width="400" height="70" x="30" y="135" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="230" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.01" font-weight="bold" text-anchor="middle"><tspan x="230" dy="146.49">DNA Tự sao chép: đột biến ngẫu nhiên + chọn</tspan><tspan x="230" dy="12.97">lọc tự nhiên</tspan></text><text x="230" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.51" font-weight="normal" text-anchor="middle"><tspan x="230" dy="171.62">Không hiểu chính mình · Không thể thực hiện các sửa</tspan><tspan x="230" dy="11.35">đổi có chủ đích · 37 Hàng trăm triệu năm thử và sai</tspan><tspan x="230" dy="11.35">mù quáng</tspan></text><rect width="400" height="70" x="450" y="135" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="650" y="0" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.81" font-weight="bold" text-anchor="middle"><tspan x="650" dy="148.01">Agent Bootstrap: Tìm hiểu mã + Thiết kế định</tspan><tspan x="650" dy="15.99">hướng</tspan></text><text x="650" y="0" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle"><tspan x="650" dy="179">Hiểu cơ chế của riêng bạn · Sáng tạo có mục đích · Kế</tspan><tspan x="650" dy="14">thừa các phương pháp hay nhất</tspan></text><rect width="390" height="295" x="20" y="225" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="215" y="248" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agent gốc (tự mã)</text><rect width="175" height="124" x="30" y="265" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="118" y="327" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lời nhắc hệ thống</text><text x="40" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start"><tspan x="40" dy="288.12">Bạn là nhân viên dịch vụ</tspan><tspan x="40" dy="12.96">khách hàng của hãng</tspan><tspan x="40" dy="12.96">hàng không</tspan></text><text x="40" y="327" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Quy định hủy:...</text><text x="40" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start"><tspan x="40" dy="339.96">Quy định chuyển</tspan><tspan x="40" dy="12.96">nhượng:...</tspan></text><text x="40" y="365.88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Tool: cancel_order</text><rect width="185" height="124" x="215" y="265" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="308" y="285" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Mã khung Agent</text><text x="225" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">loop:</text><text x="225" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">msg = llm(ctx)</text><text x="225" y="344" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">if tool_call:</text><text x="225" y="362" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">exec(tool)</text><rect width="370" height="54" x="30" y="400" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="215" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.86" font-weight="normal" text-anchor="middle"><tspan x="215" dy="410.34">Định nghĩa tool + tích hợp MCP + định dạng</tspan><tspan x="215" dy="11.73">thông báo</tspan></text><text x="215" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle"><tspan x="215" dy="433.33">Việc thực hiện chất lượng cao đã được chứng</tspan><tspan x="215" dy="10.8">minh</tspan></text><text x="440" y="215" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sao chép + Sửa đổi</text><line x1="410" x2="470" y1="375" y2="375" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="390" height="295" x="470" y="225" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="665" y="248" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agent mới (sau khi sửa đổi hướng)</text><rect width="180" height="124" x="480" y="265" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="570" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><tspan x="570" dy="318.36">Lời nhắc hệ thống</tspan><tspan x="570" dy="17.28">mới</tspan></text><text x="490" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start"><tspan x="490" dy="294.6">Bạn là nhân viên dịch vụ</tspan><tspan x="490" dy="12.96">khách hàng thương mại</tspan><tspan x="490" dy="12.96">điện tử</tspan></text><text x="490" y="333.48" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Quy định hoàn tiền:...</text><text x="490" y="346.44" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Truy vấn hậu cần: ...</text><text x="490" y="359.4" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Tool: refund_order</text><rect width="180" height="124" x="670" y="265" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="760" y="285" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Kế thừa mã khung</text><text x="680" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">loop:</text><text x="680" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">msg = llm(ctx)</text><text x="680" y="344" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">if tool_call:</text><text x="680" y="362" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">exec(tool)</text><rect width="370" height="54" x="480" y="400" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="665" y="413" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.81" font-weight="normal" text-anchor="middle">Tool mới + logic kinh doanh mới</text><text x="665" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle"><tspan x="665" dy="428">Khung kiến ​​trúc được kế thừa hoàn toàn → chất</tspan><tspan x="665" dy="14">lượng được đảm bảo</tspan></text></svg>