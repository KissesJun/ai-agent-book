ue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle"><tspan x="510" dy="141.1">Phân bố xác suất P(x_t</tspan><tspan x="510" dy="10.8">| x_{&lt;t})</tspan></text><rect width="50" height="12" x="460" y="186" fill="#999" stroke="#333" stroke-width="2" rx="2"/><text x="452" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="end"><tspan x="452" dy="162.7">ở</tspan><tspan x="452" dy="10.8">giữa</tspan></text><text x="515" y="184.3" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start">42%</text><rect width="33" height="12" x="460" y="203" fill="#999" stroke="#333" stroke-width="2" rx="2"/><text x="452" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="end"><tspan x="452" dy="195.1">bên</tspan><tspan x="452" dy="10.8">trong</tspan></text><text x="498" y="216.7" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start">28%</text><rect width="18" height="12" x="460" y="220" fill="#999" stroke="#333" stroke-width="2" rx="2"/><text x="452" y="227.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="end">Xuống</text><text x="483" y="238.3" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start">15%</text><rect width="18" height="12" x="460" y="237" fill="#999" stroke="#333" stroke-width="2" rx="2"/><text x="452" y="249.1" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="end">...</text><text x="483" y="259.9" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start">15%</text><text x="390" y="263" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Mất = −Σ log P(x_t | x_1...x_{t−1}) → Giảm thiểu entropy chéo</text><text x="390" y="332" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="390" dy="-9.44">Mô hình học tập hướng tới mục tiêu có vẻ đơn giản: quy tắc ngôn ngữ → kiến ​​thức thế giới →</tspan><tspan x="390" dy="18.88">lý luận cơ bản</tspan></text></svg>