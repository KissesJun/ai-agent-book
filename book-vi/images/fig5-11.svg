<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 40 880 570" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="280" height="55" x="30" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="170" y="73.18" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.15" font-weight="bold" text-anchor="middle">Nhu cầu của người dùng</text><text x="170" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.26" font-weight="normal" text-anchor="middle"><tspan x="170" dy="88.52">&quot;Tạo dịch vụ hoàn tiền thương mại</tspan><tspan x="170" dy="14.32">điện tử cho khách hàng Agent&quot;</tspan></text><line x1="170" x2="170" y1="115" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="840" height="230" x="20" y="145" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="168" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Meta-Agent (Coding Agent)</text><rect width="190" height="170" x="35" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="270" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">① Đọc mã tham chiếu</text><text x="45" y="231.12" fill="#333" dominant-baseline="central" font-family="'Courier New', C