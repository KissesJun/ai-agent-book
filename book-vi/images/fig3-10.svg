f" stroke="#999" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="400" y="340" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="normal" text-anchor="middle">tài liệu gốc</text><rect width="90" height="16" x="60" y="350" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><rect width="90" height="16" x="170" y="350" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><rect width="90" height="16" x="280" y="350" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><rect width="90" height="16" x="390" y="350" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><rect width="90" height="16" x="500" y="350" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><rect width="90" height="16" x="610" y="350" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="420" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="normal" text-anchor="middle">Trừu tượng đệ quy từ dưới lên: chi tiết → chủ đề → bức tranh lớn</text></svg>