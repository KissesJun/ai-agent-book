ier, monospace" font-size="11" text-anchor="start"><tspan x="194" dy="168.32">→ Thay thế kết hợp chính</tspan><tspan x="194" dy="11.88">xác chuỗi</tspan></text><rect width="160" height="56" x="192" y="212" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="272" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle"><tspan x="272" dy="213">Ưu điểm: Có thể dự</tspan><tspan x="272" dy="10.8">đoán được, không mơ</tspan><tspan x="272" dy="10.8">hồ</tspan></text><text x="272" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle"><tspan x="272" dy="245.4">Nhược điểm: Xóa các</tspan><tspan x="272" dy="10.8">phần lớn yêu cầu đầu</tspan><tspan x="272" dy="10.8">ra đầy đủ</tspan></text><rect width="168" height="38" x="366" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Định vị số dòng</text><rect width="168" height="99" x="366" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="372" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start"><tspan x="372" dy="114.86">Xóa các hàng 42-43 và</tspan><tspan x="372" dy="11.88">chèn:</tspan></text><text x="372" y="138.62" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">def foo(x, y=0):</text><text x="372" y="150.5" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y</text><text 