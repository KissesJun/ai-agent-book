<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 40 900 660" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="168" height="38" x="10" y="55" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="94" y="74" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Diff + Apply Model</text><rect width="168" height="116" x="10" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="16" y="123.36" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">LLM Đầu ra diff Mô tả:</text><text x="16" y="135.24" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- def foo(x):</text><text x="16" y="147.12" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- return x</text><text x="16" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ def foo(x, y=0):</text><text x="16" y="170.88" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ return x + y</text><text x="16" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start"><tspan x="16" dy="182.76">→ Định vị và áp dụng các</tspan><tspan x="16" dy="11.88">mô hình nhỏ</tspan></text><rect width="160" height="56" x="14" y="229" fill="#fff" stroke="#999" s