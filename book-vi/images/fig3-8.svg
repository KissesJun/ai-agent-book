<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 40 800 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="720" height="50" x="40" y="50" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="60" y="75" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="16" text-anchor="start">Score(Q,D) = Σ IDF(qi) × TF(qi,D)×(k1+1) / (TF + k1×(1-b+b×|D|/avgdl))</text><rect width="220" height="170" x="40" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle"><tspan x="150" dy="142.36">Độ bão hòa tần số</tspan><tspan x="150" dy="21.6">từ (TF)</tspan></text><line x1="60" x2="240" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="150" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="150" dy="183.4">k₁ kiểm soát tốc độ bão</tspan><tspan x="150" dy="17.28">hòa</tspan></text><text x="150" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="150" dy="217.96">Tần suất từ ​​↑ nhưng</tspan><tspan x="150" dy="17.28">đóng góp giảm dần</tspan></text><text x="150" y="252.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Số lần xuất hiện tăng gấp đôi</text><text x="150" y="269.8" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Điểm không tăng gấp đôi</text><rect width="220" height="170" x="290" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle"><tspan x="400" dy="151">Tần số tài liệu</tspan><tspan x="400" dy="21.6">nghịch đảo (IDF)</tspan></text><line x1="310" x2="490" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="400" y="192.04" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Đo độ hiếm của một từ</text><text x="400" y="209.32" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">&quot;của&quot; → IDF ≈ 0</text><text x="400" y="226.6" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">&quot;Kết án&quot; → IDF ≈ 5.2</text><text x="400" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="400" dy="243.88">Trọng lượng từ hiếm &gt;&gt; từ</tspan><tspan x="400" dy="17.28">thông dụng</tspan></text><rect width="220" height="170" x="540" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="650" y="144.52" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Chuẩn hóa độ dài (b)</text><line x1="560" x2="740" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="650" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="650" dy="163.96">b ∈ [0,1] Cường độ chuẩn</tspan><tspan x="650" dy="17.28">hóa</tspan></text><text x="650" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="650" dy="198.52">b=0: không xem xét độ</tspan><tspan x="650" dy="17.28">dài</tspan></text><text x="650" y="233.08" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">b=1: chuẩn hóa hoàn toàn</text><text x="650" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="650" dy="250.36">Tránh thiên vị tài liệu</tspan><tspan x="650" dy="17.28">dài</tspan></text><line x1="150" x2="150" y1="290" y2="315" stroke="#999" stroke-width="2"/><line x1="400" x2="400" y1="290" y2="315" stroke="#999" stroke-width="2"/><line x1="650" x2="650" y1="290" y2="315" stroke="#999" stroke-width="2"/><rect width="720" height="48" x="40" y="315" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17.59" font-weight="bold" text-anchor="middle"><tspan x="400" dy="329.5">Điểm cuối = Σ [IDF × TF bão hòa đã chuẩn hóa</tspan><tspan x="400" dy="19">theo độ dài]</tspan></text></svg>