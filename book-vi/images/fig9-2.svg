<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#52636d}.label{font-size:13px;font-weight:700;fill:#2f617a}.value{font-size:15px;fill:#3f515c}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">Kiểm chứng quỹ đạo ba lớp: để bằng chứng đến từ môi trường thật</text><rect width="245" height="82" x="30" y="76" class="box" rx="8"/><text x="152.5" y="107" class="t h" text-anchor="middle">Bộ kiểm chứng kết quả</text><text x="152.5" y="135" class="t s" text-anchor="middle" style="font-size:10.5px">Kiểm thử, số tiền, trạng thái cuối của đơn hàng</text><rect width="245" height="82" x="30" y="174" class="box" rx="8"/><text x="152.5" y="205" class="t h" text-anchor="middle" style="font-size:19.5px">Bộ kiểm chứng quá trình</text><text x="152.5" y="233" class="t s" text-anchor="middle" style="font-size:12px">Chính sách, quyền, hành động và cam kết</text><rect width="245" height="82" x="30" y="272" class="accent" rx="8"/><text x="152.5" y="303" class="t h" text-anchor="middle">LLM Rubric</text><text x="152.5" y="331" class="t s" text-anchor="middle" style="font-size:13px">Tự nhiên, súc tích, lách đúng quy định</text><rect width="320" height="340" x="342" y="62" class="accent" rx="10"/><text x="502" y="97" class="t h" text-anchor="middle">Đánh giá quỹ đạo có cấu trúc</text><line x1="374" x2="630" y1="117" y2="117" stroke="#89a0ac"/><text x="376" y="145" class="t label">Kết quả tác vụ</text><text x="376" y="168" class="t value" style="font-size:14px">Thành công, thành công một phần hoặc thất bại</text><text x="376" y="198" class="t label">Chấm điểm theo từng chiều</text><text x="376" y="221" class="t value">Chấm từng mục, không chỉ tổng điểm</text><text x="376" y="251" class="t label">Vị trí bằng chứng</text><text x="376" y="274" class="t value">Ghi rõ lượt hội thoại và trạng thái công cụ</text><text x="376" y="304" class="t label">Nhãn thất bại</text><text x="376" y="327" class="t value">Giữ loại vấn đề để chẩn đoán về sau</text><line x1="374" x2="630" y1="348" y2="348" stroke="#b6c7cf"/><text x="502" y="378" class="t s" text-anchor="middle">Cho phép từ chối chấm khi thiếu bằng chứng</text><rect width="258" height="202" x="712" y="119" class="box" rx="10"/><text x="841" y="156" class="t h" text-anchor="middle" style="font-size:17px">Tín hiệu chẩn đoán học được</text><text x="841" y="199" class="t s" text-anchor="middle" style="font-size:13.5px">Giữ vị trí xảy ra thành công và thất bại</text><text x="841" y="234" class="t s" text-anchor="middle">Nêu rõ bằng chứng và loại vấn đề</text><text x="841" y="269" class="t s" text-anchor="middle" style="font-size:11px">Giao cho module riêng chọn đối tượng cập nhật</text><path d="M275 117 H307 V151 H340" class="line"/><path d="M275 215 H340" class="line"/><path d="M275 313 H307 V279 H340" class="line"/><path d="M662 220 H710" class="line"/></svg>