<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 40 780 450" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="160" height="50" x="40" y="80" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="120" y="105" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Nhập Prompt x</text><line x1="202" x2="238" y1="105" y2="105" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="280" height="120" x="240" y="50" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="380" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><tspan x="380" dy="101.36">Mô hình chính sách πθ lấy mẫu</tspan><tspan x="380" dy="17.28">song song</tspan></text><text x="255" y="90.56" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₁: (8+6)×3-4 = 38 ✗</text><text x="255" y="103.52" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₂: 3×4×(8-6) = 24 ✓</text><text x="255" y="116.48" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₃: 8×4-6-3 = 23 ✗</text><text x="255" y="129.44" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₄: (8+4)×3÷6 = 6 ✗</text><line x1="522" x2="558" y1="105" y2="105" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="98" x="560" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="655" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.81" font-weight="bold" text-anchor="middle"><tspan x="655" dy="83.01">Tính toán phần</tspan><tspan x="655" dy="15.99">thưởng</tspan></text><text x="655" y="114" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle">R₁ = 0 (lỗi)</text><text x="655" y="128" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle">R₂ = 1 (đúng)</text><text x="655" y="141.99" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle">R₃ = 0 (lỗi)</text><text x="655" y="155.99" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle">R₄ = 0 (lỗi)</text><rect width="700" height="70" x="40" y="220" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="238" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Tính toán lợi thế so sánh (không cần mạng giá trị)</text><text x="390" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">A(yi) = (Ri - mean(R)) / std(R) → A1=-0.58 A2=+1.73 A3=-0.58 A4=-0.58</text><rect width="700" height="100" x="40" y="315" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="341.24" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Cập nhật chính sách (cắt tỉa đối xứng)</text><text x="390" y="360.68" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">L = -E[ min(r(θ)·A, clip(r(θ), 1-ε, 1+ε)·A) ]</text><text x="390" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="390" dy="376.88">Phạm vi cắt đối xứng [1-ε, 1+ε], ε=0.2 · Ưu điểm đến từ sự so sánh tương đối trong nhóm mà</tspan><tspan x="390" dy="15.12">không cần mạng giá trị</tspan></text><text x="390" y="435" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ưu điểm cốt lõi của GRPO</text><text x="390" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="390" dy="-8.26">Không cần mô hình phần thưởng/mạng giá trị · So sánh tương đối trong các nhóm · Duy trì khả năng khám</tspan><tspan x="390" dy="16.52">phá trực tuyến · Thích hợp cho các kịch bản phần thưởng có thể kiểm chứng</tspan></text></svg>