<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">Biến kinh nghiệm thành tri thức: quỹ đạo là bằng chứng, tài liệu mới là đơn vị tái dùng</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle">Quỹ đạo gốc</text><text x="106" y="139" class="t s" text-anchor="middle" style="font-size:10.5px">Hành động, kết quả, môi trường</text><text x="106" y="160" class="t s" text-anchor="middle">Bằng chứng bất biến</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle">Đánh giá đơn lẻ</text><text x="299" y="139" class="t s" text-anchor="middle" style="font-size:12.5px">Thành công, thất bại, nhãn</text><text x="299" y="160" class="t s" text-anchor="middle">Giữ vị trí bằng chứng</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle" style="font-size:13.5px">So sánh giữa các quỹ đạo</text><text x="500" y="128" class="t s" text-anchor="middle">Gộp các tác vụ cùng loại</text><text x="500" y="151" class="t s" text-anchor="middle" style="font-size:11.5px">Đối chiếu thành công với thất bại</text><text x="500" y="174" class="t s" text-anchor="middle" style="font-size:12px">Rút ra điểm chung và ranh giới</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle">Tài liệu Markdown</text><text x="709" y="128" class="t s" text-anchor="middle" style="font-size:12px">Bối cảnh áp dụng và chiến lược</text><text x="709" y="151" class="t s" text-anchor="middle" style="font-size:12.5px">Ngoại lệ, vùng cấm và nguồn</text><text x="709" y="174" class="t s" text-anchor="middle" style="font-size:10.5px">Phiên bản và thời điểm kiểm chứng</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle" style="font-size:14.5px">Truy hồi và áp dụng</text><text x="902" y="139" class="t s" text-anchor="middle" style="font-size:10px">Nạp theo nhu cầu cho tác vụ mới</text><text x="902" y="160" class="t s" text-anchor="middle" style="font-size:13.5px">Tiếp tục sinh phản hồi</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">Bằng chứng mới sửa đổi, thu hẹp hoặc loại bỏ tri thức cũ</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="332" class="t s" text-anchor="middle" style="font-size:10.5px">Dùng chung hạ tầng trích xuất và truy hồi với chương 3; chương này thêm đánh giá quỹ đạo và vòng cải thiện hành vi</text></svg>