" y="270" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="293" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Giai đoạn 2: Phân tích nhân tố và mô hình hóa kiến ​​thức</text><rect width="200" height="80" x="40" y="310" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="140" y="322.01" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="bold" text-anchor="middle">Vector hóa tính năng</text><text x="140" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle"><tspan x="140" dy="336">Mã hóa một nóng + mã</tspan><tspan x="140" dy="14">hóa đa nóng</tspan></text><text x="140" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle"><tspan x="140" dy="364">+ phép biến đổi</tspan><tspan x="140" dy="14">logarit + chuẩn hóa</tspan></text><line x1="240" x2="278" y1="350" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="80" x="280" y="310" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="380" y="322.01" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="bold" text-anchor="middle">Phân cụm KMeans</text><text x="380" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle"><tspan x="380" dy="336">Khám phá &quot;Nguyên mẫu</tspan><tspan x="380" dy="14">của vụ án&quot;</tspan></text><text x="380" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.96" font-weight="normal" text-anchor="middle"><tspan x="380" dy="364">Ví dụ: &quot;ẩu đả tay không,</tspan><tspan x="380" dy="14">thương tích nhẹ&quot;</tspan></text><line x1="480" x2="518" y1="350" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="80" x="520" y="310" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="620" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" font-weight="bold" text-anchor="middle"><tspan x="620" dy="320.84">mô hình tầm quan trọng</tspan><tspan x="620" dy="11.66">của yếu tố</tspan></text><text x="620" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" font-weight="normal" text-anchor="middle"><tspan x="620" dy="344.17">Lượng hóa trọng số</tspan><tspan x="620" dy="11.66">của từng yếu tố</tspan></text><text x="620" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" font-weight="normal" text-anchor="middle"><tspan x="620" dy="367.5">Xây dựng logic ra</tspan><tspan x="620" dy="11.66">quyết định tuyên án</tspan></text><line x1="620" x2="620" y1="390" y2="415" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="720" height="60" x="40" y="418" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="432.61" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17.81" font-weight="bold" text-anchor="middle">Ứng dụng: Tư vấn pháp luật đàm thoại Agent</text><text x="400" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.25" font-weight="normal" text-anchor="middle"><tspan x="400" dy="449.92">Hướng dẫn câu hỏi theo tầm quan trọng của yếu tố → Truy xuất các nguyên mẫu trường</tspan><tspan x="400" dy="15.39">hợp tương tự → Phân tích kết án dựa trên dữ liệu</tspan></text></svg>