<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="840" height="200" x="20" y="55" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Giai đoạn 1: Khai thác và cấu trúc tri thức</text><rect width="180" height="65" x="40" y="95" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="130" y="113" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">hồ sơ vụ án gốc</text><text x="50" y="138" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">Bộ dữ liệu CAIL2018</text><line x1="220" x2="258" y1="127" y2="127" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="65" x="260" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="113" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Khám phá yếu tố LLM</text><text x="350" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Từ dưới lên Schema</text><line x1="440" x2="478" y1="127" y2="127" stroke="#333" stroke-wid