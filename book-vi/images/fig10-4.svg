t-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start"><tspan x="485" dy="454.55">→ Manager chuyển</tspan><tspan x="485" dy="10.8">sang C</tspan></text><text x="610" y="476.15" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start">→ C Báo cáo trả lại</text><text x="390" y="486.95" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Phối cảnh Manager: gọi Agent = tool gọi (gửi yêu cầu → nhận phản hồi)</text></svg>