<svg xmlns="http://www.w3.org/2000/svg" width="780" height="455" viewBox="0 40 780 455" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="300" height="100" x="240" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="79.76" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Manager Agent</text><text x="390" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="390" dy="98.12">Hiểu nhiệm vụ → phân tách → lập kế</tspan><tspan x="390" dy="15.12">hoạch → tổng hợp</tspan></text><text x="390" y="128.36" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Bộ tool: [call_agent_A, call_agent_B,</text><text x="390" y="143.48" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">call_agent_C, search, write_file]</text><rect width="210" height="120" x="50" y="240" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sub-Agent A</text><text x="155" y="280" fill="#666" dominant-baseline="central" font-family="Ari