<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 40 920 380" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="240" height="90" x="340" y="250" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="460" y="278" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">bộ nhớ làm việc</text><text x="460" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Working Memory</text><text x="460" y="322" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Trạng thái nhiệm vụ hiện tại</text><rect width="200" height="84" x="60" y="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="99.32" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">trí nhớ từng đoạn</text><text x="160" y="117.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Episodic</text><text x="160" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="160" dy="132.8">Chuỗi sự kiện có siêu dữ</tspan><tspan x="160" dy="15.12">liệu</tspan></text><rect width="200" height="84" x="360" y="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="460" y="99.32" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">trí nhớ ngữ nghĩa</text><text x="460" y="117.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Semantic</text><text x="460" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="460" dy="132.8">tóm tắt kiến ​​thức tổng</tspan><tspan x="460" dy="15.12">quát</tspan></text><rect width="200" height="84" x="660" y="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="760" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.71" font-weight="bold" text-anchor="middle"><tspan x="760" dy="94.02">bộ nhớ chương</tspan><tspan x="760" dy="18.05">trình</tspan></text><text x="760" y="127.41" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.7" font-weight="normal" text-anchor="middle">Procedural</text><text x="760" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.7" font-weight="normal" text-anchor="middle"><tspan x="760" dy="140.05">Quy trình hành vi có thể</tspan><tspan x="760" dy="12.64">tái sử dụng</tspan></text><line x1="200" x2="410" y1="168" y2="246" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="430" x2="250" y1="246" y2="168" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="460" x2="460" y1="164" y2="246" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="460" x2="470" y1="246" y2="164" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="720" x2="510" y1="168" y2="246" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="490" x2="700" y1="246" y2="164" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="250" y="210" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Chuyển giao có chọn lọc ↑</text><text x="560" y="210" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">↓Kích hoạt tải</text><text x="460" y="60" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Trí nhớ dài hạn (qua các phiên)</text><text x="460" y="372" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="460" dy="-8.26">Tương tác động giữa bộ nhớ làm việc và bộ nhớ dài hạn: thông tin quan trọng được ghi có chọn lọc và các bộ nhớ liên quan</tspan><tspan x="460" dy="16.52">được kích hoạt theo yêu cầu</tspan></text></svg>