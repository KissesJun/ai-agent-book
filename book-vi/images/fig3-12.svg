<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 40 900 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="370" height="46" x="30" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="55.43" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.9" font-weight="bold" text-anchor="middle">Cơ thể không thông minh RAG</text><text x="215" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.71" font-weight="bold" text-anchor="middle"><tspan x="215" dy="67.64">Đã sửa lỗi các bước trước, truy xuất</tspan><tspan x="215" dy="11.57">một lần</tspan></text><rect width="270" height="44" x="80" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="132" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Truy vấn của người dùng</text><line x1="215" x2="215" y1="156" y2="174" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="80" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Truy xuất (một lần)</text><line x1="215" x2="215" y1="220" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="80" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Tạo câu trả lời trực tiếp</text><rect width="370" height="46" x="500" y="44" fill="#eef3f6" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="55.43" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.9" font-weight="bold" text-anchor="middle">Cơ thể thông minh RAG (Agentic)</text><text x="685" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.71" font-weight="bold" text-anchor="middle"><tspan x="685" dy="67.64">Agent bị chi phối bởi ReAct, tìm kiếm</tspan><tspan x="685" dy="11.57">lặp lại</tspan></text><rect width="310" height="44" x="530" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.74" font-weight="normal" text-anchor="middle"><tspan x="685" dy="123.5">Tư duy: Phân tích nhu cầu và xác</tspan><tspan x="685" dy="17">định từ khóa</tspan></text><line x1="685" x2="685" y1="156" y2="174" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="310" height="44" x="530" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Hành động: Gọi tool truy xuất</text><line x1="685" x2="685" y1="220" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="310" height="44" x="530" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.74" font-weight="normal" text-anchor="middle"><tspan x="685" dy="251.5">Quan sát: Thông tin có đầy đủ</tspan><tspan x="685" dy="17">không?</tspan></text><line x1="840" x2="858" y1="260" y2="260" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="858" y1="260" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="840" y1="196" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="862" y="228" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.08" font-weight="normal" text-anchor="start"><tspan x="862" dy="-5.95">không</tspan><tspan x="862" dy="11.9">đủ</tspan></text><line x1="685" x2="685" y1="302" y2="320" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="550" y="322" fill="#dfeef0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.74" font-weight="bold" text-anchor="middle"><tspan x="685" dy="335.5">Đủ → đưa ra câu trả lời một</tspan><tspan x="685" dy="17">cách toàn diện</tspan></text></svg>