<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 40 780 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="260" height="130" x="80" y="120" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="210" y="135.72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19.84" font-weight="bold" text-anchor="middle">Agent (Nhà thám hiểm)</text><text x="210" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.87" font-weight="normal" text-anchor="middle"><tspan x="210" dy="155">Chiến lược π: Trạng thái</tspan><tspan x="210" dy="17.14">quan sát →</tspan></text><text x="210" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.87" font-weight="normal" text-anchor="middle"><tspan x="210" dy="189.28">Chọn hành động (di</tspan><tspan x="210" dy="17.14">chuyển/nhặt/tấn công)</tspan></text><text x="210" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="normal" text-anchor="middle"><tspan x="210" dy="222.49">ε-Tham lam: 90% tối ưu, 10% ngẫu</tspan><tspan x="210" dy="15">nhiên</tspan></text><rect width="260" height="130" x="440" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="570" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.84" font-weight="bold" text-anchor="middle"><tspan x="570" dy="134.09">Môi trường (thế giới mê</tspan><tspan x="570" dy="18.19">cung)</tspan></text><text x="570" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.47" font-weight="normal" text-anchor="middle"><tspan x="570" dy="168.64">Phòng 5 · chìa khóa/cửa/bảo</tspan><tspan x="570" dy="14.55">vệ</tspan></text><text x="570" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.47" font-weight="normal" text-anchor="middle"><tspan x="570" dy="197.74">Chuyển: P (Phòng lưu trữ |</tspan><tspan x="570" dy="14.55">Hội trường, phía Đông) = 1.0</tspan></text><text x="570" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.78" font-weight="normal" text-anchor="middle"><tspan x="570" dy="225.92">R (bảo vệ thất bại)=+50, R (di</tspan><tspan x="570" dy="12.72">chuyển)=0</tspan></text><line x1="342" x2="438" y1="150" y2="150" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="136" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Hành động A(t) = &quot;Di chuyển về phía đông&quot;</text><line x1="438" x2="342" y1="235" y2="235" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="253" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Trạng thái S(t+1) + Phần thưởng R(t+1)</text><text x="390" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Theo dõi: S(0), A(0), R(1), S(1), A(1), R(2), ...</text><rect width="134" height="70" x="35" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="102" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="normal" text-anchor="middle"><tspan x="102" dy="351">S(0): Lối vào</tspan><tspan x="102" dy="12">sảnh</tspan></text><text x="102" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="normal" text-anchor="middle"><tspan x="102" dy="375">A(0): Hướng về</tspan><tspan x="102" dy="12">phía đông</tspan></text><text x="102" y="399" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="bold" text-anchor="middle">R(1): 0</text><line x1="171" x2="181" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="179" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="246" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="normal" text-anchor="middle"><tspan x="246" dy="351">S(1): Phòng chứa</tspan><tspan x="246" dy="12">đồ</tspan></text><text x="246" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="normal" text-anchor="middle"><tspan x="246" dy="375">A(1): Lấy chìa</tspan><tspan x="246" dy="12">khóa</tspan></text><text x="246" y="399" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="bold" text-anchor="middle">R(2): +5</text><line x1="315" x2="325" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="323" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="normal" text-anchor="middle"><tspan x="390" dy="352.5">S(2): Phòng chứa</tspan><tspan x="390" dy="15">đồ</tspan></text><text x="390" y="382.5" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="normal" text-anchor="middle">A(2): Hướng Bắc</text><text x="390" y="397.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="bold" text-anchor="middle">R(3): 0</text><line x1="459" x2="469" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="467" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="534" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="normal" text-anchor="middle"><tspan x="534" dy="351">S(3): Phòng bảo</tspan><tspan x="534" dy="12">vệ</tspan></text><text x="534" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="normal" text-anchor="middle"><tspan x="534" dy="375">A(3): Thanh kiếm</tspan><tspan x="534" dy="12">bạc tổng hợp</tspan></text><text x="534" y="399" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.11" font-weight="bold" text-anchor="middle">R(4): +10</text><line x1="603" x2="613" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="611" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="678" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="normal" text-anchor="middle"><tspan x="678" dy="352.5">S(4): Phòng bảo</tspan><tspan x="678" dy="15">vệ</tspan></text><text x="678" y="382.5" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="normal" text-anchor="middle">A(4): Tấn công</text><text x="678" y="397.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.89" font-weight="bold" text-anchor="middle">R(5): +50</text><text x="390" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Mục tiêu: Tối đa hóa phần thưởng tích lũy G = R(1) + γR(2) + γ²R(3) + ...(γ=0.99)</text></svg>