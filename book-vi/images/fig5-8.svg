rosoft YaHei', sans-serif" font-size="15.43" font-weight="bold" text-anchor="middle">Agent tiếp tục nhiệm vụ với thông số đầy đủ</text><text x="350" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" font-weight="normal" text-anchor="middle"><tspan x="350" dy="457.5">search_flights(from=&apos;Thượng Hải&apos;, to=&apos;Bắc Kinh&apos;,</tspan><tspan x="350" dy="11.66">depart=&apos;2025-08-15&apos;, ...)</tspan></text><rect width="250" height="140" x="20" y="280" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="145" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><tspan x="145" dy="341.36">So sánh: Dạng văn bản thuần</tspan><tspan x="145" dy="17.28">túy vs</tspan></text><text x="30" y="312.2" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Văn bản Hỏi đáp: Đối thoại vòng 10</text><text x="30" y="323" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Q1: Bắt đầu từ đâu? A: Thượng Hải</text><text x="30" y="333.8" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Q2: Ngày nào? A: 8 Tháng 15</text><text x="30" y="344.6" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Q3: Một chiều hay khứ hồi? ...</text><text x="30" y="366.2" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Hình thức động: gửi 1</text><text x="30" y="377" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Tấ