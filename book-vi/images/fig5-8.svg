<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="60" x="20" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="120" y="74.88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">đầu vào của người dùng</text><text x="120" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="120" dy="91.08">&quot;Tôi muốn đặt vé đi Bắc</tspan><tspan x="120" dy="15.12">Kinh&quot;</tspan></text><line x1="220" x2="260" y1="90" y2="90" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="140" x="260" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="390" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><tspan x="390" dy="116.36">Phân tích LLM → Tạo mã biểu</tspan><tspan x="390" dy="17.28">mẫu</tspan></text><rect width="240" height="140" x="270" y="90" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="276" y="103" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&lt;form id=&quot;clarify&quot;&gt;</text><text x="276" y="116" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font