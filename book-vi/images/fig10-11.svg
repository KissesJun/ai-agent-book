.2">Đêm: Cứu/Đầu độc</tspan><tspan x="542" dy="14.04">1 Người</tspan></text><line x1="390" x2="542" y1="132" y2="178" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="135" height="155" x="620" y="180" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="687" y="208.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">👤 Dân làng ×2</text><text x="687" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle"><tspan x="687" dy="224.02">Hiển thị: chỉ</tspan><tspan x="687" dy="14.04">thông tin công</tspan><tspan x="687" dy="14.04">khai</tspan></text><text x="687" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle"><tspan x="687" dy="266.14">Chiến lược: Suy</tspan><tspan x="687" dy="14.04">luận logic</tspan></text><text x="687" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle"><tspan x="687" dy="294.22">Ngày: Phân tích</tspan><tspan x="687" dy="14.04">bài phát biểu</tspan></text><line x1="390" x2="687" y1="132" y2="178" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="720" height="150" x="30" y="355" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="369.06" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.73" font-weight="bold" text-anchor="middle">Kiểm soát truy cập thông tin: Thẩm phán lọc bối cảnh theo vai trò</text><text x="50" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.67" font-weight="bold" text-anchor="start"><tspan x="50" dy="366.83">Người</tspan><tspan x="50" dy="13.68">sói:</tspan></text><text x="105" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.04" font-weight="normal" text-anchor="start"><tspan x="105" dy="394.39">Tất cả danh tính người sói + những</tspan><tspan x="105" dy="14.08">cuộc thảo luận trong đêm + diễn</tspan><tspan x="105" dy="14.08">thuyết trước công chúng</tspan></text><text x="400" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.54" font-weight="bold" text-anchor="start"><tspan x="400" dy="384.86">Tiên</tspan><tspan x="400" dy="13.54">tri:</tspan></text><text x="460" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.54" font-weight="normal" text-anchor="start"><tspan x="460" dy="411.95">Kết quả kiểm tra (chỉ tự kiểm tra) +</tspan><tspan x="460" dy="13.54">bài phát biểu trước công chúng</tspan></text><text x="50" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.04" font-weight="bold" text-anchor="start"><tspan x="50" dy="436.64">Phù</tspan><tspan x="50" dy="14.08">thủy:</tspan></text><text x="105" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.04" font-weight="normal" text-anchor="start"><tspan x="105" dy="464.81">Người chết đêm đó + thuốc giải</tspan><tspan x="105" dy="14.08">độc/trạng thái chất độc + bài phát</tspan><tspan x="105" dy="14.08">biểu trước công chúng</tspan></text><text x="400" y="0" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.54" font-weight="bold" text-anchor="start"><tspan x="400" dy="439.03">Dân</tspan><tspan x="400" dy="13.54">làng:</tspan></text><text x="460" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.54" font-weight="normal" text-anchor="start"><tspan x="460" dy="466.12">Chỉ phát biểu trước công chúng + hồ</tspan><tspan x="460" dy="13.54">sơ biểu quyết (không có thông tin</tspan><tspan x="460" dy="13.54">cá nhân)</tspan></text><rect width="720" height="155" x="30" y="533" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="546.42" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.61" font-weight="bold" text-anchor="middle">Tương tác bằng giọng nói theo thời gian thực (ASR + LLM + TTS)</text><text x="137" y="578.1" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Thảo luận trong ngày</text><text x="137" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle"><tspan x="137" dy="594.84">Thẩm phán quản lý trật</tspan><tspan x="137" dy="16.2">tự phát biểu</tspan></text><text x="137" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle"><tspan x="137" dy="627.24">Nói theo thứ tự chỗ</tspan><tspan x="137" dy="16.2">ngồi</tspan></text><text x="312" y="561.6" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.49" font-weight="bold" text-anchor="middle">giai đoạn bỏ phiếu</text><text x="312" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.71" font-weight="normal" text-anchor="middle"><tspan x="312" dy="588.15">Thu thập phiếu bầu</tspan><tspan x="312" dy="12.65">từ tất cả người chơi</tspan></text><text x="312" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.71" font-weight="normal" text-anchor="middle"><tspan x="312" dy="651.39">Kiểm phiếu và công</tspan><tspan x="312" dy="12.65">bố kết quả</tspan></text><text x="487" y="575.09" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.49" font-weight="bold" text-anchor="middle">giai đoạn ban đêm</text><text x="487" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.71" font-weight="normal" text-anchor="middle"><tspan x="487" dy="613.45">Giám khảo lần lượt</tspan><tspan x="487" dy="12.65">đánh thức các nhân</tspan><tspan x="487" dy="12.65">vật</tspan></text><text x="487" y="676.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.71" font-weight="normal" text-anchor="middle">Kênh thoại riêng</text><text x="662" y="570" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">người chơi thực sự</text><text x="662" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle"><tspan x="662" dy="586.74">Phân công vai trò</tspan><tspan x="662" dy="16.2">ngẫu nhiên</tspan></text><text x="662" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle"><tspan x="662" dy="619.14">Biểu hiện bằng giọng</tspan><tspan x="662" dy="16.2">nói biểu quyết/phát</tspan><tspan x="662" dy="16.2">biểu</tspan></text></svg>