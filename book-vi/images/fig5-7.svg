<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="250" height="160" x="20" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="145" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">① Thu thập nhật ký</text><rect width="230" height="122" x="30" y="98" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="38" y="115.8" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">trajectory_001.json:</text><text x="38" y="126.6" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:</text><text x="38" y="137.4" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;Hủy đơn hàng #12345&quot;}</text><text x="38" y="148.2" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">{&quot;role&quot;:&quot;assistant&quot;,</text><text x="38" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;tool_call&quot;:&quot;cancel_order&quot;}</text><text x="38" y="169.8" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">{&quot;role&quot;:&quot;tool&quot;,&quot;result&quot;:</text><text x="38" y="180.6" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;ERROR: no insurance&quot;}</text><text x="38" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="38" dy="191.4">→ Agent không thông báo lý do cho người</tspan><tspan x="38" dy="10.8">dùng</tspan></text><line x1="270" x2="310" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="160" x="310" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="140" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">② Phân tích LLM</text><text x="320" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="320" dy="86">Đầu vào: trajectory + tài liệu kiến ​​trúc +</tspan><tspan x="320" dy="10.8">PRD</tspan></text><text x="320" y="118.4" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Kích thước phân tích:</text><text x="320" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="320" dy="129.2">- Quá trình thực hiện có đáp ứng được mong</tspan><tspan x="320" dy="10.8">đợi hay không</tspan></text><text x="320" y="150.8" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- Lệnh gọi tool có đúng không?</text><text x="320" y="161.6" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- Xử lý lỗi có phù hợp không</text><text x="320" y="172.4" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- Trải nghiệm người dùng có hài lòng không?</text><text x="320" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">→ Định vị các liên kết và module sai lệch</text><line x1="570" x2="610" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="250" height="160" x="610" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="735" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">③ Báo cáo có cấu trúc</text><rect width="230" height="108" x="620" y="98" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="628" y="103.4" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Báo cáo vấn đề:</text><text x="628" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="628" dy="114.2">Mức độ ưu tiên: P1 (nguy cơ người dùng</tspan><tspan x="628" dy="10.8">rời bỏ)</tspan></text><text x="628" y="135.8" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Mô-đun: cancellation_handler</text><text x="628" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="628" dy="146.6">Mô tả: Không có thông báo nào được gửi</tspan><tspan x="628" dy="10.8">sau khi hủy không thành công.</tspan></text><text x="628" y="0" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"><tspan x="628" dy="168.2">Người dùng giải thích lý do và lựa chọn</tspan><tspan x="628" dy="10.8">thay thế</tspan></text><text x="628" y="189.8" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Đề xuất: Thêm mô tả về lý do lỗi</text><text x="628" y="200.6" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">và hướng dẫn mua bảo hiểm</text><line x1="440" x2="440" y1="220" y2="260" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="370" height="160" x="60" y="260" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="245" y="282" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">④ Tạo ca kiểm thử hồi quy</text><rect width="350" height="150" x="70" y="298" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="78" y="312" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">def test_cancel_no_insurance():</text><text x="78" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;&quot;&quot;Trajectory #001, Vòng 3-5&quot;&quot;&quot;</text><text x="78" y="340" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># Replay: Người dùng yêu cầu hủy hạng phổ thông</text><text x="78" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">resp = agent.run(</text><text x="78" y="368" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;Hủy đơn hàng #12345&quot;)</text><text x="78" y="382" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># Xác thực: Lý do cần được giải thích</text><text x="78" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;Bảo hiểm&quot; in resp.text</text><text x="78" y="410" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;Thay thế&quot; in resp.text</text><text x="78" y="424" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># Xác minh: Không có lỗi nên báo trực tiếp</text><text x="78" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;ERROR&quot; not in resp.text</text><line x1="430" x2="470" y1="340" y2="340" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="380" height="160" x="470" y="260" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="660" y="282" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⑤ GitHub Issue được tạo tự động</text><rect width="360" height="136" x="480" y="298" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="488" y="312" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">gh issue create \</text><text x="488" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--title &quot;P1: Hủy không thành công</text><text x="488" y="340" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Hướng dẫn sử dụng&quot; \</text><text x="488" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--body &quot;**Câu hỏi**: Agent trong</text><text x="488" y="368" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">cancel_order ngay sau khi thất bại</text><text x="488" y="382" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Trả về lỗi mà không giải thích được tại sao...</text><text x="488" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">**Trajectory**: #001 Vòng 3-5</text><text x="488" y="410" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">**Kiểm tra**: test_cancel_...&quot; \</text><text x="488" y="424" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--assignee @backend-team</text><rect width="680" height="44" x="100" y="445" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="0" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.66" font-weight="bold" text-anchor="middle"><tspan x="440" dy="455.3">Tự động hóa từ đầu đến cuối: Ghi nhật ký → Phân tích → Báo cáo →</tspan><tspan x="440" dy="12.59">Kiểm tra → Issue</tspan></text><text x="440" y="479.59" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Kết nối với GitHub thông qua MCP · Xác minh phát lại tự động khung kiểm tra</text><text x="440" y="530" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Giảm chi phí chẩn đoán thủ công từ vài giờ xuống còn vài phút</text></svg>