<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" style="background:#fff"><defs><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#52636d}.accent,.box{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.accent{fill:#e8f1f5;stroke:#2f617a}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">Cách biểu diễn năng lực quyết định nơi cập nhật chính</text><rect width="220" height="126" x="35" y="72" class="box" rx="9"/><text x="145" y="105" class="t h" text-anchor="middle">Tri thức</text><text x="145" y="135" class="t s" text-anchor="middle" style="font-size:15px">Sự kiện, kinh nghiệm, ngoại lệ</text><text x="145" y="164" class="t s" text-anchor="middle">Markdown / cơ sở tri thức</text><rect width="220" height="126" x="275" y="72" class="box" rx="9"/><text x="385" y="105" class="t h" text-anchor="middle">Chỉ dẫn</text><text x="385" y="135" class="t s" text-anchor="middle" style="font-size:10px">Nguyên tắc phán đoán diễn đạt được bằng lời</text><text x="385" y="164" class="t s" text-anchor="middle">Prompt / Skill</text><rect width="220" height="126" x="515" y="72" class="box" rx="9"/><text x="625" y="105" class="t h" text-anchor="middle">Chương trình</text><text x="625" y="135" class="t s" text-anchor="middle" style="font-size:12px">Quy trình tất định và ràng buộc chặt</text><text x="625" y="164" class="t s" text-anchor="middle" style="font-size:14.5px">Công cụ / Luồng việc / Harness</text><rect width="220" height="126" x="755" y="72" class="accent" rx="9"/><text x="865" y="105" class="t h" text-anchor="middle">Tham số</text><text x="865" y="135" class="t s" text-anchor="middle" style="font-size:12px">Tri giác nhiều chiều và chính sách ẩn</text><text x="865" y="164" class="t s" text-anchor="middle">SFT / Chưng cất / RL</text><line x1="145" x2="865" y1="226" y2="226" stroke="#33434d" stroke-width="2"/><path stroke="#33434d" stroke-width="2" d="M145 218 V234 M865 218 V234"/><text x="145" y="260" class="t s" text-anchor="middle">Dễ cập nhật, truy vết được</text><text x="865" y="260" class="t s" text-anchor="middle">Nội hóa, chi phí suy luận thấp</text><text x="500" y="289" class="t h" text-anchor="middle">Không phải bậc thang một chiều mà là bốn vật mang bổ trợ nhau</text><rect width="710" height="58" x="145" y="320" class="accent" rx="8"/><text x="500" y="344" class="t h" text-anchor="middle" style="font-size:15.5px">Câu hỏi đầu tiên: năng lực có diễn đạt trọn vẹn bằng sự kiện, quy tắc hay chương trình không?</text><text x="500" y="367" class="t s" text-anchor="middle" style="font-size:15px">Độ ổn định, chi phí và tần suất cập nhật quyết định cách triển khai, không phải khả năng tham số hóa</text></svg>