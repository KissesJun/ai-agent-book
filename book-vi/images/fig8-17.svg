<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 40 780 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="380" height="78" x="50" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Suy nghĩ văn bản₁</text><text x="65" y="98" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">&quot;Cần giải phương trình x²+2x-8=0</text><text x="65" y="114" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Trước tiên hãy sử dụng sympy để giải quyết...&quot;</text><line x1="240" x2="240" y1="139" y2="145" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="146" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="164" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Tạo mã₁</text><text x="65" y="178" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&lt;code&gt;</text><text x="65" y="188" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">from sympy import *</text><text x="65" y="198" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">x=symbols(&quot;x&quot;)</text><text x="65" y="208" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">solve(x**2+2*x-8,x)</text><text x="65" y="218" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&lt;/code&gt;</text><line x1="240" x2="240" y1="225" y2="231" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="232" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="250" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Phản hồi hộp cát₁</text><text x="65" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">&lt;interpreter&gt;</text><text x="65" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">[-4, 2]</text><text x="65" y="302" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">&lt;/interpreter&gt;</text><line x1="240" x2="240" y1="311" y2="317" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="318" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="336" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Suy nghĩ văn bản₂</text><text x="65" y="356" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">&quot;Giải pháp là x=-4 hoặc x=2</text><text x="65" y="372" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Xác minh: 2²+2×2-8=0 ✓&quot;</text><line x1="240" x2="240" y1="397" y2="403" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="404" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="422" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">câu trả lời cuối cùng</text><text x="65" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">\boxed{-4, 2}</text><rect width="280" height="130" x="470" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="610" y="85.04" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">SandboxFusion</text><text x="610" y="104.48" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">128 song song worker</text><text x="610" y="121.76" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Thực thi hộp cát Python</text><text x="610" y="137.96" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">sympy/numpy/scipy</text><text x="610" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"><tspan x="610" dy="153.08">Kiểm soát thời gian chờ + giới hạn</tspan><tspan x="610" dy="15.12">bộ nhớ</tspan></text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 432,185 Q 432.5041728782917,142.81000344028462 468,120"/><rect width="40" height="24" x="422" y="126" fill="#fff" rx="3"/><text x="441.252" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle"><tspan x="441.25" dy="132.6">mã</tspan><tspan x="441.25" dy="10.8">số</tspan></text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 468,150 Q 469.1695571333223,216.2033393123934 432,271"/><rect width="40" height="24" x="440" y="192" fill="#fff" rx="3"/><text x="459.585" y="203.352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">result</text><rect width="280" height="260" x="470" y="220" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="610" y="350" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Vòng đào tạo PPO</text><text x="480" y="274.4" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Mẫu cơ bản: Qwen2.5-32B</text><text x="480" y="289.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">SFT Khởi động nguội: ~1 giờ</text><text x="480" y="304.64" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Đào tạo RL: ~9 ngày / số bước 400</text><text x="480" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start"><tspan x="480" dy="319.76">Mỗi bước: Câu hỏi 32 × Ứng viên 16</tspan><tspan x="480" dy="15.12">= 512</tspan></text><text x="480" y="0" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start"><tspan x="480" dy="350">Số vòng tương tác/phản hồi 7-9</tspan><tspan x="480" dy="15.12">trung bình</tspan></text><text x="480" y="380.24" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">AIME 2024 Độ chính xác:</text><text x="480" y="395.36" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Đường cơ sở SFT: 25%</text><text x="480" y="410.48" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">110 Bước tiếp theo: 52%</text><text x="480" y="425.6" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">400 Bước tiếp theo: 67%</text></svg>