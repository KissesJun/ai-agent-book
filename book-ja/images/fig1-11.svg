<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 40 820 460" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="500" height="380" x="80" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="330" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">while not done:</text><rect width="420" height="60" x="120" y="100" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="115" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">① 思考（Reasoning）</text><rect width="400" height="28" x="130" y="125" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="140" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;検索結果を分析中...情報が不十分、さらに検索が必要&quot;</text><rect width="420" height="60" x="120" y="175" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">② 行動</text><rect width="400" height="28" x="130" y="200" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="140" y="215" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13.5" text-anchor="start">web_search(&quot;Agent RL training techniques 2025&quot;)</text><line x1="330" x2="330" y1="162" y2="173" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="420" height="60" x="120" y="250" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">③ 観察</text><rect width="400" height="28" x="130" y="275" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="140" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">tool_result: &quot;関連する論文を3件発見...&quot;</text><line x1="330" x2="330" y1="237" y2="248" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><path fill="none" stroke="#999" stroke-width="2" marker-end="url(#ah-light)" d="M 540,280 Q 500.0,200.0 540,120"/><text x="520" y="190" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">ループを継続</text><rect width="190" height="190" x="610" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="622" y="78" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">終了条件</text><text x="620" y="100" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">① タスク完了</text><text x="620" y="132" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">② final_answer を呼び出し</text><text x="620" y="164" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">③ ツール呼び出しが返されない</text><text x="620" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="start">④ 最大ラウンド数に到達</text><text x="620" y="228" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">⑤ エラー回数の超過</text><rect width="500" height="70" x="80" y="360" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="330" y="380" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">実行例：SWE-bench のコード修正</text><text x="330" y="405" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">コード検索 → バグ特定 → ファイル編集 → テスト実行 → 修正失敗 → 再編集 → テスト成功 → 完了</text><text x="330" y="425" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">（5ラウンドの反復、12回のツール呼び出し）</text><line x1="330" x2="330" y1="312" y2="358" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="330" y="325" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">done = True</text></svg>