<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 40 820 560" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="410" y="58" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">各検索は平均約52K文字を返す → 戦略ごとに異なる方法で処理</text><rect width="130" height="26" x="30" y="75" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="88" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">① 圧縮なし</text><rect width="120" height="40" x="30" y="105" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">そのまま保持</text><line x1="152" x2="165" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="105" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">原文全体をコンテキストに投入</text><line x1="500" x2="513" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="105" fill="#fff" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">166K tok · 102.1% · 失敗</text><rect width="130" height="26" x="30" y="153" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="166" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">② 個別要約</text><rect width="120" height="40" x="30" y="183" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="203" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">独立して要約</text><line x1="152" x2="165" y1="203" y2="203" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="183" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="203" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">各結果を独立に2〜3段落の要約に生成</text><line x1="500" x2="513" y1="203" y2="203" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="183" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="203" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">277K tok · 10.9% · 12回</text><rect width="130" height="26" x="30" y="231" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="244" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">③ 統