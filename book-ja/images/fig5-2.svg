al" text-anchor="middle">Agent ステータスバー：未ステージの変更</text><rect width="250" height="38" x="610" y="465" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="735" y="484" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ツール出力：head/tail による切り詰め</text><rect width="250" height="38" x="610" y="515" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="735" y="534" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">永続的なターミナルセッション</text><text x="440" y="565" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">行動前に計画・全過程で検証・ドキュメントとコードが共進化</text></svg>