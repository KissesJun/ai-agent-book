<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" style="background:#fff"><defs><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#52636d}.accent,.box{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.accent{fill:#e8f1f5;stroke:#2f617a}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">能力の表現形式が主な更新場所を決める</text><rect width="220" height="126" x="35" y="72" class="box" rx="9"/><text x="145" y="105" class="t h" text-anchor="middle">知識</text><text x="145" y="135" class="t s" text-anchor="middle">事実・経験・例外</text><text x="145" y="164" class="t s" text-anchor="middle">Markdown / 知識ベース</text><rect width="220" height="126" x="275" y="72" class="box" rx="9"/><text x="385" y="105" class="t h" text-anchor="middle">指示</text><text x="385" y="135" class="t s" text-anchor="middle">言語化できる判断原則</text><text x="385" y="164" class="t s" text-anchor="middle">Prompt / Skill</text><rect width="220" height="126" x="515" y="72" class="box" rx="9"/><text x="625" y="105" class="t h" text-anchor="middle">プログラム</text><text x="625" y="135" class="t s" text-anchor="middle">決定的な手順と強い制約</text><text x="625" y="164" class="t s" text-anchor="middle" style="font-size:14px">ツール / ワークフロー / Harness</text><rect width="220" height="126" x="755" y="72" class="accent" rx="9"/><text x="865" y="105" class="t h" text-anchor="middle">パラメータ</text><text x="865" y="135" class="t s" text-anchor="middle">高次元の知覚と暗黙の方策</text><text x="865" y="164" class="t s" text-anchor="middle">SFT / 蒸留 / RL</text><line x1="145" x2="865" y1="226" y2="226" stroke="#33434d" stroke-width="2"/><path stroke="#33434d" stroke-width="2" d="M145 218 V234 M865 218 V234"/><text x="145" y="260" class="t s" text-anchor="middle">更新しやすく追跡できる</text><text x="865" y="260" class="t s" text-anchor="middle">内在化され推論コストが低い</text><text x="500" y="289" class="t h" text-anchor="middle">一方向の階段ではなく四つの補完的な担い手</text><rect width="710" height="58" x="145" y="320" class="accent" rx="8"/><text x="500" y="344" class="t h" text-anchor="middle">最初の判断：その能力は事実・言語規則・プログラムで完全に表せるか？</text><text x="500" y="367" class="t s" text-anchor="middle">安定性・コスト・更新頻度が配置を決める。パラメータ化の可否ではない</text></svg>