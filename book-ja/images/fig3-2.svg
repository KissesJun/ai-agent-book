<svg xmlns="http://www.w3.org/2000/svg" width="920" height="412" viewBox="0 40 920 412" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="42" x="24" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="124" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">シンプルなメモ</text><rect width="172" height="84" x="38" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="48" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">「ユーザーのメール：</text><text x="48" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">john@x.com&quot;</text><text x="124" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ 原子的な事実・O(1)</text><text x="124" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:15px">✓ オーバーヘッドが極めて小さい</text><text x="124" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ 関連性が失われる</text><rect width="200" height="42" x="248" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="348" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">拡張されたメモ</text><rect width="172" height="84" x="262" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="272" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">「TechCorp では、</text><text x="272" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">シニアエンジニアが</text><text x="272" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" text-anchor="start" style="font-size:13px">5 人のチームを率いる。」</text><text x="348" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ 物語として完結</text><text x="348" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ 意味的に完全</text><text x="348" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ 冗長・更新が難しい</text><text x="348" y="318" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ 長文は検索しにくい</text><rect width="200" height="42" x="472" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="572" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">JSON カード</text><rect width="172" height="84" x="486" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="496" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">work.position</text><text x="496" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">.title = …</text><text x="496" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">（分類 → キーと値）</text><text x="572" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ 三層構造</text><text x="572" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ 部分更新に対応</text><text x="572" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ 分類が硬直的</text><rect width="200" height="42" x="696" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="796" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">高度な JSON カード</text><rect width="172" height="84" x="710" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="720" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">+ backstory</text><text x="720" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">+ person</text><text x="720" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">+ relationship</text><text x="796" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">✓ 曖昧性の解消・知識管理</text><text x="796" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ 出典と関係を保持</text><text x="796" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">✗ 生成と保守のコストが高い</text><line x1="70" x2="850" y1="400" y2="400" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="70" y="383" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">単純さ</text><text x="850" y="383" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="end">表現力</text><text x="460" y="424" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">単純さは下がり、表現力は上がる</text></svg>