<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="250" height="150" x="30" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ルーブリック</text><line x1="40" x2="270" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="45" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">事実の正確性: 必須</text><text x="45" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">論理的整合性: 重要</text><text x="45" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">ハルシネーション検出: 拒否権 ⚠</text><text x="45" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">網羅性: 重要</text><rect width="250" height="150" x="315" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">候補回答</text><line x1="325" x2="555" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="330" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">エージェント出力:</text><text x="330" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">&quot;返金処理が完了しました。$150 は次の期間内に</text><text x="330" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">3〜5 営業日以内に入金されます。&quot;</text><rect width="250" height="150" x="600" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="725" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">参照解答（任意）</text><line x1="610" x2="840" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="615" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">標準解答 / 採点ポイント:</text><text x="615" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">返金額を含めること</text><text x="615" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">入金時期を含めること</text><text x="615" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">具体的な期日を約束しないこと</text><line x1="155" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="440" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="725" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="50" x="280" y="245" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="262" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">審査モデル（GPT-5 / Gemini 2.5）</text><text x="440" y="282" fill="#ccc" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">同一ソースバイアスを防ぐための多元的な異種評価</text><line x1="440" x2="440" y1="295" y2="325" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="760" height="180" x="60" y="328" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="350" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">構造化された評価出力</text><rect width="360" height="125" x="75" y="370" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="85" y="390" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">事実の正確性</text><text x="250" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="390" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="start">金額と時期の両方が正確</text><text x="85" y="414" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">網羅性</text><text x="250" y="414" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3/4</text><text x="300" y="414" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="start">返金方法の説明が欠落</text><text x="85" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">ハルシネーション検出</text><text x="250" y="438" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PASS</text><text x="300" y="438" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">虚偽情報なし</text><text x="85" y="462" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">論理的整合性</text><text x="250" y="462" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="462" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">因果関係が明確</text><rect width="345" height="125" x="460" y="370" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="632" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">スコア集約戦略</text><text x="475" y="415" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">加重平均: Σ(重み × 次元スコア)</text><text x="475" y="437" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">拒否権: ハルシネーション=FAIL → 総合スコア=0</text><text x="475" y="459" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">複数審査: 3審査員の中央値</text><text x="475" y="481" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">エッジケースフラグ: 判定の食い違い &gt;2点 → 人間によるレビュー</text></svg>