<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 40 800 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="720" height="50" x="40" y="50" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="60" y="75" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="16" text-anchor="start">Score(Q,D) = Σ IDF(qi) × TF(qi,D)×(k1+1) / (TF + k1×(1-b+b×|D|/avgdl))</text><rect width="220" height="170" x="40" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="148" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="bold" text-anchor="middle">単語頻度の飽和（TF）</text><line x1="60" x2="240" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="150" y="190" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">k₁ が飽和の速さを制御</text><text x="150" y="218" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">TF ↑ でも寄与は逓減</text><text x="150" y="246" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">出現回数が2倍</text><text x="150" y="274" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">スコアは2倍未満</text><rect width="220" height="170" x="290" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="148" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">逆文書頻度（IDF）</text><line x1="310" x2="490" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="400" y="190" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">単語の希少性を測る</text><text x="400" y="218" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">「の」 → IDF ≈ 0</text><text x="400" y="246" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">「量刑」 → IDF ≈ 5.2</text><text x="400" y="274" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">希少語の重み &gt;&gt; 一般語</text><rect width="220" height="170" x="540" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="650" y="148" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">文書長の正規化（b）</text><line x1="560" x2="740" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="650" y="190" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">b ∈ [0,1] は正規化の強さ</text><text x="650" y="218" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">b=0：文書長を無視</text><text x="650" y="246" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">b=1：完全に正規化</text><text x="650" y="274" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">長文への偏りを防ぐ</text><line x1="150" x2="150" y1="290" y2="315" stroke="#999" stroke-width="2"/><line x1="400" x2="400" y1="290" y2="315" stroke="#999" stroke-width="2"/><line x1="650" x2="650" y1="290" y2="315" stroke="#999" stroke-width="2"/><rect width="720" height="48" x="40" y="315" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="339" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">最終スコア = Σ［IDF × 文書長で正規化した飽和 TF］</text></svg>