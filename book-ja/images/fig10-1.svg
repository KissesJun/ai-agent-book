<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 40 780 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="350" height="480" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="32" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">コンテキストの共有（継承型の協働）</text><g transform="translate(0 4)"><rect width="320" height="100" x="35" y="82" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">フェーズ1: 要件アナリスト</text><text x="47" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">sys: &quot;あなたの責務は要件を完全に理解することです……&quot;</text><text x="47" y="132" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [ask_question, save_req]</text><text x="47" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">user: &quot;CSV 分析スクリプトを書いて&quot;</text><text x="47" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">agent: &quot;どのファイル形式を処理する必要がありますか？&quot;</text><g transform="translate(0 10)"><rect width="320" height="100" x="35" y="184" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">フェーズ2: ソフトウェアエンジニア</text><text x="47" y="216" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">sys: &quot;確定した要件に基づいてコードを書く……&quot;</text><text x="47" y="234" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [write_file, execute_code]</text><text x="47" y="252" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: write_file(&quot;analyze.py&quot;, ...)</text><text x="47" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: execute_code(&quot;python test.py&quot;)</text></g><g transform="translate(0 20)"><rect width="320" height="100" x="35" y="286" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">フェーズ3: コードレビュアー</text><text x="47" y="318" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.75" text-anchor="start">sys: &quot;コードの品質とセキュリティをレビューする……&quot;</text><text x="47" y="336" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [run_linter, run_tests]</text><text x="47" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: run_linter → 警告 2 件</text><text x="47" y="372" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: approve_code()</text></g><g transform="translate(0 38)"><rect width="320" height="28" x="35" y="388" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="195" y="402" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">↑ すべてのフェーズが同じ会話履歴を共有する</text><text x="195" y="434" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ 完全なトレース</text><text x="195" y="456" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ コンテキストが急速に膨張</text></g></g><rect width="350" height="480" x="410" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="422" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">コンテキストの共有なし（隔離型の協働）</text><g transform="translate(0 4)"><rect width="320" height="80" x="425" y="82" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">用語集 Agent</text><text x="437" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;用語を特定して翻訳する……&quot;</text><text x="437" y="132" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [search_dict, write_file]</text><text x="437" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ glossary.json</text><g transform="translate(0 10)"><rect width="320" height="80" x="425" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="184" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">翻訳 Agent</text><text x="437" y="202" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;この章を翻訳する……&quot;</text><text x="437" y="220" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [read_file, write_file]</text><text x="437" y="238" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ chapter1_zh.md</text></g><g transform="translate(0 20)"><rect width="320" height="80" x="425" y="258" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="272" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">校正 Agent</text><text x="437" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;用語の一貫性をチェックする……&quot;</text><text x="437" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [read_file, write_file]</text><text x="437" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ review_report.md</text></g><g transform="translate(0 39)"><rect width="320" height="65" x="425" y="351" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="585" y="367" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">共有ファイルシステム</text><text x="437" y="389" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">glossary.json chapter1_zh.md review_report.md</text><text x="585" y="406" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">+ ツール呼び出しの引数で構造化データを渡す</text><text x="585" y="433" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ モジュール化 · 拡張可能 · 並列</text><text x="585" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ 情報同期が複雑</text></g></g></svg>