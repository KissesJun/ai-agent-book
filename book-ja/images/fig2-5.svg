<svg xmlns="http://www.w3.org/2000/svg" width="900" height="184" viewBox="0 40 900 184" xml:lang="ja" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="84" x="26" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="126" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ユーザーの依頼</text><text x="126" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&quot;Xfinity との料金交渉を手伝って&quot;</text><rect width="200" height="84" x="242" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="342" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">ローカル LLM サービス</text><text x="342" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">vLLM/Ollama（OpenAI 互換）</text><line x1="228" x2="240" y1="86" y2="86" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="84" x="458" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="558" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">モデル推論</text><text x="558" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_call を判断して生成</text><line x1="444" x2="456" y1="86" y2="86" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="84" x="674" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="774" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ローカル tool 実行</text><text x="774" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">関数 / 外部 API を呼び出す</text><line x1="660" x2="672" y1="86" y2="86" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="774" x2="774" y1="128" y2="158" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="774" x2="558" y1="158" y2="158" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="558" x2="558" y1="158" y2="130" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="666" y="176" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">tool の結果をモデルへ返し、最終応答を生成</text></svg>