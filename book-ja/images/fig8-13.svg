<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 40 780 450" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="160" height="50" x="40" y="80" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="120" y="105" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">入力プロンプト x</text><line x1="202" x2="238" y1="105" y2="105" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="280" height="120" x="240" y="50" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="380" y="70" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">方策モデル πθ の並列サンプリング</text><text x="255" y="95" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₁: (8+6)×3-4 = 38 ✗</text><text x="255" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₂: 3×4×(8-6) = 24 ✓</text><text x="255" y="139" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₃: 8×4-6-3 = 23 ✗</text><text x="255" y="161" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">y₄: (8+4)×3÷6 = 6 ✗</text><line x1="522" x2="558" y1="105" y2="105" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="98" x="560" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="655" y="90" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">報酬の計算</text><text x="655" y="112" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">R₁ = 0（不正解）</text><text x="655" y="126" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">R₂ = 1（正解）</text><text x="655" y="140" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">R₃ = 0（不正解）</text><text x="655" y="154" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">R₄ = 0（不正解）</text><rect width="700" height="70" x="40" y="220" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="238" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">相対アドバンテージの計算（価値ネットワーク不要）</text><text x="390" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">A(yi) = (Ri - mean(R)) / std(R) → A1=-0.58 A2=+1.73 A3=-0.58 A4=-0.58</text><rect width="700" height="100" x="40" y="315" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="337" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">方策の更新（対称クリッピング）</text><text x="390" y="365" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">L = -E[ min(r(θ)·A, clip(r(θ), 1-ε, 1+ε)·A) ]</text><text x="390" y="390" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">対称クリッピング範囲 [1-ε, 1+ε]、ε=0.2 ・ アドバンテージはグループ内の相対比較から得られ、価値ネットワークは不要</text><text x="390" y="435" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">GRPO の主な利点</text><text x="390" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">報酬モデル／価値ネットワーク不要 ・ グループ内の相対比較 ・ オンライン探索能力を維持 ・ 検証可能な報酬のシナリオに適する</text></svg>