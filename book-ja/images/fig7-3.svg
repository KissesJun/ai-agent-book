<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker><marker id="ah-r" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="0" refY="3.5"><polygon fill="#666" points="10 0 0 3.5 10 7"/></marker></defs><style>.l,.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;dominant-baseline:central}.t{text-anchor:middle}.l{text-anchor:start}.h{font-size:17px;font-weight:700}.m{font-size:13px}.c,.n{font-size:11.5px;fill:#666}.c{font-family:&apos;SF Mono&apos;,Menlo,Consolas,monospace}</style><rect width="270" height="86" x="40" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="175" y="40" class="t h">ユーザーシミュレータ（LLM）</text><text x="56" y="62" class="l n">known_info：John Smith / 555-123-2002 / フランス滞在</text><text x="56" y="80" class="l n">task_instructions：漸進的開示 · 感情 · 事実接地</text><text x="56" y="96" class="l n">受け入れ基準：excellent のみ解決とみなす</text><rect width="270" height="86" x="570" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="705" y="40" class="t h">Agent（評価対象）</text><text x="586" y="62" class="l n">入力：チケット + ドメインポリシー</text><text x="586" y="80" class="l n">不可視：ユーザー端末の実際の状態</text><text x="586" y="96" class="l n">誘導のみ可能で、代行はできない</text><line x1="316" x2="560" y1="63" y2="63" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)" marker-start="url(#ah-r)"/><text x="438" y="50" class="t n">マルチターン対話</text><text x="438" y="80" class="t n">漸進的な情報開示</text><rect width="800" height="150" x="40" y="146" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="166" class="t h">共有環境（双方向制御：両側が状態を変更できる）</text><rect width="370" height="98" x="60" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="245" y="200" class="t m" font-weight="bold">端末側の状態</text><text x="76" y="222" class="l n">機内モード ON · ローミング OFF · データセーバー · 残データ</text><text x="76" y="246" class="l c">ユーザー側：toggle_airplane_mode / toggle_roaming</text><text x="76" y="266" class="l c">check_status_bar / run_speed_test</text><rect width="370" height="98" x="450" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="635" y="200" class="t m" font-weight="bold">キャリア側データベース</text><text x="466" y="222" class="l n">顧客 C1001 · 回線 L1001/L1002/L1003 · プラン · 請求</text><text x="466" y="246" class="l c">Agent 側：get_customer_by_phone / get_data_usage</text><text x="466" y="266" class="l c">enable_roaming / refuel_data</text><line x1="175" x2="175" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="705" x2="705" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="800" height="34" x="40" y="306" fill="#fff" stroke="#666" stroke-dasharray="5 4" stroke-width="1.5" rx="5"/><text x="440" y="323" class="t n">ユーザーの toggle_roaming で環境は変化した。Agent はツールを呼び直さないと結果を知れない——検証はこの読み直しまでを覆う</text><rect width="800" height="136" x="40" y="356" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="376" class="t h">タスク終了後：4 層の検査 + 集約ルール</text><rect width="182" height="62" x="56" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="147" y="408" class="t m">env_assertions</text><text x="147" y="428" class="t n">モバイルデータ利用可</text><text x="147" y="444" class="t n">速度 ≥ 200 / excellent</text><rect width="182" height="62" x="254" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="345" y="408" class="t m">actions</text><text x="345" y="428" class="t n">toggle_airplane_mode</text><text x="345" y="444" class="t n">requestor は user であること</text><rect width="182" height="62" x="452" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="543" y="408" class="t m">communicate_info</text><text x="543" y="428" class="t n">必要な情報を伝えたか</text><text x="543" y="444" class="t n">この問題では null</text><rect width="182" height="62" x="650" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="741" y="408" class="t m">nl_assertions</text><text x="741" y="428" class="t n">自然言語レベルの判定</text><text x="741" y="444" class="t n">この問題では null</text><text x="440" y="474" class="t n">reward_basis = [&quot;ENV_ASSERTION&quot;] → 第 1 層のみ採用。他の層は記録されるが報酬には算入されない</text></svg>