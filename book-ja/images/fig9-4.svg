<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">経験の知識化：生の軌跡は証拠、知識文書こそ再利用の単位</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle">生の軌跡</text><text x="106" y="139" class="t s" text-anchor="middle">行動・結果・環境</text><text x="106" y="160" class="t s" text-anchor="middle">不変の証拠</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle">単発の評価</text><text x="299" y="139" class="t s" text-anchor="middle">成功・失敗・ラベル</text><text x="299" y="160" class="t s" text-anchor="middle">証拠の位置を保持</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle" style="font-size:18px">軌跡をまたいだ比較</text><text x="500" y="128" class="t s" text-anchor="middle">同種のタスクを集約</text><text x="500" y="151" class="t s" text-anchor="middle">成功と失敗を対照</text><text x="500" y="174" class="t s" text-anchor="middle">共通点と境界を抽出</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle">Markdown 文書</text><text x="709" y="128" class="t s" text-anchor="middle">適用場面と方針</text><text x="709" y="151" class="t s" text-anchor="middle">例外・禁止領域・出典</text><text x="709" y="174" class="t s" text-anchor="middle">バージョンと検証日時</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle">検索して活用</text><text x="902" y="139" class="t s" text-anchor="middle" style="font-size:9px">新しいタスクで必要に応じ読み込む</text><text x="902" y="160" class="t s" text-anchor="middle" style="font-size:10.5px">フィードバックを生み続ける</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">新しい証拠は旧知識を改訂・限定・淘汰する</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="332" class="t s" text-anchor="middle" style="font-size:14.5px">第3章の抽出・検索基盤を共用し、本章では軌跡評価と行動改善の閉ループを追加する</text></svg>