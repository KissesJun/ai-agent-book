<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 40 820 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="240" height="65" x="30" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ポストトレーニング</text><rect width="86.16" height="28" x="106.92" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="150" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">学習時</text><rect width="240" height="38" x="30" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">モデルの重みを変更</text><rect width="240" height="38" x="30" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">永続的・汎用的</text><rect width="240" height="38" x="30" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">高コスト・更新が遅い</text><rect width="240" height="45" x="30" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="150" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">例：ツールを呼び出すタイミングを学習</text><rect width="240" height="65" x="290" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">インコンテキスト学習</text><rect width="86.16" height="28" x="366.92" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="410" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">推論時</text><rect width="240" height="38" x="290" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle">アテンションによるソフトな更新</text><rect width="240" height="38" x="290" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">一時的・即座に適応</text><rect width="240" height="38" x="290" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">コンテキストウィンドウに制限される</text><rect width="240" height="45" x="290" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">例：3つの例からフォーマットを学習</text><rect width="240" height="65" x="550" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">外部化学習</text><rect width="86.16" height="28" x="626.92" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="670" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">実行時</text><rect width="240" height="38" x="550" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">知識ベース + 生成されたツール</text><rect width="240" height="38" x="550" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">永続的・更新可能</text><rect width="240" height="38" x="550" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">信頼性が高い・検証可能</text><rect width="240" height="45" x="550" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="670" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">例：ワークフローをツールに固定化</text><line x1="60" x2="760" y1="430" y2="430" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="60" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">遅い（週単位）</text><text x="410" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">学習速度</text><text x="760" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="end">速い（ミリ秒単位）</text></svg>