<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" style="background:#fff"><defs><marker id="ax" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker></defs><style>.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;text-anchor:middle;dominant-baseline:central}.h{font-size:15px;font-weight:700}.m{fill:#666}.m,.n{font-size:12px}.a,.n{fill:#333}.a{font-size:13px}</style><line x1="40" x2="846" y1="26" y2="26" stroke="#333" stroke-width="2" marker-end="url(#ax)"/><text x="130" y="12" class="t a">タスクの機械的検証可能性：高</text><text x="790" y="12" class="t a">低</text><rect width="190" height="112" x="18" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="113" y="76" class="t h">決定的検証器</text><text x="113" y="100" class="t m">最終状態が一意に照会可能</text><text x="113" y="120" class="t m">通過 / 不通過</text><text x="113" y="146" class="t n">SWE-bench はテスト実行</text><line x1="212" x2="232" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="236" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="331" y="76" class="t h">検査項目リスト</text><text x="331" y="100" class="t m">複数の決定的検査</text><text x="331" y="120" class="t m">宣言された基準で集約</text><text x="331" y="146" class="t n">τ²-bench の 4 層検証</text><line x1="430" x2="450" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="454" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="549" y="76" class="t h">Rubric + LLM 評定</text><text x="549" y="100" class="t m">次元は分けられるが機械判定は不可</text><text x="549" y="120" class="t m">次元ごとに採点し理由を示す</text><text x="549" y="146" class="t n">接客品質、レポート作成</text><line x1="648" x2="668" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="672" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="767" y="76" class="t h">配対比較</text><text x="767" y="100" class="t m">次元すら書き出しにくい</text><text x="767" y="120" class="t m">A と B の優劣のみ判定</text><text x="767" y="146" class="t n">Chatbot Arena</text><rect width="408" height="66" x="18" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="222" y="212" class="t h">決定的検証</text><text x="222" y="234" class="t m">完全に再現可能、CI に組み込め、低コスト</text><text x="222" y="250" class="t m">代償：正誤のみで、問題の所在は示さない</text><rect width="408" height="66" x="454" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="658" y="212" class="t h">モデルによる評定</text><text x="658" y="234" class="t m">診断次元を取り出せ、アサート不能な課題も覆う</text><text x="658" y="250" class="t m">代償：評定のバイアスとばらつき、コスト増</text></svg>