<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 40 880 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="640" height="35" x="120" y="55" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="135" y="73" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Задача: смена тарифа Xfinity | Проблема: отсутствует адрес выставления счета + неверное название тарифа</text><rect width="190" height="36" x="37.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="132.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Скаляр</text><rect width="190" height="210" x="37.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="47.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">7.2 балла</text><text x="47.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="47.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Нет диагностических возможностей</text><text x="47.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Не знает где</text><text x="47.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Хорошо/плохо</text><line x1="229.5" x2="240.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="242.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="337.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Полускалярный</text><rect width="190" height="210" x="242.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="252.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Хорошо: найден верный номер телефона</text><text x="252.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Хорошо: изменение успешно выполнено</text><text x="252.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Плохо: отсутствует платёжный адрес</text><text x="252.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">Плохо: неверное название плана</text><text x="252.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="252.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Общий балл: 6,5</text><text x="252.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">(На основе фактов, но грубо)</text><line x1="434.5" x2="445.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="447.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="542.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Вектор</text><rect width="190" height="230" x="447.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="457.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Точность запроса информации 9/10</text><text x="457.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">Полнота сбора информации 6/10</text><text x="457.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Беглость общения 8/10</text><text x="457.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">Точность коммуникации 7/10</text><text x="457.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Точность коммуникации с пользователем 10/10</text><text x="457.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Общее выполнение задачи 8/10</text><text x="457.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="457.5" y="343" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Точно локализовать недостатки ↑</text><line x1="639.5" x2="650.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="652.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="747.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Генеративный</text><rect width="190" height="210" x="652.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="662.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Аспект 1: Точное использование инструментов</text><text x="662.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Аспект 2: Сбор недостающей информации</text><text x="662.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">Аспект 3: Перефразирование названия плана</text><text x="662.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">Ошибка → Предложить прямое повторение</text><text x="662.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Аспект 4: нет объяснения использования данных</text><text x="662.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Аспект 5: Отсутствие проверки идентичности агента</text><text x="662.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">→ 6-7 аналитических ракурсов</text><line x1="132.5" x2="747.5" y1="368" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="388" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Увеличение информации →</text><rect width="760" height="55" x="60" y="405" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="80" y="420" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="15" text-anchor="start">Эксперимент DeepSeek: генеративные 8 оценок дают 6-7 аналитических точек зрения</text><text x="80" y="442" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Значительное улучшение после комплексной многоракурсной диагностики (иллюстративно) — обучение направлению улучшения из единичной ошибки</text><rect width="760" height="45" x="60" y="475" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="498" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Генеративное вознаграждение: превращение богатой обратной связи от среды в обучаемые знания без сотен проб и ошибок</text></svg>