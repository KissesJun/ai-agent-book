<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 40 820 560" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="410" y="58" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Каждый поиск возвращает в среднем ~52K символов → стратегии обрабатывают их по-разному</text><rect width="130" height="26" x="30" y="75" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="88" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">① Без сжатия</text><rect width="120" height="40" x="30" y="105" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Оставить как есть</text><line x1="152" x2="165" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="105" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Полный исходный текст в контекст</text><line x1="500" x2="513" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="105" fill="#fff" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">166K ток. · 102,1% · сбой</text><rect width="130" height="26" x="30" y="153" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="166" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">② Индивидуальное резюме</text><rect width="120" height="40" x="30" y="183" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="203" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Независимое резюме</text><line x1="152" x2="165" y1="203" y2="203" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="183" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="203" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">Каждый результат независимо генерирует резюме из 2-3 абзацев</text><line x1="500" x2="513" y1="203" y2="203" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="183" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="203" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">277K ток. · 10,9% · 12 ит.</text><rect width="130" height="26" x="30" y="231" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="244" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">③ Объединённое резюме</text><rect width="120" height="40" x="30" y="261" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">Объединённое резюме</text><line x1="152" x2="165" y1="281" y2="281" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="261" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Все результаты объединяются, затем единое резюме</text><line x1="500" x2="513" y1="281" y2="281" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="261" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">93K ток. · 4,3% · 10 ит.</text><rect width="130" height="26" x="30" y="309" fill="#666" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="322" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">④ С учётом контекста</text><rect width="120" height="40" x="30" y="339" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="middle">Интеллектуальное сжатие</text><line x1="152" x2="165" y1="359" y2="359" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="339" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">При заданном запросе + контексте → целевое сжатие</text><line x1="500" x2="513" y1="359" y2="359" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="339" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">40K ток. · 3,0% · 7 ит.</text><rect width="130" height="26" x="30" y="387" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="400" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle">⑤ Контекст-осведомлённость + цитаты</text><rect width="120" height="40" x="30" y="417" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="5.5" font-weight="normal" text-anchor="middle">Интеллектуальность + трассируемость</text><line x1="152" x2="165" y1="437" y2="437" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="417" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Сжатое содержимое + сохранение маркеров ссылок URL</text><line x1="500" x2="513" y1="437" y2="437" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="417" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">223K ток. · 4,1% · 10 ит.</text><rect width="130" height="26" x="30" y="465" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="478" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">⑥ Адаптивное окно</text><rect width="120" height="40" x="30" y="495" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="515" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Отложенное сжатие</text><line x1="152" x2="165" y1="515" y2="515" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="495" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="515" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">&lt; 80% окна сохранять исходный текст, пакетное сжатие при превышении</text><line x1="500" x2="513" y1="515" y2="515" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="495" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x=