<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" style="background:#fff"><defs><marker id="ax" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker></defs><style>.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;text-anchor:middle;dominant-baseline:central}.h{font-size:14px;font-weight:700}.m{fill:#666}.m,.n{font-size:11px}.a,.n{fill:#333}.a{font-size:12px}</style><line x1="40" x2="846" y1="26" y2="26" stroke="#333" stroke-width="2" marker-end="url(#ax)"/><text x="130" y="12" class="t a">Механическая проверяемость задачи: высокая</text><text x="790" y="12" class="t a">низкая</text><rect width="190" height="112" x="18" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="113" y="76" class="t h">Детерминир.</text><text x="113" y="100" class="t m">Конечное состояние однозначно</text><text x="113" y="120" class="t m">Пройдено / нет</text><text x="113" y="146" class="t n">SWE-bench гоняет тесты</text><line x1="212" x2="232" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="236" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="331" y="76" class="t h">Список проверок</text><text x="331" y="100" class="t m">Несколько детерм. проверок</text><text x="331" y="120" class="t m">Агрегация по объявленному базису</text><text x="331" y="146" class="t n">Четыре слоя τ²-bench</text><line x1="430" x2="450" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="454" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="549" y="76" class="t h">Rubric + LLM</text><text x="549" y="100" class="t m">Измерения есть, кода нет</text><text x="549" y="120" class="t m">Оценка по измерениям с обоснованием</text><text x="549" y="146" class="t n">Качество поддержки, отчёты</text><line x1="648" x2="668" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="672" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="767" y="76" class="t h">Попарно</text><text x="767" y="100" class="t m">Трудно даже задать измерения</text><text x="767" y="120" class="t m">Судит только A против B</text><text x="767" y="146" class="t n">Chatbot Arena</text><rect width="408" height="66" x="18" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="222" y="212" class="t h">Детерминированная проверка</text><text x="222" y="234" class="t m">Полностью воспроизводима, годится для CI, дёшева</text><text x="222" y="250" class="t m">Цена: даёт вердикт, но не место ошибки</text><rect width="408" height="66" x="454" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="658" y="212" class="t h">Суждение модели</text><text x="658" y="234" class="t m">Даёт диагностические измерения, покрывает неформализуемое</text><text x="658" y="250" class="t m">Цена: смещение и разброс суждений, выше стоимость</text></svg>