<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>Рис. 6-5: Совместимость с синхронным интерфейсом и нативная асинхронность модели</title><desc>В предыдущем подходе среда выполнения упорядочивает поступающие события, позволяя модели с синхронным интерфейсом участвовать в асинхронных задачах. Другой путь — нативное понимание моделью такого ритма: пока инструмент работает, можно заниматься другими частями задачи, а новые требования пользователя позволяют скорректировать дальнейшую работу. GPT-6 Astra уже поддерживает асинхронные вызовы инструментов (Async tool calling) и изменение указаний в середине хода (Mid-turn steering), отражая этот сдвиг (Рис. 6-5).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="40" y="53" class="title">Совместимость: среда выполнения организует асинхронную работу</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" text-anchor="middle">Задача работает в фоне</text><text x="155" y="122" class="small" text-anchor="middle">Явная отметка: не завершено</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" text-anchor="middle" style="font-size:15.36px">Принимать новые события</text><text x="440" y="122" class="small" text-anchor="middle">Очередь, пауза, параллелизм</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" text-anchor="middle" style="font-size:15.27px">Модель продолжает задачу</text><text x="725" y="122" class="small" text-anchor="middle" style="font-size:14.36px">Входы по синхронным раундам</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="40" y="218" class="title">Нативная асинхронность: понимать ожидание и изменения в ходе задачи</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" text-anchor="middle" style="font-size:16.73px">Запустить долгий запрос</text><text x="155" y="290" class="small" text-anchor="middle">Найти площадку для встречи</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" text-anchor="middle" style="font-size:14.37px">Работать во время ожидания</text><text x="440" y="290" class="small" text-anchor="middle" style="font-size:14.61px">Подготовить повестку и список</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" text-anchor="middle" style="font-size:14.05px">Решить по получении данных</text><text x="725" y="290" class="small" text-anchor="middle" style="font-size:14.43px">Сравнить площадки по фактам</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" text-anchor="middle" style="font-size:13.73px">Пользователь меняет условия</text><text x="155" y="390" class="small" text-anchor="middle" style="font-size:14.93px">Бюджет или число участников</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" text-anchor="middle" style="font-size:15.64px">Сохранить готовую работу</text><text x="440" y="390" class="small" text-anchor="middle">Учесть новые требования</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" text-anchor="middle" style="font-size:13.26px">Изменить следующие действия</text><text x="725" y="390" class="small" text-anchor="middle" style="font-size:13px">Объединить данные и обновления</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" text-anchor="middle" style="font-size:14.74px">Модель понимает изменения и правит план; среда выполнения ведёт инструменты, состояние и источники.</text><text x="440" y="506" class="small" text-anchor="middle">Приём сообщений требует также верного возобновления задач и управления действиями.</text></svg>