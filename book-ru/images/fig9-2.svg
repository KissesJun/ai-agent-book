<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#52636d}.label{font-size:13px;font-weight:700;fill:#2f617a}.value{font-size:15px;fill:#3f515c}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">Трёхслойная проверка траекторий: доказательства — из реальной среды</text><rect width="245" height="82" x="30" y="76" class="box" rx="8"/><text x="152.5" y="107" class="t h" text-anchor="middle" style="font-size:17px">Верификатор результата</text><text x="152.5" y="135" class="t s" text-anchor="middle" style="font-size:11.5px">Тесты, суммы, конечный статус заказа</text><rect width="245" height="82" x="30" y="174" class="box" rx="8"/><text x="152.5" y="205" class="t h" text-anchor="middle" style="font-size:18.5px">Верификатор процесса</text><text x="152.5" y="233" class="t s" text-anchor="middle" style="font-size:10px">Политики, права, действия, обязательства</text><rect width="245" height="82" x="30" y="272" class="accent" rx="8"/><text x="152.5" y="303" class="t h" text-anchor="middle">LLM Rubric</text><text x="152.5" y="331" class="t s" text-anchor="middle" style="font-size:9px">Естественность, краткость, допустимые обходы</text><rect width="320" height="340" x="342" y="62" class="accent" rx="10"/><text x="502" y="97" class="t h" text-anchor="middle" style="font-size:17px">Структурная оценка траектории</text><line x1="374" x2="630" y1="117" y2="117" stroke="#89a0ac"/><text x="376" y="145" class="t label">Результат задачи</text><text x="376" y="168" class="t value">Успех, частичный успех или провал</text><text x="376" y="198" class="t label">Оценка по измерениям</text><text x="376" y="221" class="t value" style="font-size:14.5px">Оценивать по пунктам, а не только итог</text><text x="376" y="251" class="t label">Место доказательства</text><text x="376" y="274" class="t value" style="font-size:12.5px">Указать ход диалога и состояние инструмента</text><text x="376" y="304" class="t label">Метки сбоев</text><text x="376" y="327" class="t value" style="font-size:14px">Сохранять тип проблемы для диагностики</text><line x1="374" x2="630" y1="348" y2="348" stroke="#b6c7cf"/><text x="502" y="378" class="t s" text-anchor="middle" style="font-size:12px">При нехватке доказательств можно не оценивать</text><rect width="258" height="202" x="712" y="119" class="box" rx="10"/><text x="841" y="156" class="t h" text-anchor="middle" style="font-size:12.5px">Обучаемый диагностический сигнал</text><text x="841" y="199" class="t s" text-anchor="middle" style="font-size:13.5px">Сохраняет место успеха и провала</text><text x="841" y="234" class="t s" text-anchor="middle" style="font-size:11px">Указывает доказательства и тип проблемы</text><text x="841" y="260.3" class="t s" text-anchor="middle" style="font-size:15px">Передать выбор объекта</text><text x="841" y="277.7" class="t s" text-anchor="middle" style="font-size:15px">обновления отдельному модулю</text><path d="M275 117 H307 V151 H340" class="line"/><path d="M275 215 H340" class="line"/><path d="M275 313 H307 V279 H340" class="line"/><path d="M662 220 H710" class="line"/></svg>