<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" style="background:#fff"><defs><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#52636d}.accent,.box{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.accent{fill:#e8f1f5;stroke:#2f617a}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">Форма представления способности определяет место обновления</text><rect width="220" height="126" x="35" y="72" class="box" rx="9"/><text x="145" y="105" class="t h" text-anchor="middle">Знания</text><text x="145" y="135" class="t s" text-anchor="middle">Факты, опыт, исключения</text><text x="145" y="164" class="t s" text-anchor="middle">Markdown / база знаний</text><rect width="220" height="126" x="275" y="72" class="box" rx="9"/><text x="385" y="105" class="t h" text-anchor="middle">Инструкции</text><text x="385" y="135" class="t s" text-anchor="middle" style="font-size:10px">Принципы суждения, выразимые словами</text><text x="385" y="164" class="t s" text-anchor="middle">Prompt / Skill</text><rect width="220" height="126" x="515" y="72" class="box" rx="9"/><text x="625" y="105" class="t h" text-anchor="middle">Программы</text><text x="625" y="127.46" class="t s" text-anchor="middle" style="font-size:13px">Детерминированные процессы</text><text x="625" y="142.54" class="t s" text-anchor="middle" style="font-size:13px">и жёсткие ограничения</text><text x="625" y="164" class="t s" text-anchor="middle" style="font-size:12.5px">Инструменты / Workflow / Harness</text><rect width="220" height="126" x="755" y="72" class="accent" rx="9"/><text x="865" y="105" class="t h" text-anchor="middle">Параметры</text><text x="865" y="126.01" class="t s" text-anchor="middle" style="font-size:15.5px">Многомерное восприятие</text><text x="865" y="143.99" class="t s" text-anchor="middle" style="font-size:15.5px">и неявная политика</text><text x="865" y="164" class="t s" text-anchor="middle">SFT / Дистилляция / RL</text><line x1="145" x2="865" y1="226" y2="226" stroke="#33434d" stroke-width="2"/><path stroke="#33434d" stroke-width="2" d="M145 218 V234 M865 218 V234"/><text x="145" y="260" class="t s" text-anchor="middle">Легко обновлять, прослеживаемо</text><text x="865" y="260" class="t s" text-anchor="middle" style="font-size:14px">Усвоено, низкая стоимость вывода</text><text x="500" y="289" class="t h" text-anchor="middle">Не односторонняя лестница, а четыре взаимодополняющих носителя</text><rect width="710" height="58" x="145" y="320" class="accent" rx="8"/><text x="500" y="344" class="t h" text-anchor="middle" style="font-size:14.5px">Главный вопрос: выразима ли способность фактами, правилами языка или программой?</text><text x="500" y="367" class="t s" text-anchor="middle" style="font-size:12.5px">Способ развёртывания задают стабильность, стоимость и частота обновлений, а не параметризуемость</text></svg>