ang SC', 'Microsoft YaHei', sans-serif" font-size="6.5" font-weight="normal" text-anchor="middle">Рандомизация физических параметров</text><line x1="319" x2="326" y1="125" y2="125" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="143" height="130" x="476" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="548" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">④ Обучение RL</text><text x="548" y="101" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">PPO · 1024 параллельных сред</text><text x="548" y="119" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">25-40 миллионов шагов</text><text x="548" y="137" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">~1ч (один 4090)</text><line x1="469" x2="476" y1="125" y2="125" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="143" height="130" x="626" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="698" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">⑤ Реальное развертывание</text><text x="698" y="101" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">15Гц частота управления</text><text x="698" y="