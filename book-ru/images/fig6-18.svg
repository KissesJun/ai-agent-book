<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 40 800 470" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker><marker id="ah-sm" markerHeight="4" markerWidth="6" orient="auto" refX="6" refY="2"><polygon fill="#999" points="0 0 6 2 0 4"/></marker></defs><rect width="143" height="130" x="26" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="97" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">① Согласование окружения</text><text x="97" y="101" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="5.5" font-weight="normal" text-anchor="middle">Соответствие симуляции и реальной камеры</text><text x="97" y="119" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="middle">Проверка визуального наложения</text><text x="97" y="137" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">Проверка перекрытия изображений</text><rect width="143" height="130" x="176" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="248" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">② Замена фона</text><text x="248" y="101" fill