etica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Фон + текстура</text><text x="258.7" y="327" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.09" font-weight="normal" text-anchor="middle">Преодоление визуального разрыва</text><text x="495.6" y="293" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.57" font-weight="bold" text-anchor="middle">Рандомизация физики</text><text x="480" y="311" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Трение/масса/жёсткость</text><text x="502.7" y="327" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.09" font-weight="normal" text-anchor="middle">Преодоление физического разрыва</text><text x="696.2" y="293" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Эффективность обучения</text><text x="660" y="311" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1024 параллельных сред</text><text x="714" y="327" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="middle">~1ч для достижения &gt;90%</text><rect width="740" height="95" x="30" y="360" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="380" fill="#333" do