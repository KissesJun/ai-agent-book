<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 40 820 530" style="background:#fff"><title>Рис. 1-5 Архитектура «модель как агент» — врождённый вызов инструментов</title><desc>LLM вызывает врождённые инструменты вроде web_search и code_interpreter в замкнутом цикле, который выполняет серверный Harness. Ввод пользователя и итоговый вывод находятся вне этого цикла; внутри него мысль, действие и наблюдение образуют цикл ReAct. «Клиенту не нужно писать цикл ReAct» верно только для пути Responses API (эксперимент 1-3); на пути Kimi K3 (эксперимент 1-2) инструменты выполняются на сервере, но цикл по-прежнему ведёт клиентский код.</desc><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="300" height="100" x="260" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="100" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LLM (Kimi K3 / GPT-5.6)</text><text x="410" y="130" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Нативные способности агента после RL-обучения</text><rect width="180" height="230" x="620" y="70" fill="none" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="632" y="88" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="bold" text-anchor="start">Нативные инструменты</text><rect width="150" height="50" x="635" y="105" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="710" y="130" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">web_search</text><rect width="150" height="50" x="635" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="710" y="195" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">code_interpreter</text><rect width="150" height="50" x="635" y="235" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="710" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Другие инструменты...</text><line x1="560" x2="633" y1="120" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="633" x2="560" y1="195" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><path fill="none" stroke="#999" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah-light)" d="M 570,308 Q 600,240 548,172"/><text x="568" y="250" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Сигнал RL-обучения</text><rect width="230" height="55" x="25" y="235" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="140" y="252.9" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Пользователь: найди динамику</text><text x="140" y="273.7" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">биткоина за последний месяц</text><rect width="790" height="170" x="15" y="310" fill="none" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="410" y="328" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Цикл ReAct (путь Responses API: замкнутое выполнение серверным Harness)</text><line x1="140" x2="140" y1="292" y2="380" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="350" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">переходим к следующему кругу с наблюдением</text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 680,382 L 680,366 L 200,366 L 200,382"/><rect width="200" height="76" x="40" y="384" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="140" y="412" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Мысль: нужны данные в реальном</text><text x="140" y="433" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">времени, затем анализ кодом</text><line x1="242" x2="298" y1="422" y2="422" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="220" height="76" x="300" y="384" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="404" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Круг 1: вызов web_search</text><text x="410" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">&quot;BTC price last month&quot;</text><text x="410" y="444" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Круг 2: code_interpreter</text><line x1="522" x2="578" y1="422" y2="422" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="76" x="580" y="384" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="680" y="412" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Результат: [данные о цене]</text><text x="680" y="433" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">$67,230 → $71,450</text><line x1="140" x2="140" y1="462" y2="496" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="230" height="55" x="25" y="500" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="140" y="517.9" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">Итог: отчёт технического</text><text x="140" y="538.7" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">анализа + график</text><rect width="230" height="120" x="15" y="70" fill="none" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="27" y="80.8" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="start">Отличия от традиционных</text><text x="27" y="95.2" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="start">фреймворков</text><text x="30" y="110" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">✓ Модель сама решает, что вызвать</text><text x="30" y="133" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">✓ Инструменты работают на сервере</text><text x="30" y="156" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">✓ Responses API: цикл на сервере</text><text x="30" y="179" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">※ Путь Kimi: цикл ведёт клиент</text></svg>