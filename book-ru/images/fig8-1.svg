<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 40 780 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="260" height="130" x="10" y="120" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="118.6" y="145" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.5" font-weight="bold" text-anchor="middle">Агент (Исследователь)</text><text x="140" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Политика π: наблюдение состояния →</text><text x="140" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Выбор действия (перемещение/подъём/атака)</text><text x="140" y="225" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">ε-жадный: 90% оптимально, 10% случайно</text><rect width="260" height="130" x="510" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="665.6" y="145" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16.5" font-weight="bold" text-anchor="middle">Среда (Мир лабиринта)</text><text x="640" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">5 комнат · Ключ/Дверь/Охранник</text><text x="640" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">Переход: P(Storage|Hall,East)=1.0</text><text x="640" y="225" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">R(Победа над стражем)=+50, R(Движение)=0</text><line x1="272" x2="508" y1="150" y2="150" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="393.7" y="136" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.08" font-weight="bold" text-anchor="middle">Действие A(t) = «Движение на восток»</text><line x1="508" x2="272" y1="235" y2="235" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="258" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Состояние S(t+1) + Награда R(t+1)</text><text x="390" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Траектория: S(0), A(0), R(1), S(1), A(1), R(2), ...</text><rect width="134" height="70" x="35" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="102" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">S(0): Входной зал</text><text x="102" y="375" fill="#666" dominant-ba