<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 40 920 400" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="400" height="46" x="40" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="240" y="93" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:15.5px">Память пользователя (индивидуальный масштаб)</text><rect width="400" height="46" x="480" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="680" y="93" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">База знаний (групповой масштаб)</text><rect width="400" height="158" x="40" y="128" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="60" y="156" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">· Иерархия памяти · Трёхуровневая оценка</text><text x="60" y="184" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">· Четыре формата хранения</text><text x="60" y="212" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="start" style="font-size:11px">· Когнитивные типы: эпизодическая · семантическая · процедурная</text><text x="60" y="240" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">· Фреймворки памяти: Mem0 · Memobase</text><text x="60" y="268" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">· Сжатие и консолидация · Уровни приватности</text><rect width="400" height="158" x="480" y="128" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="500" y="156" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="start" style="font-size:14px">· Чанкинг документов · Мультимодальное извлечение</text><text x="500" y="184" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="start" style="font-size:14px">· Плотные/разреженные эмбеддинги · Гибридный поиск</text><text x="500" y="212" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">· Структурная индексация: RAPTOR · GraphRAG</text><text x="500" y="240" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">· Парадигма файловой системы · Агентный RAG</text><text x="500" y="268" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">· Контекстный поиск · Глубокое извлечение знаний</text><line x1="240" x2="240" y1="320" y2="288" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="680" x2="680" y1="320" y2="288" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="840" height="50" x="40" y="322" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="6"/><text x="460" y="340" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Общая основа: техники поиска</text><text x="460" y="360" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Чанкинг · Векторные/ключевые эмбеддинги · Гибридный поиск · Переранжирование</text><text x="460" y="397" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Обе линии сходятся в «двухслойной архитектуре памяти»:</text><text x="460" y="414" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Продвинутые JSON-карточки держат обзор в памяти, а контекстный поиск подтягивает детали по требованию.</text></svg>