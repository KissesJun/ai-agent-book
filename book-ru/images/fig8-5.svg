<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 40 780 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="280" height="45" x="20" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="82.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Классический RL-агент</text><rect width="270" height="45" x="490" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="625" y="82.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LLM-агент</text><rect width="280" height="44" x="20" y="115" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="115" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="137" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Замкнутое конечное множество (6 действий)</text><text x="500" y="137" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Открытый: естественный язык + инструменты</text><text x="395" y="137" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Пространство действий</text><rect width="280" height="44" x="20" y="163" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="163" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="185" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Без априорных знаний, со случайной политики</text><text x="500" y="185" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="start">Предобученные знания + априорные представления</text><text x="395" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Априорные знания</text><rect width="280" height="44" x="20" y="211" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="211" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Хеш-кодирование: state_id=0x3A7F</text><text x="500" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">Семантика: &quot;красный ключ в кладовой&quot;</text><text x="395" y="233" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Представление состояния</text><rect width="280" height="44" x="20" y="259" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="259" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Скалярное вознаграждение: R ∈ {-1, 0, +5, +50}</text><text x="500" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Награда + обратная связь + саморефлексия</text><text x="395" y="281" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Сигнал обучения</text><rect width="280" height="44" x="20" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start">Нет внутреннего размышления (чисто реактивный)</text><text x="500" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Размышление как особое действие (CoT)</text><text x="395" y="329" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Способность к размышлению</text><rect width="280" height="44" x="20" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="377" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">Новые правила → полное переобучение</text><text x="500" y="377" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Перенос между задачами zero/few-shot</text><text x="395" y="377" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Способность к обобщению</text><rect width="280" height="44" x="20" y="403" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="403" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">~10000 эпизодов / 10 секунд</text><text x="500" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">~1 эпизод / 2 минуты</text><text x="395" y="425" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Эффективность выборки</text></svg>