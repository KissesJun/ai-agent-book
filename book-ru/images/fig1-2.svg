<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 40 820 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="240" height="65" x="30" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Постобучение</text><rect width="132.625" height="28" x="83.688" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="150" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Время обучения</text><rect width="240" height="38" x="30" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Изменить веса модели</text><rect width="240" height="38" x="30" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Постоянный · общий</text><rect width="240" height="38" x="30" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Высокая стоимость · медленное обновление</text><rect width="240" height="45" x="30" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="150" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle">Например, изучить, когда вызывать инструмент</text><rect width="240" height="65" x="290" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">обучение в контексте</text><rect width="141.938" height="28" x="339.031" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="410" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Время вывода</text><rect width="240" height="38" x="290" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Мягкое обновление через внимание</text><rect width="240" height="38" x="290" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Временный · мгновенно адаптируется</text><rect width="240" height="38" x="290" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Ограничено окном контекста</text><rect width="240" height="45" x="290" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Например, изучить формат по 3 примерам</text><rect width="240" height="65" x="550" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Экстернализованное обучение</text><rect width="98.249" height="28" x="620.876" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="670" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Среда выполнения</text><rect width="240" height="38" x="550" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">База знаний + сгенерированные инструменты</text><rect width="240" height="38" x="550" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Постоянный · обновляемый</text><rect width="240" height="38" x="550" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Надёжно · проверяемо</text><rect width="240" height="45" x="550" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="670" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="middle">Например, зафиксировать рабочий процесс как инструмент</text><line x1="60" x2="760" y1="430" y2="430" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="60" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">Медленно (недели)</text><text x="410" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Скорость обучения</text><text x="760" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="end">Быстро (миллисекунды)</text></svg>