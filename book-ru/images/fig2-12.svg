<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 40 820 620" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-y" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#e6a817" points="0 0 12 4 0 8"/></marker><marker id="ah-o" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#d46e4e" points="0 0 12 4 0 8"/></marker></defs><text x="40" y="60" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" text-anchor="start">messages: [</text><rect width="500" height="32" x="50" y="78" fill="#e8e8e8" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="94" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12.5" text-anchor="start">{ role: &quot;system&quot;, content: &quot;Ты ассистент Claude Code...&quot; }</text><rect width="500" height="32" x="50" y="114" fill="#e8e8e8" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="130" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">инструменты: [Skill, Read, Bash, Edit, Write, ...]</text><path fill="none" stroke="#999" stroke-width="1.5" d="M 560,78 C 575,78 575,114 580,123 C 575,132 575,146 560,146"/><text x="590" y="112" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start">исправлено</text><text x="590" y="130" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start">(KV Cache)</text><rect width="500" height="32" x="50" y="158" fill="#dce9f5" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="174" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">{ role: &quot;user&quot;, content: &quot;Помоги сгенерировать PPT из этого PDF&quot; }</text><rect width="500" height="64" x="50" y="198" fill="#fff3cd" stroke="#e6a817" stroke-width="2.5" rx="4"/><text x="62" y="214" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;user&quot;, isMeta: true,</text><text x="62" y="232" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">content: &quot;&lt;system-reminder&gt;</text><text x="62" y="250" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">Доступные навыки: pdf, pptx, ...&lt;/system-reminder&gt;&quot; }</text><line x1="600" x2="555" y1="230" y2="230" stroke="#e6a817" stroke-width="2" marker-end="url(#ah-y)"/><text x="608" y="214" fill="#c9a227" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="start">ⓐ Список Skills</text><text x="608" y="232" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="start">Harness: разовый вывод</text><text x="608" y="250" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="start">~300 токенов</text><rect width="500" height="32" x="50" y="270" fill="#d9f0d9" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;assistant&quot;, tool_calls: [Skill(skill: &quot;pptx&quot;)] }</text><rect width="500" height="32" x="50" y="306" fill="#fdf6e3" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="322" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">{ role: &quot;tool&quot;, content: &quot;Запуск Skill: pptx&quot; } ← заглушка</text><rect width="500" height="64" x="50" y="346" fill="#ffe4d9" stroke="#d46e4e" stroke-width="2.5" rx="4"/><text x="62" y="362" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;user&quot;, isMeta: true,</text><text x="62" y="380" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">content: &quot;Base directory: ...\n# PPTX Skill</text><text x="62" y="398" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">## Рабочий процесс: 1. Использовать markitdown...&quot; }</text><line x1="600" x2="555" y1="378" y2="378" stroke="#d46e4e" stroke-width="2" marker-end="url(#ah-o)"/><text x="608" y="362" fill="#a04830" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="start">ⓑ Содержимое Skill</text><text x="608" y="380" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" text-anchor="start">Однократный вызов инструмента-навыка</text><text x="608" y="398" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="start">~2k токенов</text><rect width="500" height="32" x="50" y="418" fill="#d9f0d9" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="434" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;assistant&quot;, tool_calls: [Read(file: &quot;input.pdf&quot;)] }</text><rect width="500" height="32" x="50" y="454" fill="#fdf6e3" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="470" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;tool&quot;, content: &quot;...текст PDF-документа...&quot; }</text><rect width="500" height="32" x="50" y="490" fill="#d9f0d9" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="506" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12.5" text-anchor="start">{ role: &quot;assistant&quot;, tool_calls: [Write(file: &quot;slides.html&quot;)] }</text><rect width="500" height="32" x="50" y="526" fill="#fdf6e3" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="542" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;tool&quot;, content: &quot;Записано 12345 байт&quot; }</text><path fill="none" stroke="#999" stroke-width="1.5" d="M 560,418 C 575,418 575,490 580,506 C 575,522 575,558 560,558"/><text x="590" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start">Последующий tool_use /</text><text x="590" y="496" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start">tool_result продолжается</text><text x="590" y="514" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start">добавить в конец</text><text x="300" y="580" fill="#999" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle">... последующие раунды ...</text><text x="40" y="604" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" text-anchor="start">]</text><rect width="720" height="22" x="50" y="624" fill="#f5f5f5" stroke="none" rx="4"/><text x="410" y="635" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" text-anchor="middle">ⓐ и ⓑ оба emit-once: после однократной оплаты cache_creation они постоянно находятся в префиксе кэша и не перемещаются с последующими tool_use</text></svg>