al, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="6" font-weight="normal" text-anchor="middle">Результат A + результат B + запись об отмене C</text><rect width="740" height="40" x="120" y="460" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="130" y="480" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">Ключевое: внедрение плейсхолдера + асинхронное событие завершения + API cancel_tool(task_id)</text></svg>