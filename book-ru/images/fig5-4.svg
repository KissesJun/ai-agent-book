<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 40 900 660" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="168" height="38" x="10" y="55" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="94" y="74" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Модель Diff + Apply</text><rect width="168" height="116" x="10" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="16" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Описание diff вывода LLM:</text><text x="16" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- def foo(x):</text><text x="16" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- return x</text><text x="16" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ def foo(x, y=0):</text><text x="16" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ return x + y</text><text x="16" y="202" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">→ Малая модель находит и применяет</text><rect width="160" height="80" x="14" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="94" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Преимущество: разделение</text><text x="94" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Опасения</text><text x="94" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Недостаток: незначительный</text><text x="94" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Причины отклонения</text><text x="94" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Несогласованность</text><rect width="168" height="38" x="188" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="272" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Старая строка → Новая строка</text><rect width="168" height="99" x="188" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="194" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">old: &quot;def foo(x):\n</text><text x="194" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x&quot;</text><text x="194" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">new: &quot;def foo(x, y=0):\n</text><text x="194" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y&quot;</text><text x="194" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">→ Замена по точному совпадению строки</text><rect width="160" height="80" x="192" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="272" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">Преимущество: предсказуемость,</text><text x="272" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Однозначно</text><text x="272" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Недостаток: большой</text><text x="272" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Удаления требуют полного</text><text x="272" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Выход</text><rect width="168" height="38" x="366" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Позиционирование по номеру строки</text><rect width="168" height="99" x="366" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="372" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Удалить строки 42-43, вставить:</text><text x="372" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">def foo(x, y=0):</text><text x="372" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y</text><text x="372" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">→ Номер строки задаёт точный диапазон</text><rect width="160" height="80" x="370" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="450" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle">Преимущество: эффективно для</text><text x="450" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Крупные операции</text><text x="450" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Недостаток: строка</text><text x="450" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Числа склонны к ошибкам в</text><text x="450" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Длинные файлы</text><rect width="168" height="38" x="544" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="628" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Vim-подобные команды</text><rect width="168" height="99" x="544" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="550" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">42G (Перейти на строку 42)</text><text x="550" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">cw (Заменить слово)</text><text x="550" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">dd (Удалить строку)</text><text x="550" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">yy/p (Копировать/Вставить)</text><text x="550" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">→ Богатая семантика редактирования</text><rect width="160" height="80" x="548" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="628" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">Преимущество: эффективность</text><text x="628" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">перемещение/реорганизация</text><text x="628" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Недостаток: слабый</text><text x="628" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">модели производят больше</text><text x="628" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">ошибки</text><rect width="168" height="38" x="722" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="806" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Сопоставление начала и конца</text><rect width="168" height="99" x="722" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="728" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">start: &quot;def foo(x):&quot;</text><text x="728" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">end: &quot; return x&quot;</text><text x="728" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">new: &quot;def foo(x, y=0):</text><text x="728" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y&quot;</text><text x="728" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">→ Нужны только границы для локализации</text><rect width="160" height="80" x="726" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="806" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">Преимущество: большое удаление</text><text x="806" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">без полного вывода</text><text x="806" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Недостаток: граница</text><text x="806" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">комбинация должна быть</text><text x="806" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">уникальный</text><line x1="30" x2="870" y1="331" y2="331" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="450" y="355" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Фактическое внедрение</text><text x="240" y="393" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Старое→Новое</text><rect width="408" height="28" x="250" y="379" fill="#999" stroke="#333" stroke-width="2" rx="3"/><text x="454" y="393" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Claude Code</text><text x="240" y="431" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="end">Позиционирование по номеру строки</text><rect width="240" height="28" x="250" y="417" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="370" y="431" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Сценарии глубокой интеграции с IDE</text><text x="240" y="469" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Diff + Применить</text><rect width="192" height="28" x="250" y="455" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="346" y="469" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Cursor</text><text x="240" y="507" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Сопоставление начала и конца</text><rect width="144" height="28" x="250" y="493" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="322" y="507" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">Частичные кастомные решения</text><text x="240" y="545" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Команды Vim</text><rect width="72" height="28" x="250" y="531" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="286" y="545" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="6" font-weight="normal" text-anchor="middle">Эксперим. решения</text></svg>