<svg xmlns="http://www.w3.org/2000/svg" width="890" height="515" viewBox="0 40 890 515" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="150" height="230" x="26" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="101" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Менеджер продукта</text><text x="34" y="97" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="6" font-weight="normal" text-anchor="start">Вход: описание требований пользователя</text><rect width="134" height="68" x="34" y="113" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="40" y="127" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Выход:</text><text x="40" y="143" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="start">Список функций + приоритет</text><text x="40" y="159" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start">Пользовательские истории (5 шт.)</text><text x="40" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Критерии приёмки</text><rect width="134" height="30" x="34" y="223" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="101" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">docs/PRD.md</text><line x1="186" x2="198" y1="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="150" height="230" x="198" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="273" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Архитектор</text><text x="206" y="97" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Вход: PRD.md</text><rect width="134" height="68" x="206" y="113" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="212" y="127" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Выход:</text><text x="212" y="143" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="start">Стек технологий: FastAPI+React</text><text x="212" y="159" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="start">Спецификация API (OpenAPI)</text><text x="212" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Схема базы данных</text><rect width="134" height="30" x="206" y="223" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="273" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">docs/design.md</text><line x1="358" x2="370" y1="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="150" height="230" x="370" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="445" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Менеджер проекта</text><text x="378" y="97" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Вход: design.md</text><rect width="134" height="68" x="378" y="113" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="384" y="127" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Выход:</text><text x="384" y="143" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="start">Список задач + распределение</text><text x="384" y="159" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start">Распределение на уровне файлов</text><text x="384" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="start">Порядок зависимостей модулей</text><rect width="134" height="30" x="378" y="223" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="445" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">docs/tasks.md</text><line x1="530" x2="542" y1="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="150" height="230" x="542" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="617" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Инженер ×3</text><text x="550" y="97" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">Вход: tasks.md + design.md</text><rect width="134" height="68" x="550" y="113" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="556" y="127" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Выход:</text><text x="556" y="143" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start">Модуль A: Сервис пользователей</text><text x="556" y="159" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="start">Модуль B: Сервис заказов</text><text x="556" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="start">Модуль C: Сервис платежей</text><rect width="134" height="30" x="550" y="223" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="617" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">src/*.py</text><line x1="702" x2="714" y1="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="150" height="230" x="714" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="789" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">QA-инженер</text><text x="722" y="97" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Вход: src/ + PRD.md</text><rect width="134" height="68" x="722" y="113" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="728" y="127" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Выход:</text><text x="728" y="143" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="start">Модульные тесты (pytest)</text><text x="728" y="159" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="start">Интеграционные тесты (API)</text><text x="728" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="start">Отчёт об ошибке → Инженер</text><rect width="134" height="30" x="722" y="223" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="789" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="middle">docs/test_report.md</text><path fill="none" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)" d="M 789,293 Q 703,346 617,293"/><text x="703" y="300" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Исправление ошибки</text><rect width="830" height="50" x="30" y="335" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="445" y="351" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Общая директория проекта</text><text x="445" y="371" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">docs/PRD.md docs/design.md docs/tasks.md src/*.py docs/test_report.md</text><rect width="830" height="130" x="30" y="400" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="445" y="418" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Основной дизайн MetaGPT</text><text x="3" y="442" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.75" font-weight="bold" text-anchor="start">▸ Стандартизированные документы</text><text x="314.1" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Каждая роль выдаёт фиксированный формат; downstream нужен формат, а не рассуждение</text><text x="42" y="466" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Развязка интерфейса</text><text x="270" y="466" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="start">Заменить на более сильного менеджера продукта; если вывод сохраняет формат PRD, нижестоящий процесс не меняется</text><text x="42" y="490" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Без менеджера</text><text x="270" y="490" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Управление проходит по DAG: Менеджер продукта→Архитектор→Менеджер проекта→Инженер→QA</text><text x="42" y="514" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Канал исключений</text><text x="270" y="514" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Ошибка QA → отчёт об ошибке передаётся инженеру по модулю → итеративное исправление</text></svg>