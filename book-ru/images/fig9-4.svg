<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">Опыт в знание: траектории — доказательство, документ — единица переиспользования</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle" style="font-size:13px">Исходная траектория</text><text x="106" y="139" class="t s" text-anchor="middle" style="font-size:10px">Действия, результаты, среда</text><text x="106" y="160" class="t s" text-anchor="middle" style="font-size:9.5px">Неизменяемое доказательство</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle" style="font-size:18px">Разовая оценка</text><text x="299" y="139" class="t s" text-anchor="middle" style="font-size:14px">Успех, провал, метки</text><text x="299" y="151.3" class="t s" text-anchor="middle" style="font-size:15px">Сохраняет место</text><text x="299" y="168.7" class="t s" text-anchor="middle" style="font-size:15px">доказательства</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle" style="font-size:10px">Сравнение между траекториями</text><text x="500" y="128" class="t s" text-anchor="middle" style="font-size:12px">Объединить схожие задачи</text><text x="500" y="151" class="t s" text-anchor="middle" style="font-size:11.5px">Сопоставить успех и провал</text><text x="500" y="174" class="t s" text-anchor="middle" style="font-size:12.5px">Выделить общее и границы</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle" style="font-size:16.5px">Документ Markdown</text><text x="709" y="128" class="t s" text-anchor="middle" style="font-size:9.5px">Сценарии применения и стратегия</text><text x="709" y="151" class="t s" text-anchor="middle" style="font-size:10px">Исключения, запреты, источники</text><text x="709" y="174" class="t s" text-anchor="middle" style="font-size:13px">Версия и время проверки</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle" style="font-size:13px">Поиск и применение</text><text x="902" y="130.3" class="t s" text-anchor="middle" style="font-size:15px">Загружать по</text><text x="902" y="147.7" class="t s" text-anchor="middle" style="font-size:15px">мере надобности</text><text x="902" y="152.17" class="t s" text-anchor="middle" style="font-size:13.5px">Продолжает давать</text><text x="902" y="167.83" class="t s" text-anchor="middle" style="font-size:13.5px">обратную связь</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">Новые доказательства правят, сужают или отменяют старое знание</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="323.3" class="t s" text-anchor="middle" style="font-size:15px">Использует инфраструктуру извлечения и поиска из главы 3;</text><text x="508" y="340.7" class="t s" text-anchor="middle" style="font-size:15px">здесь добавлены оценка траекторий и цикл улучшения поведения</text></svg>