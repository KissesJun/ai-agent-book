<svg xmlns="http://www.w3.org/2000/svg" width="850" height="390" viewBox="0 40 850 390" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="160" height="80" x="80" y="120" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="140" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">модель политики πθ</text><text x="160" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">генерация действия:</text><text x="160" y="178" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">размышление/поиск/код/ответ</text><rect width="160" height="60" x="320" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="90" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">выполнение инструмента</text><text x="400" y="110" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Вызов API / песочница кода</text><rect width="160" height="60" x="320" y="200" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="220" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">разбор результата</text><text x="400" y="240" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="middle">сообщение об успехе/неудаче/ошибке</text><rect width="170" height="80" x="560" y="120" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="645" y="140" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">расчёт reward</text><text x="645" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">правильно: +1</text><text x="645" y="178" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">неверно: −1</text><line x1="242" x2="318" y1="140" y2="100" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="482" x2="558" y1="100" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="480" x2="558" y1="230" y2="180" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="355" x2="355" y1="132" y2="198" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 645,200 Q 400,151 160,202"/><text x="400" y="275" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">обновление градиента политики</text><rect width="770" height="110" x="40" y="300" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="330" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Три уровня сложности в RL для использования инструментов</text><text x="88" y="367" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Уровень 1: Освоение одного инструмента</text><text x="102.4" y="392" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">когда вызывать + как вызывать + обработка ошибок</text><text x="362.4" y="367" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.49" font-weight="bold" text-anchor="middle">Уровень 2: Выбор из нескольких инструментов</text><text x="398.9" y="392" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.46" font-weight="normal" text-anchor="middle">поиск / код / разбор документов: выбрать один из трёх</text><text x="700.2" y="367" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Уровень 3: Оркестрация цепочки инструментов</text><text x="700.2" y="386" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">Управление зависимостями + ограничения</text><text x="700.2" y="398" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">взаимного исключения + оптимизация затрат</text></svg>