<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 40 780 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker><marker id="ah-sm" markerHeight="4" markerWidth="6" orient="auto" refX="6" refY="2"><polygon fill="#999" points="0 0 6 2 0 4"/></marker></defs><rect width="310" height="240" x="30" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="185" y="87" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Phone Agent</text><text x="185" y="107" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Node.js · Голосовой звонок в реальном времени</text><rect width="290" height="36" x="40" y="125" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="50" y="139" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Голос пользователя</text><text x="50" y="153" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Вход с микрофона</text><line x1="185" x2="185" y1="161" y2="167" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="290" height="36" x="40" y="167" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="50" y="181" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">VAD + ASR</text><text x="50" y="195" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Silero VAD → транскрипция STT</text><line x1="185" x2="185" y1="203" y2="209" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="290" height="36" x="40" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="50" y="223" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Инференс LLM</text><text x="50" y="237" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Понять намерение + извлечь информацию</text><line x1="185" x2="185" y1="245" y2="251" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="290" height="36" x="40" y="251" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="50" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">TTS-синтез</text><text x="50" y="279" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">Генерация голосового ответа → Воспроизведение</text><rect width="310" height="240" x="440" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="595" y="87" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Computer Agent</text><text x="595" y="107" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Python · Автоматизация браузера</text><rect width="290" height="36" x="450" y="125" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="460" y="139" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Скриншот</text><text x="460" y="153" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Текущая страница браузера</text><line x1="595" x2="595" y1="161" y2="167" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="290" height="36" x="450" y="167" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="460" y="181" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Vision LLM</text><text x="460" y="195" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Понять структуру страницы + поля формы</text><line x1="595" x2="595" y1="203" y2="209" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="290" height="36" x="450" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="460" y="223" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Планирование действий</text><text x="460" y="237" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="start">Определить поля → Спланировать последовательность ввода</text><line x1="595" x2="595" y1="245" y2="251" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="290" height="36" x="450" y="251" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="460" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Выполнить действия</text><text x="460" y="279" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Клик / Ввод / Отправка</text><rect width="720" height="36" x="30" y="320" fill="#999" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="338" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Двусторонняя связь WebSocket (ws://localhost:8849)</text><line x1="185" x2="185" y1="307" y2="318" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="595" x2="595" y1="307" y2="318" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="720" height="150" x="30" y="370" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="388" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Двунаправленный поток сообщений в реальном времени (использование компьютера во время звонка)</text><text x="42" y="412" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Телефон → Компьютер</text><text x="210" y="412" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">[FROM_PHONE_AGENT] Пользователь говорит, что имя — Zhang San</text><text x="42" y="438" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Компьютер → Телефон</text><text x="210" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">[FROM_COMPUTER_AGENT] Имя заполнено, нужен номер удостоверения</text><text x="42" y="464" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Телефон → Компьютер</text><text x="210" y="464" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">[FROM_PHONE_AGENT] Номер удостоверения 310101199001011234</text><text x="42" y="490" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Компьютер → Телефон</text><text x="210" y="490" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">[FROM_COMPUTER_AGENT] Форма отправлена, регистрация успешна</text><text x="390" y="510" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">Ключевое: два агента выполняют независимые циклы ReAct параллельно, без блокировки</text></svg>