<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="250" height="150" x="30" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Рубрика</text><line x1="40" x2="270" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="45" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">Фактическая корректность: необходима</text><text x="45" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Логическая связность: важно</text><text x="45" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Обнаружение галлюцинаций: вето ⚠</text><text x="45" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Полнота: важно</text><rect width="250" height="150" x="315" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Кандидат-ответ</text><line x1="325" x2="555" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="330" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Вывод агента:</text><text x="330" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">&quot;Возврат обработан, $150 будет зачислено в течение</text><text x="330" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">3-5 рабочих дней.&quot;</text><rect width="250" height="150" x="600" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="725" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Эталонное решение (опционально)</text><line x1="610" x2="840" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="615" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">Стандартный ответ / баллы за:</text><text x="615" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Должно включать сумму возврата</text><text x="615" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">Должно включать время начисления кредита</text><text x="615" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Не может обещать конкретную дату</text><line x1="155" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="440" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="725" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="50" x="280" y="245" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="262" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Модель-судья (GPT-5 / Gemini 2.5)</text><text x="440" y="282" fill="#ccc" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="6.5" font-weight="normal" text-anchor="middle">Мультиисточниковая гетерогенная оценка для предотвращения смещения одного источника</text><line x1="440" x2="440" y1="295" y2="325" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="760" height="180" x="60" y="328" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="350" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Структурированный вывод оценки</text><rect width="360" height="125" x="75" y="370" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="85" y="390" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Фактическая корректность</text><text x="260" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="390" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="start">Сумма и время точны</text><text x="85" y="414" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Полнота</text><text x="260" y="414" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3/4</text><text x="300" y="414" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="5.5" font-weight="normal" text-anchor="start">Отсутствует объяснение способа возврата</text><text x="85" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Обнаружение галлюцинаций</text><text x="260" y="438" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PASS</text><text x="300" y="438" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">Нет ложной информации</text><text x="85" y="462" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Логическая связность</text><text x="260" y="462" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="462" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="6.5" font-weight="normal" text-anchor="start">Чёткая причинно-следственная связь</text><rect width="345" height="125" x="460" y="370" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="632" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Стратегия агрегации оценок</text><text x="475" y="415" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Взвешенное среднее: Σ(вес × оценка измерения)</text><text x="475" y="437" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Вето: Галлюцинация=FAIL → итоговый балл=0</text><text x="475" y="459" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Мультисудья: медиана из 3 судей</text><text x="475" y="481" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Флаг граничного случая: расхождение &gt;2 балла → проверка человеком</text></svg>