<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 40 820 400" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="300" height="95" x="260" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LLM-оркестратор</text><rect width="280" height="38" x="270" y="105" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="410" y="124" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">&quot;Анализ проблемы → Поиск файлов → Назначение подзадач&quot;</text><rect width="230" height="55" x="40" y="220" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="237.1" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Worker 1: изменить auth.py</text><text x="155" y="257.9" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">Добавить поддержку OAuth2</text><rect width="190" height="40" x="60" y="285" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="296.55" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Чтение/редактирование</text><text x="155" y="313.45" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Файловый инструмент</text><line x1="410" x2="155" y1="157" y2="218" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="230" height="55" x="290" y="220" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="405" y="237.1" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Worker 2: изменить api.py</text><text x="405" y="257.9" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Добавить новый эндпоинт</text><rect width="190" height="40" x="310" y="285" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="405" y="296.55" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Чтение/редактирование</text><text x="405" y="313.45" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Файловый инструмент</text><line x1="410" x2="405" y1="157" y2="218" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="230" height="55" x="540" y="220" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="655" y="237.1" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle">Worker 3: написать test_auth.py</text><text x="655" y="257.9" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Тестовые случаи</text><rect width="190" height="40" x="560" y="285" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="655" y="296.55" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Выполнить тесты</text><text x="655" y="313.45" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Инструмент</text><line x1="410" x2="655" y1="157" y2="218" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="300" height="55" x="260" y="370" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="387.1" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Оркестратор: объединить результаты → проверить</text><text x="410" y="407.9" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">согласованность</text><line x1="155" x2="410" y1="327" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="405" x2="410" y1="327" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="655" x2="410" y1="327" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/></svg>