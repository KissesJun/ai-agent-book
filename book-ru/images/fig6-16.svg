 Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">два способа представления действий: дискретный токен действия (RT-2 / OpenVLA) · непрерывная генерация траектории (π₀)</text></svg>