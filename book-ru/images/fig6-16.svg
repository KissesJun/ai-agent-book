etica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle">устранение шума методом flow matching</text><line x1="630" x2="630" y1="165" y2="173" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><rect width="194" height="50" x="533" y="231" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="630" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">выход действий</text><text x="630" y="267" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">непрерывная траектория действий</text><line x1="630" x2="630" y1="223" y2="231" stroke="#999" stroke-width="2" marker-end="url(#ah-sm)"/><text x="660.5" y="294" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">маршрут непрерывной генерации траектории</text><text x="646.6" y="312" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" font-weight="normal" text-anchor="middle">разбиение действий на блоки 25-50/блок при 50Гц</text><text x="670.2" y="330" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.66" font-weight="normal" text-anchor="middle">выше плавность точных манипуляций</text><rect width="710" height="135" x="35" y="365" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="387" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20