<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 40 880 660" style="background:#fff"><defs><marker id="ah" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="7" orient="auto" refX="7" refY="5"><polygon fill="#333" points="0 0 7 5 0 10"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="400" height="552" x="30" y="66" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="230" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="bold" text-anchor="middle">Дерево трассировки выполнения (одна задача)</text><rect width="360" height="46" x="50" y="108" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="230" y="131" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Трассировка: узнать погоду в Пекине для пользователя на завтра (3.2с, $0.008)</text><rect width="360" height="64" x="50" y="164" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="68" y="189" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Вызов LLM: распознавание намерения</text><text x="68" y="211" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Claude 4 Sonnet · 0.4с · 320 токенов</text><rect width="360" height="64" x="50" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="68" y="263" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Tool: get_weather(Beijing)</text><text x="68" y="285" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">MCP-сервер · 1.8s · 200ms TTFT</text><rect width="324" height="64" x="86" y="312" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="104" y="337" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">├─ HTTP-запрос</text><text x="104" y="359" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">api.weather.com · 1.6s</text><rect width="324" height="64" x="86" y="386" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="104" y="411" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">└─ Разбор ответа</text><text x="104" y="433" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">JSON → структурированные данные о погоде</text><rect width="360" height="64" x="50" y="460" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="68" y="485" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Вызов LLM: генерация ответа</text><text x="68" y="507" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Claude 4 Sonnet · 0.8с · 580 токенов</text><rect width="360" height="64" x="50" y="534" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="68" y="559" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Tool: send_message(user)</text><text x="68" y="581" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">0.2с · Содержит сводку погоды</text><line x1="230" x2="230" y1="154" y2="163" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="230" x2="230" y1="228" y2="237" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="248" x2="248" y1="302" y2="311" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="248" x2="248" y1="376" y2="385" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="248" x2="248" y1="450" y2="459" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="230" x2="230" y1="524" y2="533" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="380" height="552" x="470" y="66" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="660" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Панель мониторинга</text><rect width="340" height="140" x="490" y="116" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="142" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Отслеживание затрат</text><text x="510" y="174" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Сегодня: $12.30 (1200 вызовов)</text><text x="510" y="198" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">В этом месяце: $340 (34K вызовов)</text><text x="510" y="222" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="start">Аномалия: задача#892 зациклила поиск 14 раз, стоимость $2.1</text><rect width="340" height="140" x="490" y="272" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="298" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Мониторинг производительности</text><text x="510" y="330" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Задержка P50 / P95 / P99: 2,1с / 8,4с / 15,2с</text><text x="510" y="354" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Успешность инструмента: 94.3%</text><rect width="340" height="140" x="490" y="428" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="454" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Аудит качества</text><text x="510" y="486" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Успешность задач: 87% Триггер галлюцинаций: 2.1%</text><text x="510" y="510" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start">Нарушения безопасности: 0 (за этот месяц) Удовлетворённость пользователей: 4.3/5</text><rect width="820" height="46" x="30" y="640" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="663" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Замкнутый цикл: данные трассировки → выявление проблем → A/B-тестирование → управление версиями промптов → непрерывная оптимизация</text></svg>