<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 40 880 540" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="560" height="118" x="20" y="50" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="start">Статический префикс (побайтно неизменен, KV Cache стабильно попадает)</text><rect width="520" height="34" x="40" y="84" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="101" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Системный промпт</text><rect width="520" height="34" x="40" y="124" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="141" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Ключевые инструменты: web_search, code_interpreter, tool_search</text><rect width="560" height="386" x="20" y="180" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="202" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Траектория (только рост, новое — в конец)</text><rect width="520" height="30" x="40" y="214" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="229" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: запрос цены акций NVDA</text><rect width="520" height="30" x="40" y="250" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(цена акций)</text><rect width="520" height="40" x="40" y="286" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="306" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → внедряется полная schema get_stock_quote</text><rect width="520" height="30" x="40" y="332" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="347" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: вызов get_stock_quote → Tool Result</text><rect width="520" height="30" x="40" y="368" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="383" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: анализ контрибьюторов репозитория GitHub</text><rect width="520" height="30" x="40" y="404" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="419" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(GitHub)</text><rect width="520" height="40" x="40" y="440" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="460" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → внедряются schema list_contributors и др.</text><rect width="520" height="30" x="40" y="486" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="501" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: вызов → Tool Result → ответ</text><rect width="520" height="30" x="40" y="522" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="537" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">…… последнее в этом раунде</text><line x1="562" x2="592" y1="306" y2="306" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><line x1="562" x2="592" y1="460" y2="460" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="600" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="bold" text-anchor="start">Первое появление: prefill один раз (запись в кэш)</text><text x="600" y="316" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Далее — обычная история, попадает в кэш</text><text x="600" y="448" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="bold" text-anchor="start">Нельзя удалять/переставлять загруженные инструменты</text><text x="600" y="470" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Иначе кэш сбрасывается с точки изменения</text></svg>