<svg xmlns="http://www.w3.org/2000/svg" width="900" height="184" viewBox="0 40 900 184" xml:lang="ru" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="84" x="26" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="126" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Запрос пользователя</text><text x="126" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">&quot;Помоги договориться о скидке с Xfinity&quot;</text><rect width="200" height="84" x="242" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="342" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="bold" text-anchor="middle">Локальный сервис LLM</text><text x="342" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">vLLM/Ollama (совместим с OpenAI)</text><line x1="228" x2="240" y1="86" y2="86" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="84" x="458" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="558" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" tex