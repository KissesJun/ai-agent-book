, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Проверка рендеринга</text><line x1="535.5" x2="674.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="535.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">export --per-slide</text><text x="535.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Обзор Vision LLM</text><text x="535.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">Обнаружение переполнения</text><line x1="684.5" x2="690.5" y1="137" y2="137" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="692.5" y="72" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="770" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Итеративное исправление</text><line x1="700.5" x2="839.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="700.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Reviewer→Proposer</text><text x="700.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Изменить код Slidev</text><text x="700.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Повторный рендер и проверка</text><line x1="440" x2="440" y1="202" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="222" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'Ping