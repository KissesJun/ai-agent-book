<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="440" y="60" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Этап 1: Генерация PPT (предложитель-рецензент)</text><rect width="155" height="130" x="32.5" y="72" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="110" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Вход PDF</text><line x1="40.5" x2="179.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="40.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">paper.pdf</text><text x="40.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Разбор структуры документа</text><text x="40.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Извлечь ссылки на рисунки</text><line x1="189.5" x2="195.5" y1="137" y2="137" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="197.5" y="72" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="275" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle