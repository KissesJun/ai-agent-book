Env.</text><rect width="76" height="40" x="472" y="75" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="510" y="95" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Chinese</text><rect width="76" height="40" x="552" y="75" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="590" y="95" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Execute</text><rect width="76" height="40" x="632" y="75" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="670" y="95" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Task</text><text x="60" y="95" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="normal" text-anchor="middle">...</text><text x="720" y="95" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="normal" text-anchor="middle">...</text><line x1="510" x2="510" y1="117" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="95" x="420" y="153" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="510" y="171" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">probability distribution P(x_t | x_{&lt;t})</text><rect width="50" height="12" x="460" y="186" fill="#999" stroke="#333" stroke-width="2" rx="2"/><text x="452" y="1