" font-weight="normal" text-anchor="start">15%</text><text x="390" y="263" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Loss = −Σ log P(x_t | x_1...x_{t−1}) → minimize cross-entropy</text><text x="390" y="332" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Seemingly simple goal-driven model learning: language rules → world knowledge → basic reasoning</text></svg>