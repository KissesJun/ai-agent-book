<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 40 780 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="280" height="45" x="20" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="82.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Classic RL Agent</text><rect width="270" height="45" x="490" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="625" y="82.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LLM Agent</text><rect width="280" height="44" x="20" y="115" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="115" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="137" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Closed finite set (6 actions)</text><text x="500" y="137" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Open: natural language + tools</text><text x="395" y="137" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Action Space</text><rect width="280" height="44" x="20" y="163" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="163" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="185" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Zero prior, from random policy</text><text x="500" y="185" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Pretrained knowledge + priors</text><text x="395" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Prior Knowledge</text><rect width="280" height="44" x="20" y="211" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="211" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Hash encoding: state_id=0x3A7F</text><text x="500" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Semantic: &quot;red key in storage room&quot;</text><text x="395" y="233" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">State Representation</text><rect width="280" height="44" x="20" y="259" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="259" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Scalar reward: R ∈ {-1, 0, +5, +50}</text><text x="500" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Reward + feedback + self-reflection</text><text x="395" y="281" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Learning Signal</text><rect width="280" height="44" x="20" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">No internal thinking (purely reactive)</text><text x="500" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Thinking as a special action (CoT)</text><text x="395" y="329" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Thinking Ability</text><rect width="280" height="44" x="20" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="377" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">New rules → full retraining</text><text x="500" y="377" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Cross-task zero/few-shot transfer</text><text x="395" y="377" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Generalization Ability</text><rect width="280" height="44" x="20" y="403" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="403" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">~10000 episodes / 10 seconds</text><text x="500" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">~1 episode / 2 minutes</text><text x="395" y="425" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sample Efficiency</text></svg>