<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="840" height="200" x="20" y="55" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Phase 1: Knowledge Extraction and Structuring</text><rect width="180" height="65" x="40" y="95" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="130" y="113" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Original Judgment Documents</text><text x="50" y="138" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">CAIL2018 Dataset</text><line x1="220" x2="258" y1="127" y2="127" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="65" x="260" y="95" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="113" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LLM Factor Discovery</text><text x="350" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Bottom-up Schema</text><line x1="440" x2="478" y1="127" y2="127" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="65" x="480" y="95" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="580" y="113" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Structured JSON</text><text x="490" y="138" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">{voluntary_surrender:true, compensation:500000,</text><text x="490" y="155" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">injury_level:severe_injury_grade_2}</text><rect width="400" height="70" x="40" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="240" y="188" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Modular Data Schema</text><text x="240" y="212" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="middle">Core Schema (voluntary_surrender/compensation/prior_convictions) + Crime-specific Extension Schema</text><text x="240" y="232" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">(theft→amount_involved, injury→injury_level)</text><rect width="840" height="215" x="20" y="270" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="293" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Phase 2: Factor Analysis and Knowledge Modeling</text><rect width="200" height="80" x="40" y="310" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="140" y="330" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Feature Vectorization</text><text x="140" y="354" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">One-hot Encoding + Multi-hot Encoding</text><text x="140" y="376" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">+ Log Transformation + Standardization</text><line x1="240" x2="278" y1="350" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="80" x="280" y="310" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="380" y="330" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">KMeans Clustering</text><text x="380" y="354" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">Discover &quot;Case Prototypes&quot;</text><text x="380" y="376" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">e.g., &quot;unarmed brawl, minor injury&quot;</text><line x1="480" x2="518" y1="350" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="80" x="520" y="310" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="620" y="330" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Factor Importance Model</text><text x="620" y="354" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Quantify Weights of Each Factor</text><text x="620" y="376" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Construct Sentencing Decision Logic</text><line x1="620" x2="620" y1="390" y2="415" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="720" height="60" x="40" y="418" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="438" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Application: Conversational Legal Advisory Agent</text><text x="400" y="463" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Guide Questions by Factor Importance → Retrieve Similar Case Prototypes → Data-driven Sentencing Analysis</text></svg>