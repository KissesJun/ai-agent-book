ata available</text><text x="147" y="444" class="t n">Speed test ≥ 200 / excellent</text><rect width="182" height="62" x="254" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="345" y="408" class="t m">actions</text><text x="345" y="428" class="t n">toggle_airplane_mode</text><text x="345" y="444" class="t n">requestor must be user</text><rect width="182" height="62" x="452" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="543" y="408" class="t m">communicate_info</text><text x="543" y="428" class="t n">Was required info conveyed</text><text x="543" y="444" class="t n">null for this task</text><rect width="182" height="62" x="650" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="741" y="408" class="t m">nl_assertions</text><text x="741" y="428" class="t n">Natural-language judgment</text><text x="741" y="444" class="t n">null for this task</text><text x="440" y="474" class="t n">reward_basis = [&quot;ENV_ASSERTION&quot;] → only layer one counts; the rest are recorded but excluded from the reward</text></svg>