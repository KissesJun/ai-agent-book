<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>Figure 6-5: Synchronous-Interface Compatibility and Model-Native Asynchrony</title><desc>In the compatibility approach above, the runtime orders incoming events so that a model with a synchronous interface can participate in asynchronous tasks. Another approach lets the model understand this interaction rhythm natively: it can do other work while a tool runs and adjust subsequent work when the user adds requirements midway. GPT-6 Astra already supports Async tool calling and Mid-turn steering, illustrating this change (Figure 6-5).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="40" y="53" class="title">Compatibility: the runtime schedules asynchronous work</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" text-anchor="middle" style="font-size:15.45px">Task runs in the background</text><text x="155" y="122" class="small" text-anchor="middle">Explicitly marked unfinished</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" text-anchor="middle" style="font-size:15.05px">Runtime receives new events</text><text x="440" y="122" class="small" text-anchor="middle" style="font-size:14.04px">Queue, interrupt, or run in parallel</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" text-anchor="middle">Model continues the task</text><text x="725" y="122" class="small" text-anchor="middle" style="font-size:13.35px">Inputs still follow synchronous turns</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="40" y="218" class="title">Native asynchrony: understanding waits and mid-task changes</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" text-anchor="middle">Start a slow query</text><text x="155" y="290" class="small" text-anchor="middle">Example: find meeting venues</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" text-anchor="middle" style="font-size:16.08px">Keep working while waiting</text><text x="440" y="290" class="small" text-anchor="middle" style="font-size:14.09px">Prepare the agenda and checklist</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" text-anchor="middle" style="font-size:16.57px">Decide when results arrive</text><text x="725" y="290" class="small" text-anchor="middle" style="font-size:14.53px">Compare venues using real data</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" text-anchor="middle">User adds requirements</text><text x="155" y="390" class="small" text-anchor="middle">Budget or attendance changes</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" text-anchor="middle">Retain completed work</text><text x="440" y="390" class="small" text-anchor="middle" style="font-size:14.09px">Add new requirements to the task</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" text-anchor="middle" style="font-size:16.43px">Adjust subsequent actions</text><text x="725" y="390" class="small" text-anchor="middle" style="font-size:14.25px">Use existing data and all updates</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" text-anchor="middle">Model: understand changes and revise plans. Runtime: tools, state, and event sources.</text><text x="440" y="506" class="small" text-anchor="middle">Receiving messages also requires correct task resumption and action control.</text></svg>