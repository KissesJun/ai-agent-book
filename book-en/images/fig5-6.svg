<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="440" y="60" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Phase 1: PPT Generation (Proposer-Reviewer)</text><rect width="155" height="130" x="32.5" y="72" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="110" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PDF Input</text><line x1="40.5" x2="179.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="40.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">paper.pdf</text><text x="40.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Parse doc structure</text><text x="40.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Extract figure refs</text><line x1="189.5" x2="195.5" y1="137" y2="137" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="197.5" y="72" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="275" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Content Planning</text><line x1="205.5" x2="344.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="205.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">10-20 page structure</text><text x="205.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Extract core arguments</text><text x="205.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Assign figures to pages</text><line x1="354.5" x2="360.5" y1="137" y2="137" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="362.5" y="72" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Slidev Generation</text><line x1="370.5" x2="509.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="370.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Generate page by page</text><text x="370.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">layout: two-cols</text><text x="370.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Code + image layout</text><line x1="519.5" x2="525.5" y1="137" y2="137" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="527.5" y="72" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="605" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Rendering Check</text><line x1="535.5" x2="674.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="535.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">export --per-slide</text><text x="535.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Vision LLM review</text><text x="535.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Overflow detection</text><line x1="684.5" x2="690.5" y1="137" y2="137" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="692.5" y="72" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="770" y="92" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Iterative Fix</text><line x1="700.5" x2="839.5" y1="104" y2="104" stroke="#999" stroke-width="2"/><text x="700.5" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Reviewer→Proposer</text><text x="700.5" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Modify Slidev code</text><text x="700.5" y="160" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Re-render and verify</text><line x1="440" x2="440" y1="202" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="222" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-a