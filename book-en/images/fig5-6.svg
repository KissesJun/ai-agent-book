" text-anchor="start">Narration per page</text><text x="205.5" y="356" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Guiding narrative</text><line x1="354.5" x2="360.5" y1="333" y2="333" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="362.5" y="268" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="288" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">TTS synthesis</text><line x1="370.5" x2="509.5" y1="300" y2="300" stroke="#999" stroke-width="2"/><text x="370.5" y="316" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Text → speech</text><text x="370.5" y="336" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">speech-01.mp3</text><text x="370.5" y="356" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">speech-02.mp3</text><line x1="519.5" x2="525.5" y1="333" y2="333" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="527.5" y="268" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="605" y="288" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Audio-video sync</text><line x1="535.5" x2="674.5" y1="300" y2="300" stroke="#999" stroke-width="2"/><text x="535.5" y="316" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">ffmpeg synthesis</text><text x="535.5" y="336" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Match audio duration</text><text x="535.5" y="356" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Transition effects</text><line x1="684.5" x2="690.5" y1="333" y2="333" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="130" x="692.5" y="268" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="770" y="288" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Final video</text><line x1="700.5" x2="839.5" y1="300" y2="300" stroke="#999" stroke-width="2"/><text x="700.5" y="316" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">output.mp4</text><text x="700.5" y="336" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">5-15 minutes</text><text x="700.5" y="356" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Audio + visual output</text><line x1="30" x2="850" y1="420" y2="420" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="440" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Acceptance criteria</text><rect width="92" height="26" x="180" y="462" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="226" y="475" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PPT</text><text x="285" y="475" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">10-20 pages · Cover main contributions · ≥3 original charts</text><rect width="92" height="26" x="180" y="492" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="226" y="505" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Rendering</text><text x="285" y="505" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Zero text overflow · Reasonable layout · Text-image match</text><rect width="92" height="26" x="180" y="522" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="226" y="535" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Video</text><text x="285" y="535" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">5-15 minutes · Audio-video sync · Coherent narration</text></svg>