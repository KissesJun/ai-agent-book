<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 40 880 480" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="840" height="195" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="60" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">training paradigm (strictly synchronous sequence)</text><rect width="160" height="28" x="680" y="64" fill="#999" stroke="#333" stroke-width="2" rx="14"/><text x="760" y="78" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">API mandatory constraint</text><rect width="180" height="55" x="47" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="137" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Observation</text><text x="137" y="142" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">User: Check Beijing weather</text><line x1="229" x2="247" y1="128" y2="128" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="249" y="100" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="339" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Thinking</text><text x="339" y="142" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Need to call weather tool</text><line x1="431" x2="449" y1="128" y2="128" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="451" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="541" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Action</text><text x="541" y="142" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">get_weather(Beijing)</text><line x1="633" x2="651" y1="128" y2="128" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="653" y="100" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="743" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Observation</text><text x="743" y="142" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">22°C, sunny</text><rect width="786" height="30" x="47" y="170" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="57" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">tool_call → next must be tool_result, otherwise API error</text><line x1="20" x2="860" y1="262" y2="262" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="280" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">contradiction</text><rect width="840" height="210" x="20" y="295" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="60" y="318" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">deployment reality (asynchronous events interleaved)</text><rect width="160" height="28" x="680" y="304" fill="#999" stroke="#333" stroke-width="2" rx="14"/><text x="760" y="318" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Format conflict!</text><rect width="156" height="50" x="50" y="340" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="128" y="355" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Assistant</text><text x="128" y="372" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">tool_call:</text><text x="128" y="386" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">get_weather(Beijing)</text><rect width="218.4" height="50" x="221.6" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="330.8" y="355" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Waiting...</text><text x="330.8" y="372" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Tool execution ~5s</text><rect width="117" height="50" x="362" y="340" fill="#999" stroke="#333" stroke-width="2" rx="4"/><text x="420.5" y="355" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">User interrupts</text><text x="420.5" y="372" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">&quot;No need,</text><text x="420.5" y="386" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">check Shanghai&apos;s &quot;</text><rect width="163.8" height="50" x="494.6" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="576.5" y="355" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">???</text><text x="576.5" y="372" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">When will tool_result arrive?</text><text x="576.5" y="386" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">How to ensure format?</text><rect width="156" height="50" x="674" y="340" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="752" y="355" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">placeholder</text><text x="752" y="372" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">[Tool still executing,</text><text x="752" y="386" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">prioritize interruption]</text><rect width="780" height="40" x="50" y="410" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="60" y="430" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">Solution: placeholder fixes format + non-urgent events enqueued + only interrupt when truly urgent</text><rect width="600" height="40" x="140" y="465" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="485" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Fundamental solution: next-generation models need to be trained via RL in asynchronous environments</text></svg>