<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 40 880 580" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="160" height="44" x="120" y="50" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="200" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">MCP Client</text><rect width="160" height="44" x="600" y="50" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="680" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">MCP Server</text><line x1="200" x2="200" y1="94" y2="600" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><line x1="680" x2="680" y1="94" y2="600" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><line x1="204" x2="676" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="116" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">initialize</text><rect width="350" height="48" x="230" y="136" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="240" y="155" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">{&quot;method&quot;: &quot;initialize&quot;,</text><text x="240" y="173" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-