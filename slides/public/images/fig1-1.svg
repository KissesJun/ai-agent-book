<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 40 820 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="240" height="65" x="30" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Post-training</text><rect width="132.625" height="28" x="83.688" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="150" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Training time</text><rect width="240" height="38" x="30" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Modify model weights</text><rect width="240" height="38" x="30" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Permanent · general</text><rect width="240" height="38" x="30" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">High cost · slow to update</text><rect width="240" height="45" x="30" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="150" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">e.g. learn when to call a tool</text><rect width="240" height="65" x="290" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">In-context learning</text><rect width="141.938" height="28" x="339.031" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="410" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Inference time</text><rect width="240" height="38" x="290" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Soft update via attention</text><rect width="240" height="38" x="290" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Temporary · adapts instantly</text><rect width="240" height="38" x="290" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="410" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Bounded by context window</text><rect width="240" height="45" x="290" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle">e.g. learn a format from 3 examples</text><rect width="240" height="65" x="550" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="97.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Externalized learning</text><rect width="98.249" height="28" x="620.876" y="140" fill="#666" stroke="#333" stroke-width="2" rx="14"/><text x="670" y="154" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Runtime</text><rect width="240" height="38" x="550" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="204" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Knowledge base + generated tools</text><rect width="240" height="38" x="550" y="230" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="249" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Persistent · updatable</text><rect width="240" height="38" x="550" y="275" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="670" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Reliable · verifiable</text><rect width="240" height="45" x="550" y="330" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="670" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">e.g. freeze a workflow into a tool</text><line x1="60" x2="760" y1="430" y2="430" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="60" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">Slow (Weeks)</text><text x="410" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Learning Speed</text><text x="760" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="end">Fast (Milliseconds)</text></svg>