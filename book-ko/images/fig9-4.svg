<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;Apple SD Gothic Neo&apos;,&apos;Noto Sans KR&apos;,&apos;Malgun Gothic&apos;,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.note,.s{fill:#52636d}.s{font-size:15px}.note{font-size:14px}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">경험의 지식화: 원시 궤적은 증거이며 지식 문서가 재사용 단위입니다</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle">원시 궤적</text><text x="106" y="139" class="t s" text-anchor="middle">행동·결과·환경</text><text x="106" y="160" class="t s" text-anchor="middle">변경 불가 증거</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle">단일 평가</text><text x="299" y="139" class="t s" text-anchor="middle">성공·실패·태그</text><text x="299" y="160" class="t s" text-anchor="middle">증거 위치 보존</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle">궤적 간 비교</text><text x="500" y="128" class="t s" text-anchor="middle">동종 업무 집계</text><text x="500" y="151" class="t s" text-anchor="middle">성공·실패 대조</text><text x="500" y="174" class="t s" text-anchor="middle">공통점·경계 추출</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle">Markdown 문서</text><text x="709" y="128" class="t s" text-anchor="middle">적용 상황·전략</text><text x="709" y="151" class="t s" text-anchor="middle">예외·금지 영역·출처</text><text x="709" y="174" class="t s" text-anchor="middle">버전·검증 시각</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle">검색 적용</text><text x="902" y="139" class="t s" text-anchor="middle">새 업무에 필요시 로드</text><text x="902" y="160" class="t s" text-anchor="middle">계속 피드백 생성</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">새 증거로 기존 지식을 수정·한정·폐기합니다</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="332" class="t note" text-anchor="middle">3장과 추출·검색 인프라를 공유하고, 이 장에서는 궤적 평가·행동 개선 루프를 추가합니다</text></svg>