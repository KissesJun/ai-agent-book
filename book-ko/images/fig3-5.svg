<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 40 880 400" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="180" height="55" x="20" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="110" y="92.5" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">① 사용자 질의</text><text x="110" y="145" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">&quot;고의살인죄의 형량은?&quot;</text><line x1="200" x2="238" y1="92" y2="92" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="240" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="330" y="92.5" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">② 검색(Retrieval)</text><text x="330" y="140" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">밀집 검색 + BM25</text><text x="330" y="160" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">→ Top-K 텍스트 조각</text><line x1="420" x2="458" y1="92" y2="92" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="460" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="92.5" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">③ 증강(Augment)</text><text x="550" y="140" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">질의 + 검색 결과</text><text x="550" y="160" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">→ 전체 프롬프트 구성</text><line x1="640" x2="678" y1="92" y2="92" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="55" x="680" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="770" y="92.5" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">④ 생성(Generate)</text><text x="770" y="140" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">LLM이 컨텍스트 종합</text><text x="770" y="160" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">→ 답변 생성</text><line x1="20" x2="860" y1="195" y2="195" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="215" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">구체적인 데이터 흐름 예</text><rect width="400" height="90" x="20" y="235" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="220" y="253" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">검색된 텍스트 조각</text><text x="30" y="278" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">《형법》 제232조: 고의로 살인한 자는 사형,</text><text x="30" y="298" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">무기징역 또는 10년 이상의 유기징역...</text><rect width="420" height="90" x="440" y="235" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="650" y="253" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">증강된 프롬프트</text><text x="450" y="278" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">다음 법조문을 바탕으로 답하세요:</text><text x="450" y="298" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">[《형법》 제232조...] 질문: 고의살인죄의 형량은?</text><rect width="840" height="80" x="20" y="345" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="363" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">생성된 답변</text><text x="30" y="390" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">《형법》 제232조에 따라 고의살인죄는 사형, 무기징역 또는 10년 이상의 유기징역에 처합니다.</text><text x="30" y="412" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">사안이 경미하면 3년 이상 10년 이하의 유기징역에 처합니다.</text></svg>