<svg xmlns="http://www.w3.org/2000/svg" width="820" height="525" viewBox="0 40 820 525" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="740" height="90" x="40" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="60" y="90" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start">1계층: 메타데이터(시작 시 로드, 약 300 tokens)</text><rect width="700" height="48" x="60" y="108" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="70" y="130" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">skills: [{name: &quot;PPTX&quot;, desc: &quot;콘텐츠로 PowerPoint 프레젠테이션 생성&quot;}</text><text x="70" y="145" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="14" text-anchor="start">{name: &quot;PDF&quot;, desc: &quot;PDF 문서 추출 및 분석&quot;}, ...]</text><line x1="410" x2="410" y1="162" y2="185" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="430" y="173" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">업무 트리거: &quot;논문으로 PPT 만들어 줘&quot;</text><rect width="740" height="150" x="40" y="190" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="60" y="210" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start">2계층: SKILL.md 핵심 절차(필요할 때 로드, 약 2K tokens)</text><rect width="700" height="100" x="60" y="230" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="70" y="250" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" text-anchor="start">PPTX Skill 핵심 절차:</text><text x="70" y="272" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" text-anchor="start">1. markitdown으로 텍스트 추출 → 2. PPTX 압축 해제 후 XML 접근</text><text x="70" y="294" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" text-anchor="start">3. slide{N}.xml 콘텐츠 수정 → 4. .pptx로 다시 패키징</text><text x="70" y="316" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" text-anchor="start">참조: → html2pptx.md | → reference.md | → scripts/</text><line x1="410" x2="410" y1="342" y2="365" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="430" y="353" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">세부 방법 필요: &quot;HTML 템플릿으로 PPT 만들어 줘&quot;</text><rect width="740" height="140" x="40" y="370" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="60" y="390" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start">3계층: 하위 문서(선택적으로 탐색, 필요할 때 로드)</text><rect width="215" height="80" x="60" y="415" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="167.5" y="433" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">html2pptx.md</text><text x="167.5" y="455" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">HTML 템플릿 → PPT</text><text x="167.5" y="473" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">전체 워크플로</text><rect width="215" height="80" x="295" y="415" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="402.5" y="433" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">reference.md</text><text x="402.5" y="455" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">XML 형식 규칙과</text><text x="402.5" y="473" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">기술 세부 사항</text><rect width="215" height="80" x="530" y="415" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="637.5" y="433" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">scripts/*.py</text><text x="637.5" y="455" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">실행 가능한 도구:</text><text x="637.5" y="473" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">thumbnail.py 등</text><rect width="620" height="35" x="100" y="520" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="538" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">메타데이터 고정 → KV Cache에 유리 | 동적 콘텐츠 추가 → 캐시 유지</text></svg>