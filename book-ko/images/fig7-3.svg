<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker><marker id="ah-r" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="0" refY="3.5"><polygon fill="#666" points="10 0 0 3.5 10 7"/></marker></defs><style>.l,.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;dominant-baseline:central}.t{text-anchor:middle}.l{text-anchor:start}.h{font-size:17px;font-weight:700}.m{font-size:13px}.c,.n{font-size:11.5px;fill:#666}.c{font-family:&apos;SF Mono&apos;,Menlo,Consolas,monospace}</style><rect width="270" height="86" x="40" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="175" y="40" class="t h">사용자 시뮬레이터(LLM)</text><text x="56" y="62" class="l n">known_info: John Smith / 555-123-2002 / 프랑스 체류</text><text x="56" y="80" class="l n">task_instructions: 점진적 공개 · 감정 · 사실 접지</text><text x="56" y="96" class="l n">수용 기준: excellent만 해결로 인정</text><rect width="270" height="86" x="570" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="705" y="40" class="t h">Agent(평가 대상)</text><text x="586" y="62" class="l n">입력: 티켓 + 도메인 정책</text><text x="586" y="80" class="l n">비가시: 사용자 단말의 실제 상태</text><text x="586" y="96" class="l n">유도만 가능, 대행은 불가</text><line x1="316" x2="560" y1="63" y2="63" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)" marker-start="url(#ah-r)"/><text x="438" y="50" class="t n">다중 턴 대화</text><text x="438" y="80" class="t n">점진적 정보 공개</text><rect width="800" height="150" x="40" y="146" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="166" class="t h">공유 환경(이중 제어: 양쪽 모두 상태 변경 가능)</text><rect width="370" height="98" x="60" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="245" y="200" class="t m" font-weight="bold">단말 쪽 상태</text><text x="76" y="222" class="l n">비행기 모드 ON · 로밍 OFF · 데이터 절약 · 잔여 데이터</text><text x="76" y="246" class="l c">사용자 도구: toggle_airplane_mode / toggle_roaming</text><text x="76" y="266" class="l c">check_status_bar / run_speed_test</text><rect width="370" height="98" x="450" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="635" y="200" class="t m" font-weight="bold">통신사 쪽 데이터베이스</text><text x="466" y="222" class="l n">고객 C1001 · 회선 L1001/L1002/L1003 · 요금제 · 청구</text><text x="466" y="246" class="l c">Agent 도구: get_customer_by_phone / get_data_usage</text><text x="466" y="266" class="l c">enable_roaming / refuel_data</text><line x1="175" x2="175" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="705" x2="705" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="800" height="34" x="40" y="306" fill="#fff" stroke="#666" stroke-dasharray="5 4" stroke-width="1.5" rx="5"/><text x="440" y="323" class="t n">사용자의 toggle_roaming으로 환경이 바뀌었다. Agent는 도구를 다시 호출해야 결과를 안다 — 검증은 이 재확인까지 포괄한다</text><rect width="800" height="136" x="40" y="356" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="376" class="t h">과제 종료 후: 네 층 검사 + 집계 규칙</text><rect width="182" height="62" x="56" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="147" y="408" class="t m">env_assertions</text><text x="147" y="428" class="t n">모바일 데이터 사용 가능</text><text x="147" y="444" class="t n">속도 ≥ 200 / excellent</text><rect width="182" height="62" x="254" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="345" y="408" class="t m">actions</text><text x="345" y="428" class="t n">toggle_airplane_mode</text><text x="345" y="444" class="t n">requestor는 user여야 함</text><rect width="182" height="62" x="452" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="543" y="408" class="t m">communicate_info</text><text x="543" y="428" class="t n">필요 정보를 전달했는가</text><text x="543" y="444" class="t n">이 과제에서는 null</text><rect width="182" height="62" x="650" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="741" y="408" class="t m">nl_assertions</text><text x="741" y="428" class="t n">자연어 층위 판정</text><text x="741" y="444" class="t n">이 과제에서는 null</text><text x="440" y="474" class="t n">reward_basis = [&quot;ENV_ASSERTION&quot;] → 첫 층만 채택. 나머지는 기록되나 보상에는 미반영</text></svg>