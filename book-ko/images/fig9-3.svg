<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" style="background:#fff"><defs><style>.t{font-family:Arial,&apos;Apple SD Gothic Neo&apos;,&apos;Noto Sans KR&apos;,&apos;Malgun Gothic&apos;,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#52636d}.q{font-size:18px;font-weight:700}.accent,.box{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.accent{fill:#e8f1f5;stroke:#2f617a}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">능력의 표현 특성이 주된 갱신 위치를 결정합니다</text><rect width="220" height="126" x="35" y="72" class="box" rx="9"/><text x="145" y="105" class="t h" text-anchor="middle">지식</text><text x="145" y="135" class="t s" text-anchor="middle">사실·경험·예외</text><text x="145" y="164" class="t s" text-anchor="middle">Markdown / 지식 베이스</text><rect width="220" height="126" x="275" y="72" class="box" rx="9"/><text x="385" y="105" class="t h" text-anchor="middle">지침</text><text x="385" y="135" class="t s" text-anchor="middle">언어화 가능한 판단 원칙</text><text x="385" y="164" class="t s" text-anchor="middle">Prompt / Skill</text><rect width="220" height="126" x="515" y="72" class="box" rx="9"/><text x="625" y="105" class="t h" text-anchor="middle">프로그램</text><text x="625" y="135" class="t s" text-anchor="middle">결정론적 절차·강제 제약</text><text x="625" y="164" class="t s" text-anchor="middle">도구 / 워크플로 / Harness</text><rect width="220" height="126" x="755" y="72" class="accent" rx="9"/><text x="865" y="105" class="t h" text-anchor="middle">매개변수</text><text x="865" y="135" class="t s" text-anchor="middle">고차원 지각·암묵적 전략</text><text x="865" y="164" class="t s" text-anchor="middle">SFT / 증류 / RL</text><line x1="145" x2="865" y1="226" y2="226" stroke="#33434d" stroke-width="2"/><path stroke="#33434d" stroke-width="2" d="M145 218 V234 M865 218 V234"/><text x="145" y="260" class="t s" text-anchor="middle">갱신 용이·추적 가능</text><text x="865" y="260" class="t s" text-anchor="middle">내재화·낮은 추론 비용</text><text x="500" y="289" class="t h" text-anchor="middle">단방향 사다리가 아닌 네 가지 상호 보완 수단</text><rect width="710" height="58" x="145" y="320" class="accent" rx="8"/><text x="500" y="344" class="t q" text-anchor="middle">첫 판단: 능력을 사실·언어 규칙·프로그램으로 완전히 표현할 수 있는가?</text><text x="500" y="367" class="t s" text-anchor="middle">안정성·비용·갱신 빈도가 배치 방식을 정하며 매개변수화 가능 여부와는 무관합니다</text></svg>