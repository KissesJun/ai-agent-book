<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 40 900 430" xml:lang="ko" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="30" y="78" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start">첫 번째 모델 API 호출</text><rect width="340" height="106" x="30" y="92" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="200" y="118" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">messages: system + user</text><text x="200" y="148" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tools: get_current_time,</text><text x="200" y="170" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">get_weather</text><line x1="370" x2="480" y1="145" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="425" y="135" fill="#666" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" text-anchor="middle">API</text><rect width="390" height="106" x="480" y="92" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="675" y="112" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">assistant: tool_calls</text><text x="675" y="138" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">get_current_time(timezone=&quot;America/Vancouver&quot;)</text><text x="675" y="158" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">get_weather(city=&quot;Vancouver&quot;, unit=&quot;celsius&quot;)</text><text x="675" y="180" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">데이터 의존성 없음 → 병렬 실행 가능</text><line x1="675" x2="675" y1="198" y2="218" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="390" height="50" x="480" y="220" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="675" y="245" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">에이전트 프레임워크가 두 도구를 병렬 실행</text><line x1="675" x2="675" y1="270" y2="298" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="30" y="286" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start">두 번째 모델 API 호출</text><rect width="390" height="78" x="480" y="300" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="675" y="322" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">messages: + tool 결과</text><text x="675" y="346" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">밴쿠버 시간 및 날씨</text><text x="675" y="364" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">메시지 기록에 추가한 뒤 모델을 다시 요청</text><line x1="480" x2="370" y1="339" y2="339" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="425" y="329" fill="#666" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" text-anchor="middle">API</text><rect width="340" height="78" x="30" y="300" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="200" y="322" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">assistant: 최종 응답</text><text x="200" y="346" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">도구 호출 없음 → 루프 종료</text><text x="200" y="364" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">&quot;현재 시각은…, 날씨는…&quot;</text><text x="450" y="430" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">무상태 API에서는 매 라운드마다 전체 메시지 기록을 모델에 다시 전송해야 합니다.</text></svg>