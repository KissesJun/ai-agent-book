<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 40 800 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="720" height="50" x="40" y="50" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="60" y="75" fill="#333" dominant-baseline="central" font-family="'Noto Sans Mono CJK KR', 'Noto Sans CJK KR', monospace" font-size="16" text-anchor="start">Score(Q,D) = Σ IDF(qi) × TF(qi,D)×(k1+1) / (TF + k1×(1-b+b×|D|/avgdl))</text><rect width="220" height="170" x="40" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="148" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">단어 빈도 포화(TF)</text><line x1="60" x2="240" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="150" y="190" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">k₁이 포화 속도 제어</text><text x="150" y="218" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">단어 빈도 ↑, 기여도는 감소</text><text x="150" y="246" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">등장 횟수가 두 배여도</text><text x="150" y="274" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">점수는 두 배로 늘지 않음</text><rect width="220" height="170" x="290" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="148" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">역문서 빈도(IDF)</text><line x1="310" x2="490" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="400" y="190" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">단어의 희소성 측정</text><text x="400" y="218" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">&quot;의&quot; → IDF ≈ 0</text><text x="400" y="246" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">&quot;양형&quot; → IDF ≈ 5.2</text><text x="400" y="274" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">희귀어 가중치 &gt;&gt; 일반어</text><rect width="220" height="170" x="540" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="650" y="148" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">길이 정규화(b)</text><line x1="560" x2="740" y1="163" y2="163" stroke="#999" stroke-width="2"/><text x="650" y="190" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">b ∈ [0,1], 정규화 강도</text><text x="650" y="218" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">b=0: 길이 미고려</text><text x="650" y="246" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">b=1: 완전 정규화</text><text x="650" y="274" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">긴 문서 편향 방지</text><line x1="150" x2="150" y1="290" y2="315" stroke="#999" stroke-width="2"/><line x1="400" x2="400" y1="290" y2="315" stroke="#999" stroke-width="2"/><line x1="650" x2="650" y1="290" y2="315" stroke="#999" stroke-width="2"/><rect width="720" height="48" x="40" y="315" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="339" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">최종 점수 = Σ [IDF × 길이 정규화를 거친 포화 TF]</text></svg>