<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 40 880 540" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="560" height="118" x="20" y="50" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="72" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start">정적 접두부(바이트 단위 불변, KV Cache 지속 적중)</text><rect width="520" height="34" x="40" y="84" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="101" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">System Prompt</text><rect width="520" height="34" x="40" y="124" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="141" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">핵심 도구 정의: web_search, code_interpreter, tool_search</text><rect width="560" height="386" x="20" y="180" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="202" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start">궤적(기존 내용은 그대로 두고 새 내용을 끝에 추가)</text><rect width="520" height="30" x="40" y="214" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="229" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: NVDA 주가 조회</text><rect width="520" height="30" x="40" y="250" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="265" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(주가)</text><rect width="520" height="40" x="40" y="286" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="306" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → get_stock_quote 전체 schema 주입</text><rect width="520" height="30" x="40" y="332" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="347" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: get_stock_quote 호출 → Tool Result</text><rect width="520" height="30" x="40" y="368" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="383" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: GitHub 저장소 기여자 분석</text><rect width="520" height="30" x="40" y="404" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="419" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(GitHub)</text><rect width="520" height="40" x="40" y="440" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="460" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → list_contributors 등 schema 주입</text><rect width="520" height="30" x="40" y="486" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="501" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: 호출 → Tool Result → 응답</text><rect width="520" height="30" x="40" y="522" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="537" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">…… 이번 라운드의 최신 콘텐츠</text><line x1="562" x2="592" y1="306" y2="306" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><line x1="562" x2="592" y1="460" y2="460" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="600" y="294" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">최초 등장: prefill 1회(캐시에 기록)</text><text x="600" y="316" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start">이후 일반 기록으로 캐시에 적중</text><text x="600" y="448" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start">로드한 도구를 제거하거나 재정렬하면 안 됨</text><text x="600" y="470" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start">그러면 변경 지점부터 캐시가 무효화됨</text></svg>