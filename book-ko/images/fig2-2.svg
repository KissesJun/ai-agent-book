<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 40 900 300" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="380" height="210" x="30" y="66" fill="#fff" stroke="#999" stroke-width="2" rx="6"/><text x="220" y="90" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Request(에이전트 프레임워크가 구성)</text><rect width="340" height="62" x="50" y="112" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="70" y="132" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start">system</text><text x="70" y="154" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start">개발자가 작성한 규칙</text><rect width="340" height="62" x="50" y="190" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="70" y="210" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start">user</text><text x="70" y="232" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start">&quot;안녕하세요. 누구세요?&quot;</text><line x1="410" x2="470" y1="171" y2="171" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="161" fill="#666" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" text-anchor="middle">호출</text><rect width="380" height="210" x="490" y="66" fill="#fff" stroke="#999" stroke-width="2" rx="6"/><text x="680" y="90" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Response(API 응답)</text><rect width="340" height="82" x="510" y="150" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="530" y="174" fill="#333" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start">assistant</text><text x="530" y="198" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start">모델이 생성한 응답</text><text x="530" y="218" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start">&quot;안녕하세요! 저는 코딩 어시스턴트입니다…&quot;</text><text x="450" y="308" fill="#666" dominant-baseline="central" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">각 호출은 무상태입니다. 모델에 필요한 모든 정보를 요청의 messages 목록에 빠짐없이 제공해야 합니다.</text></svg>