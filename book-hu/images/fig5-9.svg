<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 40 880 540" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="840" height="200" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="60" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">Hagyományos mód: az adatok áthaladnak az LLM-en (nem hatékony)</text><rect width="80" height="24" x="770" y="65" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="810" y="77" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✗ Inefficient</text><rect width="130" height="60" x="60" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="125" y="118" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">felhasználó</text><text x="125" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">&quot;Hány ember van osztályonként?&quot;</text><line x1="190" x2="210" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="130" height="60" x="215" y="100" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="280" y="118" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LLM</text><text x="280" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">generálás SQL</text><line x1="345" x2="365" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="130" height="60" x="370" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="435" y="118" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DB</text><text x="435" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">végrehajtás</text><text x="435" y="154" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">lekérdezés</text><line x1="500" x2="520" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="130" height="60" x="525" y="100" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="590" y="118" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">LLM</text><text x="590" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">olvasás</text><text x="590" y="154" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">5000 lines</text><line x1="655" x2="675" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="130" height="60" x="680" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="745" y="118" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">felhasználó</text><text x="745" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">szöveg</text><text x="745" y="154" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">leírás</text><rect width="760" height="30" x="60" y="175" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="70" y="190" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Probléma: az LLM adatmásolása hibára hajlamos · sok tokent fogyaszt · nagy a késleltetés</text><line x1="30" x2="850" y1="265" y2="265" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><rect width="840" height="280" x="20" y="275" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="60" y="298" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">artefaktum mód: az adatok közvetlenül a frontendhez kerülnek (hatékony)</text><rect width="80" height="24" x="770" y="285" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="12"/><text x="810" y="297" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ hatékony</text><rect width="250" height="120" x="40" y="315" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="165" y="335" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Az LLM csak kódot generál</text><rect width="230" height="92" x="50" y="345" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="58" y="358" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">build_artifact(</text><text x="58" y="372" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">type=&quot;sql&quot;,</text><text x="58" y="386" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">code=&quot;SELECT dept,</text><text x="58" y="400" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">COUNT(*) as cnt</text><text x="58" y="414" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">FROM employees</text><text x="58" y="428" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">GROUP BY dept&quot;)</text><line x1="290" x2="340" y1="380" y2="380" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="250" height="120" x="340" y="315" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="465" y="335" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">A frontend közvetlenül végrehajtja</text><rect width="230" height="75" x="350" y="348" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="358" y="360" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">┌────────┬──────┐</text><text x="358" y="372" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">│ dept │ cnt │</text><text x="358" y="384" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">├────────┼──────┤</text><text x="358" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">│ R&amp;D Dept │ 42 │</text><text x="358" y="408" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">│ Marketing Dept │ 28 │</text><text x="358" y="420" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">└────────┴──────┘</text><line x1="590" x2="640" y1="380" y2="380" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="210" height="120" x="640" y="315" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="745" y="335" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Vizualizációs artefaktum</text><text x="745" y="355" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Második artefaktum:</text><rect width="190" height="60" x="650" y="365" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="658" y="380" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">build_artifact(</text><text x="658" y="394" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">type=&quot;chart&quot;,</text><text x="658" y="408" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">code=&quot;bar(data)&quot;)</text><rect width="520" height="45" x="180" y="450" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="465" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Adatfolyam: DB → frontend → vizualizáció (teljesen megkerüli az LLM-et)</text><text x="440" y="483" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Az LLM csak a kódgenerálásért felel, az adatátvitelért nem</text><path fill="none" stroke="#999" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah-light)" d="M 465,435 Q 605.0,460.0 745,435"/></svg>