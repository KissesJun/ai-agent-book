gzített formátumot ad; a következő lépésnek ez kell, nem az érvelés</text><text x="42" y="466" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Laza csatolás</text><text x="270" y="466" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">Erősebb termékmenedzser cserélhető lenni; a PRD-formátum mellett a további folyamat változatlan</text><text x="42" y="490" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Nincs menedzser</text><text x="270" y="490" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Vezérlés a DAG mentén: termékmenedzser→architekt→projektmenedzser→mérnök→QA</text><text x="42" y="514" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Kivételcsatorna</text><text x="270" y="514" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">QA-hiba → modulonkénti hibajelentés a mérnöknek → iteratív javítás</text></svg>