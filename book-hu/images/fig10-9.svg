d</text><rect width="134" height="30" x="378" y="223" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="445" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">docs/tasks.md</text><line x1="530" x2="542" y1="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="150" height="230" x="542" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="617" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Mérnök ×3</text><text x="550" y="97" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Input: tasks.md + design.md</text><rect width="134" height="68" x="550" y="113" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="556" y="127" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">kimenet:</text><text x="556" y="143" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="start">A modul: felhasználói szolgáltatás</text><text x="556" y="159" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="start">B modul: rendelési szolgáltatás</text><text x="556" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="start">C modul: fizetési szolgáltatás</text><rect width="134" height="30" x="550" y="223" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="617" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">src/*.py</text><line x1="702" x2="714" y1="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="150" height="230" x="714" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="789" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">QA-mérnök</text><text x="722" y="97" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Input: src/ + PRD.md</text><rect width="134" height="68" x="722" y="113" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="728" y="127" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">kimenet:</text><text x="728" y="143" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Egységtesztek (pytest)</text><text x="728" y="159" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Integrációs tesztek (API)</text><text x="728" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Hibajelentés → mérnök</text><rec