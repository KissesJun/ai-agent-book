<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="350" height="280" x="20" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="195" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Javaslattevő ágens</text><text x="40" y="110" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Bemenet: tanulmány/tartalom</text><rect width="330" height="24" x="30" y="125" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="38" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">paper.pdf → Extract sections/arguments/figures</text><text x="40" y="168" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Kimenet: Slidev Markdown</text><rect width="330" height="138" x="30" y="182" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="40" y="199" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">---</text><text x="40" y="213" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">layout: two-cols</text><text x="40" y="227" fill="#333" dominan