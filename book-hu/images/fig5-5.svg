 sans-serif" font-size="14" font-weight="normal" text-anchor="middle">slidev export --minden-dia</text><text x="685" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">→ slide-01.png, slide-02.png ...</text><text x="520" y="192" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">2. lépés: felülvizsgálat látási LLM-mel</text><rect width="330" height="108" x="520" y="208" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="528" y="222" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Felülvizsgálati szempontok:</text><text x="528" y="238" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✓ A szöveg túllépi a határt</text><text x="528" y="254" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✓ Túl zsúfolt elrendezés</text><text x="528" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✓ Megfelelő képméret</text><text x="528" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✗ Slide 3: A szöveg túlnyúlik a jobb oszlopon</text><text x="528" y="302" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✗ Slide 7: Túl sűrű tartalom</text><line x1="370" x2="508" y1="200" y2="150" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="439" y="165" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsof