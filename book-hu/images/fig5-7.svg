<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="250" height="160" x="20" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="145" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">① napló gyűjtés</text><rect width="230" height="122" x="30" y="98" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="38" y="112" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">trajectory_001.json:</text><text x="38" y="126" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:</text><text x="38" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&quot;Rendelés lemondása #12345&quot;}</text><text x="38" y="154" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">{&quot;role&quot;:&quot;assistant&quot;,</text><text x="38" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&quot;tool_call&quot;:&quot;cancel_order&quot;}</text><text x="38" y="182" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">{&quot;role&quot;:&quot;tool&quot;,&quot;result&quot;:</text><text x="38" y="196" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&quot;ERROR: no insurance&quot;}</text><text x="38" y="210" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">→ Az ágens nem tájékoztatta a felhasználót az okról</text><line x1="270" x2="310" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="160" x="310" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">② LLM elemzés</text><text x="320" y="100" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Bemenet: nyomkövetés + architektúradokumentum + PRD</text><text x="320" y="128" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Elemzési dimenziók:</text><text x="320" y="142" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">- Megfelel-e a végrehajtási folyamat az elvárásoknak</text><text x="320" y="156" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- Helyesek-e az eszközhívások</text><text x="320" y="170" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- Megfelelő-e a hibakezelés</text><text x="320" y="184" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">- Kielégítő-e a felhasználói élmény</text><text x="320" y="212" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">→ Az eltérő lépés és modul megkeresése</text><line x1="570" x2="610" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="250" height="160" x="610" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="735" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">③ strukturált jelentés</text><rect width="230" height="108" x="620" y="98" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="628" y="112" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Problémajelentés:</text><text x="628" y="126" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Prioritás: P1 (ügyfélvesztési kockázat)</text><text x="628" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Modul: cancellation_handler</text><text x="628" y="154" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Leírás: a lemondási hiba után nincs magyarázat erre:</text><text x="628" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">az ok és az alternatívák ismertetése a felhasználóval</text><text x="628" y="182" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Javaslat: a hiba okának magyarázata</text><text x="628" y="196" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">and guidance to purchase insurance</text><line x1="440" x2="440" y1="220" y2="260" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="370" height="160" x="60" y="260" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="245" y="282" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">④ Regression Teszteset generálás</text><rect width="350" height="150" x="70" y="298" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="78" y="312" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">def test_cancel_no_insurance():</text><text x="78" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;&quot;&quot;Trajectory #001, Round 3-5&quot;&quot;&quot;</text><text x="78" y="340" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start"># Replay: Felhasználói kéréss cancellation of economy class</text><text x="78" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">resp = agent.run(</text><text x="78" y="368" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;Rendelés lemondása #12345&quot;)</text><text x="78" y="382" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># Ellenőrzés: magyarázza el az okot</text><text x="78" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;insurance&quot; in resp.text</text><text x="78" y="410" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;alternative&quot; in resp.text</text><text x="78" y="424" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># Ellenőrzés: ne csak hibát adjon vissza</text><text x="78" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;ERROR&quot; not in resp.text</text><line x1="430" x2="470" y1="340" y2="340" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="380" height="160" x="470" y="260" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="660" y="282" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⑤ GitHub probléma Auto-létrehozás</text><rect width="360" height="136" x="480" y="298" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="488" y="312" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">gh issue create \</text><text x="488" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--title &quot;P1: Cancellation failure lacks</text><text x="488" y="340" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">user guidance&quot; \</text><text x="488" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--body &quot;**Problem**: Agent directly</text><text x="488" y="368" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">returns an error after cancel_order</text><text x="488" y="382" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">failure, without explaining the reason...</text><text x="488" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">**Trajectory**: #001 Round 3-5</text><text x="488" y="410" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">**Test**: test_cancel_...&quot; \</text><text x="488" y="424" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--assignee @backend-team</text><rect width="680" height="44" x="100" y="445" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="460" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Végponttól végpontig Automation: napló → elemzés → jelentés → teszt → probléma</text><text x="440" y="480" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">integráció és GitHub segítségével MCP · teszt keretrendszer auto-replay ellenőrzés</text><text x="440" y="530" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Reduce manual diagnosis költség innen óra → perc</text></svg>