<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>6-5. ábra: Szinkron interfészkompatibilitás és a modell natív aszinkron működése</title><desc>Az előző kompatibilitási megoldásban a futtatókörnyezet rendezi az események belépési sorrendjét, hogy a szinkron interfészű modell aszinkron feladatokban vehessen részt. A másik út az, hogy a modell eleve értse ezt a ritmust: dolgozhasson máson az eszköz futása alatt, és módosíthassa a későbbi munkát új felhasználói követelmények alapján. A GPT-6 Astra már támogatja az aszinkron eszközhívást (Async tool calling) és a kör közbeni iránymódosítást (Mid-turn steering), ami ezt a változást példázza (6-5. ábra).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="40" y="53" class="title">Kompatibilitás: a futtatókörnyezet ütemezi az aszinkron munkát</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" text-anchor="middle">A feladat a háttérben fut</text><text x="155" y="122" class="small" text-anchor="middle" style="font-size:13.94px">Egyértelműen befejezetlen állapot</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" text-anchor="middle">Új események fogadása</text><text x="440" y="122" class="small" text-anchor="middle" style="font-size:14.2px">Sor, megszakítás vagy párhuzam</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" text-anchor="middle" style="font-size:15.47px">A modell folytatja a feladatot</text><text x="725" y="122" class="small" text-anchor="middle">Bemenetek szinkron körökben</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="40" y="218" class="title">Natív aszinkron működés: várakozás és menet közbeni változások megértése</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" text-anchor="middle" style="font-size:16.15px">Hosszú lekérdezés indítása</text><text x="155" y="290" class="small" text-anchor="middle">Találkozóhelyszínek keresése</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" text-anchor="middle">Munka várakozás közben</text><text x="440" y="290" class="small" text-anchor="middle">Napirend és előkészületi lista</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" text-anchor="middle">Döntés az eredmény után</text><text x="725" y="290" class="small" text-anchor="middle">Helyszínek és valós adatok</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" text-anchor="middle" style="font-size:14.53px">Új felhasználói követelmények</text><text x="155" y="390" class="small" text-anchor="middle">Keret vagy létszám változik</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" text-anchor="middle">Kész munka megőrzése</text><text x="440" y="390" class="small" text-anchor="middle" style="font-size:14.53px">Új feltételek felvétele a feladatba</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" text-anchor="middle" style="font-size:14.2px">Következő lépések módosítása</text><text x="725" y="390" class="small" text-anchor="middle" style="font-size:14.64px">Adatok és frissítések egyesítése</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" text-anchor="middle" style="font-size:16.41px">A modell megérti a változást és tervez; a futtatókörnyezet kezeli az eszközöket, állapotot és forrásokat.</text><text x="440" y="506" class="small" text-anchor="middle">Az üzenetfogadáshoz helyes feladatfolytatás és műveletvezérlés is kell.</text></svg>