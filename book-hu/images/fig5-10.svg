<svg xmlns="http://www.w3.org/2000/svg" width="880" height="515" viewBox="0 40 880 515" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="180" height="50" x="60" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Por → csillag</text><text x="150" y="92" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Fizikai törvények</text><line x1="240" x2="255" y1="80" y2="80" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="50" x="260" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Csillag → bolygó</text><text x="350" y="92" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Gravitációs összeállás</text><line x1="440" x2="455" y1="80" y2="80" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="50" x="460" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Bolygó → élet</text><text x="550" y="92" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">DNS-önreplikáció</text><line x1="640" x2="655" y1="80" y2="80" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="180" height="50" x="660" y="55" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="750" y="72" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Élet → ágens</text><text x="750" y="92" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Kódalapú önindítás</text><line x1="30" x2="850" y1="120" y2="120" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><rect width="400" height="70" x="30" y="135" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="230" y="155" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">DNS-önreplikáció: véletlen mutáció + természetes kiválasztás</text><text x="230" y="177" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle">Nem érti önmagát · nem képes célzott módosításra · 3,7 milliárd év vak próbálkozás</text><rect width="400" height="70" x="450" y="135" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="650" y="155" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Ágensindítás: kódmegértés + célzott tervezés</text><text x="650" y="177" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Érti saját működését · célirányosan alkot · örökli a bevált gyakorlatokat</text><rect width="390" height="295" x="20" y="225" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="215" y="248" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Eredeti ágens (saját kód)</text><rect width="175" height="124" x="30" y="265" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="118" y="285" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Rendszerprompt</text><text x="40" y="308" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="start">Ön légitársasági ügyfélszolgálati ágens</text><text x="40" y="326" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Lemondási szabályok: ...</text><text x="40" y="344" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Átadási szabályok: ...</text><text x="40" y="362" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Eszköz: cancel_order</text><rect width="185" height="124" x="215" y="265" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="308" y="285" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Ágens-keretrendszer kódja</text><text x="225" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">loop:</text><text x="225" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">msg = llm(ctx)</text><text x="225" y="344" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">if tool_call:</text><text x="225" y="362" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">exec(tool)</text><rect width="370" height="54" x="30" y="400" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="215" y="419" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Eszközdefiníció + MCP-integráció + üzenetformátum</text><text x="215" y="438" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Ellenőrzött, kiváló minőségű megvalósítás</text><text x="440" y="215" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Másolás + módosítás</text><line x1="410" x2="470" y1="375" y2="375" stroke="#333" stroke-widt