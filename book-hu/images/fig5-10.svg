ize="14" font-weight="bold" text-anchor="middle">Örökölt keretrendszerkód</text><text x="680" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">loop:</text><text x="680" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">msg = llm(ctx)</text><text x="680" y="344" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">if tool_call:</text><text x="680" y="362" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">exec(tool)</text><rect width="370" height="54" x="480" y="400" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="665" y="419" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Új eszközök + új üzleti logika</text><text x="665" y="438" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">A teljes architektúra örökölt → garantált minőség</text></svg>