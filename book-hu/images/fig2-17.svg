lvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Intelligens tömörítés</text><line x1="152" x2="165" y1="359" y2="359" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="339" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Lekérdezés + kontextus → célzott tömörítés</text><line x1="500" x2="513" y1="359" y2="359" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="339" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">40K tok · 3,0% · 7 kör</text><rect width="130" height="26" x="30" y="387" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="400" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">⑤ Tudatos + hivatkozás</text><rect width="120" height="40" x="30" y="417" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Intelligens + követhető</text><line x1="152" x2="165" y1="437" y2="437" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="417" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="437" fill="#333" dominant-baseline="central" font-family="Arial,