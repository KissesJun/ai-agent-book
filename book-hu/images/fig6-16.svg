<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 40 780 480" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker><marker id="ah-sm" markerHeight="4" markerWidth="6" orient="auto" refX="6" refY="2"><polygon fill="#999" points="0 0 6 2 0 4"/></marker></defs><rect width="210" height="50" x="55" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="73" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">RT-2</text><rect width="194" height="50" x="63" y="115" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="160" y="133" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Látás-nyelvi gerinc</text><text x="160" y="151" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">Nagy léptékben előtréningezett VLM</text><rect width="194" height="50" x="63" y="173" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="160" y="191" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Diszkrét műveletek</text><text x="160" y="209" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle"