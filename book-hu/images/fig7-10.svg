="75" x="260" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Befejezési idő</text><text x="350" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">25 lépések × 25 műveletek</text><text x="350" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">= 625 vezérlés lépések</text><rect width="180" height="75" x="460" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Generalization képesség</text><text x="550" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">kereszt-position/orientation</text><text x="550" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">/Megjelenési változat</text><rect width="180" height="75" x="660" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="750" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Szimulációból valós környezetbe</text><text x="750" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Doménrandomizáció</text><text x="750" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">→ valós migration</text></svg>