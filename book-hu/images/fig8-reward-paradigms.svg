<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 40 880 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="640" height="35" x="120" y="55" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="135" y="73" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">Feladat: Xfinity-csomag módosítása | Probléma: hiányzó számlázási cím + hibás csomagnév</text><rect width="190" height="36" x="37.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="132.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Skalár</text><rect width="190" height="210" x="37.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="47.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">7.2 points</text><text x="47.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="47.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">No diagnostic capability</text><text x="47.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Don&apos;t know where</text><text x="47.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Good/bad</text><line x1="229.5" x2="240.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="242.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="337.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Félig skalár</text><rect width="190" height="210" x="242.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="252.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Jó: megtalálta a helyes telefonszámot</text><text x="252.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Jó: sikeresen befejezte a módosítást</text><text x="252.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Hiba: hiányzó számlázási cím</text><text x="252.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Hiba: hibás csomagnév</text><text x="252.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="252.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Overall: 6.5 points</text><text x="252.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">(bizonyítékalapú, de durva felbontású)</text><line x1="434.5" x2="445.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="447.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="542.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">vektor</text><rect width="190" height="230" x="447.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="457.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Információlekérés pontossága: 9/10</text><text x="457.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">Információgyűjtés teljessége: 6/10</text><text x="457.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Kommunikáció folyékonysága: 8/10</text><text x="457.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Kommunikáció pontossága: 7/10</text><text x="457.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">A felhasználói kommunikáció pontossága: 10/10</text><text x="457.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Overall Feladatbefejezés 8/10</text><text x="457.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="457.5" y="343" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Precisely locate shortcomings ↑</text><line x1="639.5" x2="650.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="652.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="747.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Generatív</text><rect width="190" height="210" x="652.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="662.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">1. nézőpont: pontos eszközhasználat</text><text x="662.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">2. nézőpont: hiányos információgyűjtés</text><text x="662.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">3. nézőpont: a csomagnév átfogalmazása</text><text x="662.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Hiba → közvetlen ismétlés javaslata</text><text x="662.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">4. nézőpont: az információfelhasználás nincs elmagyarázva</text><text x="662.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">5. nézőpont: az ágensidentitás nincs ellenőrizve</text><text x="662.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">→ 6-7 analysis perspectives</text><line x1="132.5" x2="747.5" y1="368" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="388" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Növekvő információmennyiség →</text><rect width="760" height="55" x="60" y="405" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="80" y="420" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="15" text-anchor="start">DeepSeek-kísérlet: 8 generatív kiértékelés 6–7 elemzési nézőpontot ad</text><text x="80" y="442" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Jelentős javulás az átfogó, több szempontú diagnózis után (szemléltetés) — egyetlen hibából is tanulható javítási irány</text><rect width="760" height="45" x="60" y="475" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="498" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Generatív jutalom: a gazdag környezeti visszajelzés tanulható tudássá alakítása több száz próbálkozás és hiba nélkül</text></svg>