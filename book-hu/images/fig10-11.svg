soft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Nappal: a beszéd elemzése</text><line x1="390" x2="687" y1="132" y2="178" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="720" height="95" x="30" y="355" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="375" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Információ-hozzáférés: a bíró szerep szerint szűri a kontextust</text><text x="50" y="399" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="start">vérfarkas:</text><text x="132" y="399" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ally IDs + éjszaka talk + nyilvános beszéd</text><text x="400" y="399" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="start">Látnok:</text><text x="485" y="399" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">saját ellenőrzés eredmények + nyilvános beszéd</text><text x="50" y="423" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="start">Boszorkány:</text><text x="132" y="423" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" te