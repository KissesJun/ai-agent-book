<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 40 780 480" style="background:#fff"><defs><marker id="ah" markerHeight="4" markerWidth="5" orient="auto" refX="5" refY="2"><polygon fill="#333" points="0 0 5 2 0 4"/></marker><marker id="ah-light" markerHeight="4" markerWidth="5" orient="auto" refX="5" refY="2"><polygon fill="#999" points="0 0 5 2 0 4"/></marker></defs><rect width="350" height="310" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="32" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Q-tanulás ágens</text><rect width="350" height="310" x="410" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="422" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">LLM ágens（Kimi K2）</text><rect width="320" height="48" x="35" y="85" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="109" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">állapot: hash kód 0x3A7F</text><text x="195" y="123" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">szoba=2, items=[kulcs], doors=[N]</text><rect width="320" height="48" x="35" y="147" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="171" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Q-table lookup</text><text x="195" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">145 állapotok × 7 műveletek = 1015 entries</text><line x1="195" x2="195" y1="135" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="35" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">ε-greedy kiválasztás</text><text x="195" y="247" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ε=0.1 → 90% optimal / 10% véletlen</text><line x1="195" x2="195" y1="197" y2="207" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="35" y="271" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="295" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Művelet: integer ID</text><text x="195" y="309" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">a=3 → &quot;Mozgás északra&quot; (nincs szemantikai megértés)</text><line x1="195" x2="195" y1="259" y2="269" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="85" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="109" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">állapot: Természetes nyelv leírás</text><text x="585" y="123" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">&quot;A raktárban piros kulcs van, az északi ajtó zárva&quot;</text><rect width="320" height="48" x="425" y="147" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="171" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">LLM-érvelés + tapasztalat generálása buffer</text><text x="585" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">érvelés: &quot;Door locked → szükséges kulcs → get kulcs&quot;</text><line x1="585" x2="585" y1="135" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">szemantikai Művelet kiválasztás</text><text x="585" y="247" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Fogalmi kapcsolatok megértése, célirányos döntések</text><line x1="585" x2="585" y1="197" y2="207" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="271" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="295" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Művelet: strukturált instruction</text><text x="585" y="309" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">{&quot;action&quot;:&quot;pick_up&quot;,&quot;target&quot;:&quot;red_key&quot;}</text><line x1="585" x2="585" y1="259" y2="269" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="720" height="105" x="30" y="382" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="404" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Teljesítmény-összehasonlítás</text><text x="200" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Metric</text><text x="380" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Q-tanulás</text><text x="600" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LLM ágens</text><text x="200" y="442" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Első teljesítés</text><text x="380" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~7000 epizód</text><text x="600" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">epizód 1 (17 lépések)</text><text x="200" y="460" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">végső Győzelmi arány</text><text x="380" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">100% (után 10K ep)</text><text x="600" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~90% (instant)</text><text x="200" y="478" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Computation költség</text><text x="380" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">10 sec / 10K ep</text><text x="600" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1-2 min / epizód</text></svg>