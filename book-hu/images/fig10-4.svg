elentés</text><text x="390" y="452" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Menedzseri nézet: egy ágens meghívása = egy eszköz meghívása (kérés küldése → válasz fogadása)</text></svg>