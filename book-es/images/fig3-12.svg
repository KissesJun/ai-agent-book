s-serif" font-size="16" font-weight="normal" text-anchor="middle">Observar: ¿basta la información?</text><line x1="840" x2="858" y1="260" y2="260" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="858" y1="260" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="840" y1="196" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="862" y="228" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">No</text><line x1="685" x2="685" y1="302" y2="320" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="550" y="322" fill="#dfeef0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="344" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sí → sintetizar la respuesta</text></svg>