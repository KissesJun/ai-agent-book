<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 40 780 480" style="background:#fff"><defs><marker id="ah" markerHeight="4" markerWidth="5" orient="auto" refX="5" refY="2"><polygon fill="#333" points="0 0 5 2 0 4"/></marker><marker id="ah-light" markerHeight="4" markerWidth="5" orient="auto" refX="5" refY="2"><polygon fill="#999" points="0 0 5 2 0 4"/></marker></defs><rect width="350" height="310" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="32" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Agente de Q-learning</text><rect width="350" height="310" x="410" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="422" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Agente LLM (Kimi K2)</text><rect width="320" height="48" x="35" y="85" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="109" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Estado: código hash 0x3A7F</text><text x="195" y="123" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">room=2, items=[key], doors=[N]</text><rect width="320" height="48" x="35" y="147" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="171" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Búsqueda en la tabla Q</text><text x="195" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">145 estados × 7 acciones = 1015 entradas</text><line x1="195" x2="195" y1="135" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="35" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Selección ε-greedy</text><text x="195" y="247" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ε=0.1 → 90% óptimo / 10% aleatorio</text><line x1="195" x2="195" y1="197" y2="207" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="35" y="271" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="295" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Acción: ID entero</text><text x="195" y="309" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">a=3 → &quot;mover al norte&quot; (sin comprensión semántica)</text><line x1="195" x2="195" y1="259" y2="269" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="85" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="109" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Estado: descripción en lenguaje natural</text><text x="585" y="123" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">&quot;El almacén tiene una llave roja, la puerta norte está cerrada&quot;</text><rect width="320" height="48" x="425" y="147" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="171" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Razonamiento del LLM + búfer de experiencia</text><text x="585" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">Razonamiento: &quot;Puerta bloqueada → se necesita llave → obtener llave&quot;</text><line x1="585" x2="585" y1="135" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Selección semántica de acciones</text><text x="585" y="247" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">Comprender relaciones conceptuales, tomar decisiones fundamentadas</text><line x1="585" x2="585" y1="197" y2="207" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="271" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="295" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Acción: instrucción estructurada</text><text x="585" y="309" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">{&quot;action&quot;:&quot;pick_up&quot;,&quot;target&quot;:&quot;red_key&quot;}</text><line x1="585" x2="585" y1="259" y2="269" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="720" height="105" x="30" y="382" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="404" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Comparación de rendimiento</text><text x="200" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Métrica</text><text x="380" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Q-learning</text><text x="600" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Agente LLM</text><text x="200" y="442" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Primer completamiento</text><text x="380" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~7000 episodios</text><text x="600" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Episodio 1 (17 pasos)</text><text x="200" y="460" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Tasa de victorias final</text><text x="380" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">100% (después de 10K ep)</text><text x="600" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~90% (instantáneo)</text><text x="200" y="478" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Costo computacional</text><text x="380" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">10 s / 10K ep</text><text x="600" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1-2 min / episodio</text></svg>