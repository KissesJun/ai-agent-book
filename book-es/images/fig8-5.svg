<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 40 780 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="280" height="45" x="20" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="82.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agente de RL clásico</text><rect width="270" height="45" x="490" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="625" y="82.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agente LLM</text><rect width="280" height="44" x="20" y="115" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="115" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="137" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Conjunto finito cerrado (6 acciones)</text><text x="500" y="137" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Abierto: lenguaje natural + herramientas</text><text x="395" y="137" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Espacio de acciones</text><rect width="280" height="44" x="20" y="163" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="163" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="185" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Sin prioris, desde política aleatoria</text><text x="500" y="185" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Conocimiento preentrenado + priores</text><text x="395" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Conocimiento previo</text><rect width="280" height="44" x="20" y="211" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="211" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Codificación hash: state_id=0x3A7F</text><text x="500" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Semántico: &quot;llave roja en el almacén&quot;</text><text x="395" y="233" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Representación del estado</text><rect width="280" height="44" x="20" y="259" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="259" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Recompensa escalar: R ∈ {-1, 0, +5, +50}</text><text x="500" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Recompensa + retroalimentación + autorreflexión</text><text x="395" y="281" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Señal de aprendizaje</text><rect width="280" height="44" x="20" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">Sin pensamiento interno (puramente reactivo)</text><text x="500" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">El pensamiento como acción especial (CoT)</text><text x="395" y="329" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Capacidad de pensamiento</text><rect width="280" height="44" x="20" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="377" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Nuevas reglas → reentrenamiento completo</text><text x="500" y="377" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Transferencia zero/few-shot entre tareas</text><text x="395" y="377" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Capacidad de generalización</text><rect width="280" height="44" x="20" y="403" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="403" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">~10000 episodios / 10 segundos</text><text x="500" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">~1 episodio / 2 minutos</text><text x="395" y="425" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Eficiencia de muestreo</text></svg>