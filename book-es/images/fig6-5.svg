<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>Figura 6-5: Compatibilidad síncrona y asincronía nativa del modelo</title><desc>En la solución anterior, el entorno de ejecución ordena los eventos entrantes para que un modelo con interfaz síncrona participe en tareas asíncronas. Otra vía permite que el propio modelo comprenda ese ritmo: puede realizar otros trabajos mientras una herramienta se ejecuta y ajustar lo que hará después cuando el usuario añade requisitos. GPT-6 Astra ya admite llamadas asíncronas a herramientas (Async tool calling) y orientación durante el turno (Mid-turn steering), reflejando este cambio (Figura 6-5).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="40" y="53" class="title">Compatibilidad: el entorno de ejecución organiza la asincronía</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" text-anchor="middle">Tarea en segundo plano</text><text x="155" y="122" class="small" text-anchor="middle">Estado pendiente explícito</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" text-anchor="middle">Recibir nuevos eventos</text><text x="440" y="122" class="small" text-anchor="middle" style="font-size:14.57px">Encolar, interrumpir o paralelizar</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" text-anchor="middle">El modelo continúa</text><text x="725" y="122" class="small" text-anchor="middle">Entradas en turnos síncronos</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="40" y="218" class="title">Asincronía nativa: comprender esperas y cambios durante la tarea</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" text-anchor="middle">Iniciar una consulta lenta</text><text x="155" y="290" class="small" text-anchor="middle" style="font-size:14.47px">Buscar lugares para una reunión</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" text-anchor="middle" style="font-size:16.87px">Trabajar durante la espera</text><text x="440" y="290" class="small" text-anchor="middle" style="font-size:14.2px">Preparar agenda y lista de tareas</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" text-anchor="middle" style="font-size:16.8px">Decidir con los resultados</text><text x="725" y="290" class="small" text-anchor="middle" style="font-size:13.44px">Comparar lugares con datos reales</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" text-anchor="middle" style="font-size:16.08px">El usuario añade requisitos</text><text x="155" y="390" class="small" text-anchor="middle" style="font-size:14.47px">Cambios de presupuesto o aforo</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" text-anchor="middle" style="font-size:14.21px">Conservar el trabajo terminado</text><text x="440" y="390" class="small" text-anchor="middle" style="font-size:14.82px">Incorporar los nuevos requisitos</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" text-anchor="middle" style="font-size:15.3px">Ajustar acciones posteriores</text><text x="725" y="390" class="small" text-anchor="middle" style="font-size:14.93px">Integrar datos y actualizaciones</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" text-anchor="middle">Modelo: entender cambios y ajustar planes. Entorno de ejecución: herramientas, estado y fuentes.</text><text x="440" y="506" class="small" text-anchor="middle">Recibir mensajes también exige reanudar tareas y controlar las acciones correctamente.</text></svg>