<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">De la experiencia al conocimiento: las trayectorias son evidencia, los documentos son la unidad reutilizable</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle" style="font-size:17px">Trayectoria original</text><text x="106" y="139" class="t s" text-anchor="middle" style="font-size:11.5px">Acciones, resultados, entorno</text><text x="106" y="160" class="t s" text-anchor="middle">Evidencia inmutable</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle" style="font-size:17px">Evaluación puntual</text><text x="299" y="139" class="t s" text-anchor="middle">Éxito, fallo, etiquetas</text><text x="299" y="160" class="t s" text-anchor="middle" style="font-size:9px">Conserva la ubicación de la evidencia</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle" style="font-size:11.5px">Comparación entre trayectorias</text><text x="500" y="128" class="t s" text-anchor="middle">Agrupar tareas similares</text><text x="500" y="151" class="t s" text-anchor="middle">Contrastar éxito y fallo</text><text x="500" y="174" class="t s" text-anchor="middle" style="font-size:10.5px">Extraer patrones comunes y límites</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle" style="font-size:16px">Documento Markdown</text><text x="709" y="128" class="t s" text-anchor="middle" style="font-size:11px">Escenarios aplicables y estrategia</text><text x="709" y="151" class="t s" text-anchor="middle" style="font-size:9.5px">Excepciones, zonas vedadas y fuentes</text><text x="709" y="174" class="t s" text-anchor="middle" style="font-size:13px">Versión y fecha de validación</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle" style="font-size:14.5px">Recuperación y uso</text><text x="902" y="130.88" class="t s" text-anchor="middle" style="font-size:14px">Cargar bajo demanda</text><text x="902" y="147.12" class="t s" text-anchor="middle" style="font-size:14px">en tareas nuevas</text><text x="902" y="151.3" class="t s" text-anchor="middle" style="font-size:15px">Sigue generando</text><text x="902" y="168.7" class="t s" text-anchor="middle" style="font-size:15px">retroalimentación</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">La nueva evidencia revisa, acota o retira el conocimiento antiguo</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="332" class="t s" text-anchor="middle" style="font-size:9px">Comparte la infraestructura de extracción y recuperación del capítulo 3; aquí se añade la evaluación de trayectorias y el ciclo de mejora</text></svg>