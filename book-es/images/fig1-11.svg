<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 40 820 460" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="500" height="380" x="80" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="330" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">while not done:</text><rect width="420" height="60" x="120" y="100" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="115" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">① Pensar (Razonamiento)</text><rect width="400" height="28" x="130" y="125" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="140" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">&quot;Resultados insuficientes, se requieren más búsquedas&quot;</text><rect width="420" height="60" x="120" y="175" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">② Actuar</text><rect width="400" height="28" x="130" y="200" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="140" y="215" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">web_search(&quot;Técnicas de entrenamiento RL Agentes 2025&quot;)</text><line x1="330" x2="330" y1="162" y2="173" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="420" height="60" x="120" y="250" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">③ Observar</text><rect width="400" height="28" x="130" y="275" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="140" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tool_result: &quot;Encontrados 3 artículos relevantes...&quot;</text><line x1="330" x2="330" y1="237" y2="248" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><path fill="none" stroke="#999" stroke-width="2" marker-end="url(#ah-light)" d="M 540,280 Q 500.0,200.0 540,120"/><text x="520" y="190" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">Continuar bucle</text><rect width="190" height="190" x="610" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="622" y="78" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Condiciones de salida</text><text x="620" y="100" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">① Tarea completada</text><text x="620" y="132" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="start">② final_answer invocado</text><text x="620" y="164" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">③ Sin respuesta de herramienta</text><text x="620" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">④ Máximo de rondas alcanzado</text><text x="620" y="228" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">⑤ Límite de errores superado</text><rect width="500" height="70" x="80" y="360" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="330" y="380" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ejemplo de ejecución práctica: corrección SWE-bench</text><text x="330" y="405" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Buscar código → Hallar error → Editar → Probar → Fallo → Editar → Éxito</text><text x="330" y="425" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">(5 rondas de iteración, 12 llamadas a herramientas)</text><line x1="330" x2="330" y1="312" y2="358" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="330" y="325" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">done = True</text></svg>