<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 40 780 440" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="260" height="130" x="10" y="120" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="140" y="145" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agente (Explorador)</text><text x="140" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Política π: Observar estado →</text><text x="140" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Seleccionar acción (mover/recoger/atacar)</text><text x="140" y="225" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ε-greedy: 90% óptimo, 10% aleatorio</text><rect width="260" height="130" x="510" y="120" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="640" y="145" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Entorno (Mundo Laberinto)</text><text x="640" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle">5 habitaciones · Llave/Puerta/Guardia</text><text x="640" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Transición: P(Storage|Hall,East)=1.0</text><text x="640" y="225" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">R(Derrotar guardia)=+50, R(Mover)=0</text><line x1="272" x2="508" y1="150" y2="150" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="136" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Acción A(t) = &quot;Move Este&quot;</text><line x1="508" x2="272" y1="235" y2="235" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="258" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Estado S(t+1) + Recompensa R(t+1)</text><text x="390" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Trayectoria: S(0), A(0), R(1), S(1), A(1), R(2), ...</text><rect width="134" height="70" x="35" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="102" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">S(0): Vestíbulo de entrada</text><text x="102" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">A(0): Este</text><text x="102" y="393" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">R(1): 0</text><line x1="171" x2="181" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="179" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="246" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">S(1): Almacén</text><text x="246" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">A(1): Tomar llave</text><text x="246" y="393" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">R(2): +5</text><line x1="315" x2="325" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="323" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">S(2): Almacén</text><text x="390" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">A(2): Norte</text><text x="390" y="393" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">R(3): 0</text><line x1="459" x2="469" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="467" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="534" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">S(3): Sala de guardia</text><text x="534" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle">A(3): Fabricar espada de plata</text><text x="534" y="393" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">R(4): +10</text><line x1="603" x2="613" y1="373" y2="373" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="134" height="70" x="611" y="340" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="678" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">S(4): Sala de guardia</text><text x="678" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">A(4): Atacar</text><text x="678" y="393" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">R(5): +50</text><text x="390" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Objetivo: Maximizar la recompensa acumulada G = R(1) + γR(2) + γ²R(3) + ... (γ=0.99)</text></svg>