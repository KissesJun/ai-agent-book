<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 40 780 300" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="190" height="185" x="30" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="125" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">① Captura</text><rect width="140" height="90" x="55" y="95" fill="#fff" stroke="#999" stroke-width="1.5" rx="4"/><text x="125" y="115" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" text-anchor="middle">Pantalla de la computadora</text><rect width="106" height="14" x="72" y="128" fill="#e8e8e8" stroke="none" rx="2"/><rect width="80" height="14" x="72" y="146" fill="#e8e8e8" stroke="none" rx="2"/><rect width="50" height="12" x="72" y="164" fill="#d0d0d0" stroke="none" rx="2"/><text x="125" y="205" fill="#999" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">Escritorio / navegador / aplicación</text><text x="125" y="225" fill="#999" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">Capturar tras estabilizarse</text><line x1="220" x2="283" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="252" y="118" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">Captura</text><rect width="190" height="185" x="295" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="bold" text-anchor="middle">② Inferencia del modelo</text><text x="390" y="103" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Entrada</text><text x="390" y="121" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">Captura + instrucción</text><line x1="310" x2="470" y1="137" y2="137" stroke="#999" stroke-dasharray="4 3" stroke-width="1"/><text x="390" y="155" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Salida</text><text x="390" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" text-anchor="middle">Pensamiento: «El buscador está en el centro»</text><text x="390" y="195" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="middle">Acción: click(512, 250)</text><text x="390" y="215" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="middle">Acción: type(&quot;weather&quot;)</text><line x1="485" x2="548" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="517" y="118" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">Acción</text><rect width="190" height="185" x="560" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="655" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">③ Ejecutar acción</text><text x="655" y="108" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Herramienta de ejecución</text><text x="655" y="130" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">xdotool / Playwright</text><line x1="575" x2="735" y1="147" y2="147" stroke="#999" stroke-dasharray="4 3" stroke-width="1"/><text x="655" y="165" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">Ratón: mover, clicar, arrastrar</text><text x="655" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">Teclado: escribir, usar atajos</text><text x="655" y="205" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle">Desplazamiento: cuatro direcciones</text><text x="655" y="225" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" text-anchor="middle">Espera: respuesta de la interfaz</text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 655 240 L 655 280 L 125 280 L 125 248"/><text x="390" y="298" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle">④ La interfaz cambia → esperar estabilidad → siguiente captura</text><text x="390" y="325" fill="#999" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">Escenario típico: completar un formulario de varios pasos puede requerir 10–20 ciclos</text></svg>