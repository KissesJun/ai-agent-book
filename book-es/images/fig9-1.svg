<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="28" class="t h" text-anchor="middle">Evolución continua: de la experiencia de ejecución a una nueva versión del Agent</text><rect width="150" height="90" x="25" y="72" class="box" rx="8"/><text x="100" y="105" class="t h" text-anchor="middle">Ejecutar tarea</text><text x="100" y="127.04" class="t s" text-anchor="middle" style="font-size:12px">Interacción con usuarios,</text><text x="100" y="140.96" class="t s" text-anchor="middle" style="font-size:12px">entorno y herramientas</text><rect width="150" height="90" x="205" y="72" class="box" rx="8"/><text x="280" y="105" class="t h" text-anchor="middle" style="font-size:14px">Registrar trayectoria</text><text x="280" y="125.59" class="t s" text-anchor="middle" style="font-size:14.5px">Acciones, resultados</text><text x="280" y="142.41" class="t s" text-anchor="middle" style="font-size:14.5px">y retroalimentación</text><rect width="150" height="90" x="385" y="72" class="accent" rx="8"/><text x="460" y="105" class="t h" text-anchor="middle" style="font-size:18.5px">Formar señales</text><text x="460" y="134" class="t s" text-anchor="middle" style="font-size:10px">Resultado · Proceso · Calidad</text><rect width="230" height="124" x="565" y="55" class="accent" rx="8"/><text x="680" y="84" class="t h" text-anchor="middle" style="font-size:13px">Generar actualizaciones candidatas</text><rect width="92" height="27" x="582" y="102" fill="#fff" stroke="#66808e" rx="5"/><rect width="92" height="27" x="686" y="102" fill="#fff" stroke="#66808e" rx="5"/><rect width="92" height="27" x="582" y="139" fill="#fff" stroke="#66808e" rx="5"/><rect width="92" height="27" x="686" y="139" fill="#fff" stroke="#66808e" rx="5"/><text x="628" y="121" class="t s" text-anchor="middle" style="font-size:12.5px">Conocimiento</text><text x="732" y="121" class="t s" text-anchor="middle" style="font-size:13px">Instrucciones</text><text x="628" y="158" class="t s" text-anchor="middle">Programas</text><text x="732" y="158" class="t s" text-anchor="middle">Parámetros</text><rect width="150" height="90" x="825" y="72" class="box" rx="8"/><text x="900" y="105" class="t h" text-anchor="middle" style="font-size:16.5px">Validar y publicar</text><text x="900" y="126.17" class="t s" text-anchor="middle" style="font-size:13.5px">Regresión, despliegue</text><text x="900" y="141.83" class="t s" text-anchor="middle" style="font-size:13.5px">gradual y reversión</text><path d="M175 117 H203" class="line"/><path d="M355 117 H383" class="line"/><path d="M535 117 H563" class="line"/><path d="M795 117 H823" class="line"/><path stroke-dasharray="7 5" d="M900 162 V238 H100 V164" class="line"/><text x="500" y="265" class="t h" text-anchor="middle">El nuevo Agent entra en la siguiente ronda</text><text x="500" y="294" class="t s" text-anchor="middle">Solo las actualizaciones que cambian el comportamiento posterior y superan la validación constituyen evolución continua</text><line x1="260" x2="740" y1="318" y2="318" stroke="#9aa8af" stroke-width="1"/></svg>