<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 40 780 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="380" height="78" x="50" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Pensamiento en texto₁</text><text x="65" y="98" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">&quot;Necesito resolver la ecuación x²+2x-8=0</text><text x="65" y="114" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Primero resolver con sympy...&quot;</text><line x1="240" x2="240" y1="139" y2="145" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="146" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="164" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Generación de código₁</text><text x="65" y="178" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&lt;code&gt;</text><text x="65" y="188" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">from sympy import *</text><text x="65" y="198" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">x=symbols(&quot;x&quot;)</text><text x="65" y="208" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">solve(x**2+2*x-8,x)</text><text x="65" y="218" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&lt;/code&gt;</text><line x1="240" x2="240" y1="225" y2="231" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="232" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="250" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Retroalimentación del sandbox₁</text><text x="65" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">&lt;interpreter&gt;</text><text x="65" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">[-4, 2]</text><text x="65" y="302" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">&lt;/interpreter&gt;</text><line x1="240" x2="240" y1="311" y2="317" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="318" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="336" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Pensamiento en texto₂</text><text x="65" y="356" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">&quot;Solución: x=-4 o x=2</text><text x="65" y="372" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Verificación: 2²+2×2-8=0 ✓&quot;</text><line x1="240" x2="240" y1="397" y2="403" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="404" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="422" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Respuesta final</text><text x="65" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">\boxed{-4, 2}</text><rect width="280" height="130" x="470" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="610" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">SandboxFusion</text><text x="610" y="105" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">128 trabajadores paralelos</text><text x="610" y="125" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Ejecución en sandbox de Python</text><text x="610" y="148" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">sympy/numpy/scipy</text><text x="610" y="168" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Control de tiempo de espera + límite de memoria</text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 432,185 Q 432.5041728782917,142.81000344028462 468,120"/><rect width="40" height="24" x="422" y="126" fill="#fff" rx="3"/><text x="441.252" y="137.655" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">Código</text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 468,150 Q 469.1695571333223,216.2033393123934 432,271"/><rect width="40" height="24" x="440" y="192" fill="#fff" rx="3"/><text x="459.585" y="203.352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">Resultado</text><rect width="280" height="260" x="470" y="220" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="610" y="242" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Bucle de entrenamiento de PPO</text><text x="480" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Modelo base: Qwen2.5-32B</text><text x="480" y="283" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Arranque en frío de SFT: ~1 hora</text><text x="480" y="301" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Entrenamiento de RL: ~9 días / 400 pasos</text><text x="480" y="337" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">Por paso: 32 preguntas × 16 candidatos = 512</text><text x="480" y="355" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Promedio de 7-9 rondas de interacción/respuesta</text><text x="480" y="391" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Precisión de AIME 2024:</text><text x="480" y="409" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Línea base de SFT: 25%</text><text x="480" y="427" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Tras 110 pasos: 52%</text><text x="480" y="445" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Tras 400 pasos: 67%</text></svg>