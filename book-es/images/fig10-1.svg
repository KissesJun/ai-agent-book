<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 40 780 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="350" height="480" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="32" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="start">Contexto compartido (colaboración heredada)</text><g transform="translate(0 4)"><rect width="320" height="100" x="35" y="82" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Fase 1: Analista de requisitos</text><text x="47" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">sys: &quot;Tu responsabilidad es comprender completamente los requisitos...&quot;</text><text x="47" y="132" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">herramientas: [ask_question, save_req]</text><text x="47" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">usuario: &quot;Escribe un script de análisis de CSV&quot;</text><text x="47" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">agente: &quot;¿Qué tipos de archivos deben procesarse?&quot;</text><g transform="translate(0 10)"><rect width="320" height="100" x="35" y="184" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Fase 2: Ingeniero de software</text><text x="47" y="216" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">sys: &quot;Escribir código basado en los requisitos confirmados...&quot;</text><text x="47" y="234" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">herramientas: [write_file, execute_code]</text><text x="47" y="252" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agente: write_file(&quot;analyze.py&quot;, ...)</text><text x="47" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agente: execute_code(&quot;python test.py&quot;)</text></g><g transform="translate(0 20)"><rect width="320" height="100" x="35" y="286" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Fase 3: Revisor de código</text><text x="47" y="318" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">sys: &quot;Revisar la calidad y seguridad del código...&quot;</text><text x="47" y="336" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">herramientas: [run_linter, run_tests]</text><text x="47" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agente: run_linter → 2 advertencias</text><text x="47" y="372" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agente: approve_code()</text></g><g transform="translate(0 38)"><rect width="320" height="28" x="35" y="388" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="195" y="402" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">↑ Todas las fases comparten el mismo historial de conversación</text><text x="195" y="434" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Traza completa</text><text x="195" y="456" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ Expansión rápida del contexto</text></g></g><rect width="350" height="480" x="410" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="422" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="start">Sin contexto compartido (colaboración aislada)</text><g transform="translate(0 4)"><rect width="320" height="80" x="425" y="82" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Agente de glosario</text><text x="437" y="114