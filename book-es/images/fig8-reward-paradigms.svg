<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 40 880 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="640" height="35" x="120" y="55" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="135" y="73" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Tarea: Cambio de plan de Xfinity | Problema: Falta dirección de facturación + Nombre de plan incorrecto</text><rect width="190" height="36" x="37.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="132.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Escalar</text><rect width="190" height="210" x="37.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="47.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">7.2 puntos</text><text x="47.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="47.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Sin capacidad de diagnóstico</text><text x="47.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Sin saber dónde</text><text x="47.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Bueno/malo</text><line x1="229.5" x2="240.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="242.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="337.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Semiescalar</text><rect width="190" height="210" x="242.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="252.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Bueno: Se encontró el número de teléfono correcto</text><text x="252.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Bueno: Cambio completado con éxito</text><text x="252.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Incorrecto: Falta la dirección de facturación</text><text x="252.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Incorrecto: Nombre de plan incorrecto</text><text x="252.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="252.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">General: 6.5 puntos</text><text x="252.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">(Basado en evidencia pero de grano grueso)</text><line x1="434.5" x2="445.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="447.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="542.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Vector</text><rect width="190" height="230" x="447.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="457.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Precisión de la consulta de información 9/10</text><text x="457.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Completitud de la recopilación de información 6/10</text><text x="457.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Fluidez de la comunicación 8/10</text><text x="457.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Precisión de la comunicación 7/10</text><text x="457.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Precisión de comunicación con el usuario 10/10</text><text x="457.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Completación general de tareas 8/10</text><text x="457.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="457.5" y="343" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Localizar con precisión las deficiencias ↑</text><line x1="639.5" x2="650.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="652.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="747.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Generativo</text><rect width="190" height="210" x="652.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="662.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Perspectiva 1: Uso preciso de herramientas</text><text x="662.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Perspectiva 2: Recopilación de información faltante</text><text x="662.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Perspectiva 3: Parafraseo del nombre del plan</text><text x="662.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Error → Sugerir repetición directa</text><text x="662.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Perspectiva 4: No explicar el uso de la información</text><text x="662.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Perspectiva 5: No verificar la identidad del agente</text><text x="662.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">→ 6-7 perspectivas de análisis</text><line x1="132.5" x2="747.5" y1="368" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="388" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Información creciente →</text><rect width="760" height="55" x="60" y="405" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="80" y="420" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13.5" text-anchor="start">Experimento de DeepSeek: 8 evaluaciones generativas producen 6-7 perspectivas analíticas</text><text x="80" y="442" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Mejora significativa tras un diagnóstico exhaustivo desde múltiples ángulos (ilustrativo) — aprendizaje de la dirección de mejora a partir de un solo fallo</text><rect width="760" height="45" x="60" y="475" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="498" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Recompensa generativa: transformar la rica retroalimentación del entorno en conocimiento aprendible sin cientos de ensayos y errores</text></svg>