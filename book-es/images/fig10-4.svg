<svg xmlns="http://www.w3.org/2000/svg" width="780" height="455" viewBox="0 40 780 455" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="300" height="100" x="240" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agente gestor</text><text x="390" y="106" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">Comprensión de la tarea → Descomposición → Programación → Síntesis</text><text x="390" y="126" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Conjunto de herramientas: [call_agent_A, call_agent_B,</text><text x="390" y="142" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">call_agent_C, search, write_file]</text><rect width="210" height="120" x="50" y="240" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Subagente A</text><text x="155" y="280" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Rol: Recopilación de datos</text><text x="155" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Buscar documentación técnica</text><text x="155" y="320" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Extraer información clave</text><rect width="50" height="20" x="205" y="335" fill="#999" stroke="#333" stroke-width="2" rx="10"/><text x="230" y="345" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Paso 1</text><line x1="290" x2="155" y1="162" y2="238" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="262" x2="283" y1="300" y2="300" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="210" height="120" x="285" y="240" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Subagente B</text><text x="390" y="280" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Rol: Análisis y procesamiento</text><text x="390" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Comparar y analizar datos</text><text x="390" y="320" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Generar informe estadístico</text><rect width="50" height="20" x="440" y="335" fill="#999" stroke="#333" stroke-width="2" rx="10"/><text x="465" y="345" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Paso 2</text><line x1="390" x2="390" y1="162" y2="238" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="497" x2="518" y1="300" y2="300" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="210" height="120" x="520" y="240" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="625" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Subagente C</text><text x="625" y="280" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Rol: Generación de informes</text><text x="625" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Escribir informe final</text><text x="625" y="320" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Formatear salida</text><rect width="50" height="20" x="675" y="335" fill="#999" stroke="#333" stroke-width="2" rx="10"/><text x="700" y="345" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Paso 3</text><line x1="490" x2="625" y1="162" y2="238" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="720" height="95" x="30" y="380" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="398" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Flujo de ejecución secuencial</text><text x="50" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">El gestor llama a A</text><text x="155" y="420" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ A devuelve datos</text><text x="260" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ El gestor pasa a B</text><text x="380" y="420" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ B devuelve análisis</text><text x="485" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ El gestor pasa a C</text><text x="610" y="420" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ C devuelve informe</text><text x="390" y="452" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle">Perspectiva del gestor: Llamar a un agente = Llamar a una herramienta (enviar solicitud → recibir respuesta)</text></svg>