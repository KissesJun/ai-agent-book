<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 40 820 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="65" x="50" y="100" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="122.75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">LLM Gerador</text><text x="150" y="142.25" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Gerar tradução inicial</text><rect width="200" height="45" x="50" y="185" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="150" y="208" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="middle">&quot;Sono de primavera, alheio à aurora&quot; → tradução v1</text><line x1="150" x2="150" y1="167" y2="183" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="65" x="330" y="100" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="430" y="122.425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="normal" text-anchor="middle">LLM Avaliador</text><text x="430" y="142.575" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="normal" text-