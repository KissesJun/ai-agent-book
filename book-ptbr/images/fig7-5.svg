<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="250" height="150" x="30" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Rubrica</text><line x1="40" x2="270" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="45" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Correção Factual: Essencial</text><text x="45" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Coerência Lógica: Importante</text><text x="45" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Detecção de Alucinação: Veto ⚠</text><text x="45" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Completude: Importante</text><rect width="250" height="150" x="315" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Resposta Candidata</text><line x1="325" x2="555" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="330" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Saída do Agente:</text><text x="330" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">&quot;Reembolso processado, $150 serão creditados em</text><text x="330" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">3-5 dias úteis.&quot;</text><rect width="250" height="150" x="600" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="725" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Solução de Referência (Opcional)</text><line x1="610" x2="840" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="615" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Resposta Padrão / Pontos de Pontuação:</text><text x="615" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">Deve incluir o valor do reembolso</text><text x="615" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Deve incluir o prazo de crédito</text><text x="615" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Não pode prometer uma data específica</text><line x1="155" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="440" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="725" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="50" x="280" y="245" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="262" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Modelo Julgador (GPT-5 / Gemini 2.5)</text><text x="440" y="282" fill="#ccc" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Avaliação heterogênea multifonte para evitar viés de mesma origem</text><line x1="440" x2="440" y1="295" y2="325" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="760" height="180" x="60" y="328" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="350" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Saída de avaliação estruturada</text><rect width="360" height="125" x="75" y="370" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="85" y="390" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Correção Factual</text><text x="250" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="390" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="start">Valor e prazo estão ambos corretos</text><text x="85" y="414" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Completude</text><text x="250" y="414" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3/4</text><text x="300" y="414" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="start">Falta explicação do método de reembolso</text><text x="85" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Detecção de Alucinação</text><text x="250" y="438" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">APROVADO</text><text x="300" y="438" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="start">Nenhuma informação falsa</text><text x="85" y="462" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Coerência Lógica</text><text x="250" y="462" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="462" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Relação causal clara</text><rect width="345" height="125" x="460" y="370" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="632" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Estratégia de Agregação de Pontuação</text><text x="475" y="415" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Média ponderada: Σ(peso × pontuação da dimensão)</text><text x="475" y="437" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">Veto: Alucinação=REPROVADO → pontuação total=0</text><text x="475" y="459" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Multi-julgador: mediana de 3 julgadores</text><text x="475" y="481" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Sinalização de caso extremo: divergência &gt;2 pontos → revisão humana</text></svg>