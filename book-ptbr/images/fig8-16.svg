<svg xmlns="http://www.w3.org/2000/svg" width="850" height="390" viewBox="0 40 850 390" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="160" height="80" x="80" y="120" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="140" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">modelo de política πθ</text><text x="160" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">gerar ação:</text><text x="160" y="178" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">pensar/pesquisar/codificar/responder</text><rect width="160" height="60" x="320" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="90" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">execução da ferramenta</text><text x="400" y="110" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">chamada de API / sandbox de código</text><rect width="160" height="60" x="320" y="200" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="400" y="220" fill="#333" dominant-baseline="central" font-fa