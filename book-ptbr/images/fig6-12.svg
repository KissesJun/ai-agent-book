<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 40 780 420" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="340" height="180" x="35" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="205" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ferramenta de operação de GUI (computer)</text><text x="47" y="98" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Mouse:</text><text x="105" y="98" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">mouse_move · left/right/middle_click</text><text x="105" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">double/triple_click · left_click_drag</text><text x="105" y="130" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">left_mouse_down/up</text><text x="47" y="152" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Teclas:</text><text x="105" y="152" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">type (caractere por caractere, intervalo de 12ms)</text><text x="105" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">key (tecla de combinação) · hold_key (pressão longa)</text><text x="47" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Scroll:</text><text x="105" y="190" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">scroll em 4 direções + teclas modificadoras</text><rect width="345" height="100" x="400" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="572" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ações de percepção</text><text x="412" y="98" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Tela:</text><text x="470" y="98" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">screenshot → escalar para a resolução de treinamento</text><text x="412" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Cursor:</text><text x="470" y="120" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">cursor_position → (x, y)</text><text x="412" y="142" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Espera:</text><text x="470" y="142" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">wait → esperar a interface estabilizar</text><rect width="345" height="65" x="400" y="175" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="572" y="195" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Execução de comando (bash)</text><text x="412" y="213" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Term:</text><text x="470" y="213" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">sessão bash persistente · timeout de 120s</text><text x="470" y="229" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Detecção de string sentinela concluída</text><rect width="340" height="65" x="35" y="255" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="205" y="275" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Edição de arquivo (str_replace_editor)</text><text x="47" y="293" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Ops:</text><text x="105" y="293" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">view · create · str_replace</text><text x="105" y="309" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">insert · undo_edit</text><rect width="345" height="65" x="400" y="255" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="572" y="275" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Mecanismo de escalonamento de coordenadas</text><text x="572" y="295" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">resolução real ↔ resolução de treinamento (XGA/WXGA/FWXGA)</text><text x="572" y="310" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">reduzir screenshot → inferência do modelo → ampliar coordenadas → executar xdotool</text><rect width="710" height="110" x="35" y="335" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="357" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Fluxo de execução típico: preencher formulário</text><text x="123" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">① screenshot</text><text x="123" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Capturar página</text><line x1="186" x2="196" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="259" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">② Inferência do modelo</text><text x="259" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Localizar campo de nome</text><line x1="322" x2="332" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="387" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">③ mouse_move</text><text x="387" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Mover para (324, 156)</text><line x1="458" x2="468" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="531" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">④ left_click</text><text x="531" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Clicar para obter o foco</text><line x1="594" x2="604" y1="391" y2="391" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><text x="667" y="385" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⑤ type</text><text x="667" y="403" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">&quot;John Smith&quot;</text><text x="390" y="430" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Cada ação tem intervalo de 2-5s (screenshot-reconhecer-pensar-clicar em série), de 1/3 a 1/5 da velocidade humana</text></svg>