<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="60" x="20" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="120" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Entrada do usuário</text><text x="120" y="100" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">&quot;Quero reservar um voo para Pequim&quot;</text><line x1="220" x2="260" y1="90" y2="90" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="140" x="260" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="390" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Análise por LLM → Gerar código do formulário</text><rect width="240" height="140" x="270" y="90" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="276" y="103" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;form id=&quot;clarify&quot;&gt;</text><text x="276" y="116" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;input type=&quot;text&quot;</text><text x="276" y="129" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">name=&quot;from&quot; label=&quot;Cidade de partida&quot;/&gt;</text><text x="276" y="142" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;input type=&quot;date&quot;</text><text x="276" y="155" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">name=&quot;depart&quot; label=&quot;Data de partida&quot;/&gt;</text><text x="276" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;select name=&quot;type&quot;&gt;</text><text x="276" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;option&gt;Somente ida&lt;/option&gt;</text><text x="276" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;option&gt;Ida e volta&lt;/option&gt;</text><text x="276" y="207" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;/select&gt;</text><text x="276" y="220" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&lt;/form&gt;</text><line x1="520" x2="560" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="300" height="200" x="560" y="55" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="710" y="75" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Interface do formulário renderizado</text><text x="580" y="95" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Cidade de Partida</text><rect width="180" height="24" x="660" y="83" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="95" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Xangai</text><text x="580" y="135" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Data de Partida</text><rect width="180" height="24" x="660" y="123" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="135" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">2025-08-15</text><text x="580" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Tipo de Viagem</text><rect width="180" height="24" x="660" y="163" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="175" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Ida e Volta ▾</text><text x="580" y="215" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Data de Retorno</text><rect width="180" height="24" x="660" y="203" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="668" y="215" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">2025-08-22</text><rect width="80" height="26" x="660" y="238" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="700" y="251" fi