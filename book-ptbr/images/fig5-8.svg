</text><text x="350" y="468" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">search_flights(from=&apos;Xangai&apos;, to=&apos;Pequim&apos;, depart=&apos;2025-08-15&apos;, ...)</text><rect width="250" height="140" x="20" y="280" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="145" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Comparação: Texto Simples vs Formulário</text><text x="30" y="318" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">Perguntas e Respostas em Texto: 10 rodadas de diálogo</text><text x="30" y="331" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">P1: Cidade de partida? R: Xangai</text><text x="30" y="344" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">P2: Data? R: 15 de agosto</text><text x="30" y="357" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">P3: Somente ida ou ida e volta? ...</text><text x="30" y="383" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Formulário Dinâmico: 1 envio</text><text x="30" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Todas as informações coletadas de uma vez</text><text x="30" y="409" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Lógica em cascata tratada automaticamente</text><text x="440" y="510" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Código do formulário gerado dinamicamente pelo LLM → Lógica em cascata: exibe automaticamente a data de retorno quando &quot;Ida e Volta&quot; é selecionado</text></svg>