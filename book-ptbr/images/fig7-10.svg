<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 40 940 480" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-compact" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="220" height="250" x="20" y="65" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="130" y="88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Observação multimodal</text><rect width="190" height="42" x="35" y="105" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Câmera de cabeça</text><text x="130" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">224×224 RGB</text><rect width="190" height="42" x="35" y="160" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Câmera do pulso esquerdo</text><text x="130" y="193" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">224×224 RGB</text><rect width="190" height="42" x="35" y="215" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="230" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Câmera do pulso direito</text><text x="130" y="248" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">224×224 RGB</text><rect width="190" height="30" x="35" y="275" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="45" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Vetor de estado das juntas de 14 dimensões</text><rect width="310" height="250" x="280" y="65" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="435" y="88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Modelo Vision-Language-Action (VLA)</text><rect width="280" height="50" x="295" y="105" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Codificador de visão</text><text x="450" y="145" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">SigLIP → tokens visuais</text><line x1="435" x2="435" y1="157" y2="168" stroke="#333" stroke-width="2" marker-end="url(#ah-compact)"/><rect width="280" height="50" x="295" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Modelo de linguagem</text><text x="450" y="210" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Backbone Llama 2 7B</text><line x1="435" x2="435" y1="222" y2="233" stroke="#333" stroke-width="2" marker-end="url(#ah-compact)"/><rect width="280" height="78" x="295" y="235" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="435" y="252" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Decodificador de ação</text><text x="435" y="272" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">→ Vetor de controle contínuo de 14 dimensões</text><text x="435" y="298" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="middle">Action chunking: gera 25 ações consecutivas de uma vez</text><line x1="240" x2="278" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="240" x2="278" y1="257" y2="257" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="32" x="300" y="345" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="430" y="361" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Instrução: &quot;Coloque a lata na panela&quot;</text><line x1="430" x2="430" y1="345" y2="315" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="230" height="250" x="690" y="65" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="805" y="88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Motor de física SAPIEN</text><rect width="200" height="55" x="705" y="105" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="805" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Robô de dois braços</text><text x="805" y="145" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="middle">7 DOF cada = ação de 14 dimensões</text><rect width="200" height="55" x="705" y="175" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="805" y="195" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Randomização do ambiente</text><text x="805" y="215" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Posição 60cm / orientação ±22,5°</text><rect width="200" height="55" x="705" y="245" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="805" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Detecção de colisão + simulação de física</text><text x="805" y="285" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Corpo rígido / corpo macio / atrito</text><line x1="590" x2="688" y1="220" y2="220" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="640" y="210" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">Ação</text><line x1="690" x2="592" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="640" y="120" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">Observação</text><line x1="20" x2="920" y1="385" y2="385" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="408" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Métricas de avaliação</text><rect width="180" height="75" x="60" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Taxa de sucesso</text><text x="150" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Lata dentro da panela</text><text x="150" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">e não caiu</text><rect width="180" height="75" x="260" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Tempo de conclusão</text><text x="350" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">25 passos × 25 ações</text><text x="350" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">= 625 passos de controle</text><rect width="180" height="75" x="460" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Capacidade de generalização</text><text x="550" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Entre posições/orientações</text><text x="550" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">/Variação de aparência</text><rect width="180" height="75" x="660" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="750" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sim-to-Real</text><text x="750" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Randomização de domínio</text><text x="750" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">→ Migração para o real</text></svg>