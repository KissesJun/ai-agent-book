<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>Figura 6-5: Compatibilidade síncrona e assincronia nativa do modelo</title><desc>Na abordagem anterior, o runtime ordena a entrada de eventos para que um modelo com interface síncrona participe de tarefas assíncronas. Outra abordagem permite que o próprio modelo compreenda esse ritmo: trabalhar em outras partes enquanto uma ferramenta executa e ajustar o trabalho seguinte quando o usuário acrescenta requisitos. O GPT-6 Astra já oferece chamadas assíncronas a ferramentas (Async tool calling) e orientação durante o turno (Mid-turn steering), exemplificando essa mudança (Figura 6-5).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="40" y="53" class="title">Compatibilidade: o runtime organiza o trabalho assíncrono</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" text-anchor="middle">Tarefa em segundo plano</text><text x="155" y="122" class="small" text-anchor="middle">Estado pendente explícito</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" text-anchor="middle">Receber novos eventos</text><text x="440" y="122" class="small" text-anchor="middle" style="font-size:13.25px">Enfileirar, interromper ou paralelizar</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" text-anchor="middle">O modelo continua</text><text x="725" y="122" class="small" text-anchor="middle">Entradas em turnos síncronos</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="40" y="218" class="title">Assincronia nativa: compreender esperas e mudanças durante a tarefa</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" text-anchor="middle" style="font-size:16.94px">Iniciar consulta demorada</text><text x="155" y="290" class="small" text-anchor="middle" style="font-size:14.93px">Buscar locais para uma reunião</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" text-anchor="middle" style="font-size:16.43px">Trabalhar enquanto espera</text><text x="440" y="290" class="small" text-anchor="middle" style="font-size:14.7px">Preparar pauta e lista de tarefas</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" text-anchor="middle" style="font-size:16.79px">Decidir com os resultados</text><text x="725" y="290" class="small" text-anchor="middle" style="font-size:14.1px">Comparar locais com dados reais</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" text-anchor="middle" style="font-size:14.7px">Usuário acrescenta requisitos</text><text x="155" y="390" class="small" text-anchor="middle" style="font-size:13.25px">Mudanças de orçamento ou público</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" text-anchor="middle" style="font-size:14.26px">Preservar o trabalho concluído</text><text x="440" y="390" class="small" text-anchor="middle">Incorporar novos requisitos</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" text-anchor="middle">Ajustar ações seguintes</text><text x="725" y="390" class="small" text-anchor="middle">Integrar dados e atualizações</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" text-anchor="middle">Modelo: entender mudanças e rever planos. Runtime: ferramentas, estado e fontes de eventos.</text><text x="440" y="506" class="small" text-anchor="middle">Receber mensagens também exige retomar tarefas e controlar ações corretamente.</text></svg>