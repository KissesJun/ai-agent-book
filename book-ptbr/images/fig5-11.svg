<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 40 880 570" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="280" height="55" x="30" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="170" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Requisitos do usuário</text><text x="170" y="98" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="middle">&quot;Criar um Agente de atendimento ao cliente para reembolsos de e-commerce&quot;</text><line x1="170" x2="170" y1="115" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="840" height="230" x="20" y="145" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="168" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Meta-Agente (Agente de Codificação)</text><rect width="190" height="170" x="35" y="185" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="205" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">① Ler código de referência</text><text x="45" y="228" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="star