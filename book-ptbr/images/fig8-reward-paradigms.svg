<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 40 880 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="640" height="35" x="120" y="55" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="135" y="73" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">Tarefa: troca de plano Xfinity | Problema: endereço de cobrança ausente + nome do plano incorreto</text><rect width="190" height="36" x="37.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="132.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Escalar</text><rect width="190" height="210" x="37.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="47.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">7,2 pontos</text><text x="47.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="47.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Sem capacidade diagnóstica</text><text x="47.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Não se sabe onde</text><text x="47.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Bom/ruim</text><line x1="229.5" x2="240.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="242.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="337.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Semiescalar</text><rect width="190" height="210" x="242.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="252.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Bom: encontrou o número de telefone correto</text><text x="252.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Bom: concluiu a alteração com sucesso</text><text x="252.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Ruim: endereço de cobrança ausente</text><text x="252.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Ruim: nome do plano incorreto</text><text x="252.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="252.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Geral: 6,5 pontos</text><text x="252.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">(Evidências, mas grosseiro)</text><line x1="434.5" x2="445.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="447.5" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="542.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Vetor</text><rect width="190" height="230" x="447.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="457.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Precisão na consulta de info 9/10</text><text x="457.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Completude na coleta de info 6/10</text><text x="457.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Fluência na comunicação 8/10</text><text x="457.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Precisão na comunicação 7/10</text><text x="457.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Precisão na comunicação com o usuário 10/10</text><text x="457.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">Conclusão geral da tarefa 8/10</text><text x="457.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="457.5" y="343" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Aponta deficiências com precisão ↑</text><line x1="639.5" x2="650.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="652.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="747.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Generativo</text><rect width="190" height="210" x="652.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="662.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Persp. 1: Uso preciso de ferramentas</text><text x="662.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Persp. 2: Coleta de informações ausente</text><text x="662.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Persp. 3: Parafraseia nome do plano</text><text x="662.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Erro → Sugerir repetição direta</text><text x="662.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">Persp. 4: Não explica uso da informação</text><text x="662.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Persp. 5: Não verifica identidade do agente</text><text x="662.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">→ 6-7 perspectivas de análise</text><line x1="132.5" x2="747.5" y1="368" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="388" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Aumento de informação →</text><rect width="760" height="55" x="60" y="405" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="80" y="420" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14.5" text-anchor="start">experimento DeepSeek: 8 avaliações generativas produzem 6-7 perspectivas analíticas</text><text x="80" y="442" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">melhoria significativa após diagnóstico abrangente sob múltiplos ângulos (ilustrativo) — aprendendo a direção da melhoria a partir de uma única falha</text><rect width="760" height="45" x="60" y="475" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="498" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">recompensa generativa: transformando o rico feedback do ambiente em conhecimento aprendível sem centenas de tentativas e erros</text></svg>