<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 40 900 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="370" height="46" x="30" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="55" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">RAG não agêntico</text><text x="215" y="81" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Etapa fixa pré-definida, recuperação única</text><rect width="270" height="44" x="80" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="132" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Consulta do usuário</text><line x1="215" x2="215" y1="156" y2="174" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="80" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Recuperação (única)</text><line x1="215" x2="215" y1="220" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="80" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Geração direta de resposta</text><rect width="370" height="46" x="500" y="44" fill="#eef3f6" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="55" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">RAG agêntico</text><text x="685" y="81" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Recuperação iterativa orientada por ReAct</text><rect width="310" height="44" x="530" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="132" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Pensar: analisar necessidades, determinar palavras-chave</text><line x1="685" x2="685" y1="156" y2="174" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="310" height="44" x="530" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Agir: chamar ferramenta de recuperação</text><line x1="685" x2="685" y1="220" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="310" height="44" x="530" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Observar: a informação é suficiente?</text><line x1="840" x2="858" y1="260" y2="260" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="858" y1="260" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="840" y1="196" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="862" y="228" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="start">Não</text><line x1="685" x2="685" y1="302" y2="320" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="550" y="322" fill="#dfeef0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="344" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sim → Sintetizar Resposta</text></svg>