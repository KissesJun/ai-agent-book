<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 40 820 460" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="40" y="60" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" text-anchor="start">messages: [</text><rect width="480" height="32" x="50" y="78" fill="#e8e8e8" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="94" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">{ role: &quot;system&quot;, content: &quot;Você é um agente de atendimento ao cliente de telecom...&quot; }</text><rect width="480" height="32" x="50" y="114" fill="#e8e8e8" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="130" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">tools: [cancel_plan, query_records, ...]</text><path fill="none" stroke="#999" stroke-width="1.5" d="M 540,78 C 555,78 555,114 560,123 C 555,132 555,146 540,146"/><text x="570" y="112" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start">fixo</text><text x="570" y="130" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="start">(KV Cache)</text><rect width="480" height="32" x="50" y="154" fill="#dce9f5" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="170" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;user&quot;, content: &quot;Me ajude a cancelar meu plano&quot; }</text><rect width="480" height="32" x="50" y="190" fill="#d9f0d9" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="206" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;assistant&quot;, tool_calls: [cancel_plan(...)] }</text><rect width="480" height="32" x="50" y="226" fill="#fdf6e3" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="242" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">{ role: &quot;tool&quot;, content: &quot;Este plano tem um período de contrato...&quot; }</text><rect width="480" height="32" x="50" y="262" fill="#d9f0d9" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="278" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">{ role: &quot;assistant&quot;, content: &quot;Seu plano está dentro do período de contrato...&quot; }</text><text x="280" y="306" fill="#999" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">... mais turnos de conversa ...</text><rect width="480" height="32" x="50" y="322" fill="#dce9f5" stroke="#999" stroke-width="1.5" rx="4"/><text x="62" y="338" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">{ role: &quot;user&quot;, content: &quot;Então me ajude a verificar meu histórico de chamadas&quot; }</text><text x="570" y="338" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start">acompanhamento do usuário</text><rect width="480" height="48" x="50" y="362" fill="#fff3cd" stroke="#e6a817" stroke-width="2.5" rx="4"/><text x="62" y="380" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="13" text-anchor="start">{ role: &quot;user&quot;, content: &quot;&lt;agent_status&gt;</text><text x="62" y="398" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Chamada 3/3 vezes · TODO: Cancelar plano (em andamento)&lt;/agent_status&gt;&quot; }</text><line x1="570" x2="538" y1="386" y2="386" stroke="#e6a817" stroke-width="2" marker-end="url(#ah)"/><text x="578" y="378" fill="#c9a227" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Inserção do framework do agente</text><text x="578" y="396" fill="#c9a227" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">barra de status do agente</text><text x="40" y="428" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" text-anchor="start">]</text><line x1="50" x2="50" y1="422" y2="450" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="20" height="20" x="60" y="442" fill="#d9f0d9" stroke="#999" stroke-width="1" rx="2"/><text x="88" y="452" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="start">o modelo começa a gerar a partir daqui</text><rect width="720" height="22" x="50" y="472" fill="#f5f5f5" stroke="none" rx="4"/><text x="410" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" text-anchor="middle">← adjacente ao início da geração do modelo, recebe o maior peso de atenção</text></svg>