ont-size="14" font-weight="normal" text-anchor="start">15%</text><text x="390" y="263" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Loss = −Σ log P(x_t | x_1...x_{t−1}) → minimizar a entropia cruzada</text><text x="390" y="332" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Aprendizado de modelo aparentemente simples orientado por objetivo: regras da linguagem → conhecimento de mundo → raciocínio básico</text></svg>