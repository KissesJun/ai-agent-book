<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">transformando experiência em conhecimento: trajetórias brutas são evidência, documentos são a unidade reutilizável</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle">Trajetória bruta</text><text x="106" y="139" class="t s" text-anchor="middle" style="font-size:10.5px">Ações, resultados, ambiente</text><text x="106" y="160" class="t s" text-anchor="middle">Evidência imutável</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle">Avaliação única</text><text x="299" y="139" class="t s" text-anchor="middle">Sucesso, falha, rótulos</text><text x="299" y="160" class="t s" text-anchor="middle" style="font-size:12px">Preserva a localização da evidência</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle" style="font-size:13px">Comparação entre trajetórias</text><text x="500" y="128" class="t s" text-anchor="middle">Agregar tarefas semelhantes</text><text x="500" y="151" class="t s" text-anchor="middle" style="font-size:11.5px">Contrastar sucesso e falha</text><text x="500" y="174" class="t s" text-anchor="middle" style="font-size:10px">Extrair pontos comuns e limites</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle" style="font-size:17.5px">Documento Markdown</text><text x="709" y="128" class="t s" text-anchor="middle" style="font-size:11px">Cenários aplicáveis e estratégia</text><text x="709" y="151" class="t s" text-anchor="middle" style="font-size:11px">Exceções, zonas proibidas, fontes</text><text x="709" y="174" class="t s" text-anchor="middle" style="font-size:13.5px">Versão e horário de verificação</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle" style="font-size:16.5px">Recuperação e uso</text><text x="902" y="139" class="t s" text-anchor="middle" style="font-size:10px">Carregar sob demanda para novas tarefas</text><text x="902" y="160" class="t s" text-anchor="middle" style="font-size:11.5px">Continua produzindo feedback</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">Novas evidências revisam, restringem ou aposentam conhecimento antigo</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="332" class="t s" text-anchor="middle" style="font-size:9.5px">Compartilha a pilha de extração e recuperação com o Capítulo 3; este capítulo acrescenta a avaliação de trajetória e o ciclo de melhoria de comportamento</text></svg>