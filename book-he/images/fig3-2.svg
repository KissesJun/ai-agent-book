<svg xmlns="http://www.w3.org/2000/svg" width="920" height="412" viewBox="0 40 920 412" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="42" x="24" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="124" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Simple Notes</text><rect width="172" height="84" x="38" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="48" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;User email:</text><text x="48" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">john@x.com&quot;</text><text x="124" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Atomic fact · O(1)</text><text x="124" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Extremely low overhead</text><text x="124" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ Relevance lost</text><rect width="200" height="42" x="248" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="348"