al, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">JSON Cards</text><rect width="172" height="84" x="486" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="496" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">work.position</text><text x="496" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">.title = …</text><text x="496" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">(category → key-value)</text><text x="572" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Three-level structure</text><text x="572" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Supports partial updates</text><text x="572" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ Rigid classification</text><rect width="200" height="42" x="696" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="796" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Advanced JSON Cards</text><rect width="172" height="84" x="710" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="720" y="150" fill="#333" dominant-baseline="central" font-family="'