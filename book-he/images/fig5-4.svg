<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 40 900 660" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="168" height="38" x="10" y="55" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="94" y="74" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Diff + Apply Model</text><rect width="168" height="116" x="10" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="16" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">LLM Output Diff Description:</text><text x="16" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- def foo(x):</text><text x="16" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- return x</text><text x="16" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ def foo(x, y=0):</text><text x="16" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ return x + y</text><text x="16" y="202" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">→ Small Model Locates and Applies</text><rect width="160" height="80" x="14" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="94" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Advantage: Separation of</text><text x="94" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Concerns</text><text x="94" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Disadvantage: Minor</text><text x="94" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Deviation Causes</text><text x="94" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Misalignment</text><rect width="168" height="38" x="188" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="272" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Old String → New String</text><rect width="168" height="99" x="188" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="194" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">old: &quot;def foo(x):\n</text><text x="194" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x&quot;</text><text x="194" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">new: &quot;def foo(x, y=0):\n</text><text x="194" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y&quot;</text><text x="194" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">→ Exact String Match Replacement</text><rect width="160" height="80" x="192" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="272" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Advantage: Predictable,</text><text x="272" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Unambiguous</text><text x="272" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Disadvantage: Large</text><text x="272" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Deletions Require Full</text><text x="272" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Output</text><rect width="168" height="38" x="366" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">Line Number Positioning</text><rect width="168" height="99" x="366" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="372" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">Delete lines 42-43, insert:</text><text x="372" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">def foo(x, y=0):</text><text x="372" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y</text><text x="372" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">→ Line Number Specifies Exact Range</text><rect width="160" height="80" x="370" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="450" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Advantage: Efficient for</text><text x="450" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Large Operations</text><text x="450" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Disadvantage: Line</text><text x="450" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Numbers Error-Prone in</text><text x="450" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Long Files</text><rect width="168" height="38" x="544" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="628" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Vim-like Commands</text><rect width="168" height="99" x="544" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="550" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">42G (Jump to line 42)</text><text x="550" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">cw (Replace word)</text><text x="550" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">dd (Delete line)</text><text x="550" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">yy/p (Copy/Paste)</text><text x="550" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">→ Rich editing semantics</text><rect width="160" height="80" x="548" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="628" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Advantage: Efficient</text><text x="628" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">move/reorganize</text><text x="628" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Disadvantage: Weak</text><text x="628" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">models produce more</text><text x="628" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">errors</text><rect width="168" height="38" x="722" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="806" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Head-tail matching</text><rect width="168" height="99" x="722" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="728" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">start: &quot;def foo(x):&quot;</text><text x="728" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">end: &quot; return x&quot;</text><text x="728" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">new: &quot;def foo(x, y=0):</text><text x="728" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y&quot;</text><text x="728" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">→ Only need boundaries to locate</text><rect width="160" height="80" x="726" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="806" y="244.2" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Advantage: Large deletion</text><text x="806" y="258.36" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">without full output</text><text x="806" y="272.52" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Disadvantage: Boundary</text><text x="806" y="286.68" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">combination must be</text><text x="806" y="300.84" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">unique</text><line x1="30" x2="870" y1="331" y2="331" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="450" y="355" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Actual adoption</text><text x="240" y="393" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Old→New</text><rect width="408" height="28" x="250" y="379" fill="#999" stroke="#333" stroke-width="2" rx="3"/><text x="454" y="393" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Claude Code</text><text x="240" y="431" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Line Number Positioning</text><rect width="240" height="28" x="250" y="417" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="370" y="431" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">IDE deep integration scenarios</text><text x="240" y="469" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Diff + Apply</text><rect width="192" height="28" x="250" y="455" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="346" y="469" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Cursor</text><text x="240" y="507" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Head-tail matching</text><rect width="144" height="28" x="250" y="493" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="322" y="507" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Partial custom solutions</text><text x="240" y="545" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Vim commands</text><rect width="72" height="28" x="250" y="531" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="286" y="545" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7" font-weight="normal" text-anchor="middle">Experimental solutions</text></svg>