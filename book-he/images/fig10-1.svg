<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 40 780 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="350" height="480" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="32" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Shared Context (Inherited Collaboration)</text><g transform="translate(0 4)"><rect width="320" height="100" x="35" y="82" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Phase 1: Requirements Analyst</text><text x="47" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">sys: &quot;Your responsibility is to fully understand the requirements...&quot;</text><text x="47" y="132" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [ask_question, save_req]</text><text x="47" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">user: &quot;Write a CSV analysis script&quot;</text><text x="47" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">agent: &quot;What file types need to be processed?&quot;</text><g transform="translate(0 10)"><rect width="320" height="100" x="35" y="184" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="198" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Phase 2: Software Engineer</text><text x="47" y="216" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9.5" text-anchor="start">sys: &quot;Write code based on confirmed requirements...&quot;</text><text x="47" y="234" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [write_file, execute_code]</text><text x="47" y="252" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: write_file(&quot;analyze.py&quot;, ...)</text><text x="47" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: execute_code(&quot;python test.py&quot;)</text></g><g transform="translate(0 20)"><rect width="320" height="100" x="35" y="286" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="43" y="300" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Phase 3: Code Reviewer</text><text x="47" y="318" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;Review code quality and security...&quot;</text><text x="47" y="336" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [run_linter, run_tests]</text><text x="47" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: run_linter → 2 warnings</text><text x="47" y="372" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">agent: approve_code()</text></g><g transform="translate(0 38)"><rect width="320" height="28" x="35" y="388" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="195" y="402" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">↑ All phases share the same conversation history</text><text x="195" y="434" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Complete trace</text><text x="195" y="456" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ Rapid context expansion</text></g></g><rect width="350" height="480" x="410" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="422" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">No Shared Context (Isolated Collaboration)</text><g transform="translate(0 4)"><rect width="320" height="80" x="425" y="82" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="96" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Glossary Agent</text><text x="437" y="114" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;Identify terms and translate...&quot;</text><text x="437" y="132" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [search_dict, write_file]</text><text x="437" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ glossary.json</text><g transform="translate(0 10)"><rect width="320" height="80" x="425" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="184" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Translation Agent</text><text x="437" y="202" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;Translate this chapter...&quot;</text><text x="437" y="220" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [read_file, write_file]</text><text x="437" y="238" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ chapter1_zh.md</text></g><g transform="translate(0 20)"><rect width="320" height="80" x="425" y="258" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="433" y="272" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Proofreading Agent</text><text x="437" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">sys: &quot;Check terminology consistency...&quot;</text><text x="437" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">tools: [read_file, write_file]</text><text x="437" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">→ review_report.md</text></g><g transform="translate(0 39)"><rect width="320" height="65" x="425" y="351" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="585" y="367" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Shared File System</text><text x="437" y="389" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">glossary.json chapter1_zh.md review_report.md</text><text x="585" y="406" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">+ Tool call parameters pass structured data</text><text x="585" y="433" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ Modular · Extensible · Parallel</text><text x="585" y="455" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ Complex information synchronization</text></g></g></svg>