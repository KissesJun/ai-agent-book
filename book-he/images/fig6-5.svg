<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>איור 6-5: תאימות לממשק סינכרוני ואסינכרוניות מובנית במודל</title><desc>בגישת התאימות הקודמת, סביבת הריצה מסדרת את כניסת האירועים כדי שמודל בעל ממשק סינכרוני ישתתף במשימות אסינכרוניות. דרך אחרת היא שהמודל יבין את קצב האינטראקציה באופן מובנה: יוכל לעסוק בעבודה אחרת כשהכלי פועל, ולהתאים את ההמשך כשהמשתמש מוסיף דרישות. GPT-6 Astra כבר תומך בקריאות אסינכרוניות לכלים (Async tool calling) ובהכוונה באמצע תור (Mid-turn steering), ומדגים את השינוי הזה (איור 6-5).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="840" y="53" class="title" direction="rtl" unicode-bidi="plaintext">תאימות: סביבת הריצה מתזמנת עבודה אסינכרונית</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">המשימה פועלת ברקע</text><text x="155" y="122" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">סימון מפורש: טרם הושלם</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">קבלת אירועים חדשים</text><text x="440" y="122" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">תור, הפרעה או עיבוד מקבילי</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">המודל ממשיך במשימה</text><text x="725" y="122" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">קלט בתורות סינכרוניים</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="840" y="218" class="title" direction="rtl" unicode-bidi="plaintext">אסינכרוניות מובנית: להבין המתנה ושינויים במהלך המשימה</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">התחלת שאילתה ממושכת</text><text x="155" y="290" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">חיפוש מקום לפגישה</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">עבודה בזמן ההמתנה</text><text x="440" y="290" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">הכנת סדר יום ורשימת הכנות</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">החלטה כשהתוצאות מגיעות</text><text x="725" y="290" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">השוואת מקומות לפי מידע אמיתי</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">המשתמש מוסיף דרישות</text><text x="155" y="390" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">שינוי תקציב או מספר משתתפים</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">שמירת העבודה שהושלמה</text><text x="440" y="390" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">שילוב דרישות חדשות במשימה</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">התאמת הפעולות הבאות</text><text x="725" y="390" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">שילוב המידע וכל העדכונים</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">המודל מבין שינוי ומעדכן תוכנית; סביבת הריצה מנהלת כלים, מצב ומקורות אירועים</text><text x="440" y="506" class="small" direction="rtl" text-anchor="middle" unicode-bidi="plaintext">קבלת הודעות מחייבת גם חידוש משימות ושליטה נכונה בפעולות.</text></svg>