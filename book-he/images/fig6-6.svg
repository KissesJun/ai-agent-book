<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 40 780 300" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="155" height="140" x="47" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="124" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">VAD</text><text x="124" y="104" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Voice Activity Detection</text><rect width="125" height="28" x="62" y="122" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="124" y="136" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">500-800ms</text><text x="124" y="162" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Silero VAD</text><text x="124" y="180" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ONNX Runtime</text><rect width="155" height="140" x="224" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="301" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ASR</text><text x="301" y="104" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Automatic Speech Recognition</text><rect width="125" height="28" x="239" y="122" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="301" y="136" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">50-200ms</text><text x="301" y="162" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Whisper</text><text x="301" y="180" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">SenseVoice</text><line x1="204" x2="222" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="140" x="401" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="478" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LLM</text><text x="478" y="104" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Language Model Inference</text><rect width="125" height="28" x="416" y="122" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="478" y="136" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">100-500ms</text><text x="478" y="162" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">GPT-4o</text><text x="478" y="180" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Doubao Flash</text><line x1="381" x2="399" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="155" height="140" x="578" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="655" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">TTS</text><text x="655" y="104" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Speech Synthesis</text><rect width="125" height="28" x="593" y="122" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="655" y="136" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">200-500ms</text><text x="655" y="162" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Fish Audio S1</text><text x="655" y="180" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Neural Network Synthesis</text><line x1="558" x2="576" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><g fill="#333"><rect width="10" height="18" x="12" y="112" rx="5"/><path fill="none" stroke="#333" stroke-width="2" d="M9,127 a8,8 0 0 0 16,0"/><rect width="2" height="7" x="16" y="135"/><rect width="12" height="2" x="11" y="142"/></g><g fill="#333"><path d="M740,124 h6 l8,-7 v26 l-8,-7 h-6 z"/><path fill="none" stroke="#333" stroke-width="2" d="M757,120 a10,10 0 0 1 0,20"/><path fill="none" stroke="#333" stroke-width="2" d="M757,125 a5,5 0 0 1 0,10"/></g><rect width="700" height="75" x="40" y="225" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="245" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Serial blocking: each stage waits for the previous stage to complete</text><text x="390" y="267" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">User speaks 2-3 seconds → VAD waits → ASR waits → LLM idle → wastes all time gaps</text><text x="390" y="287" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Tech stack: Node.js WebSocket + AudioWorklet (128 samples ≈ 2.7ms) + FFmpeg</text></svg>