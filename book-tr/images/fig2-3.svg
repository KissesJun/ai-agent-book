<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 40 900 430" xml:lang="tr" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="30" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">Birinci model API çağrısı</text><rect width="340" height="106" x="30" y="92" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="200" y="118" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">messages: system + user</text><text x="200" y="148" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tools: get_current_time,</text><text x="200" y="170" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">get_weather</text><line x1="370" x2="480" y1="145" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="425" y="135" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">API</text><rect width="390" height="106" x="480" y="92" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="675" y="112" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">assistant: tool_calls</text><text x="675" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">get_current_time(timezone=&quot;America/Vancouver&quot;)</text><text x="675" y="158" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">get_weather(city=&quot;Vancouver&quot;, unit=&quot;celsius&quot;)</text><text x="675" y="180" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Veri bağımlılığı yok → paralel çalıştırılabilir</text><line x1="675" x2="675" y1="198" y2="218" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="390" height="50" x="480" y="220" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="675" y="245" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Agent çerçevesi iki aracı paralel çalıştırır</text><line x1="675" x2="675" y1="270" y2="298" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="30" y="286" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">İkinci model API çağrısı</text><rect width="390" height="78" x="480" y="300" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="675" y="322" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">messages: + araç sonuçları</text><text x="675" y="346" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Vancouver saati ve hava durumu</text><text x="675" y="364" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Mesaj geçmişine ekle, sonra modeli yeniden çağır</text><line x1="480" x2="370" y1="339" y2="339" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="425" y="329" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">API</text><rect width="340" height="78" x="30" y="300" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="200" y="322" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">assistant: son yanıt</text><text x="200" y="346" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Araç çağrısı yok → döngüyü bitir</text><text x="200" y="364" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">&quot;Şu an…, hava…&quot;</text><text x="450" y="430" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Stateless API&apos;de tüm mesaj geçmişi her turda modele yeniden gönderilmelidir</text></svg>