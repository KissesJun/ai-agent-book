<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"><title>Şekil 6-5: Senkron arayüz uyumluluğu ve modelin yerleşik asenkron yetenekleri</title><desc>Önceki uyumluluk yaklaşımında çalışma zamanı, gelen olayların sırasını düzenleyerek senkron arayüzlü modelin asenkron görevlere katılmasını sağlar. Diğer yaklaşımda model bu etkileşim ritmini doğrudan anlar: araç çalışırken başka işler yapabilir, kullanıcı yeni gereksinimler eklediğinde sonraki işi değiştirebilir. GPT-6 Astra&apos;nın desteklediği asenkron araç çağırma (Async tool calling) ve tur içi yönlendirme (Mid-turn steering), bu değişimi gösterir (Şekil 6-5).</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#555" d="M0,0 L8,4 L0,8"/></marker><style>text{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333}.title{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.arrow,.box{stroke:#555;stroke-width:1.5}.box{fill:#f4f4f4}.arrow{fill:none;marker-end:url(#arrow)}</style></defs><rect width="880" height="540" fill="#fff"/><rect width="840" height="145" x="20" y="20" fill="#fff" stroke="#777" stroke-dasharray="7 4" rx="8"/><text x="40" y="53" class="title">Uyumluluk: çalışma zamanı asenkron işi düzenler</text><rect width="230" height="60" x="40" y="75" class="box" rx="5"/><text x="155" y="100" class="label" text-anchor="middle">Görev arka planda çalışır</text><text x="155" y="122" class="small" text-anchor="middle">Tamamlanmadığı açıkça kayıtlı</text><path d="M270 105 H313" class="arrow"/><rect width="240" height="60" x="320" y="75" class="box" rx="5"/><text x="440" y="100" class="label" text-anchor="middle">Yeni olayları al</text><text x="440" y="122" class="small" text-anchor="middle" style="font-size:13.69px">Kuyruk, kesinti veya paralel işleme</text><path d="M560 105 H603" class="arrow"/><rect width="230" height="60" x="610" y="75" class="box" rx="5"/><text x="725" y="100" class="label" text-anchor="middle">Model göreve devam eder</text><text x="725" y="122" class="small" text-anchor="middle" style="font-size:14.92px">Girdiler hâlâ senkron turlardadır</text><rect width="840" height="250" x="20" y="185" fill="#fff" stroke="#444" stroke-width="2" rx="8"/><text x="40" y="218" class="title">Yerleşik asenkronluk: beklemeyi ve görev içi değişimi anlamak</text><rect width="230" height="65" x="40" y="240" class="box" rx="5"/><text x="155" y="267" class="label" text-anchor="middle">Uzun sorguyu başlat</text><text x="155" y="290" class="small" text-anchor="middle">Toplantı mekânlarını sorgula</text><path d="M270 272 H313" class="arrow"/><rect width="240" height="65" x="320" y="240" class="box" rx="5"/><text x="440" y="267" class="label" text-anchor="middle" style="font-size:15.81px">Beklerken çalışmaya devam</text><text x="440" y="290" class="small" text-anchor="middle" style="font-size:13.34px">Gündemi ve hazırlık listesini oluştur</text><path d="M560 272 H603" class="arrow"/><rect width="230" height="65" x="610" y="240" class="box" rx="5"/><text x="725" y="267" class="label" text-anchor="middle">Sonuç gelince karar ver</text><text x="725" y="290" class="small" text-anchor="middle" style="font-size:13.06px">Mekânları gerçek verilerle karşılaştır</text><rect width="230" height="65" x="40" y="340" class="box" rx="5"/><text x="155" y="367" class="label" text-anchor="middle" style="font-size:16.92px">Kullanıcı yeni şartlar ekler</text><text x="155" y="390" class="small" text-anchor="middle">Bütçe veya katılımcı değişir</text><path d="M270 372 H313" class="arrow"/><rect width="240" height="65" x="320" y="340" class="box" rx="5"/><text x="440" y="367" class="label" text-anchor="middle">Tamamlanan işi koru</text><text x="440" y="390" class="small" text-anchor="middle">Yeni şartları göreve kat</text><path d="M560 372 H603" class="arrow"/><rect width="230" height="65" x="610" y="340" class="box" rx="5"/><text x="725" y="367" class="label" text-anchor="middle">Sonraki eylemleri değiştir</text><text x="725" y="390" class="small" text-anchor="middle" style="font-size:13.26px">Veri ve güncellemeleri birlikte kullan</text><rect width="840" height="65" x="20" y="455" fill="#e9e9e9" rx="6"/><text x="440" y="482" class="label" text-anchor="middle">Model değişimi anlar, planı yeniler; çalışma zamanı araçları, durumu ve olay kaynaklarını yönetir.</text><text x="440" y="506" class="small" text-anchor="middle">Mesaj almak, görevi doğru sürdürmeyi ve gerçek eylemleri kontrol etmeyi de gerektirir.</text></svg>