<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" style="background:#fff"><defs><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#52636d}.accent,.box{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.accent{fill:#e8f1f5;stroke:#2f617a}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">Bir yeteneğin temsil biçimi, nerede güncelleneceğini belirler</text><rect width="220" height="126" x="35" y="72" class="box" rx="9"/><text x="145" y="105" class="t h" text-anchor="middle">Bilgi</text><text x="145" y="135" class="t s" text-anchor="middle">Olgular, deneyim, istisnalar</text><text x="145" y="164" class="t s" text-anchor="middle">Markdown / bilgi tabanı</text><rect width="220" height="126" x="275" y="72" class="box" rx="9"/><text x="385" y="105" class="t h" text-anchor="middle">Talimatlar</text><text x="385" y="135" class="t s" text-anchor="middle">Dile dökülebilen karar ilkeleri</text><text x="385" y="164" class="t s" text-anchor="middle">Prompt / Skill</text><rect width="220" height="126" x="515" y="72" class="box" rx="9"/><text x="625" y="105" class="t h" text-anchor="middle">Programlar</text><text x="625" y="135" class="t s" text-anchor="middle" style="font-size:12.5px">Belirlenimci akışlar ve sıkı kısıtlar</text><text x="625" y="164" class="t s" text-anchor="middle" style="font-size:15.5px">Araçlar / İş akışı / Harness</text><rect width="220" height="126" x="755" y="72" class="accent" rx="9"/><text x="865" y="105" class="t h" text-anchor="middle">Parametreler</text><text x="865" y="135" class="t s" text-anchor="middle" style="font-size:12.5px">Yüksek boyutlu algı ve örtük politika</text><text x="865" y="164" class="t s" text-anchor="middle">SFT / Damıtma / RL</text><line x1="145" x2="865" y1="226" y2="226" stroke="#33434d" stroke-width="2"/><path stroke="#33434d" stroke-width="2" d="M145 218 V234 M865 218 V234"/><text x="145" y="260" class="t s" text-anchor="middle">Güncellemesi kolay, izlenebilir</text><text x="865" y="260" class="t s" text-anchor="middle" style="font-size:15px">İçselleşmiş, düşük çıkarım maliyeti</text><text x="500" y="289" class="t h" text-anchor="middle">Tek yönlü bir merdiven değil, dört tamamlayıcı taşıyıcı</text><rect width="710" height="58" x="145" y="320" class="accent" rx="8"/><text x="500" y="344" class="t h" text-anchor="middle" style="font-size:18.5px">İlk soru: yetenek olgular, dil kuralları ya da programlarla tam ifade edilebilir mi?</text><text x="500" y="367" class="t s" text-anchor="middle">Dağıtımı kararlılık, maliyet ve güncelleme sıklığı belirler; parametrelenebilirlik değil</text></svg>