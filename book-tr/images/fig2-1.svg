<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 40 820 580" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="700" height="84" x="40" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">Sistem İstemi</text><text x="65" y="102" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;Sen yardımsever bir asistansın. Yanıtların ÖZ olmalı.&quot;</text><text x="65" y="124" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;Kullanıcı gerçek zamanlı bilgi istediğinde araç kullan.&quot;</text><rect width="700" height="84" x="40" y="152" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="172" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">Araç Tanımları</text><text x="65" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">{&quot;name&quot;: &quot;web_search&quot;, &quot;description&quot;: &quot;Web&apos;de ara&quot;,</text><text x="65" y="216" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;parameters&quot;: {&quot;query&quot;: {&quot;type&quot;: &quot;string&quot;}}}</text><rect width="700" height="106" x="40" y="244" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="264" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">Konuşma Geçmişi</text><text x="65" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">user: &quot;Bugün Pekin&apos;de hava nasıl?&quot;</text><text x="65" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">assistant: [tool_call] → get_weather(&quot;Pekin&quot;)</text><text x="65" y="330" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">tool: {&quot;temp&quot;: &quot;23°C&quot;, &quot;conditions&quot;: &quot;açık&quot;}</text><rect width="700" height="84" x="40" y="358" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="378" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">Muhakeme İzi</text><text x="65" y="400" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&lt;think&gt;Kullanıcı havayı soruyor. Araç sonucu zaten elimde,</text><text x="65" y="422" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">bu yüzden aracı tekrar çağırmadan özetleyip yanıtlayabilirim.&lt;/think&gt;</text><rect width="700" height="62" x="40" y="450" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="470" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">Mevcut üretim konumu →</text><text x="65" y="492" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">assistant: &quot;Pekin bugün açık, sıcaklık 23°C...&quot; ← LLM üretiyor</text><path fill="none" stroke="#333" stroke-width="2" d="M 748,60 C 768,60 768,281.0 773,286.0 C 768,291.0 768,512 748,512"/><text x="755" y="274" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="start">Bağlam</text><text x="755" y="298" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="bold" text-anchor="start">Penceresi</text><rect width="620" height="50" x="100" y="535" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="552" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Pencere boyutu: Qwen3 = 32K token | Claude = 200K | Gemini = 2M</text><text x="410" y="572" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Tüm içerik token akışına serileştirilir → Transformer dikkat mekanizmasıyla işlenir</text></svg>