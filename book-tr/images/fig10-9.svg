" stroke="#333" stroke-width="2" rx="12"/><text x="789" y="238" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="middle">docs/test_report.md</text><path fill="none" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)" d="M 789,293 Q 703,346 617,293"/><text x="703" y="300" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Bug fix</text><rect width="830" height="50" x="30" y="335" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="445" y="351" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Shared project directory</text><text x="445" y="371" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">docs/PRD.md docs/design.md docs/tasks.md src/*.py docs/test_report.md</text><rect width="830" height="130" x="30" y="400" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="445" y="418" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">MetaGPT core design</text><text x="42" y="442" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Standardized documents</text><text x="270" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Each role emits a fixed format; downstream needs the format, not the reasoning</text><text x="42" y="466" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Interface decoupling</text><text x="270" y="466" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Swap in a stronger Product Mgr; if output keeps PRD format, downstream is unchanged</text><text x="42" y="490" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ No Manager</text><text x="270" y="490" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Control flows along the DAG: Product Mgr→Architect→Project Mgr→Engineer→QA</text><text x="42" y="514" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">▸ Exception channel</text><text x="270" y="514" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">QA failure → bug report routed back to Engineer by module → iterative fix</text></svg>