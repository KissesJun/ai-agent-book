" y1="246" y2="164" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="720" x2="510" y1="168" y2="246" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="490" x2="700" y1="246" y2="164" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="150" height="25" x="242" y="194" fill="#fff" rx="3"/><text x="317" y="207" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Seçici aktarım</text><rect width="150" height="25" x="536" y="194" fill="#fff" rx="3"/><text x="611" y="207" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:12px">Etkinleştirme ve yükleme</text><text x="460" y="60" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Uzun süreli bellek (oturumlar arası)</text><text x="460" y="372" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Çalışma belleği ile uzun süreli bellek arasında dinamik etkileşim: önemli bilgi seçilerek yazılır, ilgili anılar gerektiğinde etkinleştirilir.</text></svg>