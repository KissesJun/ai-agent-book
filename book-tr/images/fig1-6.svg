<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" aria-labelledby="title desc" lang="tr" role="img" viewBox="0 0 820 470"><title id="title">Otonom Agent yürütme döngüsü</title><desc id="desc">Agent sırayla düşünür, eyleme geçer ve gözlem yapar; ardından çıkış koşullarını denetleyerek nihai sonucu döndürür veya sonraki döngüye başlar.</desc><defs><marker id="arrow-dark" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#333" points="0 0 9 3.5 0 7"/></marker><marker id="arrow-light" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#777" points="0 0 9 3.5 0 7"/></marker><style>.sans{font-family:Arial,&quot;Helvetica Neue&quot;,Helvetica,sans-serif}.code{font-family:&quot;Courier New&quot;,Courier,monospace}.heading{fill:#333;font-size:16px;font-weight:700}.body{fill:#333;font-size:15px}.note,.small{font-size:14px}.note{fill:#666}.box,.flow{stroke:#333;stroke-width:2}.flow{fill:none;marker-end:url(#arrow-dark)}</style></defs><rect width="820" height="470" fill="#fff"/><rect width="210" height="96" x="45" y="70" fill="#e8e8e8" class="box" rx="8"/><text x="60" y="95" class="sans heading" dominant-baseline="middle">① Düşünme (Reasoning)</text><rect width="180" height="38" x="60" y="112" fill="#fff" stroke="#777" rx="5"/><text x="150" y="132" class="sans body small" dominant-baseline="middle" text-anchor="middle">&quot;Daha fazla bilgi gerek&quot;</text><rect width="210" height="96" x="305" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="320" y="95" class="sans heading" dominant-baseline="middle">② Eylem (Acting)</text><rect width="180" height="38" x="320" y="112" fill="#fff" stroke="#777" rx="5"/><text x="410" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">web_search(...)</text><rect width="210" height="96" x="565" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="580" y="95" class="sans heading" dominant-baseline="middle">③ Gözlem (Observing)</text><rect width="180" height="38" x="580" y="112" fill="#fff" stroke="#777" rx="5"/><text x="670" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">tool_result: &quot;...&quot;</text><line x1="255" x2="302" y1="118" y2="118" class="flow"/><line x1="515" x2="562" y1="118" y2="118" class="flow"/><line x1="670" x2="670" y1="166" y2="207" class="flow"/><rect width="430" height="145" x="45" y="220" fill="#fff" stroke="#777" stroke-dasharray="7 4" stroke-width="2" rx="8"/><text x="65" y="244" class="sans heading" dominant-baseline="middle">Çıkış koşulları (herhangi biri)</text><line x1="65" x2="455" y1="258" y2="258" stroke="#ccc"/><text x="65" y="282" class="sans body small" dominant-baseline="middle">① Görev tamamlandı</text><text x="250" y="282" class="sans body small" dominant-baseline="middle">② final_answer çağrıldı</text><text x="65" y="314" class="sans body small" dominant-baseline="middle">③ Araç çağrısı yok</text><text x="250" y="314" class="sans body small" dominant-baseline="middle">④ Hata sınırı aşıldı</text><text x="65" y="346" class="sans body small" dominant-baseline="middle">⑤ Maksimum tura ulaşıldı</text><path fill="none" stroke="#777" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-light)" d="M 475 260 H 587"/><rect width="80" height="20" x="493" y="238" fill="#fff" rx="3"/><text x="533" y="248" class="sans note" dominant-baseline="middle" text-anchor="middle">Karar ölçütü</text><polygon fill="#e2e2e2" points="670 208 750 260 670 312 590 260" class="box"/><text x="670" y="252" class="sans heading" dominant-baseline="middle" text-anchor="middle">Çıkış koşulu</text><text x="670" y="273" class="sans heading" dominant-baseline="middle" text-anchor="middle">sağlandı mı?</text><path d="M 750 260 H 795 V 35 H 150 V 67" class="flow"/><text x="773" y="245" class="sans note" dominant-baseline="middle" text-anchor="middle">Hayır</text><rect width="160" height="22" x="340" y="43" fill="#fff" rx="3"/><text x="420" y="54" class="sans note" dominant-baseline="middle" text-anchor="middle">Sonraki döngüye geç</text><line x1="670" x2="670" y1="312" y2="379" class="flow"/><text x="685" y="346" class="sans note" dominant-baseline="middle">Evet</text><rect width="230" height="68" x="555" y="382" fill="#d6d6d6" class="box" rx="8"/><text x="670" y="416" class="sans heading" dominant-baseline="middle" text-anchor="middle">Nihai sonucu döndür</text></svg>