<svg xmlns="http://www.w3.org/2000/svg" width="960" height="985" aria-labelledby="title desc" role="img" viewBox="0 0 960 985"><title id="title">Cache evolution across three turns</title><desc id="desc">Web reading edition of Figure 2-13. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="985"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.three{grid-template-columns:1fr 1fr 1fr}.card,.row{border:1px solid #cbd5e1;background:#fff}.card{padding:20px;border-radius:12px;min-width:0}.row{padding:10px 14px;border-radius:7px;margin:8px 0}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;font-size:17px}.hit,.note{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}.pill{float:right;font-size:13px;font-weight:700;color:#52627a;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>The prefix stays; the trajectory grows</h1><p class="muted">An illustrative append-only session with an available prefix cache.</p><div class="grid three"><div class="card"><h2>Turn 1</h2><div class="row new small"><span class="pill">NEW</span>system</div><div class="row new small"><span class="pill">NEW</span>tools</div><div class="row new small"><span class="pill">NEW</span>user request</div><div class="row new small"><span class="pill">NEW</span>skill catalog</div><div class="row new small"><span class="pill">NEW</span>Skill(pptx)</div><div class="row new small"><span class="pill">NEW</span>tool result</div><div class="row new small"><span class="pill">NEW</span>skill instructions</div><p class="small">New content: ≈ 2.5k tokens</p></div><div class="card"><h2>Turn 2</h2><div class="row hit small"><span class="pill">REUSED</span>system</div><div class="row hit small"><span class="pill">REUSED</span>tools</div><div class="row hit small"><span class="pill">REUSED</span>user request</div><div class="row hit small"><span class="pill">REUSED</span>skill catalog</div><div class="row hit small"><span class="pill">REUSED</span>Skill(pptx)</div><div class="row hit small"><span class="pill">REUSED</span>tool result</div><div class="row hit small"><span class="pill">REUSED</span>skill instructions</div><div class="row new small"><span class="pill">NEW</span>Read(pdf)</div><div class="row new small"><span class="pill">NEW</span>tool result</div><p class="small">New content: ≈ 0.5k tokens</p></div><div class="card"><h2>Turn 3</h2><div class="row hit small"><span class="pill">REUSED</span>system</div><div class="row hit small"><span class="pill">REUSED</span>tools</div><div class="row hit small"><span class="pill">REUSED</span>user request</div><div class="row hit small"><span class="pill">REUSED</span>skill catalog</div><div class="row hit small"><span class="pill">REUSED</span>Skill(pptx)</div><div class="row hit small"><span class="pill">REUSED</span>tool result</div><div class="row hit small"><span class="pill">REUSED</span>skill instructions</div><div class="row hit small"><span class="pill">REUSED</span>Read(pdf)</div><div class="row hit small"><span class="pill">REUSED</span>tool result</div><div class="row new small"><span class="pill">NEW</span>Write(html)</div><div class="row new small"><span class="pill">NEW</span>tool result</div><p class="small">New content: ≈ 0.4k tokens</p></div></div><div class="note"><b>NEW</b>= added content requiring processing.<b>REUSED</b>= unchanged cached prefix. Reuse can still incur cached-input charges; it is not guaranteed after cache expiry, eviction, or a prefix change.</div></div></body></html></foreignObject></svg>