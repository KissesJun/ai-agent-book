<svg xmlns="http://www.w3.org/2000/svg" width="960" height="865" aria-labelledby="title desc" role="img" viewBox="0 0 960 865"><title id="title">Compression strategy results</title><desc id="desc">Web reading edition of Figure 2-16. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="865"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}p{margin:0 0 14px}.muted,.note{font-size:17px}.muted{color:#52627a}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8}.bar{height:10px;background:#6383ad;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#52627a}</style></head><body><div class="page"><h1>Compression strategies: measured outcomes</h1><p class="muted">Recorded results from Experiment 2-10. Lower token usage is better only if the task succeeds.</p><table><thead><tr><th>Strategy</th><th>Total tokens</th><th>Iterations</th><th>Outcome</th><th>Logged text ratio†</th></tr></thead><tbody><tr><td>No compression</td><td>166,043<div class="bar" style="width:108px"/></td><td>5</td><td>Failed</td><td>102.1%</td></tr><tr><td>Individual summary</td><td>276,608<div class="bar" style="width:180px"/></td><td>12</td><td>Success</td><td>10.9%</td></tr><tr><td>Combined summary</td><td>93,449<div class="bar" style="width:61px"/></td><td>10</td><td>Success</td><td>4.3%</td></tr><tr style="background:#eaf0f8"><td>Context-aware</td><td>40,157<div class="bar" style="width:26px"/></td><td>7</td><td>Success</td><td>3.0%</td></tr><tr><td>Context-aware + citations</td><td>222,992<div class="bar" style="width:145px"/></td><td>10</td><td>Success</td><td>4.1%</td></tr><tr><td>Adaptive window</td><td>174,601<div class="bar" style="width:114px"/></td><td>7</td><td>Success</td><td>102.4%</td></tr></tbody></table><div class="note">Context-aware compression used 40,157 tokens and completed the task in 7 iterations. The uncompressed run failed after 5 iterations; fewer iterations alone do not indicate better performance.</div><p class="muted" style="margin-top:16px">† Sum of logged transformed-text characters ÷ sum of raw page-body characters. Includes titles, URLs, and formatting, so values can exceed 100%. Adaptive windowing’s later history compression is not included; its 102.4% does not measure the final context size.</p></div></body></html></foreignObject></svg>