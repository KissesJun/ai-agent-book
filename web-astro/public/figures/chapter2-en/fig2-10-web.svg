<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" aria-labelledby="title desc" role="img" viewBox="0 0 960 840"><title id="title">Prefix reuse and cache invalidation</title><desc id="desc">Web reading edition of Figure 2-10. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="840"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.card,.row{border:1px solid #cbd5e1;background:#fff}.card{padding:20px;border-radius:12px;min-width:0}.row{padding:10px 14px;border-radius:7px;margin:8px 0}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;font-size:17px}.hit,.note{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}</style></head><body><div class="page"><h1>Reuse the stable prefix</h1><p class="muted">A changed token invalidates reuse from that point onward.</p><div class="card" style="margin-top:16px"><h2>Request 1 · compute</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="row new">System prompt + tools · 1,200 tokens</div><div class="row">Weather request</div></div></div><div class="card" style="margin-top:16px"><h2>Request 2 · reuse</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="row hit">Same system prompt + tools · cache hit</div><div class="row">Time request</div></div></div><div class="card" style="margin-top:16px"><h2>Request 3 · prefix changed</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="row new">New timestamp + system prompt + tools · recompute</div><div class="row">Weather request</div></div></div><div class="note"><b>Reuse saves computation, not necessarily all charges.</b>Cached input may be billed at a reduced rate. A changed prefix must be processed again. Cache availability and pricing depend on the provider.</div><p class="muted" style="margin-top:14px">Illustrative TTFT for a 3,000-token context: cache hit ~0.5 s; miss 3–5 s. These are deployment-dependent examples, not a guarantee.</p></div></body></html></foreignObject></svg>