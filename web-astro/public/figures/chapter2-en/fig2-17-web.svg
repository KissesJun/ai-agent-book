<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" aria-labelledby="title desc" role="img" viewBox="0 0 960 920"><title id="title">How six compression strategies work</title><desc id="desc">Web reading edition of Figure 2-17. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="920"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.card{padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-width:0}.blue{background:#edf4ff;border-color:#a6bfe6}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8;font-size:17px}</style></head><body><div class="page"><h1>Six ways to handle incoming search results</h1><p class="muted">The experiment averages ~52K characters per search call.</p><div class="grid two"><div class="card"><h2>1. No compression</h2><p>Retain each complete tool result.</p><p class="muted">166,043 tokens · 5 iterations · Failed</p></div><div class="card"><h2>2. Individual summary</h2><p>Summarize each result separately into 2–3 paragraphs.</p><p class="muted">276,608 tokens · 12 iterations · Success</p></div><div class="card"><h2>3. Combined summary</h2><p>Summarize all pages returned by one search together.</p><p class="muted">93,449 tokens · 10 iterations · Success</p></div><div class="card blue"><h2>4. Context-aware</h2><p>Use the current query and context to retain task-relevant information.</p><p class="muted">40,157 tokens · 7 iterations · Success</p></div><div class="card"><h2>5. Context-aware + citations</h2><p>Use task-aware summaries and retain source URL citations.</p><p class="muted">222,992 tokens · 10 iterations · Success</p></div><div class="card"><h2>6. Adaptive window</h2><p>Keep raw results below the threshold; compress in batches above 80% of the window.</p><p class="muted">174,601 tokens · 7 iterations · Success</p></div></div><div class="note">Compare what each strategy preserves, when it compresses, and whether it completes the task. Token totals describe the entire experimental run.</div></div></body></html></foreignObject></svg>