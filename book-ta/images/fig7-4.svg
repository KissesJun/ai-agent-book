<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" style="background:#fff"><defs><marker id="ax" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker></defs><style>.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;text-anchor:middle;dominant-baseline:central}.h{font-size:13px;font-weight:700}.m{fill:#666}.m,.n{font-size:10px}.a,.n{fill:#333}.a{font-size:11px}</style><line x1="40" x2="846" y1="26" y2="26" stroke="#333" stroke-width="2" marker-end="url(#ax)"/><text x="130" y="12" class="t a">பணியின் இயந்திரச் சரிபார்ப்புத் தன்மை: உயர்</text><text x="790" y="12" class="t a">தாழ்</text><rect width="190" height="112" x="18" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="113" y="76" class="t h">நிர்ணயவாதம்</text><text x="113" y="100" class="t m">இறுதி நிலை ஒற்றை, வினவக்கூடியது</text><text x="113" y="120" class="t m">தேர்ச்சி / தோல்வி</text><text x="113" y="146" class="t n">SWE-bench சோதனை இயக்கும்</text><line x1="212" x2="232" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="236" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="331" y="76" class="t h">சோதனைப் பட்டியல்</text><text x="331" y="100" class="t m">பல நிர்ணயவாதச் சோதனைகள்</text><text x="331" y="120" class="t m">அறிவிக்கப்பட்ட அடிப்படையில் தொகுப்பு</text><text x="331" y="146" class="t n">τ²-bench நான்கு அடுக்கு</text><line x1="430" x2="450" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="454" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="549" y="76" class="t h">Rubric + LLM</text><text x="549" y="100" class="t m">பரிமாணம் உண்டு, குறியீடு தீர்க்காது</text><text x="549" y="120" class="t m">பரிமாணவாரி மதிப்பெண் + காரணம்</text><text x="549" y="146" class="t n">சேவைத் தரம், அறிக்கை எழுதல்</text><line x1="648" x2="668" y1="108" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="190" height="112" x="672" y="52" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="767" y="76" class="t h">இணை ஒப்பீடு</text><text x="767" y="100" class="t m">பரிமாணத்தையே எழுதுவது கடினம்</text><text x="767" y="120" class="t m">A, B இடையே மட்டுமே தீர்ப்பு</text><text x="767" y="146" class="t n">Chatbot Arena</text><rect width="408" height="66" x="18" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="222" y="212" class="t h">நிர்ணயவாதச் சரிபார்ப்பு</text><text x="222" y="234" class="t m">முழு மறுஉருவாக்கம், CI க்கு ஏற்றது, மலிவு</text><text x="222" y="250" class="t m">விலை: சரி/தவறு மட்டுமே, இடம் சொல்லாது</text><rect width="408" height="66" x="454" y="192" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="658" y="212" class="t h">மாதிரித் தீர்ப்பு</text><text x="658" y="234" class="t m">நோயறி பரிமாணம் தரும், உறுதிமொழியாகாததையும் உள்ளடக்கும்</text><text x="658" y="250" class="t m">விலை: தீர்ப்புச் சாய்வும் ஏற்ற இறக்கமும், அதிகச் செலவு</text></svg>