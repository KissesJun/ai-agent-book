<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 40 900 340" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="370" height="46" x="30" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="55" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ஏஜெண்ட் அல்லாத RAG</text><text x="215" y="81" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:16.5px">நிலையான முன்படி, ஒரே முறை மீட்டெடுப்பு</text><rect width="270" height="44" x="80" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="132" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">பயனர் வினவல்</text><line x1="215" x2="215" y1="156" y2="174" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="80" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">மீட்டெடுப்பு (ஒரு முறை)</text><line x1="215" x2="215" y1="220" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="80" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">நேரடியாக பதில் உருவாக்கம்</text><rect width="370" height="46" x="500" y="44" fill="#eef3f6" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="55" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">ஏஜெண்டிக் RAG</text><text x="685" y="81" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ReAct வழிநடத்தும் மீள் மீட்டெடுப்பு</text><rect width="310" height="44" x="530" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="132" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:11px">சிந்தி: தேவையை ஆய்ந்து முக்கியச் சொற்களை நிர்ணயி</text><line x1="685" x2="685" y1="156" y2="174" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="310" height="44" x="530" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="196" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:14.5px">செயல்படு: மீட்டெடுப்புக் கருவியை அழை</text><line x1="685" x2="685" y1="220" y2="238" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="310" height="44" x="530" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">கவனி: தகவல் போதுமா?</text><line x1="840" x2="858" y1="260" y2="260" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="858" y1="260" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2"/><line x1="858" x2="840" y1="196" y2="196" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="862" y="228" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="start" style="font-size:10px">இல்லை</text><line x1="685" x2="685" y1="302" y2="320" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="270" height="44" x="550" y="322" fill="#dfeef0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="344" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ஆம் → பதிலைத் தொகு</text></svg>