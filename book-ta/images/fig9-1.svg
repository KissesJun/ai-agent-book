<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="28" class="t h" text-anchor="middle">தொடர் பரிணாமம்: இயக்க அனுபவத்திலிருந்து புதிய Agent பதிப்பிற்கு</text><rect width="150" height="90" x="25" y="72" class="box" rx="8"/><text x="100" y="105" class="t h" text-anchor="middle" style="font-size:18.5px">பணியை இயக்கு</text><text x="100" y="127.04" class="t s" text-anchor="middle" style="font-size:12px">பயனர், சூழல்,</text><text x="100" y="140.96" class="t s" text-anchor="middle" style="font-size:12px">கருவிகளுடன் இடைவினை</text><rect width="150" height="90" x="205" y="72" class="box" rx="8"/><text x="280" y="105" class="t h" text-anchor="middle" style="font-size:12px">பாதையைப் பதிவு செய்</text><text x="280" y="127.04" class="t s" text-anchor="middle" style="font-size:12px">செயல்கள், முடிவுகள்,</text><text x="280" y="140.96" class="t s" text-anchor="middle" style="font-size:12px">பின்னூட்டம்</text><rect width="150" height="90" x="385" y="72" class="accent" rx="8"/><text x="460" y="105" class="t h" text-anchor="middle" style="font-size:11px">சமிக்ஞைகளை உருவாக்கு</text><text x="460" y="134" class="t s" text-anchor="middle" style="font-size:10px">முடிவு · செயல்முறை · தரம்</text><rect width="230" height="124" x="565" y="55" class="accent" rx="8"/><text x="680" y="84" class="t h" text-anchor="middle" style="font-size:10px">வேட்பாளர் புதுப்பிப்புகளை உருவாக்கு</text><rect width="92" height="27" x="582" y="102" fill="#fff" stroke="#66808e" rx="5"/><rect width="92" height="27" x="686" y="102" fill="#fff" stroke="#66808e" rx="5"/><rect width="92" height="27" x="582" y="139" fill="#fff" stroke="#66808e" rx="5"/><rect width="92" height="27" x="686" y="139" fill="#fff" stroke="#66808e" rx="5"/><text x="628" y="121" class="t s" text-anchor="middle">அறிவு</text><text x="732" y="121" class="t s" text-anchor="middle" style="font-size:9px">அறிவுறுத்தல்கள்</text><text x="628" y="158" class="t s" text-anchor="middle">நிரல்கள்</text><text x="732" y="158" class="t s" text-anchor="middle" style="font-size:11.5px">அளபுருக்கள்</text><rect width="150" height="90" x="825" y="72" class="box" rx="8"/><text x="900" y="105" class="t h" text-anchor="middle" style="font-size:11px">சரிபார்த்து வெளியிடு</text><text x="900" y="127.91" class="t s" text-anchor="middle" style="font-size:10.5px">பின்னடைவு, படிப்படியான</text><text x="900" y="140.09" class="t s" text-anchor="middle" style="font-size:10.5px">வெளியீடு, பின்வாங்கல்</text><path d="M175 117 H203" class="line"/><path d="M355 117 H383" class="line"/><path d="M535 117 H563" class="line"/><path d="M795 117 H823" class="line"/><path stroke-dasharray="7 5" d="M900 162 V238 H100 V164" class="line"/><text x="500" y="265" class="t h" text-anchor="middle">புதிய Agent அடுத்த சுற்றுக்குள் நுழைகிறது</text><text x="500" y="294" class="t s" text-anchor="middle">பிந்தைய நடத்தையை மாற்றி சரிபார்ப்பில் தேறும் புதுப்பிப்புகள் மட்டுமே தொடர் பரிணாமம் ஆகும்</text><line x1="260" x2="740" y1="318" y2="318" stroke="#9aa8af" stroke-width="1"/></svg>