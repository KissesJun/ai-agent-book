<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 40 820 560" xml:lang="ta" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="410" y="58" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">ஒவ்வொரு தேடலும் சராசரியாக ~52K எழுத்துகள் → ஒவ்வொரு உத்தியும் வேறுபடச் செயலாக்கும்</text><rect width="130" height="26" x="30" y="75" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="88" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">① சுருக்கம் இல்லை</text><rect width="120" height="40" x="30" y="105" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">நேரடியாக வைத்தல்</text><line x1="152" x2="165" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="105" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">முழு அசல் உரையை context-ல் வைத்தல்</text><line x1="500" x2="513" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="105" fill="#fff" stroke=