seline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">③ ஒருங்கிணைந்த சுருக்கம்</text><rect width="120" height="40" x="30" y="261" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="middle">ஒன்றிணைந்த சுருக்கம்</text><line x1="152" x2="165" y1="281" y2="281" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="261" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">எல்லா முடிவுகளையும் இணைத்து ஒரே சுருக்கம்</text><line x1="500" x2="513" y1="281" y2="281" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="261" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">93K tok · 4.3% · 10 சுற்று</text><rect width="130" height="26" x="30" y="309" fill="#666" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="322" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">④ சூழல்-உணர்வு</text><rect width="120" height="40" x="30" y="339" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">நுண்ணறிவு சுருக்கம்</text><line x1="152" x2="165" y1="359" y2="359" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="339" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Query + context → இலக்கு சுருக்கம்</text><line x1="500" x2="513" y1="359" y2="359" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="339" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="359" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">40K tok · 3.0% · 7 சுற்று</text><rect width="130" height="26" x="30" y="387" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="400" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">⑤ உணர்வு + மேற்கோள்</text><rect width="120" height="40" x="30" y="417" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">சுருக்கம் + மூலம்</text><line x1="152" x2="165" y1="437" y2="437" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="417" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">சுருக்கப்பட்ட உள்ளடக்கம் + URL மேற்கோள்கள்</text><line x1="500" x2="513" y1="437" y2="437" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="417" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">223K tok · 4.1% · 10 சுற்று</text><rect width="130" height="26" x="30" y="465" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="478" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">⑥ தகவமைப்பு சாளரம்</text><rect width="120" height="40" x="30" y="495" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="515" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">தாமத சுருக்கம்</text><line x1="152" x2="165" y1="515" y2="515" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="495" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="515" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">&lt; 80% window-ல் அசல் உரை; மீறினால் batch compress</text><line x1="500" x2="513" y1="515" y2="515" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="495" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="515" fill="#333" dominant-baseline="central" font-family="Arial, 'Helv