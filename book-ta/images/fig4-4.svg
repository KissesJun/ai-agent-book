<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 40 880 540" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="560" height="118" x="20" y="50" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="start" style="font-size:13.5px">நிலையான முன்னொட்டு (பைட் அளவில் மாறாதது, KV Cache தொடர்ந்து பொருந்தும்)</text><rect width="520" height="34" x="40" y="84" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="101" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">System Prompt</text><rect width="520" height="34" x="40" y="124" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="141" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">மைய கருவி வரையறைகள்: web_search, code_interpreter, tool_search</text><rect width="560" height="386" x="20" y="180" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="202" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">பாதை (சேர்ப்பது மட்டும்; புதியது இறுதியில் இணைக்கப்படும்)</text><rect width="520" height="30" x="40" y="214" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="229" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: NVDA பங்கு விலையை வினவு</text><rect width="520" height="30" x="40" y="250" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(பங்கு விலை)</text><rect width="520" height="40" x="40" y="286" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="306" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → get_stock_quote இன் முழு schema ஐ செலுத்து</text><rect width="520" height="30" x="40" y="332" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="347" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: get_stock_quote அழை → Tool Result</text><rect width="520" height="30" x="40" y="368" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="383" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: GitHub களஞ்சியத்தின் பங்களிப்பாளர்களை ஆய்வு செய்</text><rect width="520" height="30" x="40" y="404" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="419" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(GitHub)</text><rect width="520" height="40" x="40" y="440" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="460" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → list_contributors போன்ற schema ஐ செலுத்து</text><rect width="520" height="30" x="40" y="486" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="501" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: அழை → Tool Result → பதில்</text><rect width="520" height="30" x="40" y="522" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="537" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">… இச்சுற்றின் சமீபத்திய உள்ளடக்கம்</text><line x1="562" x2="592" y1="306" y2="306" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><line x1="562" x2="592" y1="460" y2="460" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="600" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="start" style="font-size:10px">முதல் தோற்றம்: ஒருமுறை prefill (இடையகத்தில் எழுதல்)</text><text x="600" y="316" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="start" style="font-size:10px">அதன்பின் சாதாரண வரலாறாக இடையகத்தில் பொருந்தும்</text><text x="600" y="439.88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="start" style="font-size:14px">ஏற்றப்பட்ட கருவிகளை நீக்கவோ</text><text x="600" y="456.12" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="start" style="font-size:14px">மறுவரிசைப்படுத்தவோ கூடாது</text><text x="600" y="462.17" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="start" style="font-size:13.5px">இல்லையேல் மாற்றப் புள்ளியிலிருந்து</text><text x="600" y="477.83" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="start" style="font-size:13.5px">இடையகம் செல்லாததாகும்</text></svg>