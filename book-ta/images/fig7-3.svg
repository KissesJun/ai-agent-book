<svg xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker><marker id="ah-r" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="0" refY="3.5"><polygon fill="#666" points="10 0 0 3.5 10 7"/></marker></defs><style>.l,.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;dominant-baseline:central}.t{text-anchor:middle}.l{text-anchor:start}.h{font-size:14px;font-weight:700}.m{font-size:11px}.c,.n{font-size:9.5px;fill:#666}.c{font-family:&apos;SF Mono&apos;,Menlo,Consolas,monospace}</style><rect width="270" height="86" x="40" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="175" y="40" class="t h">பயனர் உருவகப்படுத்தி (LLM)</text><text x="56" y="62" class="l n">known_info: John Smith / 555-123-2002 / பிரான்ஸில்</text><text x="56" y="80" class="l n">task_instructions: படிப்படி வெளிப்பாடு · உணர்வு · நங்கூரம்</text><text x="56" y="96" class="l n">ஏற்பு: excellent மட்டுமே தீர்வு</text><rect width="270" height="86" x="570" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="705" y="40" class="t h">ஏஜெண்ட் (மதிப்பீட்டில்)</text><text x="586" y="62" class="l n">உள்ளீடு: டிக்கெட் + கள கொள்கை</text><text x="586" y="80" class="l n">தெரியாது: சாதனத்தின் உண்மை நிலை</text><text x="586" y="96" class="l n">வழிநடத்த மட்டுமே முடியும், செய்ய முடியாது</text><line x1="316" x2="560" y1="63" y2="63" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)" marker-start="url(#ah-r)"/><text x="438" y="50" class="t n">பல சுற்று உரையாடல்</text><text x="438" y="80" class="t n">படிப்படியான தகவல் வெளிப்பாடு</text><rect width="800" height="150" x="40" y="146" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="166" class="t h">பகிர் சூழல் (இரட்டைக் கட்டுப்பாடு: இரு பக்கமும் நிலையை மாற்றும்)</text><rect width="370" height="98" x="60" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="245" y="200" class="t m" font-weight="bold">சாதனப் பக்க நிலை</text><text x="76" y="222" class="l n">விமான பயன்முறை ON · ரோமிங் OFF · சிக்கனம் · மீதி தரவு</text><text x="76" y="246" class="l c">பயனர் கருவிகள்: toggle_airplane_mode / toggle_roaming</text><text x="76" y="266" class="l c">check_status_bar / run_speed_test</text><rect width="370" height="98" x="450" y="182" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="635" y="200" class="t m" font-weight="bold">வழங்குநர் பக்கத் தரவுத்தளம்</text><text x="466" y="222" class="l n">வாடிக்கையாளர் C1001 · இணைப்புகள் L1001/L1002/L1003 · திட்டங்கள் · கட்டணம்</text><text x="466" y="246" class="l c">ஏஜெண்ட் கருவிகள்: get_customer_by_phone / get_data_usage</text><text x="466" y="266" class="l c">enable_roaming / refuel_data</text><line x1="175" x2="175" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="705" x2="705" y1="106" y2="178" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="800" height="34" x="40" y="306" fill="#fff" stroke="#666" stroke-dasharray="5 4" stroke-width="1.5" rx="5"/><text x="440" y="323" class="t n">பயனரின் toggle_roaming சூழலை மாற்றியது; ஏஜெண்ட் கருவியை மீண்டும் அழைத்தால்தான் அறியும் — சரிபார்ப்பு இதையும் உள்ளடக்கும்</text><rect width="800" height="136" x="40" y="356" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="376" class="t h">பணி முடிந்த பின்: நான்கு அடுக்குச் சோதனை + தொகுப்பு விதி</text><rect width="182" height="62" x="56" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="147" y="408" class="t m">env_assertions</text><text x="147" y="428" class="t n">மொபைல் தரவு கிடைக்கிறது</text><text x="147" y="444" class="t n">வேகம் ≥ 200 / excellent</text><rect width="182" height="62" x="254" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="345" y="408" class="t m">actions</text><text x="345" y="428" class="t n">toggle_airplane_mode</text><text x="345" y="444" class="t n">requestor user ஆக இருக்க வேண்டும்</text><rect width="182" height="62" x="452" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="543" y="408" class="t m">communicate_info</text><text x="543" y="428" class="t n">தேவையான தகவல் தெரிவிக்கப்பட்டதா</text><text x="543" y="444" class="t n">இப்பணியில் null</text><rect width="182" height="62" x="650" y="392" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="741" y="408" class="t m">nl_assertions</text><text x="741" y="428" class="t n">இயல்மொழி மட்டத் தீர்ப்பு</text><text x="741" y="444" class="t n">இப்பணியில் null</text><text x="440" y="474" class="t n">reward_basis = [&quot;ENV_ASSERTION&quot;] → முதல் அடுக்கு மட்டுமே; மற்றவை பதிவாகும், வெகுமதியில் சேராது</text></svg>