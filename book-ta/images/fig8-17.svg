<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 40 780 500" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="380" height="78" x="50" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Text Thinking₁</text><text x="65" y="98" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">&amp;quot;Need to solve the equation x²+2x-8=0</text><text x="65" y="114" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">First solve with sympy...&amp;quot;</text><line x1="240" x2="240" y1="139" y2="145" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="146" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="164" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Code Generation₁</text><text x="65" y="178" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&lt;code&gt;</text><text x="65" y="188" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">from sympy import *</text><text x="65" y="198" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">x=symbols(&quot;x&quot;)</text><text x="65" y="208" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">solve(x**2+2*x-8,x)</text><text x="65" y="218" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">&lt;/code&gt;</text><line x1="240" x2="240" y1="225" y2="231" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="232" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="250" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Sandbox Feedback₁</text><text x="65" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">&lt;interpreter&gt;</text><text x="65" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">[-4, 2]</text><text x="65" y="302" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">&lt;/interpreter&gt;</text><line x1="240" x2="240" y1="311" y2="317" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="318" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="336" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Text Thinking₂</text><text x="65" y="356" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">&amp;quot;Solution: x=-4 or x=2</text><text x="65" y="372" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Verification: 2²+2×2-8=0 ✓&amp;quot;</text><line x1="240" x2="240" y1="397" y2="403" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="380" height="78" x="50" y="404" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="60" y="422" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Final Answer</text><text x="65" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">\boxed{-4, 2}</text><rect width="280" height="130" x="470" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="610" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">SandboxFusion</text><text x="610" y="105" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">128 parallel workers</text><text x="610" y="125" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Python sandbox execution</text><text x="610" y="148" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">sympy/numpy/scipy</text><text x="610" y="168" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Timeout control + memory limit</text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 432,185 Q 432.5041728782917,142.81000344028462 468,120"/><rect width="40" height="24" x="422" y="126" fill="#fff" rx="3"/><text x="441.252" y="137.655" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Code</text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)" d="M 468,150 Q 469.1695571333223,216.2033393123934 432,271"/><rect width="40" height="24" x="440" y="192" fill="#fff" rx="3"/><text x="459.585" y="203.352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Result</text><rect width="280" height="260" x="470" y="220" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="610" y="242" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">PPO training loop</text><text x="480" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Base model: Qwen2.5-32B</text><text x="480" y="283" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">SFT cold start: ~1 hour</text><text x="480" y="301" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">RL training: ~9 days / 400 steps</text><text x="480" y="337" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">Per step: 32 questions × 16 candidates = 512</text><text x="480" y="355" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">Average 7-9 rounds of interaction/response</text><text x="480" y="391" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">AIME 2024 accuracy:</text><text x="480" y="409" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">SFT baseline: 25%</text><text x="480" y="427" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">After 110 steps: 52%</text><text x="480" y="445" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">After 400 steps: 67%</text></svg>