<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 40 880 580"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker></defs><rect width="880" height="580" x="0" y="40" fill="#fff"/><rect width="210" height="44" x="95" y="50" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="200" y="72" fill="#333" dominant-baseline="central" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">MCP Client</text><rect width="210" height="44" x="575" y="50" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="680" y="72" fill="#333" dominant-baseline="central" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">MCP Server</text><line x1="200" x2="200" y1="94" y2="600" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><line x1="680" x2="680" y1="94" y2="600" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><line x1="204" x2="676" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="120" fill="#333" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">சர்வர் திறன்களைக் கண்டறிதல் (விருப்பம்)</text><text x="440" y="162" fill="#777" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="14" text-anchor="middle">server/discover</text><line x1="676" x2="204" y1="205" y2="205" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="191" fill="#333" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">திறன் விளக்கத்தைத் திருப்புதல்</text><rect width="420" height="42" x="230" y="218" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="5"/><text x="440" y="244" fill="#555" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="16" text-anchor="middle">ஆதரிக்கப்படும் திறன்களும் தொடர்பு முறைகளும்</text><line x1="204" x2="676" y1="305" y2="305" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="285" fill="#333" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">கருவிப் பட்டியலைப் பெறுதல்</text><text x="440" y="327" fill="#777" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="14" text-anchor="middle">tools/list</text><line x1="676" x2="204" y1="370" y2="370" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="356" fill="#333" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">தரப்படுத்தப்பட்ட கருவி வரையறை</text><rect width="420" height="58" x="230" y="383" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="5"/><text x="440" y="406" fill="#444" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">get_weather — ஒரு நகரின் வானிலையை அறிதல்</text><text x="440" y="428" fill="#666" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="15" text-anchor="middle">உள்ளீடு: நகரம் வெளியீடு: வானிலைத் தகவல்</text><line x1="204" x2="676" y1="485" y2="485" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="465" fill="#333" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">தேர்ந்தெடுத்த கருவியை அழைத்தல்</text><text x="440" y="507" fill="#777" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="14" text-anchor="middle">tools/call: get_weather (Beijing)</text><line x1="676" x2="204" y1="550" y2="550" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="536" fill="#333" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">கருவி முடிவைத் திருப்புதல்</text><rect width="280" height="38" x="300" y="563" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="5"/><text x="440" y="587" fill="#555" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="16" text-anchor="middle">பெய்ஜிங்: 22°C, வெயில்</text><text x="90" y="205" fill="#666" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><tspan x="90" dy="-8">① திறன்</tspan><tspan x="90" dy="20">கண்டறிதல்</tspan></text><text x="90" y="370" fill="#666" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><tspan x="90" dy="-8">② கருவி</tspan><tspan x="90" dy="20">கண்டறிதல்</tspan></text><text x="90" y="550" fill="#666" font-family="Arial, FreeSerif, 'Noto Sans Tamil', 'Nirmala UI', Latha, sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><tspan x="90" dy="-8">③ கருவி</tspan><tspan x="90" dy="20">அழைப்பு</tspan></text></svg>