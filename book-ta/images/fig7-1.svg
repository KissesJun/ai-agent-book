<svg xmlns="http://www.w3.org/2000/svg" width="880" height="486" viewBox="0 0 880 486" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-s" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0 10 3.5 0 7"/></marker></defs><style>.t{font-family:Arial,&apos;Helvetica Neue&apos;,Helvetica,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#333;text-anchor:middle;dominant-baseline:central}.h{font-size:16px;font-weight:700}.s{fill:#666}.m,.s{font-size:12px}.n{font-size:10px;fill:#666}</style><rect width="690" height="56" x="100" y="20" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="445" y="40" class="t h">① வெற்றியின் வரையறை</text><text x="445" y="61" class="t s">Pass@k திறன் உச்சம் · Pass^k நம்பகத்தன்மை</text><line x1="445" x2="445" y1="76" y2="94" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="690" height="102" x="100" y="96" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="445" y="116" class="t h">② பணிகளின் மூலம்</text><rect width="206" height="54" x="116" y="130" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="219" y="147" class="t m">பொதுத் தரவரிசைச் சோதனைகள்</text><text x="219" y="167" class="t n">உத்திகளைக் கடன் · கரடு வடிகட்டல்</text><rect width="206" height="54" x="342" y="130" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="445" y="147" class="t m">சொந்த வணிகத் தொகுப்பு</text><text x="445" y="167" class="t n">உண்மையான பணிப் பரவல்</text><rect width="206" height="54" x="568" y="130" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="671" y="147" class="t m">உற்பத்தியிலிருந்து திரும்பல்</text><text x="671" y="167" class="t n">தோல்விக் காரணத்தின் விளைவு</text><line x1="445" x2="445" y1="198" y2="216" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="690" height="106" x="100" y="218" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="445" y="238" class="t h">③ சரிபார்ப்பு முறை</text><text x="445" y="257" class="t n">← பணியின் இயந்திரச் சரிபார்ப்புத் தன்மை அளவின்படி →</text><rect width="142" height="44" x="116" y="268" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="187" y="282" class="t m">நிர்ணயவாதம்</text><text x="187" y="300" class="t n">SWE-bench</text><line x1="262" x2="284" y1="290" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="142" height="44" x="288" y="268" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="359" y="282" class="t m">சோதனைப் பட்டியல்</text><text x="359" y="300" class="t n">τ²-bench</text><line x1="434" x2="456" y1="290" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="142" height="44" x="460" y="268" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="531" y="282" class="t m">Rubric + LLM</text><text x="531" y="300" class="t n">திறந்த பணிகள்</text><line x1="606" x2="628" y1="290" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#ah-s)"/><rect width="142" height="44" x="632" y="268" fill="#fff" stroke="#666" stroke-width="1.5" rx="5"/><text x="703" y="282" class="t m">இணை ஒப்பீடு</text><text x="703" y="300" class="t n">Chatbot Arena</text><line x1="445" x2="445" y1="324" y2="342" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="690" height="62" x="100" y="344" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="445" y="364" class="t h">④ முடிவுகளின் பயன்பாடு</text><text x="445" y="388" class="t s">புள்ளியியல் முக்கியத்துவம் → தோல்விக் காரணம் → பின்னடைவு → மாதிரி &amp; Harness</text><path fill="none" stroke="#333" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#ah)" d="M100 375 L52 375 L52 147 L96 147"/><text x="52" y="262" class="t n" transform="rotate(-90 52 262)">பின்னடைவுப் பணிகள் புதிய வழக்குகளாகும்</text><rect width="690" height="46" x="100" y="424" fill="#f3f0e8" stroke="#333" stroke-width="2" rx="6"/><text x="445" y="440" class="t m" font-weight="bold">ஆதரவுக் கட்டமைப்பு</text><text x="445" y="458" class="t n">கவனிக்கத்தன்மை · உள் மதிப்பீட்டுக் கட்டமைப்பு (அப்லேஷன் / AB / கொடிகள்) · உருவகச் சூழல் (அத்தியாயம் 8)</text></svg>