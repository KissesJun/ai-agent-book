<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 40 880 490" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="250" height="150" x="30" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Rubric</text><line x1="40" x2="270" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="45" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Factual Correctness: Essential</text><text x="45" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Logical Coherence: Important</text><text x="45" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Hallucination Detection: Veto ⚠</text><text x="45" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Completeness: Important</text><rect width="250" height="150" x="315" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Candidate Answer</text><line x1="325" x2="555" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="330" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Agent Output:</text><text x="330" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">&amp;quot;Refund processed, $150 will be credited within</text><text x="330" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">3-5 business days.&amp;quot;</text><rect width="250" height="150" x="600" y="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="725" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Reference Solution (Optional)</text><line x1="610" x2="840" y1="94" y2="94" stroke="#999" stroke-width="2"/><text x="615" y="115" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11.5" text-anchor="start">Standard Answer / Scoring Points:</text><text x="615" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Must include refund amount</text><text x="615" y="159" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Must include credit time</text><text x="615" y="181" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Cannot promise a specific date</text><line x1="155" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="440" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="725" x2="440" y1="210" y2="240" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="50" x="280" y="245" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="262" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Judge Model (GPT-5 / Gemini 2.5)</text><text x="440" y="282" fill="#ccc" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Multi-source heterogeneous evaluation to prevent same-source bias</text><line x1="440" x2="440" y1="295" y2="325" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="760" height="180" x="60" y="328" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="350" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Structured evaluation output</text><rect width="360" height="125" x="75" y="370" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="85" y="390" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Factual Correctness</text><text x="250" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="390" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8" font-weight="normal" text-anchor="start">Amount and time are both accurate</text><text x="85" y="414" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Completeness</text><text x="250" y="414" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3/4</text><text x="300" y="414" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" font-weight="normal" text-anchor="start">Missing explanation of refund method</text><text x="85" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Hallucination Detection</text><text x="250" y="438" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PASS</text><text x="300" y="438" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">No false information</text><text x="85" y="462" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Logical Coherence</text><text x="250" y="462" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="462" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">Clear causal relationship</text><rect width="345" height="125" x="460" y="370" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="632" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Scoring Aggregation Strategy</text><text x="475" y="415" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Weighted average: Σ(weight × dimension score)</text><text x="475" y="437" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Veto: Hallucination=FAIL → total score=0</text><text x="475" y="459" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">Multi-judge: median of 3 judges</text><text x="475" y="481" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Edge case flag: disagreement &gt;2 points → human review</text></svg>