<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 40 920 380" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="240" height="90" x="340" y="250" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="460" y="278" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">செயல் நினைவகம்</text><text x="460" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">செயலில் உள்ள பணியிடம்</text><text x="460" y="322" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">தற்போதைய பணி நிலை</text><rect width="200" height="84" x="60" y="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="160" y="104" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">நிகழ்வு நினைவகம்</text><text x="160" y="128" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">நிகழ்வு</text><text x="160" y="148" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:9.5px">மேனிலைத் தரவுடன் நிகழ்வு வரிசைகள்</text><rect width="200" height="84" x="360" y="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="460" y="104" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:18.5px">பொருண்மை நினைவகம்</text><text x="460" y="128" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">பொருண்மை</text><text x="460" y="148" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:13.5px">சுருக்கப்பட்ட பொது அறிவு</text><rect width="200" height="84" x="660" y="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="760" y="104" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">நடைமுறை நினைவகம்</text><text x="760" y="128" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">நடைமுறை</text><text x="760" y="148" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:10.5px">மறுபயன்பாட்டு நடத்தை ஓட்டங்கள்</text><line x1="200" x2="410" y1="168" y2="246" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="430" x2="250" y1="246" y2="168" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="460" x2="460" y1="164" y2="246" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="460" x2="470" y1="246" y2="164" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="720" x2="510" y1="168" y2="246" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="490" x2="700" y1="246" y2="164" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="150" height="25" x="242" y="194" fill="#fff" rx="3"/><text x="317" y="207" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:10px">தேர்ந்தெடுத்த இடமாற்றம்</text><rect width="150" height="25" x="536" y="194" fill="#fff" rx="3"/><text x="611" y="207" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:9.5px">செயல்படுத்தலும் ஏற்றலும்</text><text x="460" y="60" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">நீண்டகால நினைவகம் (அமர்வுகளுக்கிடையே)</text><text x="460" y="364.75" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:12.5px">செயல் நினைவகத்திற்கும் நீண்டகால நினைவகத்திற்கும் இடையிலான இயங்கு தொடர்பு: முக்கியத் தகவல்</text><text x="460" y="379.25" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:12.5px">தேர்ந்தெடுத்து எழுதப்படுகிறது, தொடர்புடைய நினைவுகள் தேவைக்கேற்ப செயல்படுத்தப்படுகின்றன.</text></svg>