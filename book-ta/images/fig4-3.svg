<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><text x="220" y="65" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">எளிய அணுகுமுறை (இடையகம் செல்லாது)</text><rect width="380" height="120" x="30" y="85" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="220" y="107" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">System Prompt</text><text x="220" y="129" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">நீங்கள் ஒரு AI உதவியாளர்...</text><text x="220" y="149" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">+ அனைத்து கருவி schema</text><text x="390" y="107" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="end">~50K tokens</text><rect width="380" height="100" x="30" y="213" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="220" y="235" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">User Message</text><text x="220" y="257" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">NVDA பங்கு விலையை வினவு</text><rect width="380" height="80" x="30" y="321" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="220" y="343" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Assistant</text><text x="220" y="365" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tool_call: ...</text><rect width="380" height="40" x="30" y="414" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="220" y="434" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:11.5px">புதிய கருவி ஏற்றும்போதெல்லாம் → முழு இடையகமும் செல்லாது!</text><text x="660" y="65" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:17.5px">மேம்படுத்திய அணுகுமுறை (இடையகம் நிலையானது)</text><rect width="400" height="75" x="460" y="85" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="4"/><text x="660" y="101" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">System Prompt (நிலையானது)</text><text x="660" y="117" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">நீங்கள் ஒரு AI உதவியாளர்...</text><text x="660" y="133" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">பங்கு + விதிகள் + அடிப்படைக் கருவிகள்</text><text x="850" y="101" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" font-weight="normal" text-anchor="end">~2K tokens | KV இடையகம்</text><rect width="400" height="45" x="460" y="165" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="660" y="181" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Agent நிலைப்பட்டை (இலகுவானது)</text><text x="660" y="197" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">கிடைப்பவை: web_search, get_weather...</text><text x="850" y="181" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="end">~200 tokens</text><rect width="400" height="40" x="460" y="215" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="660" y="231" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">User: discover_tools</text><text x="660" y="247" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">&quot;பங்கு விலை வேண்டும்&quot;</text><rect width="400" height="55" x="460" y="260" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="660" y="276" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Tool Result</text><text x="660" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">get_stock_quote schema திரும்பும்</text><text x="850" y="276" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="end">கருவி வரையறை இங்கே</text><rect width="400" height="40" x="460" y="320" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="660" y="336" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">User Message</text><text x="660" y="352" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">NVDA பங்கு விலையை வினவு</text><rect width="400" height="45" x="460" y="365" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="660" y="381" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Agent நிலைப்பட்டை (புதுப்பிக்கப்பட்டது)</text><text x="660" y="397" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">+get_stock_quote சேர்க்கப்பட்டது</text><text x="850" y="381" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="normal" text-anchor="end">~220 tokens</text><rect width="400" height="40" x="460" y="420" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="660" y="440" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:12px">System Prompt மாறவில்லை → KV Cache முழுமையாக மறுபயன்பாடு</text><line x1="30" x2="850" y1="475" y2="475" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="250" y="495" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">பரிமாணம்</text><text x="500" y="495" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">எளிய</text><text x="740" y="495" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">மேம்படுத்திய</text><text x="250" y="523" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">இடையக வெற்றி விகிதம்</text><text x="500" y="523" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~0% (ஒவ்வொரு கருவி மாற்றத்திலும் செல்லாது)</text><text x="740" y="523" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~95% (hint மட்டும் சிறிது மாறும்)</text><text x="250" y="551" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">முதல் Token தாமதம்</text><text x="500" y="551" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">அதிகம் (ஒவ்வொரு முறையும் 50K tokens மறுகணிப்பு)</text><text x="740" y="551" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:13px">குறைவு (படிமுறைக் கணிப்பு ~200 tokens)</text></svg>