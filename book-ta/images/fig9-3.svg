<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" style="background:#fff"><defs><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#52636d}.accent,.box{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.accent{fill:#e8f1f5;stroke:#2f617a}</style></defs><text x="500" y="30" class="t h" text-anchor="middle" style="font-size:17.5px">ஒரு திறன் எப்படி பிரதிநிதித்துவப்படுகிறதோ அது எங்கு புதுப்பிக்கப்படும் என்பதைத் தீர்மானிக்கும்</text><rect width="220" height="126" x="35" y="72" class="box" rx="9"/><text x="145" y="105" class="t h" text-anchor="middle">அறிவு</text><text x="145" y="135" class="t s" text-anchor="middle" style="font-size:11px">உண்மைகள், அனுபவம், விதிவிலக்குகள்</text><text x="145" y="164" class="t s" text-anchor="middle">Markdown / அறிவுத் தளம்</text><rect width="220" height="126" x="275" y="72" class="box" rx="9"/><text x="385" y="105" class="t h" text-anchor="middle">அறிவுறுத்தல்கள்</text><text x="385" y="126.3" class="t s" text-anchor="middle" style="font-size:15px">சொற்களில் வடிக்கக்கூடிய</text><text x="385" y="143.7" class="t s" text-anchor="middle" style="font-size:15px">தீர்ப்புக் கோட்பாடுகள்</text><text x="385" y="164" class="t s" text-anchor="middle">Prompt / Skill</text><rect width="220" height="126" x="515" y="72" class="box" rx="9"/><text x="625" y="105" class="t h" text-anchor="middle">நிரல்கள்</text><text x="625" y="126.01" class="t s" text-anchor="middle" style="font-size:15.5px">நிர்ணய ஓட்டங்களும்</text><text x="625" y="143.99" class="t s" text-anchor="middle" style="font-size:15.5px">கடும் கட்டுப்பாடுகளும்</text><text x="625" y="164" class="t s" text-anchor="middle" style="font-size:13px">கருவிகள் / பணிஓட்டம் / Harness</text><rect width="220" height="126" x="755" y="72" class="accent" rx="9"/><text x="865" y="105" class="t h" text-anchor="middle">அளபுருக்கள்</text><text x="865" y="135" class="t s" text-anchor="middle" style="font-size:9px">உயர்பரிமாண உணர்வும் மறைமுகக் கொள்கையும்</text><text x="865" y="164" class="t s" text-anchor="middle">SFT / வடித்தல் / RL</text><line x1="145" x2="865" y1="226" y2="226" stroke="#33434d" stroke-width="2"/><path stroke="#33434d" stroke-width="2" d="M145 218 V234 M865 218 V234"/><text x="145" y="260" class="t s" text-anchor="middle" style="font-size:13.5px">எளிதில் புதுப்பிக்கலாம், தடமறியலாம்</text><text x="865" y="260" class="t s" text-anchor="middle" style="font-size:11.5px">உள்வாங்கப்பட்டது, குறைந்த அனுமான செலவு</text><text x="500" y="289" class="t h" text-anchor="middle">ஒருவழிப் படிக்கட்டு அல்ல, நான்கு நிரப்பு ஊடகங்கள்</text><rect width="710" height="58" x="145" y="320" class="accent" rx="8"/><text x="500" y="344" class="t h" text-anchor="middle" style="font-size:13px">முதல் கேள்வி: அத்திறனை உண்மைகள், மொழி விதிகள் அல்லது நிரல்களால் முழுமையாகச் சொல்ல முடியுமா?</text><text x="500" y="367" class="t s" text-anchor="middle" style="font-size:14px">நிலைத்தன்மை, செலவு, புதுப்பிப்பு அடர்த்தி பயன்பாட்டை முடிவு செய்யும்; அளபுருவாக்கம் அல்ல</text></svg>