<svg xmlns="http://www.w3.org/2000/svg" width="920" height="412" viewBox="0 40 920 412" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="200" height="42" x="24" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="124" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">எளிய குறிப்புகள்</text><rect width="172" height="84" x="38" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="48" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">“பயனர் மின்னஞ்சல்:</text><text x="48" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">john@x.com&quot;</text><text x="124" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ அணு உண்மை · O(1)</text><text x="124" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:14px">✓ மிகக் குறைந்த கூடுதல் செலவு</text><text x="124" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:15.5px">✗ தொடர்பு இழக்கப்படுகிறது</text><rect width="200" height="42" x="248" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="348" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:11.5px">விரிவாக்கப்பட்ட குறிப்புகள்</text><rect width="172" height="84" x="262" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="272" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" text-anchor="start" style="font-size:12px">“TechCorp நிறுவனத்தில்,</text><text x="272" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">ஒரு மூத்த பொறியாளர்</text><text x="272" y="185.88" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" text-anchor="start" style="font-size:14px">ஐந்து பேர் குழுவை</text><text x="272" y="202.12" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" text-anchor="start" style="font-size:14px">வழிநடத்துகிறார்.”</text><text x="348" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ முழுமையான விவரிப்பு</text><text x="348" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ பொருண்மையில் முழுமை</text><text x="348" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ மிகைபடும் · புதுப்பிப்பது கடினம்</text><text x="348" y="318" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ நீண்ட உரையை மீட்டெடுப்பது கடினம்</text><rect width="200" height="42" x="472" y="70" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="572" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">JSON அட்டைகள்</text><rect width="172" height="84" x="486" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="496" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">work.position</text><text x="496" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">.title = …</text><text x="496" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" text-anchor="start" style="font-size:11px">(வகை → திறவுகோல்-மதிப்பு)</text><text x="572" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ மூன்று நிலை அமைப்பு</text><text x="572" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✓ பகுதி புதுப்பிப்பை ஆதரிக்கும்</text><text x="572" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">✗ இறுக்கமான வகைப்பாடு</text><rect width="200" height="42" x="696" y="70" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="796" y="91" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle" style="font-size:14.5px">மேம்பட்ட JSON அட்டைகள்</text><rect width="172" height="84" x="710" y="126" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="720" y="150" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">+ backstory</text><text x="720" y="172" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">+ person</text><text x="720" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">+ relationship</text><text x="796" y="236" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">✓ தெளிவாக்கம் · அறிவு மேலாண்மை</text><text x="796" y="262" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:13.5px">✓ மூலங்கள் மற்றும் உறவுகளுடன்</text><text x="796" y="292" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="middle" style="font-size:9px">✗ உருவாக்கவும் பராமரிக்கவும் விலை உயர்ந்தது</text><line x1="70" x2="850" y1="400" y2="400" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="70" y="383" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="start">எளிமை</text><text x="850" y="377.78" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="end" style="font-size:9px">வெளிப்பாட்டுத்</text><text x="850" y="388.22" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="normal" text-anchor="end" style="font-size:9px">திறன்</text><text x="460" y="424" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">எளிமை குறைய, வெளிப்பாட்டுத் திறன் கூடும்</text></svg>