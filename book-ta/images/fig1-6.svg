<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" aria-labelledby="title desc" lang="ta" role="img" viewBox="0 0 820 470"><title id="title">தன்னாட்சி ஏஜெண்டின் செயல்படுத்தும் சுழற்சி</title><desc id="desc">ஏஜெண்ட் சிந்தித்து, செயல்பட்டு, கவனித்த பிறகு வெளியேறும் நிபந்தனைகளைச் சரிபார்த்து, இறுதி முடிவை வழங்குகிறது அல்லது அடுத்த சுழற்சியைத் தொடங்குகிறது.</desc><defs><marker id="arrow-dark" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#333" points="0 0 9 3.5 0 7"/></marker><marker id="arrow-light" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#777" points="0 0 9 3.5 0 7"/></marker><style>.sans{font-family:&quot;Noto Sans Tamil&quot;,&quot;Tamil Sangam MN&quot;,Arial,sans-serif}.code{font-family:&quot;Courier New&quot;,Courier,monospace}.heading{fill:#333;font-size:16px;font-weight:700}.body{fill:#333;font-size:15px}.note,.small{font-size:14px}.note{fill:#666}.box,.flow{stroke:#333;stroke-width:2}.flow{fill:none;marker-end:url(#arrow-dark)}</style></defs><rect width="820" height="470" fill="#fff"/><rect width="210" height="96" x="45" y="70" fill="#e8e8e8" class="box" rx="8"/><text x="60" y="95" class="sans heading" dominant-baseline="middle">① சிந்தனை</text><rect width="180" height="38" x="60" y="112" fill="#fff" stroke="#777" rx="5"/><text x="150" y="132" class="sans body small" dominant-baseline="middle" text-anchor="middle">&quot;மேலும் தகவல் தேவை&quot;</text><rect width="210" height="96" x="305" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="320" y="95" class="sans heading" dominant-baseline="middle">② செயல்</text><rect width="180" height="38" x="320" y="112" fill="#fff" stroke="#777" rx="5"/><text x="410" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">web_search(...)</text><rect width="210" height="96" x="565" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="580" y="95" class="sans heading" dominant-baseline="middle">③ கவனிப்பு</text><rect width="180" height="38" x="580" y="112" fill="#fff" stroke="#777" rx="5"/><text x="670" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">tool_result: &quot;...&quot;</text><line x1="255" x2="302" y1="118" y2="118" class="flow"/><line x1="515" x2="562" y1="118" y2="118" class="flow"/><line x1="670" x2="670" y1="166" y2="207" class="flow"/><rect width="430" height="145" x="45" y="220" fill="#fff" stroke="#777" stroke-dasharray="7 4" stroke-width="2" rx="8"/><text x="65" y="244" class="sans heading small" dominant-baseline="middle">வெளியேறும் நிபந்தனைகள் (ஏதேனும் ஒன்று)</text><line x1="65" x2="455" y1="258" y2="258" stroke="#ccc"/><text x="65" y="282" class="sans body small" dominant-baseline="middle">① பணி முடிந்தது</text><text x="250" y="282" class="sans body small" dominant-baseline="middle">② final_answer அழைப்பு</text><text x="65" y="314" class="sans body small" dominant-baseline="middle">③ கருவி அழைப்பு இல்லை</text><text x="250" y="314" class="sans body small" dominant-baseline="middle">④ பிழை வரம்பு மீறியது</text><text x="65" y="346" class="sans body small" dominant-baseline="middle">⑤ அதிகபட்ச சுற்றுகள்</text><path fill="none" stroke="#777" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-light)" d="M 475 260 H 587"/><rect width="80" height="20" x="493" y="238" fill="#fff" rx="3"/><text x="533" y="248" class="sans note small" dominant-baseline="middle" text-anchor="middle">நிபந்தனைகள்</text><polygon fill="#e2e2e2" points="670 208 750 260 670 312 590 260" class="box"/><text x="670" y="260" class="sans heading small" dominant-baseline="middle" text-anchor="middle">வெளியேறலாமா?</text><path d="M 750 260 H 795 V 35 H 150 V 67" class="flow"/><text x="773" y="245" class="sans note" dominant-baseline="middle" text-anchor="middle">இல்லை</text><rect width="150" height="22" x="345" y="43" fill="#fff" rx="3"/><text x="420" y="54" class="sans note small" dominant-baseline="middle" text-anchor="middle">சுழற்சியைத் தொடரவும்</text><line x1="670" x2="670" y1="312" y2="379" class="flow"/><text x="685" y="346" class="sans note" dominant-baseline="middle">ஆம்</text><rect width="230" height="68" x="555" y="382" fill="#d6d6d6" class="box" rx="8"/><text x="670" y="416" class="sans heading" dominant-baseline="middle" text-anchor="middle">இறுதி முடிவை வெளியிடு</text></svg>