<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">அனுபவத்தை அறிவாக்குதல்: பாதைகள் சான்று, ஆவணமே மறுபயன்பாட்டு அலகு</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle">மூலப் பாதை</text><text x="106" y="139" class="t s" text-anchor="middle" style="font-size:10.5px">செயல்கள், முடிவுகள், சூழல்</text><text x="106" y="160" class="t s" text-anchor="middle">மாறாத சான்று</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle" style="font-size:16.5px">ஒற்றை மதிப்பீடு</text><text x="299" y="139" class="t s" text-anchor="middle" style="font-size:11px">வெற்றி, தோல்வி, சிட்டைகள்</text><text x="299" y="151.3" class="t s" text-anchor="middle" style="font-size:15px">சான்றின் இடத்தைத்</text><text x="299" y="168.7" class="t s" text-anchor="middle" style="font-size:15px">தக்கவைக்கும்</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle" style="font-size:12px">பாதைகளுக்கிடையே ஒப்பீடு</text><text x="500" y="128" class="t s" text-anchor="middle" style="font-size:14px">ஒத்த பணிகளைத் திரட்டு</text><text x="500" y="142.59" class="t s" text-anchor="middle" style="font-size:14.5px">வெற்றியையும்</text><text x="500" y="159.41" class="t s" text-anchor="middle" style="font-size:14.5px">தோல்வியையும் ஒப்பிடு</text><text x="500" y="166.75" class="t s" text-anchor="middle" style="font-size:12.5px">பொதுத்தன்மையையும்</text><text x="500" y="181.25" class="t s" text-anchor="middle" style="font-size:12.5px">எல்லைகளையும் பிரித்தெடு</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle">Markdown ஆவணம்</text><text x="709" y="128" class="t s" text-anchor="middle" style="font-size:9px">பொருந்தும் சூழல்களும் உத்தியும்</text><text x="709" y="143.75" class="t s" text-anchor="middle" style="font-size:12.5px">விதிவிலக்குகள்,</text><text x="709" y="158.25" class="t s" text-anchor="middle" style="font-size:12.5px">தடைப்பகுதிகள், மூலங்கள்</text><text x="709" y="174" class="t s" text-anchor="middle" style="font-size:10px">பதிப்பும் சரிபார்ப்பு நேரமும்</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="102.01" class="t h" text-anchor="middle" style="font-size:15.5px">மீட்டெடுத்துப்</text><text x="902" y="119.99" class="t h" text-anchor="middle" style="font-size:15.5px">பயன்படுத்து</text><text x="902" y="131.46" class="t s" text-anchor="middle" style="font-size:13px">புதிய பணிகளுக்குத்</text><text x="902" y="146.54" class="t s" text-anchor="middle" style="font-size:13px">தேவைக்கேற்ப ஏற்று</text><text x="902" y="152.17" class="t s" text-anchor="middle" style="font-size:13.5px">தொடர்ந்து</text><text x="902" y="167.83" class="t s" text-anchor="middle" style="font-size:13.5px">பின்னூட்டம் தரும்</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">புதிய சான்று பழைய அறிவைத் திருத்தும், வரையறுக்கும் அல்லது நீக்கும்</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="325.33" class="t s" text-anchor="middle" style="font-size:11.5px">மூன்றாம் அத்தியாயத்தின் பிரித்தெடுப்பு மற்றும் மீட்டெடுப்புக் கட்டமைப்பைப் பகிர்கிறது;</text><text x="508" y="338.67" class="t s" text-anchor="middle" style="font-size:11.5px">இவ்வத்தியாயம் பாதை மதிப்பீட்டையும் நடத்தை மேம்பாட்டு வளையத்தையும் சேர்க்கிறது</text></svg>