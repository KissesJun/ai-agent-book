<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 40 820 480" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="760" height="28" x="30" y="55" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="410" y="69" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">▼ 同一上下文连续流动 — 对话历史在阶段间完整保留 ▼</text><rect width="248" height="380" x="24" y="100" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="148" y="122" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">阶段 1</text><text x="148" y="142" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">需求分析师</text><rect width="232" height="88" x="32" y="160" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="40" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">系统提示词</text><text x="40" y="192" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">&quot;你的职责是充分理解需求。</text><text x="40" y="208" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">不要急于实现，在这个阶段</text><text x="40" y="224" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">你的任务是提问和确认。&quot;</text><rect width="232" height="78" x="32" y="258" fill="#fff" stroke="#333" stroke-width="2" rx="3"/><text x="40" y="272" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">工具集</text><text x="40" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">ask_clarifying_question(q)</text><text x="40" y="310" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">save_requirement(k, v)</text><text x="40" y="330" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">complete_req_analysis()</text><rect width="232" height="48" x="32" y="390" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="148" y="406" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">触发转换</text><text x="148" y="424" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="middle">complete_req_analysis()</text><line x1="274" x2="288" y1="410" y2="410" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="248" height="380" x="290" y="100" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="414" y="122" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">阶段 2</text><text x="414" y="142" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">软件工程师</text><rect width="232" height="88" x="298" y="160" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="306" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">系统提示词</text><text x="306" y="192" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">&quot;根据已确认的需求编写</text><text x="306" y="208" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">高质量 Python 代码。遵循</text><text x="306" y="224" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">模块化、错误处理最佳实践。&quot;</text><rect width="232" height="78" x="298" y="258" fill="#fff" stroke="#333" stroke-width="2" rx="3"/><text x="306" y="272" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">工具集</text><text x="306" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">write_file(path, content)</text><text x="306" y="310" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">read_file(path)</text><text x="306" y="330" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">execute_code(code)</text><rect width="232" height="48" x="298" y="390" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="414" y="406" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">触发转换</text><text x="414" y="424" fill="#fff" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="middle">submit_for_review()</text><line x1="540" x2="554" y1="410" y2="410" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="248" height="380" x="556" y="100" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="680" y="122" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">阶段 3</text><text x="680" y="142" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">代码审查员</text><rect width="232" height="88" x="564" y="160" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="572" y="175" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">系统提示词</text><text x="572" y="192" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">&quot;从多个维度评估代码质量：</text><text x="572" y="208" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">功能正确性、代码规范、</text><text x="572" y="224" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">安全性。采用批判性思维。&quot;</text><rect width="232" height="78" x="564" y="258" fill="#fff" stroke="#333" stroke-width="2" rx="3"/><text x="572" y="272" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">工具集</text><text x="572" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">run_linter(file)</text><text x="572" y="310" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">run_tests(file)</text><text x="572" y="330" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">analyze_complexity(file)</text><text x="410" y="510" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">角色转换：更新系统提示词 + 工具集，对话历史和状态连续保留</text></svg>