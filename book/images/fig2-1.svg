<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 40 820 580" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="700" height="84" x="40" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="80" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">系统提示词（System Prompt）</text><text x="65" y="102" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;You are a helpful assistant. You MUST answer concisely.&quot;</text><text x="65" y="124" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;Use tools when the user asks for real-time information.&quot;</text><rect width="700" height="84" x="40" y="152" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="172" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">工具定义（Tool Definitions）</text><text x="65" y="194" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">{&quot;name&quot;: &quot;web_search&quot;, &quot;description&quot;: &quot;Search the web&quot;,</text><text x="65" y="216" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&quot;parameters&quot;: {&quot;query&quot;: {&quot;type&quot;: &quot;string&quot;}}}</text><rect width="700" height="106" x="40" y="244" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="264" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">对话历史（Conversation History）</text><text x="65" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">user: &quot;北京今天天气怎么样？&quot;</text><text x="65" y="308" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">assistant: [tool_call] → get_weather(&quot;北京&quot;)</text><text x="65" y="330" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">tool: {&quot;temp&quot;: &quot;23°C&quot;, &quot;conditions&quot;: &quot;晴&quot;}</text><rect width="700" height="84" x="40" y="358" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="378" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">本轮思考（Reasoning）</text><text x="65" y="400" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">&lt;think&gt;用户问天气，我已经获得了工具结果，</text><text x="65" y="422" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">可以直接汇总回答，无需再调用工具。&lt;/think&gt;</text><rect width="700" height="62" x="40" y="450" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="55" y="470" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">当前生成位置 →</text><text x="65" y="492" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="14" text-anchor="start">assistant: &quot;北京今天晴，气温 23°C...&quot; ← LLM 正在生成</text><path fill="none" stroke="#333" stroke-width="2" d="M 748,60 C 768,60 768,281.0 773,286.0 C 768,291.0 768,512 748,512"/><text x="755" y="274" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">上下文</text><text x="755" y="298" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="start">窗口</text><rect width="620" height="50" x="100" y="535" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="410" y="552" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">窗口大小：Qwen3 = 32K tokens | Claude = 200K | Gemini = 2M</text><text x="410" y="572" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">所有内容序列化为 token 流 → Transformer 注意力机制处理</text></svg>