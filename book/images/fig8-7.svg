<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 40 780 480" style="background:#fff"><defs><marker id="ah" markerHeight="4" markerWidth="5" orient="auto" refX="5" refY="2"><polygon fill="#333" points="0 0 5 2 0 4"/></marker><marker id="ah-light" markerHeight="4" markerWidth="5" orient="auto" refX="5" refY="2"><polygon fill="#999" points="0 0 5 2 0 4"/></marker></defs><rect width="350" height="310" x="20" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="32" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Q-learning Agent</text><rect width="350" height="310" x="410" y="55" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="8"/><text x="422" y="73" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">LLM Agent（Kimi K2）</text><rect width="320" height="48" x="35" y="85" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="109" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">状态：哈希编码 0x3A7F</text><text x="195" y="123" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">room=2, items=[key], doors=[N]</text><rect width="320" height="48" x="35" y="147" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="171" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Q 表查找</text><text x="195" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">145 个状态 × 7 个动作 = 1015 条目</text><line x1="195" x2="195" y1="135" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="35" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">ε-贪婪选择</text><text x="195" y="247" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ε=0.1 → 90% 最优 / 10% 随机</text><line x1="195" x2="195" y1="197" y2="207" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="35" y="271" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="195" y="295" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">动作：整数 ID</text><text x="195" y="309" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">a=3 → &quot;向北移动&quot;（无语义理解）</text><line x1="195" x2="195" y1="259" y2="269" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="85" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="109" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">状态：自然语言描述</text><text x="585" y="123" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">&quot;储藏室有红钥匙，北门被锁&quot;</text><rect width="320" height="48" x="425" y="147" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="171" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">LLM 推理 + 经验缓冲</text><text x="585" y="185" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">推理：&quot;门被锁→需要钥匙→拿钥匙&quot;</text><line x1="585" x2="585" y1="135" y2="145" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="209" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="233" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">语义动作选择</text><text x="585" y="247" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">理解概念关系，有目的地决策</text><line x1="585" x2="585" y1="197" y2="207" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="320" height="48" x="425" y="271" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="6"/><text x="585" y="295" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">动作：结构化指令</text><text x="585" y="309" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">{&quot;action&quot;:&quot;pick_up&quot;,&quot;target&quot;:&quot;red_key&quot;}</text><line x1="585" x2="585" y1="259" y2="269" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="720" height="105" x="30" y="382" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="404" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">性能对比</text><text x="200" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">指标</text><text x="380" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Q-learning</text><text x="600" y="424" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LLM Agent</text><text x="200" y="442" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">首次通关</text><text x="380" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~7000 episodes</text><text x="600" y="442" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">第 1 局（17 步）</text><text x="200" y="460" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">最终胜率</text><text x="380" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">100%（10K ep 后）</text><text x="600" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">~90%（即时）</text><text x="200" y="478" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">计算成本</text><text x="380" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">10 秒 / 10K ep</text><text x="600" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1-2 分钟 / 局</text></svg>