<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 40 880 480" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-compact" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="220" height="250" x="20" y="65" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="130" y="88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">多模态观测</text><rect width="190" height="42" x="35" y="105" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">头部相机</text><text x="130" y="138" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">224×224 RGB</text><rect width="190" height="42" x="35" y="160" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="175" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">左腕相机</text><text x="130" y="193" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">224×224 RGB</text><rect width="190" height="42" x="35" y="215" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="130" y="230" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">右腕相机</text><text x="130" y="248" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">224×224 RGB</text><rect width="190" height="30" x="35" y="275" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="45" y="290" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">14维关节状态向量</text><rect width="310" height="250" x="280" y="65" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="435" y="88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">视觉-语言-动作模型 (VLA)</text><rect width="280" height="50" x="295" y="105" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">视觉编码器</text><text x="450" y="145" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">SigLIP → 视觉 tokens</text><line x1="435" x2="435" y1="157" y2="168" stroke="#333" stroke-width="2" marker-end="url(#ah-compact)"/><rect width="280" height="50" x="295" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">语言模型</text><text x="450" y="210" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Llama 2 7B backbone</text><line x1="435" x2="435" y1="222" y2="233" stroke="#333" stroke-width="2" marker-end="url(#ah-compact)"/><rect width="280" height="78" x="295" y="235" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="435" y="252" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">动作解码器</text><text x="435" y="272" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">→ 14维连续控制向量</text><text x="435" y="298" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="middle">动作分块: 1次生成25个连续动作</text><line x1="240" x2="278" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="240" x2="278" y1="257" y2="257" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="32" x="300" y="345" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="430" y="361" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">指令: &quot;将罐子放入锅中&quot;</text><line x1="430" x2="430" y1="345" y2="315" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="230" height="250" x="630" y="65" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="745" y="88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SAPIEN 物理引擎</text><rect width="200" height="55" x="645" y="105" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="745" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">双臂机器人</text><text x="745" y="145" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">各7自由度 = 14维动作</text><rect width="200" height="55" x="645" y="175" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="745" y="195" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">环境随机化</text><text x="745" y="215" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">位置60cm/朝向±22.5°</text><rect width="200" height="55" x="645" y="245" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="745" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">碰撞检测 + 物理仿真</text><text x="745" y="285" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">刚体/软体/摩擦力</text><line x1="590" x2="628" y1="220" y2="220" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="609" y="210" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">动作</text><line x1="630" x2="592" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="611" y="120" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">观测</text><line x1="20" x2="860" y1="385" y2="385" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="408" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">评估指标</text><rect width="180" height="75" x="60" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">成功率</text><text x="150" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">罐子在锅内</text><text x="150" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">且未掉落</text><rect width="180" height="75" x="260" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">完成时间</text><text x="350" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">25步×25动作</text><text x="350" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">= 625控制步</text><rect width="180" height="75" x="460" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">泛化能力</text><text x="550" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">跨位置/朝向</text><text x="550" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">/外观变体</text><rect width="180" height="75" x="660" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="750" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sim-to-Real</text><text x="750" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">域随机化</text><text x="750" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">→ 真实迁移</text></svg>