<svg xmlns="http://www.w3.org/2000/svg" width="780" height="455" viewBox="0 40 780 455" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="300" height="100" x="240" y="60" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Manager Agent</text><text x="390" y="106" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">任务理解 → 分解 → 调度 → 综合</text><text x="390" y="126" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">工具集: [call_agent_A, call_agent_B,</text><text x="390" y="142" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">call_agent_C, search, write_file]</text><rect width="210" height="120" x="50" y="240" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="155" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sub-Agent A</text><text x="155" y="280" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">角色: 数据收集</text><text x="155" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">搜索技术文档</text><text x="155" y="320" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">提取关键信息</text><rect width="50" height="20" x="205" y="335" fill="#999" stroke="#333" stroke-width="2" rx="10"/><text x="230" y="345" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Step 1</text><line x1="290" x2="155" y1="162" y2="238" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="262" x2="283" y1="300" y2="300" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="210" height="120" x="285" y="240" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="390" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sub-Agent B</text><text x="390" y="280" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">角色: 分析处理</text><text x="390" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">对比分析数据</text><text x="390" y="320" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">生成统计报告</text><rect width="50" height="20" x="440" y="335" fill="#999" stroke="#333" stroke-width="2" rx="10"/><text x="465" y="345" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Step 2</text><line x1="390" x2="390" y1="162" y2="238" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><line x1="497" x2="518" y1="300" y2="300" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="210" height="120" x="520" y="240" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="625" y="260" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sub-Agent C</text><text x="625" y="280" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">角色: 报告生成</text><text x="625" y="302" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">撰写最终报告</text><text x="625" y="320" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">格式化输出</text><rect width="50" height="20" x="675" y="335" fill="#999" stroke="#333" stroke-width="2" rx="10"/><text x="700" y="345" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Step 3</text><line x1="490" x2="625" y1="162" y2="238" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="720" height="95" x="30" y="380" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="398" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">顺序执行流</text><text x="50" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">Manager 调用 A</text><text x="155" y="420" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ A 返回数据</text><text x="260" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ Manager 传给 B</text><text x="380" y="420" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ B 返回分析</text><text x="485" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ Manager 传给 C</text><text x="610" y="420" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">→ C 返回报告</text><text x="390" y="452" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Manager 视角：调用 Agent = 调用工具（发请求 → 获响应）</text></svg>