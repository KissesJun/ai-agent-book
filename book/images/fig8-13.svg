ominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#09 × 失败</text><rect width="105" height="30" x="595" y="166" fill="#eee" stroke="#333" stroke-width="1.5" rx="5"/><text x="647.5" y="182" fill="#333" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#10 × 失败</text><rect width="105" height="30" x="710" y="166" fill="#666" stroke="#333" stroke-width="1.5" rx="5"/><text x="762.5" y="182" fill="#fff" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#11 ✓ 通过</text><rect width="105" height="30" x="825" y="166" fill="#eee" stroke="#333" stroke-width="1.5" rx="5"/><text x="877.5" y="182" fill="#333" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#12 × 失败</text><rect width="105" height="30" x="480" y="208" fill="#eee" stroke="#333" stroke-width="1.5" rx="5"/><text x="532.5" y="224" fill="#333" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#13 × 失败</text><rect width="105" height="30" x="595" y="208" fill="#eee" stroke="#333" stroke-width="1.5" rx="5"/><text x="647.5" y="224" fill="#333" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#14 × 失败</text><rect width="105" height="30" x="710" y="208" fill="#eee" stroke="#333" stroke-width="1.5" rx="5"/><text x="762.5" y="224" fill="#333" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#15 × 失败</text><rect width="105" height="30" x="825" y="208" fill="#666" stroke="#333" stroke-width="1.5" rx="5"/><text x="877.5" y="224" fill="#fff" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">#16 ✓ 通过</text><text x="710" y="267" fill="#666" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">4 条通过，12 条失败</text><line x1="710" x2="710" y1="299" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect width="720" height="72" x="240" y="332" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="7"/><text x="600" y="354" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">奖励计算：验证器运行隐藏测试并检查路径</text><text x="420" y="382" fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">通过全部测试且未改测试 → 奖励 1</text><text x="780" y="382" fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">测试失败或违规 → 奖励 0</text><line x1="600" x2="600" y1="406" y2="435" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect width="720" height="70" x="240" y="437" fill="#fafafa" stroke="#333" stroke-width="2" rx="7"/><text x="600" y="459" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">组内比较 → 相对优势</text><text x="420" y="486" fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">4 条成功高于平均 → 正优势</text><text x="780" y="486" fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">12 条失败低于平均 → 负优势</text><line x1="238" x2="205" y1="472" y2="472" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect width="175" height="145" x="30" y="360" fill="#d9d9d9" stroke="#333" stroke-width="2" rx="7"/><text x="117.5" y="385" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">策略更新</text><text x="117.5" y="414" fill="#333" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Gradient Descent</text><text x="117.5" y="434" fill="#333" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">+ Optimizer</text><text x="117.5" y="464" fill="#333" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">成功路径 ↑</text><text x="117.5" y="484" fill="#333" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">失败路径 ↓</text><path fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)" d="M117 358 L117 225 L245 225 L245 125 L260 125"/><text x="128" y="215" fill="#666" font-family="Arial, sans-serif" font-size="13">下一 step</text><text x="490" y="555" fill="#666" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">一个 step：rollout → 验证 → 比较 → 梯度下降更新</text><text x="490" y="583" fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">粗略量级：rollout ≈ 2,000 s + update ≈ 600 s → step ≈ 2,600 s（约 43 分钟）</text></svg>