<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="12" orient="auto" refX="11" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker></defs><text x="490" y="25" fill="#333" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">同一 SWE-bench 任务：16 次 rollout 如何产生一次更新</text><rect width="190" height="120" x="30" y="65" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="7"/><text x="125" y="88" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">同一任务 + 初始代码</text><text x="45" y="116" fill="#333" font-family="'Courier New', monospace" font-size="13">parser.py</text><text x="45" y="137" fill="#333" font-family="'Courier New', monospace" font-size="13">空输入触发 IndexError</text><text x="45" y="158" fill="#333" font-family="'Courier New', monospace" font-size="13">不能修改测试文件</text><line x1="222" x2="260" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect width="170" height="100" x="262" y="75" fill="#d9d9d9" stroke="#333" stroke-width="2" rx="7"/><text x="347" y="101" fill="#333" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">策略模型</text><text x="347" y="128" fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">独立采样 16 条</text><text x="347" y="151" fill="#666" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">每条都是一次完整执行</text><line x1="434" x2="468" y1="125" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect width="500" height="255" x="460" y="42" fill="#fafafa" stroke="#333" stroke-width="2" rx="7"/><text x="710" y="64" fill="#333" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">16 个相同沙箱中的 rollout（采样不同，初始状态相同）</text><rect width="105" height="30" x="480" y="82" fill="#eee" stroke="#333" stroke-width="1.5" rx="5"