ge 模型 (GPT-5 / Gemini 2.5)</text><text x="440" y="282" fill="#ccc" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">多源异构评判防止同源偏见</text><line x1="440" x2="440" y1="295" y2="325" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="760" height="180" x="60" y="328" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="350" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">结构化评估输出</text><rect width="360" height="125" x="75" y="370" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="85" y="390" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">事实正确性</text><text x="250" y="390" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4/4</text><text x="300" y="390" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">金额和时间均准确</text><text x="85" y="414" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">完整性</text><text x="250" y="414" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3/4</text><text x="300" y="414" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="star