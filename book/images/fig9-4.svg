<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" style="background:#fff"><defs><marker id="arrow" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#33434d" d="M0,0 L10,4 L0,8 Z"/></marker><style>.t{font-family:Arial,&apos;PingFang SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif;fill:#26343c}.h{font-size:19px;font-weight:700}.s{font-size:15px;fill:#52636d}.accent{stroke-width:2}.box{fill:#f5f7f8;stroke:#33434d}.box,.line{stroke-width:2}.accent{fill:#e8f1f5;stroke:#2f617a}.line{fill:none;stroke:#33434d;marker-end:url(#arrow)}</style></defs><text x="500" y="30" class="t h" text-anchor="middle">经验知识化：原始轨迹是证据，知识文档才是复用单元</text><rect width="168" height="96" x="22" y="78" class="box" rx="8"/><text x="106" y="111" class="t h" text-anchor="middle">原始轨迹</text><text x="106" y="139" class="t s" text-anchor="middle">动作、结果、环境</text><text x="106" y="160" class="t s" text-anchor="middle">不可变证据</text><rect width="168" height="96" x="215" y="78" class="box" rx="8"/><text x="299" y="111" class="t h" text-anchor="middle">单次评价</text><text x="299" y="139" class="t s" text-anchor="middle">成功、失败、标签</text><text x="299" y="160" class="t s" text-anchor="middle">保留证据位置</text><rect width="184" height="126" x="408" y="63" class="accent" rx="8"/><text x="500" y="97" class="t h" text-anchor="middle">跨轨迹比较</text><text x="500" y="128" class="t s" text-anchor="middle">聚合同类任务</text><text x="500" y="151" class="t s" text-anchor="middle">对照成功与失败</text><text x="500" y="174" class="t s" text-anchor="middle">提取共性与边界</text><rect width="184" height="126" x="617" y="63" class="accent" rx="8"/><text x="709" y="97" class="t h" text-anchor="middle">Markdown 文档</text><text x="709" y="128" class="t s" text-anchor="middle">适用场景与策略</text><text x="709" y="151" class="t s" text-anchor="middle">例外、禁区与来源</text><text x="709" y="174" class="t s" text-anchor="middle">版本与验证时间</text><rect width="152" height="96" x="826" y="78" class="box" rx="8"/><text x="902" y="111" class="t h" text-anchor="middle">检索应用</text><text x="902" y="139" class="t s" text-anchor="middle">新任务按需加载</text><text x="902" y="160" class="t s" text-anchor="middle">继续产生反馈</text><path d="M190 126 H213" class="line"/><path d="M383 126 H406" class="line"/><path d="M592 126 H615" class="line"/><path d="M801 126 H824" class="line"/><path stroke-dasharray="7 5" d="M902 174 V244 H500 V191" class="line"/><text x="700" y="270" class="t s" text-anchor="middle">新证据用于修订、限定或淘汰旧知识</text><rect width="586" height="48" x="215" y="302" fill="#fafbfb" stroke="#9aa8af" rx="8"/><text x="508" y="332" class="t s" text-anchor="middle">与第三章共用抽取和检索基础设施；本章新增轨迹评价与行为改进闭环</text></svg>