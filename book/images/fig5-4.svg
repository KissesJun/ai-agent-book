<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 40 900 660" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="168" height="38" x="10" y="55" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="94" y="74" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Diff + Apply Model</text><rect width="168" height="116" x="10" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="16" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">LLM 输出 diff 描述:</text><text x="16" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- def foo(x):</text><text x="16" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">- return x</text><text x="16" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ def foo(x, y=0):</text><text x="16" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">+ return x + y</text><text x="16" y="202" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">→ 小模型定位并应用</text><rect width="160" height="56" x="14" y="229" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="94" y="248" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">优势: 关注点分离</text><text x="94" y="270" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">劣势: 微小偏差致错位</text><rect width="168" height="38" x="188" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="272" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Old String → New String</text><rect width="168" height="99" x="188" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="194" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">old: &quot;def foo(x):\n</text><text x="194" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x&quot;</text><text x="194" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">new: &quot;def foo(x, y=0):\n</text><text x="194" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y&quot;</text><text x="194" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">→ 字符串精确匹配替换</text><rect width="160" height="56" x="192" y="212" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="272" y="231" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">优势: 可预测、无歧义</text><text x="272" y="253" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">劣势: 大段删除需全输出</text><rect width="168" height="38" x="366" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">行号定位</text><rect width="168" height="99" x="366" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="372" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">删除行 42-43，插入:</text><text x="372" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">def foo(x, y=0):</text><text x="372" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y</text><text x="372" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">→ 行号精确指定范围</text><rect width="160" height="56" x="370" y="212" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="450" y="231" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">优势: 大段操作高效</text><text x="450" y="253" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">劣势: 长文件行号易错</text><rect width="168" height="38" x="544" y="55" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="628" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">类 Vim 命令</text><rect width="168" height="99" x="544" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="550" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">42G (跳转42行)</text><text x="550" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">cw (替换单词)</text><text x="550" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">dd (删除行)</text><text x="550" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">yy/p (复制/粘贴)</text><text x="550" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">→ 丰富的编辑语义</text><rect width="160" height="56" x="548" y="212" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="628" y="231" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">优势: 移动/重组高效</text><text x="628" y="253" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">劣势: 弱模型出错多</text><rect width="168" height="38" x="722" y="55" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="806" y="74" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">首尾匹配</text><rect width="168" height="99" x="722" y="101" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="728" y="117" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">start: &quot;def foo(x):&quot;</text><text x="728" y="134" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">end: &quot; return x&quot;</text><text x="728" y="151" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">new: &quot;def foo(x, y=0):</text><text x="728" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">return x + y&quot;</text><text x="728" y="185" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">→ 只需边界即可定位</text><rect width="160" height="56" x="726" y="212" fill="#fff" stroke="#999" stroke-width="2" rx="3"/><text x="806" y="231" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">优势: 大段删除免全输出</text><text x="806" y="253" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">劣势: 需边界组合唯一</text><line x1="30" x2="870" y1="320" y2="320" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="450" y="344" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">实际采用情况</text><text x="240" y="382" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Old→New</text><rect width="408" height="28" x="250" y="368" fill="#999" stroke="#333" stroke-width="2" rx="3"/><text x="454" y="382" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Claude Code</text><text x="240" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">行号定位</text><rect width="240" height="28" x="250" y="406" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="370" y="420" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">IDE 深度集成场景</text><text x="240" y="458" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Diff + Apply</text><rect width="192" height="28" x="250" y="444" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="346" y="458" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Cursor</text><text x="240" y="496" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">首尾匹配</text><rect width="144" height="28" x="250" y="482" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="322" y="496" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">部分定制方案</text><text x="240" y="534" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="end">Vim 命令</text><rect width="72" height="28" x="250" y="520" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="286" y="534" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="middle">实验性方案</text></svg>