chor="middle">知识·指令·程序·参数</text><text x="582" y="349" class="t s" text-anchor="middle">回归与安全验证</text><text x="582" y="371" class="t s" text-anchor="middle">保留旧能力</text><text x="792" y="349" class="t s" text-anchor="middle">灰度、监控与回滚</text><text x="792" y="371" class="t s" text-anchor="middle">晋升为新稳定版</text><path d="M257 354 H305" class="line"/><path d="M457 354 H505" class="line"/><path d="M657 354 H705" class="line"/><path stroke-dasharray="7 5" d="M705 172 V232 H182 V321" class="line"/><rect width="140" height="24" x="374" y="220" fill="#fff" rx="4"/><text x="444" y="237" class="t s" text-anchor="middle">版本化经验日志</text><path stroke-dasharray="7 5" d="M877 354 H986 V56 H295 V112" class="line"/><rect width="156" height="24" x="572" y="44" fill="#fff" rx="4"/><text x="650" y="61" class="t s" text-anchor="middle">通过验证的新版本</text><text x="500" y="452" class="t s" text-anchor="middle">可信根：权限、审计、验证与回滚机制不由普通进化流程自行修改</text></svg>