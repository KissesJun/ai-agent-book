<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="250" height="160" x="20" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="145" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">① 日志采集</text><rect width="230" height="122" x="30" y="98" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="38" y="112" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">trajectory_001.json:</text><text x="38" y="126" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:</text><text x="38" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&quot;取消订单 #12345&quot;}</text><text x="38" y="154" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">{&quot;role&quot;:&quot;assistant&quot;,</text><text x="38" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&quot;tool_call&quot;:&quot;cancel_order&quot;}</text><text x="38" y="182" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">{&quot;role&quot;:&quot;tool&quot;,&quot;result&quot;:</text><text x="38" y="196" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">&quot;ERROR: no insurance&quot;}</text><text x="38" y="210" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">→ Agent 未告知用户原因</text><line x1="270" x2="310" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="160" x="310" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="440" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">② LLM 分析</text><text x="320" y="100" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">输入: 轨迹 + 架构文档 + PRD</text><text x="320" y="128" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">分析维度:</text><text x="320" y="142" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- 执行流程是否符合预期</text><text x="320" y="156" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- 工具调用是否正确</text><text x="320" y="170" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- 错误处理是否得当</text><text x="320" y="184" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- 用户体验是否满意</text><text x="320" y="212" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">→ 定位偏差环节和模块</text><line x1="570" x2="610" y1="140" y2="140" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="250" height="160" x="610" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="735" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">③ 结构化报告</text><rect width="230" height="108" x="620" y="98" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="628" y="112" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">问题报告:</text><text x="628" y="126" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">优先级: P1 (用户流失风险)</text><text x="628" y="140" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">模块: cancellation_handler</text><text x="628" y="154" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">描述: 取消失败后未向</text><text x="628" y="168" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">用户解释原因和替代方案</text><text x="628" y="182" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">建议: 添加失败原因说明</text><text x="628" y="196" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">和购买保险的引导</text><line x1="440" x2="440" y1="220" y2="260" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="370" height="160" x="60" y="260" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="245" y="282" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">④ 回归测试用例生成</text><rect width="350" height="150" x="70" y="298" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="78" y="312" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">def test_cancel_no_insurance():</text><text x="78" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;&quot;&quot;轨迹 #001, 轮次 3-5&quot;&quot;&quot;</text><text x="78" y="340" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># 重放: 用户请求取消经济舱</text><text x="78" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">resp = agent.run(</text><text x="78" y="368" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&quot;取消订单 #12345&quot;)</text><text x="78" y="382" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># 验证: 应解释原因</text><text x="78" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;保险&quot; in resp.text</text><text x="78" y="410" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;替代方案&quot; in resp.text</text><text x="78" y="424" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># 验证: 不应直接报错</text><text x="78" y="438" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">assert &quot;ERROR&quot; not in resp.text</text><line x1="430" x2="470" y1="340" y2="340" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="380" height="160" x="470" y="260" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="660" y="282" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⑤ GitHub Issue 自动创建</text><rect width="360" height="136" x="480" y="298" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="488" y="312" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">gh issue create \</text><text x="488" y="326" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--title &quot;P1: 取消失败缺少</text><text x="488" y="340" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">用户引导&quot; \</text><text x="488" y="354" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--body &quot;**问题**: Agent 在</text><text x="488" y="368" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">cancel_order 失败后直接</text><text x="488" y="382" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">返回错误，未解释原因...</text><text x="488" y="396" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">**轨迹**: #001 轮次 3-5</text><text x="488" y="410" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">**测试**: test_cancel_...&quot; \</text><text x="488" y="424" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">--assignee @backend-team</text><rect width="680" height="44" x="100" y="445" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="460" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">端到端自动化：日志 → 分析 → 报告 → 测试 → Issue</text><text x="440" y="480" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">通过 MCP 对接 GitHub · 测试框架自动重放验证</text><text x="440" y="530" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">将人工诊断成本从小时级降低到分钟级</text></svg>