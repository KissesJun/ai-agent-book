<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" aria-labelledby="title desc" role="img" viewBox="0 0 820 470"><title id="title">自主 Agent 的执行循环</title><desc id="desc">Agent 依次思考、行动和观察，再根据退出条件决定输出最终结果或继续下一轮循环。</desc><defs><marker id="arrow-dark" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#333" points="0 0 9 3.5 0 7"/></marker><marker id="arrow-light" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#777" points="0 0 9 3.5 0 7"/></marker><style>.sans{font-family:Arial,&quot;Helvetica Neue&quot;,Helvetica,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.code{font-family:&quot;Courier New&quot;,Courier,monospace}.heading{fill:#333;font-size:16px;font-weight:700}.body{fill:#333;font-size:15px}.note{fill:#666;font-size:14px}.box,.flow{stroke:#333;stroke-width:2}.flow{fill:none;marker-end:url(#arrow-dark)}</style></defs><rect width="820" height="470" fill="#fff"/><rect width="210" height="96" x="45" y="70" fill="#e8e8e8" class="box" rx="8"/><text x="60" y="95" class="sans heading" dominant-baseline="middle">① 思考（Reasoning）</text><rect width="180" height="38" x="60" y="112" fill="#fff" stroke="#777" rx="5"/><text x="150" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">&quot;还需更多信息&quot;</text><rect width="210" height="96" x="305" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="320" y="95" class="sans heading" dominant-baseline="middle">② 行动（Acting）</text><rect width="180" height="38" x="320" y="112" fill="#fff" stroke="#777" rx="5"/><text x="410" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">web_search(...)</text><rect width="210" height="96" x="565" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="580" y="95" class="sans heading" dominant-baseline="middle">③ 观察（Observing）</text><rect width="180" height="38" x="580" y="112" fill="#fff" stroke="#777" rx="5"/><text x="670" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">tool_result: &quot;...&quot;</text><line x1="255" x2="302" y1="118" y2="118" class="flow"/><line x1="515" x2="562" y1="118" y2="118" class="flow"/><line x1="670" x2="670" y1="166" y2="207" class="flow"/><rect width="430" height="145" x="45" y="220" fill="#fff" stroke="#777" stroke-dasharray="7 4" stroke-width="2" rx="8"/><text x="65" y="244" class="sans heading" dominant-baseline="middle">退出条件（任一满足）</text><line x1="65" x2="455" y1="258" y2="258" stroke="#ccc"/><text x="65" y="282" class="sans body" dominant-baseline="middle">① 任务完成</text><text x="250" y="282" class="sans body" dominant-baseline="middle">② 调用 final_answer</text><text x="65" y="314" class="sans body" dominant-baseline="middle">③ 无工具调用返回</text><text x="250" y="314" class="sans body" dominant-baseline="middle">④ 错误次数超限</text><text x="65" y="346" class="sans body" dominant-baseline="middle">⑤ 达到最大轮次</text><path fill="none" stroke="#777" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-light)" d="M 475 260 H 587"/><rect width="62" height="20" x="502" y="238" fill="#fff" rx="3"/><text x="533" y="248" class="sans note" dominant-baseline="middle" text-anchor="middle">判断依据</text><polygon fill="#e2e2e2" points="670 208 750 260 670 312 590 260" class="box"/><text x="670" y="252" class="sans heading" dominant-baseline="middle" text-anchor="middle">满足退出</text><text x="670" y="273" class="sans heading" dominant-baseline="middle" text-anchor="middle">条件？</text><path d="M 750 260 H 795 V 35 H 150 V 67" class="flow"/><text x="765" y="245" class="sans note" dominant-baseline="middle">否</text><rect width="120" height="22" x="360" y="43" fill="#fff" rx="3"/><text x="420" y="54" class="sans note" dominant-baseline="middle" text-anchor="middle">继续下一轮循环</text><line x1="670" x2="670" y1="312" y2="379" class="flow"/><text x="685" y="346" class="sans note" dominant-baseline="middle">是</text><rect width="230" height="68" x="555" y="382" fill="#d6d6d6" class="box" rx="8"/><text x="670" y="416" class="sans heading" dominant-baseline="middle" text-anchor="middle">输出最终结果</text></svg>