ian multi-dimensi</text><line x1="252" x2="330" y1="207" y2="160" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="200" height="80" x="330" y="185" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="340" y="205" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">akurasi: 4/5</text><text x="340" y="225" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="normal" text-anchor="start">kelancaran: 3/5 ← butuh perbaikan</text><text x="340" y="245" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">adaptasi budaya: 4/5</text><line x1="430" x2="430" y1="167" y2="183" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><path fill="none" stroke="#999" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah-light)" d="M 430,267 Q 331.339380517819,114.0087186687023 150,98"/><text x="290" y="90" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">umpan balik + saran perbaikan</text><rect width="170" height="55" x="610" y="100" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="695" y="127.5" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="normal" text-anchor="middle">jumlah iterasi: n</text><text x="695" y="170" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">kondi