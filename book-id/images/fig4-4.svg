<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 40 880 540" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="560" height="118" x="20" y="50" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="72" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Prefiks Statis (Tidak berubah di tingkat byte, KV Cache terus hit)</text><rect width="520" height="34" x="40" y="84" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="101" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">System Prompt</text><rect width="520" height="34" x="40" y="124" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="141" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Definisi Tools Inti: web_search, code_interpreter, tool_search</text><rect width="560" height="386" x="20" y="180" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="36" y="202" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Jejak (Hanya bertambah tanpa diubah, konten baru ditambahkan di akhir)</text><rect width="520" height="30" x="40" y="214" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="229" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: Cek harga saham NVDA</text><rect width="520" height="30" x="40" y="250" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(harga saham)</text><rect width="520" height="40" x="40" y="286" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="306" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → Injeksi schema lengkap get_stock_quote</text><rect width="520" height="30" x="40" y="332" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="347" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: Panggil get_stock_quote → Tool Result</text><rect width="520" height="30" x="40" y="368" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="383" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">User: Analisis kontributor repositori GitHub</text><rect width="520" height="30" x="40" y="404" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="419" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: tool_search_call(GitHub)</text><rect width="520" height="40" x="40" y="440" fill="#d8e8d8" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="460" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">tool_search_output → Injeksi schema seperti list_contributors</text><rect width="520" height="30" x="40" y="486" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="501" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Assistant: Panggil → Tool Result → Balas</text><rect width="520" height="30" x="40" y="522" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="300" y="537" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">…… Konten terbaru sesi ini</text><line x1="562" x2="592" y1="306" y2="306" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><line x1="562" x2="592" y1="460" y2="460" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="600" y="294" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Muncul pertama: prefill sekali (tulis Cache)</text><text x="600" y="316" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Selanjutnya hit Cache sebagai history biasa</text><text x="600" y="448" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Tidak boleh menghapus/mengatur ulang Tools yang di-load</text><text x="600" y="470" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Atau Cache akan invalid dari titik perubahan</text></svg>