="280" height="50" x="295" y="170" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="450" y="190" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Model bahasa</text><text x="450" y="210" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Backbone Llama 2 7B</text><line x1="435" x2="435" y1="222" y2="233" stroke="#333" stroke-width="2" marker-end="url(#ah-compact)"/><rect width="280" height="78" x="295" y="235" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="435" y="252" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Decoder aksi</text><text x="435" y="272" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">→ Vektor kontrol kontinu 14 dimensi</text><text x="435" y="298" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="middle">Action chunking: menghasilkan 25 aksi berturut-turut sekaligus</text><line x1="240" x2="278" y1="132" y2="132" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="240" x2="278" y1="257" y2="257" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="260" height="32" x="300" y="345" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="430" y="361" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">Instruksi: &quot;Masukkan kaleng ke dalam panci&quot;</text><line x1="430" x2="430" y1="345" y2="315" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="230" height="250" x="690" y="65" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="805" y="88" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Mesin fisika SAPIEN</text><rect width="200" height="55" x="705" y="105" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="805" y="125" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Robot lengan ganda</text><text x="805" y="145" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Masing-masing 7 DOF = aksi 14 dimensi</text><rect width="200" height="55" x="705" y="175" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="805" y="195" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Pengacakan lingkungan</text><text x="805" y="215" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Posisi 60cm / orientasi ±22.5°</text><rect width="200" height="55" x="705" y="245" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="805" y="265" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Deteksi tabrakan + simulasi fisika</text><text x="805" y="285" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Benda tegar / benda lunak / gesekan</text><line x1="590" x2="688" y1="220" y2="220" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="640" y="210" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">Aksi</text><line x1="690" x2="592" y1="130" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="640" y="120" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">Observasi</text><line x1="20" x2="920" y1="385" y2="385" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="408" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Metrik evaluasi</text><rect width="180" height="75" x="60" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="150" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Tingkat keberhasilan</text><text x="150" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Kaleng di dalam panci</text><text x="150" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">dan tidak jatuh</text><rect width="180" height="75" x="260" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="350" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Waktu penyelesaian</text><text x="350" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">25 langkah × 25 aksi</text><text x="350" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">= 625 langkah kontrol</text><rect width="180" height="75" x="460" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="550" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Kemampuan generalisasi</text><text x="550" y="465" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Lintas posisi/orientasi</text><text x="550" y="483" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">/Varian penampilan</text><rect width="180" height="75" x="660" y="425" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="750" y="445" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Sim-to-Real</text><text x="750" y="465" fill="#666" dominant-b