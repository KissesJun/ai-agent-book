<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 40 880 520" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="350" height="280" x="20" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="195" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agent Proposer</text><text x="40" y="110" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Input: Makalah/konten</text><rect width="330" height="24" x="30" y="125" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="38" y="137" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">paper.pdf → Ekstrak bagian/argumen/gambar</text><text x="40" y="168" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Output: Markdown Slidev</text><rect width="330" height="138" x="30" y="182" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="40" y="199" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">---</text><text x="40" y="213" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">layout: two-cols</text><text x="40" y="227" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">---</text><text x="40" y="241" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start"># Transformer Architecture</text><text x="40" y="255" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">::left::</text><text x="40" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- Self-attention mechanism</text><text x="40" y="283" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">- Multi-head attention</text><text x="40" y="297" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">::right::</text><text x="40" y="311" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">&lt;img src=&quot;fig3.png&quot; /&gt;</text><rect width="350" height="280" x="510" y="60" fill="#fff" stroke="#333" stroke-dasharray="8 4" stroke-width="2" rx="6"/><text x="685" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Agent Reviewer</text><text x="520" y="110" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Langkah 1: Render tangkapan layar</text><rect width="330" height="50" x="520" y="125" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="142" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">slidev export --per-slide</text><text x="685" y="160" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">→ slide-01.png, slide-02.png ...</text><text x="520" y="192" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Langkah 2: Tinjauan Vision LLM</text><rect width="330" height="108" x="520" y="208" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="3"/><text x="528" y="222" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Dimensi tinjauan:</text><text x="528" y="238" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✓ Batas luapan teks</text><text x="528" y="254" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✓ Tata letak terlalu padat</text><text x="528" y="270" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✓ Ukuran gambar sesuai</text><text x="528" y="286" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✗ Slide 3: Teks meluap di kolom kanan</text><text x="528" y="302" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">✗ Slide 7: Konten terlalu padat</text><line x1="370" x2="508" y1="200" y2="150" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="439" y="165" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">Kode Slidev</text><line x1="508" x2="370" y1="300" y2="260" stroke="#333" stroke-dasharray="8 4" stroke-width="2" marker-end="url(#ah)"/><text x="439" y="270" fill="#666" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" text-anchor="middle">Saran modifikasi</text><rect width="100" height="24" x="395" y="220" fill="#999" stroke="#333" stroke-width="2" rx="12"/><text x="445" y="232" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Iterasi 2-3 putaran</text><line x1="30" x2="850" y1="365" y2="365" stroke="#999" stroke-dasharray="8 4" stroke-width="2"/><text x="440" y="388" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Mengapa memisahkan Proposer dan Reviewer?</text><rect width="270" height="130" x="30" y="405" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="165" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Masalah Single Agent</text><text x="165" y="450" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Puluhan halaman tangkapan layar yang dirender → konteks membengkak</text><text x="165" y="474" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">Campuran kode + tangkapan layar → perhatian terpecah</text><rect width="270" height="130" x="320" y="405" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="455" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Kelebihan Pemisahan</text><text x="455" y="450" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Konteks independen Reviewer → hanya tangkapan layar + kode</text><text x="455" y="474" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle">Proposer fokus pada kode → hanya menerima saran modifikasi</text><rect width="270" height="130" x="610" y="405" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="745" y="425" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Efek Aktual</text><text x="745" y="450" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Penggunaan konteks berkurang secara signifikan</text><text x="745" y="474" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Akurasi perbaikan meningkat secara signifikan</text></svg>