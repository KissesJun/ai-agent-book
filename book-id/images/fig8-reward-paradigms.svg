e-width="2" rx="6"/><text x="542.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Vektor</text><rect width="190" height="230" x="447.5" y="146" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="457.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Akurasi kueri informasi 9/10</text><text x="457.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7" text-anchor="start">Kelengkapan pengumpulan informasi 6/10</text><text x="457.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Kelancaran komunikasi 8/10</text><text x="457.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">Akurasi komunikasi 7/10</text><text x="457.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8.5" text-anchor="start">Akurasi komunikasi pengguna 10/10</text><text x="457.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10" text-anchor="start">Penyelesaian tugas keseluruhan 8/10</text><text x="457.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="start">─────────</text><text x="457.5" y="343" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Melokalkan kekurangan dengan tepat ↑</text><line x1="639.5" x2="650.5" y1="250" y2="250" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="190" height="36" x="652.5" y="100" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="747.5" y="118" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Generatif</text><rect width="190" height="210" x="652.5" y="146" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="662.5" y="165" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Perspektif 1: Penggunaan tool yang akurat</text><text x="662.5" y="191" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Perspektif 2: Pengumpulan informasi hilang</text><text x="662.5" y="217" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="7.5" text-anchor="start">Perspektif 3: Parafrase nama paket</text><text x="662.5" y="243" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="8" text-anchor="start">Kesalahan → Sarankan pengulangan langsung</text><text x="662.5" y="269" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" text-anchor="start">Perspektif 4: Tidak menjelaskan penggunaan informasi</text><text x="662.5" y="295" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6.5" text-anchor="start">Perspektif 5: Tidak memverifikasi identitas agent</text><text x="662.5" y="321" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">→ 6-7 perspektif analisis</text><line x1="132.5" x2="747.5" y1="368" y2="368" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="388" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Peningkatan informasi →</text><rect width="760" height="55" x="60" y="405" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="80" y="420" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="15" text-anchor="start">Eksperimen DeepSeek: 8 evaluasi Generatif menghasilkan 6-7 perspektif analitik</text><text x="80" y="442" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="9" text-anchor="start">Peningkatan signifikan setelah diagnosis komprehensif dari berbagai sudut (ilustratif) — mempelajari arah peningkatan dari satu kegagalan</text><rect width="760" height="45" x="60" y="475" fill="#999" stroke="#333" stroke-width="2" rx="6"/><text x="440" y="498" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Reward generatif: mengubah feedback lingkungan yang kaya menjadi pengetahuan yang dapat dipelajari tanpa ratusan uji coba dan kesalahan</text></svg>