New', Courier, monospace" font-size="11" text-anchor="start">- Self-attention menghitung Q·K^T/√d</text><text x="50" y="242" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="10.5" text-anchor="start">- Pemrosesan paralel multi-head attention</text><text x="180" y="255" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">Memahami struktur konten → mendekomposisikan ke halaman slide</text><rect width="300" height="200" x="450" y="65" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="600" y="87" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Reviewer Agent</text><rect width="280" height="38" x="460" y="107" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="468" y="120" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">① Rendering Slidev → PDF/PNG</text><text x="468" y="135" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">② Evaluasi multi-dimensi Vision LLM</text><rect width="280" height="85" x="460" y="151" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3"/><text x="468" y="165" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="start">Feedback terstruktur:</text><text x="468" y="183" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">Halaman Jenis Masalah Keparahan</text><text x="468" y="198" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">P3 Konten padat Tinggi</text><text x="468" y="213" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">P7 Font terlalu kecil Sedang</text><text x="468" y="228" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="11" text-anchor="start">P11 Warna tidak cocok Rendah</text><text x="600" y="255" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle">Rendering + analisis visual → saran perbaikan yang dapat ditindaklanjuti</text><line x1="332" x2="448" y1="135" y2="135" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="123" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Kode Slidev</text><line x1="448" x2="332" y1="215" y2="215" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="390" y="231" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Feedback terstruktur</text><rect width="720" height="110" x="30" y="290" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="308" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Proses perbaikan iteratif</text><rect width="190" height="62" x="75" y="325" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="85" y="339" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Putaran 1</text><text x="85" y="357" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Draf 12 halaman</text><text x="85" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">5 masalah</text><line x1="269" x2="291" y1="356" y2="356" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="190" height="62" x="295" y="325" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="305" y="339" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Putaran 2</text><text x="305" y="357" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">14 halaman (pisahkan halaman padat)</text><text x="305" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">2 masalah</text><line x1="489" x2="511" y1="356" y2="356" stroke="#999" stroke-width="2" marker-end="url(#ah-light)"/><rect width="190" height="62" x="515" y="325" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="3"/><text x="525" y="339" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="start">Putaran 3</text><text x="525" y="357" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">14 halaman (font dikoreksi)</text><text x="525" y="375" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">0 masalah ✓</text><rect width="720" height="90" x="30" y="415" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="390" y="435" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Mengapa tidak menggunakan satu Agent?</text><text x="60" y="460" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Satu Agent: merender gambar ×N putaran → ledakan konteks</text><text x="60" y="478" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">(Tangkapan layar 1080p = ribuan token × 14 halaman × 5 putaran)</text><text x="410" y="460" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Agen ganda: Reviewer hanya melihat versi saat ini</text><text x="410" y="478" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="start">Proposer hanya mengakumulasi feedback teks → konteks bersih</text></svg>