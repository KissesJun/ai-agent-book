="3"/><rect width="270" height="44" x="490" y="259" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Reward skalar: R ∈ {-1, 0, +5, +50}</text><text x="500" y="281" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Reward + umpan balik + refleksi diri</text><text x="395" y="281" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Sinyal Pembelajaran</text><rect width="280" height="44" x="20" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="307" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><text x="30" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Tidak ada pemikiran internal (murni reaktif)</text><text x="500" y="329" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="start">Berpikir sebagai action khusus (CoT)</text><text x="395" y="329" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Kemampuan Berpikir</text><rect width="280" height="44" x="20" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/><rect width="270" height="44" x="490" y="355" fill="#f0f0f0" stroke="#333" stroke-width="2" 