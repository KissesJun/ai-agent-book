<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 40 780 460" style="background:#fff"><defs><marker id="ah" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#333" points="0 0 12 4 0 8"/></marker><marker id="ah-light" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><polygon fill="#999" points="0 0 12 4 0 8"/></marker></defs><rect width="150" height="44" x="30" y="60" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="105" y="82" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Agent A</text><rect width="150" height="44" x="30" y="118" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="6"/><text x="105" y="140" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Agent B</text><rect width="204" height="60" x="288" y="56" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="8"/><text x="390" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Virtual File System /</text><text x="390" y="100" fill="#555" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9.5" text-anchor="middle">Unified interface: read_file · write_file · list_dir</text><rect width="160" height="48" x="600" y="58" fill="#fff" stroke="#333" stroke-width="2" rx="6"/><text x="680" y="78" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">User</text><text x="680" y="96" fill="#555" dominan