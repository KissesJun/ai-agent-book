="11" text-anchor="middle">Scratchpad</text><line x1="40" x2="170" y1="284" y2="284" stroke="#ccc" stroke-width="1"/><text x="105" y="303" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle">Private · Agent-only</text><text x="105" y="324" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle">Dihancurkan bersama instans</text><text x="105" y="345" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="7.5" text-anchor="middle">Read/Write · No concurrency control needed</text><text x="105" y="372" fill="#666" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle">Satu per Agent</text><rect width="170" height="185" x="210" y="200" fill="#d0d0d0" stroke="#333" stroke-width="2" rx="6"/><text x="295" y="226" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Ruang Bersama Multi-Agent</text><text x="295" y="250" fill="#333" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="middle">/workspace/shared</text><text x="295" y="270" fill="#555" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" text-anchor="middle">Shared Workspace</text><line x1="224" x2="366" y1="284" y2="284" stroke="#999" stroke-width="1"/><text x="295" y="303" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" te