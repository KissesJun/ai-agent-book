etica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Konten dikompresi + pertahankan penanda sitasi URL</text><line x1="500" x2="513" y1="437" y2="437" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="417" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="437" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="normal" text-anchor="middle">223K tok · 4,1% · 10 putaran</text><rect width="130" height="26" x="30" y="465" fill="#999" stroke="#333" stroke-width="2" rx="13"/><text x="95" y="478" fill="#fff" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⑥ Jendela adaptif</text><rect width="120" height="40" x="30" y="495" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="4"/><text x="90" y="515" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Kompresi ditangguhkan</text><line x1="152" x2="165" y1="515" y2="515" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="330" height="40" x="168" y="495" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="4"/><text x="333" y="515" fill="#333" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle">&lt; 80% jendela simpan teks asli, kompresi batch saat terlampaui</text><line x1="500" x2="513" y1="515" y2="515" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect width="275" height="40" x="516" y="495" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="4"/><text x="653" y="51